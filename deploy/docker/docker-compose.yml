# ProximaDB Docker Compose Configuration
# For local development and single-node deployments

services:
  proximadb:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: vjsingh1984/proximadb:latest
    container_name: proximadb
    restart: unless-stopped
    ports:
      - "5678:5678"  # Unified REST + gRPC + Arrow Flight
      - "5433:5433"  # PostgreSQL wire protocol
      - "9090:9090"  # Prometheus metrics
    volumes:
      - proximadb-data:/data/proximadb
      - ../../config/config.toml:/config/config.toml:ro
    environment:
      - RUST_LOG=info
      - PROXIMADB_DATA_DIR=/data/proximadb
      - PROXIMADB_BIND_ADDRESS=0.0.0.0
      - PROXIMADB_REST_PORT=5678
      - PROXIMADB_GRPC_PORT=5679
      - PROXIMADB_ARROW_IPC_PORT=5680
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5678/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 16G
        reservations:
          cpus: '1'
          memory: 4G
    networks:
      - proximadb-network

  # Optional: Prometheus for monitoring
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: proximadb-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    depends_on:
      - proximadb
    networks:
      - proximadb-network
    profiles:
      - monitoring

  # Optional: Grafana for dashboards
  grafana:
    image: grafana/grafana:10.1.0
    container_name: proximadb-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - proximadb-network
    profiles:
      - monitoring

volumes:
  proximadb-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  proximadb-network:
    driver: bridge
