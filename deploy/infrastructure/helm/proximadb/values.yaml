# ProximaDB Helm Chart - Default Values

replicaCount: 3

image:
  repository: proximadb/proximadb-server
  pullPolicy: IfNotPresent
  tag: "0.2.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true

service:
  type: LoadBalancer
  port: 5678
  annotations: {}
    # service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    # service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
    # service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:..."
    # service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "5678"

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: proximadb.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: proximadb-tls
    #   hosts:
    #     - proximadb.example.com

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# ProximaDB Configuration
config:
  global:
    environment: "production"
    log_level: "info"
    metrics_enabled: true
    tracing_enabled: true

  server:
    bind_address: "0.0.0.0:5678"
    grpc_port: 5679
    max_connections: 10000
    connection_timeout: 300
    request_timeout: 120

  storage:
    default_engine: "sst"  # not read by the server; engine is chosen per collection (TD-ENGSEL-1)
    data_directory: "/data/proximadb"
    wal_enabled: true
    wal_directory: "/data/proximadb/wal"
    wal_retention_days: 7

    persistence:
      enabled: true
      size: 100Gi
      storageClass: "gp3-encrypted"

  indexing:
    default_index_type: "hnsw"
    default_distance_metric: "cosine"
    default_vector_dimension: 1536

  quantization:
    enabled: true
    default_product_quantization: "scalar"

  caching:
    enabled: true
    cache_size_mb: 512
    cache_ttl_seconds: 300

# Storage configuration
persistence:
  enabled: true
  storageClass: "gp3-encrypted"
  size: 100Gi

# StatefulSet for data persistence (alternative to Deployment)
statefulset:
  enabled: false
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3-encrypted
        resources:
          requests:
            storage: 100Gi

# Service monitoring
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
  prometheusRule:
    enabled: true
    rules: []

# Grafana dashboard
grafanaDashboard:
  enabled: true
  configMapName: grafana-dashboard-proximadb

# Environment variables
env: []
  # - name: PROXIMADB_LOG_LEVEL
  #   value: "debug"
  # - name: PROXIMADB_METRICS_ENABLED
  #   value: "true"

# Secret for sensitive data
secret:
  enabled: false
  # Mount as environment variables from secret
  envFromSecret: []
  # - name: proximadb-secret
  #   env: DATABASE_URL

# ConfigMap for additional configuration
configMap:
  enabled: false
  data: {}
  # config.yaml: |
  #   custom:
  #     setting: value

# Init containers
initContainers: []
  # - name: init-chmod-data
  #   image: busybox:1.35
  #   command: ['sh', '-c', 'chmod -R 777 /data']
  #   volumeMounts:
  #     - name: data
  #       mountPath: /data

# Sidecar containers
sidecars: []
  # - name: log-forwarder
  #   image: fluent/fluent-bit:1.9
  #   volumeMounts:
  #     - name: varlog
  #       mountPath: /var/log

# Volumes
volumes: []
  # - name: data
  #   persistentVolumeClaim:
  #     claimName: proximadb-data

# Volume mounts
volumeMounts: []
  # - name: data
  #   mountPath: /data

# Liveness probe
livenessProbe:
  httpGet:
    path: /health
    port: 5678
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

# Readiness probe
readinessProbe:
  httpGet:
    path: /health
    port: 5678
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 3

# Startup probe
startupProbe:
  httpGet:
    path: /health
    port: 5678
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 30

# Node selector for pod placement
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}

# Priority class
priorityClassName: ""

# Topology spread constraints
topologySpreadConstraints: []

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Service mesh
serviceMesh:
  istio:
    enabled: false
  linkerd:
    enabled: false

# Observability
observability:
  logging:
    enabled: true
    format: "json"
    level: "info"

  tracing:
    enabled: true
    exporter: "otlp"
    endpoint: "http://jaeger-collector.observability.svc:4318"

  metrics:
    enabled: true
    port: 9090
    path: /metrics
