# ProximaDB Helm Values - Staging Environment
#
# Purpose: Pre-production testing environment
# Characteristics: Production-like configuration, right-sized for load testing

replicaCount: 3

image:
  repository: proximadb/proximadb-server
  pullPolicy: IfNotPresent
  tag: "0.2.0"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: "proximadb-staging"

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true

service:
  type: LoadBalancer
  port: 5678
  annotations:
    # Staging: Use ALB for better routing
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    # Enable cross-zone load balancing
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"

ingress:
  enabled: false
  className: "nginx"

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations:
  # Allow scheduling on spot instances
  - key: "eks.amazonaws.com/capacityType"
    operator: "Equal"
    value: "SPOT"
    effect: "NoSchedule"

affinity:
  # Anti-affinity for high availability
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - proximadb
          topologyKey: kubernetes.io/hostname

# ProximaDB Configuration
config:
  global:
    environment: "staging"
    log_level: "info"
    metrics_enabled: true
    tracing_enabled: true  # Enable in staging for testing

  server:
    bind_address: "0.0.0.0:5678"
    grpc_port: 5679
    max_connections: 5000
    connection_timeout: 300
    request_timeout: 120

  storage:
    default_engine: "sst"  # not read by the server; engine is chosen per collection (TD-ENGSEL-1)
    data_directory: "/data/proximadb"
    wal_enabled: true
    wal_directory: "/data/proximadb/wal"
    wal_retention_days: 7

    persistence:
      enabled: true
      size: 100Gi
      storageClass: "gp3"

  indexing:
    default_index_type: "hnsw"
    default_distance_metric: "cosine"
    default_vector_dimension: 1536

  quantization:
    enabled: true
    default_product_quantization: "scalar"

  caching:
    enabled: true
    cache_size_mb: 512
    cache_ttl_seconds: 300

# Storage configuration
persistence:
  enabled: true
  storageClass: "gp3"
  size: 100Gi

# StatefulSet for data persistence
statefulset:
  enabled: false

# Service monitoring
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
  prometheusRule:
    enabled: true  # Enable alerting in staging
    rules: []

# Grafana dashboard
grafanaDashboard:
  enabled: true
  configMapName: grafana-dashboard-proximadb

# Environment variables
env: []

# Secret for sensitive data
secret:
  enabled: false
  envFromSecret: []

# Liveness probe
livenessProbe:
  httpGet:
    path: /health
    port: 5678
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

# Readiness probe
readinessProbe:
  httpGet:
    path: /health
    port: 5678
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 3

# Startup probe
startupProbe:
  httpGet:
    path: /health
    port: 5678
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 30

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2  # Higher minimum in staging

# Observability
observability:
  logging:
    enabled: true
    format: "json"
    level: "info"

  tracing:
    enabled: true  # Enable for testing observability
    exporter: "otlp"
    endpoint: "http://jaeger-collector.observability.svc:4318"

  metrics:
    enabled: true
    port: 9090
    path: /metrics
