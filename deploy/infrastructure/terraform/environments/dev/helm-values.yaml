# ProximaDB Helm Values - Development Environment
#
# Purpose: Cost-optimized development configuration
# Characteristics: Small footprint, fast startup, minimal monitoring

replicaCount: 2

image:
  repository: proximadb/proximadb-server
  pullPolicy: IfNotPresent
  tag: "0.2.0"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: "proximadb-dev"

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true

service:
  type: LoadBalancer
  port: 5678
  annotations:
    # Development: Use NLB for faster connections
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    # Disable cross-zone load balancing (cost savings)
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "false"

ingress:
  enabled: false

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 85

nodeSelector: {}

tolerations: []

affinity: {}

# ProximaDB Configuration
config:
  global:
    environment: "development"
    log_level: "debug"
    metrics_enabled: true
    tracing_enabled: false  # Disable in dev for performance

  server:
    bind_address: "0.0.0.0:5678"
    grpc_port: 5679
    max_connections: 1000  # Lower for dev
    connection_timeout: 300
    request_timeout: 120

  storage:
    default_engine: "sst"  # not read by the server; engine is chosen per collection (TD-ENGSEL-1)
    data_directory: "/data/proximadb"
    wal_enabled: true
    wal_directory: "/data/proximadb/wal"
    wal_retention_days: 3  # Shorter retention in dev

    persistence:
      enabled: true
      size: 50Gi  # Smaller storage for dev
      storageClass: "gp2"

  indexing:
    default_index_type: "hnsw"
    default_distance_metric: "cosine"
    default_vector_dimension: 1536

  quantization:
    enabled: true
    default_product_quantization: "scalar"

  caching:
    enabled: true
    cache_size_mb: 256  # Smaller cache for dev
    cache_ttl_seconds: 300

# Storage configuration
persistence:
  enabled: true
  storageClass: "gp2"
  size: 50Gi

# StatefulSet for data persistence
statefulset:
  enabled: false

# Service monitoring
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 60s  # Less frequent in dev
    scrapeTimeout: 10s
  prometheusRule:
    enabled: false  # Disable alerting in dev
    rules: []

# Grafana dashboard
grafanaDashboard:
  enabled: false  # Disable in dev

# Environment variables
env: []
  # - name: PROXIMADB_LOG_LEVEL
  #   value: "debug"

# Secret for sensitive data
secret:
  enabled: false
  envFromSecret: []

# Liveness probe
livenessProbe:
  httpGet:
    path: /health
    port: 5678
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

# Readiness probe
readinessProbe:
  httpGet:
    path: /health
    port: 5678
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 3

# Startup probe
startupProbe:
  httpGet:
    path: /health
    port: 5678
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 30

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Observability
observability:
  logging:
    enabled: true
    format: "text"  # Text format in dev for readability
    level: "debug"

  tracing:
    enabled: false  # Disable in dev

  metrics:
    enabled: true
    port: 9090
    path: /metrics
