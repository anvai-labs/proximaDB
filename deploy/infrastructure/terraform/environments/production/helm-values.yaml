# ProximaDB Helm Values - Production Environment
#
# Purpose: Production environment for customer workloads
# Characteristics: High availability, full monitoring, auto-scaling, security hardened
#
# IMPORTANT: Production requires:
# - High availability (multi-AZ)
# - Full monitoring and alerting
# - Backup and disaster recovery
# - Security hardening
# - Performance optimization

replicaCount: 5

image:
  repository: proximadb/proximadb-server
  pullPolicy: IfNotPresent
  tag: "0.2.0"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: "proximadb"

serviceAccount:
  create: true
  annotations:
    # IRSA annotations for AWS services
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/proximadb-production"
  name: ""

podAnnotations:
  # Promote pods when they're ready
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  # Security hardening
  seccompProfile:
    type: RuntimeDefault

service:
  type: LoadBalancer
  port: 5678
  annotations:
    # Production: Use NLB for performance
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    # Enable cross-zone load balancing
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    # Enable TLS
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:REGION:ACCOUNT:certificate/CERT_ID"
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "5678"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
    # Load balancer attributes
    service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: "3600"
    # Access logs
    service.beta.kubernetes.io/aws-load-balancer-access-log-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-access-log-s3-bucket-name: "proximadb-lb-logs"
    service.beta.kubernetes.io/aws-load-balancer-access-log-s3-bucket-prefix: "production"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    # SSL/TLS
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Security headers
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/frame-deny: "true"
    nginx.ingress.kubernetes.io/content-security-policy: "default-src 'self'"
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "1000"
    # CORS (if needed)
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://proximadb.example.com"
  hosts:
    - host: proximadb.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: proximadb-tls
      hosts:
        - proximadb.example.com
        - *.proximadb.example.com

resources:
  limits:
    cpu: 4000m
    memory: 8Gi
  requests:
    cpu: 1000m
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 5
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  # Custom metrics scaling
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30

nodeSelector:
  # Schedule on dedicated nodes
  workload: proximadb-production

tolerations:
  - key: "workload"
    operator: "Equal"
    value: "proximadb-production"
    effect: "NoSchedule"

affinity:
  # Pod anti-affinity for high availability
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app
              operator: In
              values:
                - proximadb
        topologyKey: kubernetes.io/hostname
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - proximadb
          topologyKey: topology.kubernetes.io/zone

  # Node affinity for dedicated nodes
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: workload
              operator: In
              values:
                - proximadb-production

# ProximaDB Configuration
config:
  global:
    environment: "production"
    log_level: "info"
    metrics_enabled: true
    tracing_enabled: true

  server:
    bind_address: "0.0.0.0:5678"
    grpc_port: 5679
    max_connections: 10000  # Higher limit for production
    connection_timeout: 300
    request_timeout: 120

  storage:
    default_engine: "sst"  # not read by the server; engine is chosen per collection (TD-ENGSEL-1)
    data_directory: "/data/proximadb"
    wal_enabled: true
    wal_directory: "/data/proximadb/wal"
    wal_retention_days: 30  # Longer retention for production

    persistence:
      enabled: true
      size: 500Gi  # Larger storage for production
      storageClass: "gp3-encrypted"

  indexing:
    default_index_type: "hnsw"
    default_distance_metric: "cosine"
    default_vector_dimension: 1536

  quantization:
    enabled: true
    default_product_quantization: "scalar"

  caching:
    enabled: true
    cache_size_mb: 1024  # Larger cache for production
    cache_ttl_seconds: 300

# Storage configuration
persistence:
  enabled: true
  storageClass: "gp3-encrypted"
  size: 500Gi

# StatefulSet for data persistence
statefulset:
  enabled: false

# Service monitoring
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 15s  # Frequent scraping in production
    scrapeTimeout: 10s
  prometheusRule:
    enabled: true  # Critical: enable alerting in production
    rules:
      - alert: ProximaDBDown
        expr: up{job="proximadb"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "ProximaDB instance is down"
          description: "ProximaDB instance has been down for more than 5 minutes."

      - alert: ProximaDBHighCPU
        expr: rate(container_cpu_usage_seconds_total{pod=~"proximadb-.*"}[5m]) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "ProximaDB high CPU usage"
          description: "ProximaDB CPU usage is above 80% for more than 10 minutes."

      - alert: ProximaDBHighMemory
        expr: rate(container_memory_working_set_bytes{pod=~"proximadb-.*"}[5m]) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "ProximaDB high memory usage"
          description: "ProximaDB memory usage is above 90% for more than 10 minutes."

      - alert: ProximaDBHighLatency
        expr: histogram_quantile(0.99, rate(proximadb_request_duration_seconds_bucket[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "ProximaDB high latency"
          description: "ProximaDB P99 latency is above 1s for more than 10 minutes."

# Grafana dashboard
grafanaDashboard:
  enabled: true
  configMapName: grafana-dashboard-proximadb

# Environment variables
env:
  - name: PROXIMADB_LOG_LEVEL
    value: "info"
  - name: PROXIMADB_METRICS_ENABLED
    value: "true"
  - name: PROXIMADB_TRACING_ENABLED
    value: "true"

# Secret for sensitive data
secret:
  enabled: true
  envFromSecret:
    - proximadb-production-secrets

# Init containers
initContainers:
  - name: init-chmod-data
    image: busybox:1.35
    command: ['sh', '-c', 'chmod -R 777 /data']
    volumeMounts:
      - name: data
        mountPath: /data

# Sidecar containers
sidecars:
  - name: log-forwarder
    image: fluent/fluent-bit:1.9
    volumeMounts:
      - name: varlog
        mountPath: /var/log
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi

# Liveness probe
livenessProbe:
  httpGet:
    path: /health
    port: 5678
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

# Readiness probe
readinessProbe:
  httpGet:
    path: /health
    port: 5678
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 3

# Startup probe
startupProbe:
  httpGet:
    path: /health
    port: 5678
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 30

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 3  # Ensure majority quorum

# Priority class
priorityClassName: "high-priority"

# Topology spread constraints
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app: proximadb

# Observability
observability:
  logging:
    enabled: true
    format: "json"
    level: "info"

  tracing:
    enabled: true
    exporter: "otlp"
    endpoint: "http://jaeger-collector.observability.svc:4318"
    # Sampling
    sampler_type: "probabilistic"
    sampler_param: 0.1  # 10% sampling

  metrics:
    enabled: true
    port: 9090
    path: /metrics
