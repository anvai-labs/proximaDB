apiVersion: v1
kind: ConfigMap
metadata:
  name: proximadb-config
  namespace: proximadb
  labels:
    app.kubernetes.io/name: proximadb
data:
  # Server configuration
  PROXIMADB_BIND_ADDRESS: "0.0.0.0"
  PROXIMADB_REST_PORT: "5678"
  PROXIMADB_GRPC_PORT: "5679"
  PROXIMADB_ARROW_IPC_PORT: "5680"
  PROXIMADB_METRICS_PORT: "9090"

  # Storage configuration
  PROXIMADB_DATA_DIR: "/data/proximadb"
  PROXIMADB_DEFAULT_ENGINE: "sst"  # not read by the server; engine is chosen per collection (TD-ENGSEL-1)
  PROXIMADB_WAL_ENABLED: "true"

  # Logging
  RUST_LOG: "info"
