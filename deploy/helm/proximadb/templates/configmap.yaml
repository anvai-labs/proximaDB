apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "proximadb.fullname" . }}-config
  labels:
    {{- include "proximadb.labels" . | nindent 4 }}
data:
  config.toml: |
    [server]
    bind_address = "{{ .Values.proximadb.server.bindAddress }}"
    port = {{ .Values.proximadb.server.restPort }}
    data_dir = "{{ include "proximadb.dataDir" . }}"

    [storage]
    # ignored by the server; the engine is chosen per collection (TD-ENGSEL-1)
    default_engine = "{{ .Values.proximadb.storage.defaultEngine }}"
    metadata_url = "file://{{ include "proximadb.dataDir" . }}/metadata"

    [[storage.storage_locations]]
    url = "file://{{ include "proximadb.dataDir" . }}/data"
    weight = 1

    [storage.wal_config]
    global_manifest_url = "file://{{ include "proximadb.dataDir" . }}/manifest"
    enable_wal = {{ .Values.proximadb.storage.wal.enabled }}
    memory_flush_size_bytes = {{ .Values.proximadb.storage.wal.memoryFlushSizeBytes }}
    global_flush_threshold = {{ .Values.proximadb.storage.wal.globalFlushThreshold }}

    [api]
    grpc_port = {{ .Values.proximadb.server.grpcPort }}
    rest_port = {{ .Values.proximadb.server.restPort }}

    [monitoring]
    prometheus_port = {{ .Values.proximadb.server.metricsPort }}
    prometheus_enabled = {{ .Values.metrics.enabled }}

    [logging]
    level = "{{ .Values.proximadb.logging.level }}"
    format = "{{ .Values.proximadb.logging.format }}"
