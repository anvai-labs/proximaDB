apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "proximadb.fullname" . }}
  labels:
    {{- include "proximadb.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "proximadb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "proximadb.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "proximadb.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "proximadb.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: rest
              containerPort: {{ .Values.proximadb.server.restPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.proximadb.server.grpcPort }}
              protocol: TCP
            - name: arrow-ipc
              containerPort: {{ .Values.proximadb.server.arrowIpcPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.proximadb.server.metricsPort }}
              protocol: TCP
          env:
            - name: PROXIMADB_BIND_ADDRESS
              value: {{ .Values.proximadb.server.bindAddress | quote }}
            - name: PROXIMADB_REST_PORT
              value: {{ .Values.proximadb.server.restPort | quote }}
            - name: PROXIMADB_GRPC_PORT
              value: {{ .Values.proximadb.server.grpcPort | quote }}
            - name: PROXIMADB_ARROW_IPC_PORT
              value: {{ .Values.proximadb.server.arrowIpcPort | quote }}
            - name: PROXIMADB_METRICS_PORT
              value: {{ .Values.proximadb.server.metricsPort | quote }}
            - name: PROXIMADB_DATA_DIR
              value: {{ include "proximadb.dataDir" . | quote }}
            # Not read by the server; the engine is chosen per collection (TD-ENGSEL-1).
            - name: PROXIMADB_DEFAULT_ENGINE
              value: {{ .Values.proximadb.storage.defaultEngine | quote }}
            - name: PROXIMADB_WAL_ENABLED
              value: {{ .Values.proximadb.storage.wal.enabled | quote }}
            - name: RUST_LOG
              value: {{ .Values.proximadb.logging.level | quote }}
            {{- if .Values.proximadb.auth.enabled }}
            - name: PROXIMADB_AUTH_ENABLED
              value: "true"
            - name: PROXIMADB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "proximadb.fullname" . }}-auth
                  key: api-key
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.httpGet.path }}
              port: {{ .Values.livenessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.httpGet.path }}
              port: {{ .Values.readinessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ include "proximadb.dataDir" . }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.sidecars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "proximadb.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
