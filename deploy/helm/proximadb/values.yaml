# Default values for ProximaDB Helm chart
# This is a YAML-formatted file.

replicaCount: 1

image:
  repository: vjsingh1984/proximadb
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

# ProximaDB configuration
proximadb:
  # Server configuration
  server:
    bindAddress: "0.0.0.0"
    restPort: 5678
    grpcPort: 5679
    arrowIpcPort: 5680
    metricsPort: 9090

  # Storage configuration
  storage:
    defaultEngine: "sst"  # not read by the server; engine is chosen per collection (TD-ENGSEL-1)
    # Data directory inside the container
    dataDir: "/data/proximadb"
    # WAL configuration
    wal:
      enabled: true
      memoryFlushSizeBytes: 16777216  # 16MB
      globalFlushThreshold: 4294967296  # 4GB

  # Logging configuration
  logging:
    level: "info"
    format: "json"

  # Authentication (optional)
  auth:
    enabled: false
    # API key for authentication (use secrets in production)
    apiKey: ""

# Service configuration
service:
  type: ClusterIP
  rest:
    port: 5678
  grpc:
    port: 5679
  arrowIpc:
    port: 5680
  metrics:
    port: 9090

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: proximadb.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: proximadb-tls
  #    hosts:
  #      - proximadb.local

# Resource limits and requests
resources:
  limits:
    cpu: 4
    memory: 16Gi
  requests:
    cpu: 1
    memory: 4Gi

# Autoscaling configuration
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Persistence configuration
persistence:
  enabled: true
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 100Gi
  # Annotations for the PVC
  annotations: {}

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}

# Liveness probe configuration
livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: rest
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Readiness probe configuration
readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: rest
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Prometheus metrics
metrics:
  enabled: true
  serviceMonitor:
    enabled: false
    namespace: ""
    labels: {}
    interval: 30s
    scrapeTimeout: 10s

# Pod disruption budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# Extra environment variables
extraEnv: []
  # - name: RUST_LOG
  #   value: "info"

# Extra volumes
extraVolumes: []

# Extra volume mounts
extraVolumeMounts: []

# Init containers
initContainers: []

# Sidecar containers
sidecars: []
