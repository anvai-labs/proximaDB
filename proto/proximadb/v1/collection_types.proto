syntax = "proto3";

package proximadb.v1;

import "proximadb/v1/vector_types.proto"; // reuse enums

message CollectionConfig {
  string name = 1;
  uint32 dimension = 2;
  optional DistanceMetric distance_metric = 3; // Default: COSINE
  optional StorageEngine storage_engine = 4; // Default: SST (primary production engine)
  // NOTE: In proto3, repeated fields cannot be marked as optional, but they default to empty arrays
  // Client implementations should treat missing fields as empty arrays
  repeated string tags = 5; // Defaults to empty array if not provided
  optional string description = 6;
  // Additional fields needed by collection manager
  repeated FilterableColumnSpec filterable_columns = 7; // Defaults to empty array if not provided
  repeated IndexConfig index_configs = 8; // Defaults to empty array if not provided
  optional QuantizationConfig quantization = 9;
  optional StorageConfig storage_config = 10;
  optional string primary_index = 11; // Default: "" (no primary index)
  optional bool auto_index_selection = 12; // Default: true
  optional string owner = 13;
  repeated string embedding_models = 14; // Defaults to empty array if not provided

  // ProximaRecord schema configuration (NEW)
  optional RecordSchemaConfig record_schema = 20;
  optional bool enable_proxima_record = 21;  // Feature flag for ProximaRecord (default: false)
  repeated string text_columns = 22;         // Column names to store as TEXT (not in metadata)
  repeated TextStorageConfig text_storage_configs = 23;  // Detailed TEXT column configurations

  // Dual-use embedding configuration (TD-051)
  // When true, indicates the same embedding is used for retrieval AND context.
  optional bool enable_dual_use_embeddings = 24;

  // Native server-side embedding configuration (in-process via proximadb-embedding).
  // When set, Arrow Flight DoPut MAY omit the vector column; the server selects
  // an embedding model from `embedding_config.route`, runs inference in-process,
  // and writes the resulting vector. Records that still carry a populated vector
  // bypass embedding and are written as-is.
  optional EmbeddingConfig embedding_config = 25;

  // Canonical embedding precision for this collection. Mirrors
  // `CatalogTableSchema.canonical_embedding_precision`. When `FP16` (or any
  // non-`FP32`), the drainer + sink coerce records to this precision before
  // WAL append, compaction reconstitutes back to this precision, and the
  // Arrow bridge emits a Float16Array column for native fp16 on-disk storage
  // (~50% byte reduction vs fp32). When unset / `FP32`, the legacy fp32 path
  // is used unchanged.
  optional EmbeddingPrecision canonical_embedding_precision = 26;

  // Per-repo RBAC: List of principals (user IDs, service accounts, or role IDs)
  // permitted to access this collection. When empty, access is unrestricted
  // (default). When set, only principals in this list can perform data-plane
  // operations (read/write/search) on the collection. This is enforced at the
  // data-plane handler layer (REST/gRPC/pgwire) as a fail-closed check.
  // Governance/admin-plane operations (e.g., collection metadata updates) are
  // not subject to this check — they use separate admin permissions.
  repeated string permitted_principals = 27;

  // Per-collection cold/warm search routing policy (ADR-028). Absent (or
  // mode="auto"/"") => the system decides cost-derived. Owners with hard SLAs
  // override per collection. Query-time precedence: per-query SearchMode >
  // this index_policy > cost-model auto-default.
  optional IndexPolicy index_policy = 28;

  // NOTE on recall_target: stored as a tag on this collection via
  // `tags`, with the convention "recall_target:<float in [0,1]>".
  // The create-collection flow parses that tag and runs
  // `index::axis::management::hnsw_param_advisor::advise_hnsw_params`
  // to size m / ef_construction / ef_search; the AdaptiveIndexEngine
  // re-evaluates as the index grows and surfaces drift via
  // route-health + axis_diag tracing.
  //
  // Stored as a tag rather than a typed field because the proto
  // regeneration pipeline is currently manual (see
  // scripts/regenerate-proto.sh — the generated Rust is hand-
  // committed). Promoting to a typed field is a clean follow-up
  // once the regen pipeline is auto-wired into build.rs.

  // TD-155: per-collection PAX vector quantization strategy. Values: "rabitq",
  // "sq8", "auto", or absent (default-off). When set, the SST flush uses this
  // instead of the deployment-level env PROXIMADB_PAX_VECTOR_QUANT. This is
  // the staged-adoption mechanism — operators opt individual collections into
  // PAX quant without a global flip (ADR-026/027). Precedence at flush:
  // per-collection pax_vector_quant > env > default-off.
  optional string pax_vector_quant = 29;

  // Phase C: per-collection PAX *format* on/off is encoded as a TAG on `tags`
  // (convention `pax_vector_format:on|off`), not a typed field, to avoid manual
  // proto regen (same reason `recall_target` is a tag). Read at SST flush via
  // `pax_vector_format_tag`. Precedence: kill-switch
  // `PROXIMADB_PAX_VECTOR_SEGMENTS_DISABLE` > this tag > global
  // `PROXIMADB_PAX_VECTOR_SEGMENTS` default (flipped on in Phase F).

  // TD-TIER-1 SC1: the collection's desired storage class. UNSPECIFIED/absent
  // (every pre-SC1 record) resolves to BALANCED — old records decode and serve
  // unchanged. ECONOMY/PERFORMANCE persist the intent and report it back with
  // a NOT_ACTIVE status until SC3/SC4 land (read `Collection.storage_class_status`).
  // Unknown explicit values are rejected at admission.
  optional StorageClass storage_class = 30;

  // TD-TIER-1 SC3-2b: monotonic policy generation. Bumped on every actual
  // storage-class change through the policy-mutation surface (re-admission
  // included); absent on legacy records, which report the SC1-era heuristic
  // (0 if the class was never set, 1 if persisted at create). Same-value
  // re-applies do NOT bump. Read-side projection: `Collection.storage_class_status`.
  optional uint32 policy_generation = 31;
}

// Canonical scalar type for a collection's embedding column. Mirrors
// `proximadb_records::EmbeddingScalarType`. The on-disk Arrow column dtype +
// per-cell `EmbeddingCell.precision` derive from this.
enum EmbeddingPrecision {
  EMBEDDING_PRECISION_UNSPECIFIED = 0; // → Fp32 (legacy default)
  EMBEDDING_PRECISION_FP32 = 1;
  EMBEDDING_PRECISION_FP16 = 2;
  EMBEDDING_PRECISION_BF16 = 3;
  EMBEDDING_PRECISION_INT8 = 4;
  EMBEDDING_PRECISION_UINT8 = 5;
}

// Tier-aware embedding route. Resolved per-collection or per-tenant via the
// tenant registry. Mirrors `proximadb_embedding::config::EmbedRoute`.
enum EmbeddingRoute {
  EMBEDDING_ROUTE_UNSPECIFIED = 0;
  EMBEDDING_ROUTE_BGE_SMALL = 1;       // 384-dim, in-process — Free/Starter/Standard tiers
  EMBEDDING_ROUTE_BGE_LARGE = 2;       // 1024-dim, in-process — Pro/Business tiers
  EMBEDDING_ROUTE_BGE_M3 = 3;          // 1024-dim multilingual, in-process — Enterprise default
  EMBEDDING_ROUTE_AZURE_OPENAI = 4;    // External API — Enterprise + Premium add-on
  EMBEDDING_ROUTE_BYO = 5;             // Customer-supplied endpoint — Enterprise BYO
}

// Per-collection server-side embedding configuration. When set on a CollectionConfig,
// Arrow Flight DoPut accepts records without a vector column; the server populates
// it via the configured embedding route before WAL append.
message EmbeddingConfig {
  // Embedding model + transport selection.
  EmbeddingRoute route = 1;

  // Field 2 held `optional ChunkConfig chunk`, retired by TD-CHUNK-5. It was
  // accepted on the wire and converted by nothing: no Rust code ever read the
  // generated type, so a tenant could set `size_tokens: 512` and observe no
  // error and no effect. Server-side chunking is not a shipped capability, and
  // carrying a contract for one — in three disagreeing spellings — was pure
  // liability. Reserved, never reused: if server-side chunking ships, it gets
  // a new field whose semantics are decided rather than inherited.
  reserved 2;
  reserved "chunk";

  // BYO endpoint metadata (only when route == EMBEDDING_ROUTE_BYO).
  optional ByoEndpoint byo_endpoint = 3;
}

// `ChunkConfig` and `ChunkStrategy` were removed here by TD-CHUNK-5 together
// with the field above. Their names did not mean what they said in the only
// implementation that ever existed: `size_tokens` counted CHARACTERS at a
// hardcoded 4x ratio for two of the four strategies, `overlap_pct` was a
// fraction of that character window, and `HEADING` silently fell back to
// paragraph. Chunking policy is configured through the SDK
// (`proximadb_sdk.chunking_strategies`), which is the only implementation that
// chunks anything. See ADR-091 for the grid/measure/budget split that replaces
// this shape.

message ByoEndpoint {
  string url = 1;
  ByoAuth auth = 2;
  uint32 declared_dim = 3;
  uint32 batch_size = 4;     // Default: 32
  uint64 timeout_ms = 5;     // Default: 10000
}

message ByoAuth {
  oneof method {
    string bearer_secret_ref = 1;   // Azure Key Vault / Secrets Manager ref
    MtlsCert mtls = 2;
  }
}

message MtlsCert {
  string cert_ref = 1;
  string key_ref = 2;
}

message CollectionStats {
  int64 vector_count = 1;
  int64 index_size_bytes = 2;
  int64 data_size_bytes = 3;
}

// Per-collection cold/warm search routing policy (ADR-028).
//
// Paved road + escape hatch: an absent message (or mode="auto"/"") means the
// system decides cost-derived (exact when N*dim*4 <= storage-class byte budget,
// else approximate). Owners with hard SLAs can override per collection.
//
// Validity matrix (fail-closed at create): rehydrate/nprobe are index/auto
// concepts and are rejected when mode="exact" (exact builds no index).
message IndexPolicy {
  // "auto"(default) | "exact" | "ivf" | "hnsw" | "helix".
  // "auto"/"" => cost-derived. "exact" => always brute-force (no index). The
  // engine modes force the collection onto that engine/route.
  string mode = 1;
  // "auto"(default) | "eager" | "lazy" | "never". Index/auto modes only.
  // Controls when a persisted index is warmed on cold start.
  string rehydrate = 2;
  // Exact-scan byte budget override. 0 => cost-model default for the storage
  // class; otherwise the max bytes (N*dim*4) the auto gate will brute-force
  // before routing to the index.
  uint64 byte_budget = 3;
  // nprobe override for index modes. 0 => cost-derived.
  uint32 nprobe = 4;
}

message Collection {
  string id = 1;
  CollectionConfig config = 2;
  CollectionStats stats = 3;
  int64 created_at = 4;
  int64 updated_at = 5;
  optional StorageAssignment storage_assignment = 6;
  // Observed storage-class status (read-side projection of config.storage_class;
  // never an input). Computed on read; see StorageClassStatus.
  optional StorageClassStatus storage_class_status = 7;
}

// Index configuration
message IndexConfig {
  string index_name = 1;
  IndexingAlgorithm algorithm = 2;
  map<string, string> parameters = 3;
  optional bool enabled = 4; // Default: true
  // Additional fields for compatibility
  optional int32 update_mode = 5; // Default: 0 (synchronous)
  optional uint32 async_update_timeout_ms = 6;
  optional uint32 async_update_batch_size = 7;
  optional bool enable_background_optimization = 8; // Default: true
  optional HnswConfig hnsw_config = 9;
  optional IvfConfig ivf_config = 10;
  optional LshConfig lsh_config = 11;
  optional string flat_config = 12;
  optional string pq_config = 13;
  optional string annoy_config = 14;
  optional uint32 build_concurrency = 15; // Default: num_cpus
  optional uint32 memory_limit_mb = 16; // Default: 20% of system RAM
  optional uint32 checkpoint_interval_ms = 17; // Default: 60000 (1 minute)
  optional bool is_primary = 18; // Default: false
  repeated string use_cases = 19;
  optional float selectivity_threshold = 20; // Default: 0.1
  optional bool use_quantization = 21; // Default: false
  optional QuantizationConfig quantization_override = 22;
  optional string queue_representation = 23; // Default: "" (no queue)
}

// Storage configuration
message StorageConfig {
  optional string storage_path = 1; // Default: auto-generated based on collection ID
  repeated string data_paths = 2;
  optional CompressionAlgorithm compression = 3; // Default: COMPRESSION_ZSTD
  optional uint32 max_file_size_mb = 4; // Default: 128MB
  optional bool enable_caching = 5; // Default: true
}

// Per-collection storage class (TD-TIER-1 SC1). The DESIRED policy only —
// observed residency is reported separately via `StorageClassStatus` on the
// read model, never claimed from this field. UNSPECIFIED (or an absent field,
// which is every pre-SC1 record) resolves to BALANCED for compatibility;
// unknown explicit values are rejected at admission on every facade.
enum StorageClass {
  STORAGE_CLASS_UNSPECIFIED = 0;
  STORAGE_CLASS_ECONOMY = 1;
  STORAGE_CLASS_BALANCED = 2;
  STORAGE_CLASS_PERFORMANCE = 3;
}

// Observed storage-class status (read-side projection, computed from the
// desired policy; never an input). v1 (SC1): BALANCED is ACTIVE; ECONOMY and
// PERFORMANCE are accepted-but-NOT_ACTIVE — their residency/reservation
// dependencies (SC3/SC4) are not implemented, so the collection keeps serving
// with BALANCED behavior and the reason names the missing dependency. The
// byte levels stay zero-with-reason until those slices land.
message StorageClassStatus {
  enum State {
    STATE_UNSPECIFIED = 0;
    // The desired class is in effect.
    STATE_ACTIVE = 1;
    // The policy is persisted but its dependency is not implemented/enabled
    // in this build; the collection serves balanced behavior.
    STATE_NOT_ACTIVE = 2;
  }
  State state = 1;
  // Human-readable reason when state != ACTIVE (names the missing dependency).
  string reason = 2;
  // Monotonic generation of the desired policy: 0 = never set (pre-SC1
  // records), 1 = set at create; a policy-change surface will bump it.
  uint64 policy_generation = 3;
  // Reserved bytes under the collection's residency admission (SC3). 0 until then.
  uint64 reserved_bytes = 4;
  // Bytes resident in the serving cache (SC4). 0 until then.
  uint64 resident_bytes = 5;
  // Bytes covered by the READY coverage set (SC4). 0 until then.
  uint64 covered_bytes = 6;
}

// Storage assignment information
message StorageAssignment {
  string primary_path = 1;
  repeated string backup_paths = 2;
  StorageEngine engine = 3;
  map<string, string> engine_config = 4;
  // Additional fields for compatibility
  string base_location = 5;
  int64 assigned_at = 6;
  // ADR-031 Phase 4d: the typed collection identity triple, set at create when
  // PROXIMADB_TYPED_PATHS=1 so catalog-free engines can resolve the typed
  // account-rooted read path. All three are Some or all three are None.
  // uint32 in proto (no uint16); namespace_id is a u16 in Rust.
  optional uint32 typed_account_id = 7;
  optional uint32 typed_namespace_id = 8;
  optional uint32 typed_collection_id = 9;
}

message GetCollectionRequest {
  string collection_id = 1; // name or ID
}

message ListCollectionsRequest {
  optional uint32 limit = 1;
  optional uint32 offset = 2;
  optional bool include_stats = 3;
}

message ListCollectionsResponse {
  repeated Collection collections = 1;
}

message DeleteCollectionRequest {
  string collection_id = 1;
}

message DeleteCollectionResponse {
  bool success = 1;
}

// Collection operations enum
enum CollectionOperation {
  COLLECTION_OPERATION_UNSPECIFIED = 0;
  COLLECTION_CREATE = 1;
  COLLECTION_UPDATE = 2;
  COLLECTION_GET = 3;
  COLLECTION_LIST = 4;
  COLLECTION_DELETE = 5;
  COLLECTION_MIGRATE = 6;
  COLLECTION_GET_ID_BY_NAME = 7;
}

// Unified collection request message
message CollectionRequest {
  int32 operation = 1;
  optional string collection_id = 2;
  optional CollectionConfig collection_config = 3;
  map<string, string> query_params = 4;
  map<string, bool> options = 5;
  map<string, string> migration_config = 6;
}

// Unified collection response message  
message CollectionResponse {
  bool success = 1;
  optional Collection collection = 2;
  repeated Collection collections = 3;
  optional string error_message = 4;
  optional string error_code = 5;
  // Additional legacy fields
  int32 operation = 6;
  int64 affected_count = 7;
  int64 total_count = 8;
  map<string, string> metadata = 9;
  int64 processing_time_us = 10;
}

// Collection snapshot for backups/migrations
message CollectionSnapshot {
  Collection collection = 1;
  repeated VectorRecord vectors = 2;
  int64 snapshot_timestamp = 3;
  string snapshot_version = 4;
}

// =============================================================================
// ProximaRecord Schema Configuration (for v1 API compatibility)
// =============================================================================

// Record schema configuration for collection
message RecordSchemaConfig {
  string schema_id = 1;              // Reference to schema in catalog
  string schema_version = 2;         // Schema version
  SchemaEnforcement enforcement = 3; // How strictly to enforce schema
  bool auto_evolve = 4;              // Allow automatic schema evolution
  repeated TypedColumnConfig columns = 5;
}

// Schema enforcement mode
enum SchemaEnforcement {
  SCHEMA_ENFORCEMENT_UNSPECIFIED = 0;
  SCHEMA_STRICT = 1;     // All fields must match schema
  SCHEMA_FLEXIBLE = 2;   // Schema on read, no validation
  SCHEMA_HYBRID = 3;     // Core fields enforced, extras allowed
}

// Typed column configuration
message TypedColumnConfig {
  string name = 1;
  FilterableDataType data_type = 2;
  bool nullable = 3;
  bool indexed = 4;
  bool filterable = 5;

  // Validation constraints
  optional uint32 max_length = 10;
  optional int64 min_value = 11;
  optional int64 max_value = 12;
  optional string regex_pattern = 13;
  optional string default_value = 14;

  // TEXT-specific
  optional TextStorage text_storage = 20;
  optional bool fulltext_indexed = 21;
}

// TEXT storage strategy
enum TextStorage {
  TEXT_STORAGE_UNSPECIFIED = 0;
  TEXT_STORAGE_INLINE = 1;    // In main Parquet column (<4KB)
  TEXT_STORAGE_CHUNKED = 2;   // Split into chunks with embeddings
  TEXT_STORAGE_SIDECAR = 3;   // Separate sidecar file
  TEXT_STORAGE_ADAPTIVE = 4;  // Auto-select based on size
}

// Detailed TEXT column storage configuration
message TextStorageConfig {
  // Column name this config applies to
  string column_name = 1;

  // Storage strategy
  TextStorage strategy = 2;

  // Thresholds for adaptive strategy (bytes)
  uint32 inline_threshold = 3;    // Default: 4096 (4KB)
  uint32 chunked_threshold = 4;   // Default: 1048576 (1MB)

  // Chunked storage options (for RAG)
  uint32 chunk_size = 5;          // Characters per chunk, default: 512
  bool generate_chunk_embeddings = 6;  // Generate embeddings per chunk
  string embedding_model = 7;     // Model for chunk embeddings

  // N-gram bloom filter for CONTAINS queries
  bool enable_ngram_bloom = 8;    // Enable bloom filter acceleration
  uint32 ngram_size = 9;          // N-gram size, default: 3

  // Sidecar storage options
  string sidecar_base_path = 10;  // Base path for sidecar files
  TextCompression sidecar_compression = 11;

  // Limits
  uint64 max_text_size = 12;      // Max text size in bytes (0 = unlimited)

  // Full-text search options
  bool enable_fulltext_index = 13;
  string fulltext_analyzer = 14;  // Analyzer for full-text indexing
}

// Compression for sidecar TEXT files
enum TextCompression {
  TEXT_COMPRESSION_UNSPECIFIED = 0;
  TEXT_COMPRESSION_NONE = 1;
  TEXT_COMPRESSION_LZ4 = 2;
  TEXT_COMPRESSION_ZSTD = 3;
}
