syntax = "proto3";

package proximadb.v2;

// =============================================================================
// ColumnDataType: Rich data type enum for ProximaRecord columns
// =============================================================================
// Extends FilterableDataType with enterprise-grade types for OLAP/OLTP workloads.
// Each type maps to specific Arrow DataType for columnar storage.
enum ColumnDataType {
  COLUMN_TYPE_UNSPECIFIED = 0;

  // Text types
  TEXT = 1;              // UTF-8 string, max 64KB default, Arrow Utf8
  TEXT_LARGE = 2;        // Large text (>64KB), Arrow LargeUtf8, separate storage

  // Numeric types
  INTEGER = 3;           // i64, Arrow Int64
  FLOAT = 4;             // f64, Arrow Float64
  DECIMAL = 5;           // Decimal128(38,18) for financial precision

  // Boolean
  BOOLEAN = 6;           // Arrow Boolean

  // Temporal types
  TIMESTAMP = 7;         // Microseconds since epoch, no timezone, Arrow Timestamp
  TIMESTAMP_TZ = 8;      // Microseconds with timezone, Arrow TimestampTz
  DATE = 9;              // Date32, days since epoch
  TIME = 10;             // Time64, microseconds since midnight
  DURATION = 11;         // Duration in microseconds
  INTERVAL = 12;         // Calendar interval (months, days, nanos)

  // Identifier types
  UUID = 13;             // RFC 4122 UUID, validated format, stored as FixedSizeBinary(16)

  // Binary types
  BINARY = 14;           // Raw bytes, max 1MB default, Arrow Binary
  BINARY_LARGE = 15;     // Large binary (>1MB), Arrow LargeBinary

  // Structured types
  JSON = 16;             // Validated JSON object, Arrow Utf8 with validation

  // Array types (homogeneous)
  ARRAY_TEXT = 17;       // List<Utf8>
  ARRAY_INTEGER = 18;    // List<Int64>
  ARRAY_FLOAT = 19;      // List<Float64>
  ARRAY_BOOLEAN = 20;    // List<Boolean>
  ARRAY_UUID = 21;       // List<FixedSizeBinary(16)>

  // Map types
  MAP_STRING_STRING = 22;  // Map<Utf8, Utf8>
  MAP_STRING_ANY = 23;     // Map<Utf8, TypedValue> - flexible values
  MAP_STRING_INTEGER = 24; // Map<Utf8, Int64>
  MAP_STRING_FLOAT = 25;   // Map<Utf8, Float64>

  // Geospatial (future expansion)
  GEO_POINT = 26;        // (lat, lon) pair
  GEO_POLYGON = 27;      // List of points forming a polygon

  // Vector embedding (native support)
  VECTOR = 28;           // Dense vector, List<Float32>
  SPARSE_VECTOR = 29;    // Sparse vector with indices

  // Full ProximaValue coverage (MULTIMODAL_OVERHAUL_SPEC §4.2)
  INT8 = 60;
  INT16 = 61;
  INT32 = 62;
  UINT8 = 63;
  UINT16 = 64;
  UINT32 = 65;
  UINT64 = 66;
  FLOAT32 = 67;
  SYMBOL = 68;
  JSONB = 69;
  ULID = 70;
  ARRAY_ANY = 71;
  STRUCT = 72;
  BINARY_VECTOR = 73;
}

// =============================================================================
// TypedValue: Strongly-typed value wrapper
// =============================================================================
// Used in the canonical props map for schema-validated columns.
message TypedValue {
  ColumnDataType declared_type = 1;

  oneof value {
    // Text
    string text_value = 10;

    // Numeric
    int64 integer_value = 11;
    double float_value = 12;
    DecimalValue decimal_value = 13;

    // Boolean
    bool boolean_value = 14;

    // Temporal
    int64 timestamp_value = 15;      // Microseconds since epoch
    TimestampTzValue timestamp_tz_value = 16;
    int32 date_value = 17;           // Days since epoch
    int64 time_value = 18;           // Microseconds since midnight
    int64 duration_value = 19;       // Duration in microseconds
    IntervalValue interval_value = 20;

    // Identifier
    bytes uuid_value = 21;           // 16-byte UUID

    // Binary
    bytes binary_value = 22;

    // Structured
    string json_value = 23;          // JSON string (validated)

    // Arrays
    TextArray text_array = 30;
    IntegerArray integer_array = 31;
    FloatArray float_array = 32;
    BooleanArray boolean_array = 33;
    UuidArray uuid_array = 34;

    // Maps
    StringStringMap string_string_map = 40;
    StringIntegerMap string_integer_map = 41;
    StringFloatMap string_float_map = 42;

    // Geospatial
    GeoPoint geo_point = 50;
    GeoPolygon geo_polygon = 51;

    // Vector
    FloatArray vector_value = 52;
    SparseVector sparse_vector_value = 53;

    // Canonical ProximaValue extensions
    int32 int8_value = 60;
    int32 int16_value = 61;
    int32 int32_value = 62;
    uint32 uint8_value = 63;
    uint32 uint16_value = 64;
    uint32 uint32_value = 65;
    uint64 uint64_value = 66;
    float float32_value = 67;
    string symbol_value = 68;
    bytes jsonb_value = 69;          // MessagePack-encoded JSONB
    bytes ulid_value = 70;           // 16-byte ULID
    TypedValueArray array_value = 71;
    TypedValueMap map_value = 72;
    TypedValueMap struct_value = 73;
    bytes binary_vector_value = 74;

    // Null marker
    bool is_null = 99;
  }
}

// Decimal with precision and scale
message DecimalValue {
  bytes value = 1;        // i128 as 16 bytes, little-endian
  uint32 precision = 2;   // Total digits (max 38)
  uint32 scale = 3;       // Digits after decimal point
}

// Timestamp with timezone
message TimestampTzValue {
  int64 timestamp_us = 1;  // Microseconds since epoch in UTC
  string timezone = 2;     // IANA timezone (e.g., "America/New_York")
}

// Calendar interval
message IntervalValue {
  int32 months = 1;
  int32 days = 2;
  int64 nanos = 3;
}

// Array types
message TextArray {
  repeated string values = 1;
}

message IntegerArray {
  repeated int64 values = 1;
}

message FloatArray {
  repeated double values = 1;
}

message BooleanArray {
  repeated bool values = 1;
}

message UuidArray {
  repeated bytes values = 1;  // Each 16 bytes
}

message TypedValueArray {
  repeated TypedValue values = 1;
}

message TypedValueMap {
  map<string, TypedValue> entries = 1;
}

// Map types
message StringStringMap {
  map<string, string> entries = 1;
}

message StringIntegerMap {
  map<string, int64> entries = 1;
}

message StringFloatMap {
  map<string, double> entries = 1;
}

// Geospatial types
message GeoPoint {
  double latitude = 1;   // -90 to 90
  double longitude = 2;  // -180 to 180
  optional double altitude = 3;
}

message GeoPolygon {
  repeated GeoPoint points = 1;  // Ring of points, first == last
}

// Sparse vector with indices
message SparseVector {
  repeated uint32 indices = 1;
  repeated float values = 2;
  uint32 dimension = 3;  // Total dimension of sparse space
}

// Element type for dense/sparse vector columns. Value names are prefixed to
// avoid proto3 value-name collisions with ColumnDataType (FLOAT32/INT8/...).
enum VectorElementType {
  VECTOR_ELEMENT_TYPE_UNSPECIFIED = 0;
  VECTOR_ELEMENT_FLOAT16 = 1;
  VECTOR_ELEMENT_BFLOAT16 = 2;
  VECTOR_ELEMENT_FLOAT32 = 3;
  VECTOR_ELEMENT_FLOAT64 = 4;
  VECTOR_ELEMENT_INT8 = 5;
}

// =============================================================================
// TypedColumn: Column definition with validation constraints
// =============================================================================
message TypedColumn {
  string name = 1;
  ColumnDataType data_type = 2;

  // Column properties
  bool nullable = 3;           // Default: true
  bool indexed = 4;            // Create secondary index for fast lookups
  bool filterable = 5;         // Allow in WHERE clauses (enables statistics)
  bool unique = 6;             // Enforce uniqueness constraint

  // Validation constraints
  optional uint32 max_length = 10;           // For TEXT/BINARY
  optional uint32 min_length = 11;           // For TEXT/BINARY
  optional int64 min_value = 12;             // For INTEGER
  optional int64 max_value = 13;             // For INTEGER
  optional double min_float_value = 14;      // For FLOAT
  optional double max_float_value = 15;      // For FLOAT
  optional string regex_pattern = 16;        // For TEXT validation
  optional string default_value = 17;        // Default value (serialized)
  optional uint32 decimal_precision = 18;    // For DECIMAL (1-38)
  optional uint32 decimal_scale = 19;        // For DECIMAL (0-precision)
  optional uint32 array_max_items = 20;      // For ARRAY types
  optional uint32 json_max_depth = 21;       // For JSON (default: 32)
  optional string json_schema = 22;          // JSON Schema for validation
  optional string timezone = 23;             // For TIMESTAMP_TZ default

  // VECTOR-specific options
  optional uint32 vector_dimension = 24;     // For DENSE_VECTOR / BINARY_VECTOR dimension
  optional VectorElementType vector_element_type = 25;  // For DENSE_VECTOR / SPARSE_VECTOR element

  // TEXT-specific options
  optional TextStorageStrategy text_storage_strategy = 30;
  optional bool enable_fulltext_index = 31;  // Create fulltext index
  optional bool enable_ngram_bloom = 32;     // Create n-gram bloom filter
  optional uint32 ngram_size = 33;           // N-gram size (default: 3)

  // Description and metadata
  optional string description = 50;
  map<string, string> annotations = 51;
}

// =============================================================================
// RecordSchema: Schema definition with enforcement mode
// =============================================================================
message RecordSchema {
  string schema_id = 1;           // UUID for this schema version
  string schema_version = 2;      // Semantic version (e.g., "1.0.0")
  string schema_name = 3;         // Human-readable name

  repeated TypedColumn columns = 4;
  SchemaEnforcementMode enforcement_mode = 5;
  bool allow_additional_fields = 6;  // For HYBRID mode

  // Schema evolution
  optional string parent_schema_id = 10;  // Previous version
  repeated SchemaEvolutionRule evolution_rules = 11;

  // Metadata
  int64 created_at = 20;
  optional string created_by = 21;
  optional string description = 22;
  map<string, string> annotations = 23;
}

// Schema enforcement modes
enum SchemaEnforcementMode {
  SCHEMA_ENFORCEMENT_UNSPECIFIED = 0;
  STRICT = 1;      // All columns must match schema exactly
  FLEXIBLE = 2;    // Schema on read, no validation at insert
  HYBRID = 3;      // Core columns enforced, additional fields allowed in props
}

// Schema evolution rules for backward/forward compatibility
message SchemaEvolutionRule {
  string rule_id = 1;
  SchemaEvolutionType rule_type = 2;
  string source_column = 3;
  optional string target_column = 4;
  optional string transform_expression = 5;
  optional string default_value = 6;
}

enum SchemaEvolutionType {
  EVOLUTION_TYPE_UNSPECIFIED = 0;
  ADD_COLUMN = 1;        // New column with default
  REMOVE_COLUMN = 2;     // Column dropped (data preserved in props if HYBRID)
  RENAME_COLUMN = 3;     // Column renamed
  CHANGE_TYPE = 4;       // Type changed with transform
  CHANGE_NULLABILITY = 5; // Nullable -> required or vice versa
}

// =============================================================================
// TextField: Dedicated TEXT storage with strategy hints
// =============================================================================
message TextField {
  string name = 1;
  string content = 2;
  TextStorageStrategy storage_hint = 3;

  // Optional chunking info (populated after storage)
  optional uint32 chunk_count = 10;
  optional string chunk_reference = 11;  // Reference to chunks sidecar
}

// TEXT storage strategies
enum TextStorageStrategy {
  TEXT_STORAGE_UNSPECIFIED = 0;
  TEXT_INLINE = 1;      // Store in main Parquet LargeUtf8 column (<4KB)
  TEXT_CHUNKED = 2;     // Split into chunks with embeddings (4KB-1MB)
  TEXT_SIDECAR = 3;     // Separate sidecar file (>1MB)
  TEXT_ADAPTIVE = 4;    // Auto-select based on actual size (default)
}

// =============================================================================
// ProximaRecord: The new unified record type
// =============================================================================
// Replaces VectorRecord with:
// - Rich typed properties instead of generic metadata map
// - Dedicated TEXT fields for chunked text storage
// - Schema enforcement with catalog integration
message ProximaRecord {
  // Core identity
  string id = 1;

  // Vector embedding (dense)
  repeated float vector = 2;
  optional uint32 vector_dimension = 3;  // Explicit dimension for validation

  // Sparse vector (optional, for hybrid search)
  optional SparseVector sparse_vector = 4;

  // Canonical NF2 property map (schema-validated where a schema is attached)
  map<string, TypedValue> props = 5;

  // TEXT content - dedicated columnar storage
  // These are stored separately to avoid metadata scanning
  repeated TextField text_fields = 10;

  // Temporal fields
  int64 timestamp_ms = 20;           // Creation timestamp
  optional int64 updated_at_ms = 21; // Last update timestamp
  optional int64 expires_at_ms = 22; // TTL expiration
  optional uint32 version = 23;      // Optimistic locking version

  // Provenance
  optional string source = 30;       // Original content reference
  optional string source_type = 31;  // MIME type or content type
  optional string schema_id = 32;    // Schema this record conforms to

  // Partitioning hints
  optional string partition_key = 40;
  map<string, string> partition_values = 41;

  // Audit trail
  optional string created_by = 50;
  optional string updated_by = 51;
  map<string, string> custom_metadata = 52;
}

// =============================================================================
// Batch operations for ProximaRecord
// =============================================================================
message ProximaRecordBatch {
  string collection_id = 1;
  repeated ProximaRecord records = 2;
  optional string schema_id = 3;  // Schema to validate against
  BatchWriteMode write_mode = 4;

  // Options
  bool validate_schema = 5;       // Default: true
  bool return_ids = 6;            // Return generated IDs
  bool return_errors = 7;         // Return per-record errors
}

enum BatchWriteMode {
  BATCH_WRITE_MODE_UNSPECIFIED = 0;
  INSERT = 1;       // Fail if ID exists
  UPSERT = 2;       // Insert or update
  UPDATE = 3;       // Fail if ID doesn't exist
  DELETE = 4;       // Delete by ID
}

message ProximaRecordBatchResponse {
  bool success = 1;
  int64 total_processed = 2;
  int64 success_count = 3;
  int64 failed_count = 4;
  repeated string inserted_ids = 5;
  repeated BatchError errors = 6;
  int64 processing_time_us = 7;
}

message BatchError {
  int32 record_index = 1;
  string record_id = 2;
  string error_code = 3;
  string error_message = 4;
}

// =============================================================================
// Search with typed filters
// =============================================================================
message TypedSearchRequest {
  string collection_id = 1;

  // Query vectors
  repeated float query_vector = 2;
  optional SparseVector query_sparse_vector = 3;

  // Search parameters
  uint32 top_k = 4;
  optional float score_threshold = 5;

  // Typed filters (strongly-typed predicates)
  repeated TypedFilterCondition filters = 10;
  optional FilterLogicOperator filter_logic = 11;  // AND/OR for combining filters

  // Projection
  repeated string include_fields = 20;
  repeated string exclude_fields = 21;
  bool include_vector = 22;
  bool include_text_fields = 23;

  // Search hints
  optional string schema_id = 30;
  map<string, string> search_hints = 31;
}

message TypedFilterCondition {
  string field_name = 1;
  TypedFilterOperator operator = 2;
  TypedValue value = 3;
  optional TypedValue value_upper = 4;  // For BETWEEN
  repeated TypedValue value_list = 5;   // For IN/NOT_IN

  // Nested conditions for complex filters
  repeated TypedFilterCondition nested = 10;
  optional FilterLogicOperator nested_logic = 11;
}

enum TypedFilterOperator {
  TYPED_FILTER_OP_UNSPECIFIED = 0;

  // Equality
  EQ = 1;           // ==
  NE = 2;           // !=

  // Comparison
  GT = 3;           // >
  GTE = 4;          // >=
  LT = 5;           // <
  LTE = 6;          // <=
  BETWEEN = 7;      // value <= x <= value_upper

  // Set membership
  IN = 10;          // value in list
  NOT_IN = 11;      // value not in list

  // String operations
  CONTAINS = 20;    // substring match
  STARTS_WITH = 21; // prefix match
  ENDS_WITH = 22;   // suffix match
  REGEX = 23;       // regex match
  LIKE = 24;        // SQL LIKE pattern

  // Fulltext
  FULLTEXT_MATCH = 30;  // Fulltext search

  // Array operations
  ARRAY_CONTAINS = 40;      // Array contains element
  ARRAY_CONTAINS_ALL = 41;  // Array contains all elements
  ARRAY_CONTAINS_ANY = 42;  // Array contains any element
  ARRAY_LENGTH_EQ = 43;     // Array length equals
  ARRAY_LENGTH_GT = 44;     // Array length greater than

  // Null checks
  IS_NULL = 50;
  IS_NOT_NULL = 51;

  // JSON path
  JSON_PATH_EXISTS = 60;    // JSON path exists
  JSON_PATH_MATCH = 61;     // JSON path value match

  // Geospatial
  GEO_WITHIN = 70;          // Point within polygon
  GEO_DISTANCE = 71;        // Distance from point
}

enum FilterLogicOperator {
  FILTER_LOGIC_UNSPECIFIED = 0;
  AND = 1;
  OR = 2;
  NOT = 3;
}

// TD-064: predicate-aware recall shortfall — present when a filtered search
// returned fewer than the requested top_k after the WAL+AXIS+storage merge.
// Always emitted when present (NOT debug-gated): a silent <top_k under a
// tenant/RLS filter is fail-open, so the client must be told.
message PredicateShortfall {
  // The top_k value the caller asked for.
  uint32 requested_k = 1;
  // Results actually returned after predicate filtering + merge.
  uint32 returned_k = 2;
  // Candidate pool size considered before the predicate (oversample budget).
  uint32 oversample_pool = 3;
  // ADR-011 mode that produced the shortfall (post_filter / inline / pre_filter).
  string ann_filtering_mode = 4;
}

message TypedSearchResponse {
  repeated TypedSearchResult results = 1;
  int64 total_found = 2;
  int64 search_time_us = 3;
  optional string collection_id = 4;
  map<string, string> search_stats = 5;
  // TD-064: typed, top-level, always-on predicate shortfall (None on happy path).
  optional PredicateShortfall predicate_shortfall = 6;
}

message TypedSearchResult {
  string id = 1;
  double score = 2;

  // Fields (based on projection)
  map<string, TypedValue> props = 3;
  repeated float vector = 4;
  repeated TextField text_fields = 5;

  // Metadata
  optional int64 timestamp_ms = 10;
  optional uint32 version = 11;
  optional string source = 12;
}

// =============================================================================
// Schema management operations
// =============================================================================
message CreateSchemaRequest {
  string collection_id = 1;
  RecordSchema schema = 2;
  bool set_as_default = 3;  // Make this the default schema for the collection
}

message CreateSchemaResponse {
  bool success = 1;
  string schema_id = 2;
  optional string error_message = 3;
}

message GetSchemaRequest {
  string collection_id = 1;
  optional string schema_id = 2;  // If not provided, returns default schema
}

message GetSchemaResponse {
  bool success = 1;
  optional RecordSchema schema = 2;
  optional string error_message = 3;
  // TD-GRPCSCHEMA-2: whether record mode (write enforcement) is ON for the
  // collection — the schema above is served either way.
  optional bool record_enabled = 4;
}

message ListSchemasRequest {
  string collection_id = 1;
  optional uint32 limit = 2;
  optional uint32 offset = 3;
}

message ListSchemasResponse {
  repeated RecordSchema schemas = 1;
  int64 total_count = 2;
}

message EvolveSchemaRequest {
  string collection_id = 1;
  string base_schema_id = 2;
  RecordSchema new_schema = 3;
  bool dry_run = 4;  // Validate without applying
  bool migrate_existing = 5;  // Migrate existing records to new schema
}

message EvolveSchemaResponse {
  bool success = 1;
  string new_schema_id = 2;
  int64 records_to_migrate = 3;  // In dry_run mode, shows count
  repeated string compatibility_warnings = 4;
  optional string error_message = 5;
}

// =============================================================================
// Streaming write operations
// =============================================================================

// Single record for streaming write
message StreamWriteRecord {
  ProximaRecord record = 1;
  BatchWriteMode write_mode = 2;       // INSERT, UPSERT, UPDATE, DELETE
  uint64 client_sequence = 3;          // Client-side sequence for ordering/ack
}

// Request message for BatchWriteStream RPC
message BatchWriteStreamRequest {
  string collection_id = 1;
  repeated StreamWriteRecord records = 2;
  optional string schema_id = 3;       // Schema to validate against
  bool validate_schema = 4;            // Default: true
}

// Response message for BatchWriteStream RPC (streaming acks)
message BatchWriteStreamResponse {
  // Acknowledged client sequences
  repeated uint64 acked_sequences = 1;

  // Backpressure control
  BackpressureSignal backpressure = 2;

  // Cumulative statistics
  int64 total_processed = 3;
  int64 success_count = 4;
  int64 failed_count = 5;

  // Per-record errors (if any in this batch)
  repeated BatchError errors = 6;

  // Server timestamp (milliseconds since epoch)
  int64 server_timestamp_ms = 7;
}

// Backpressure signal for flow control
message BackpressureSignal {
  BackpressureLevel level = 1;
  uint32 suggested_delay_ms = 2;       // Suggested delay before next send
  uint32 buffer_percent = 3;           // Current buffer utilization (0-100)
}

// Backpressure severity levels
enum BackpressureLevel {
  BACKPRESSURE_NONE = 0;
  BACKPRESSURE_LOW = 1;                // Buffer 25-50% full
  BACKPRESSURE_MEDIUM = 2;             // Buffer 50-75% full
  BACKPRESSURE_HIGH = 3;               // Buffer 75-90% full
  BACKPRESSURE_CRITICAL = 4;           // Buffer >90% full, client should pause
}

// =============================================================================
// Collection management (v2 — parity with v1 CollectionService).
// Self-contained: distance_metric/storage_engine are lowercase strings mapped
// to the internal enums server-side (avoids importing the v1 proto package).
// =============================================================================
// v2-native HNSW tuning (maps to v1 HnswConfig at the handler boundary).
message V2HnswConfig {
  optional uint32 m = 1;
  optional uint32 ef_construction = 2;
  optional uint32 ef_search = 3;
}

// v2-native IVF tuning (maps to v1 IvfConfig at the handler boundary).
message V2IvfConfig {
  optional uint32 n_lists = 1;
  optional uint32 n_probe = 2;
}

// A single index on the collection (v2-native; maps to v1 IndexConfig).
message V2IndexSpec {
  string algorithm = 1;  // "hnsw" (default) | "ivf" | "flat" | "pq" | "annoy" | "lsh"
  optional V2HnswConfig hnsw = 2;
  optional V2IvfConfig ivf = 3;
  bool is_primary = 4;
}

// v2-native quantization config (maps to v1 QuantizationConfig).
message V2QuantizationConfig {
  bool enabled = 1;
  string strategy = 2;  // "smart_defaults" (default) | "minimal" | "aggressive" | "custom_levels"
}

message V2CollectionConfig {
  string name = 1;
  uint32 dimension = 2;
  string distance_metric = 3;  // "cosine" (default) | "euclidean" | "dot_product" | ...
  string storage_engine = 4;   // "sst" (default) | "viper" | ...
  repeated string filterable_columns = 5;
  string description = 6;
  // Optional index tuning; when empty the server auto-selects a sensible index.
  repeated V2IndexSpec index_specs = 7;
  optional V2QuantizationConfig quantization = 8;
  // TD-GRPCSCHEMA-2: record mode at create (REST parity; before, a gRPC-created
  // collection could never enable it).
  optional bool enable_proxima_record = 9;
  // TD-TIER-1 SC1: desired storage class, "economy" | "balanced" (default) |
  // "performance". Echoes the resolved policy; observed status is NOT carried
  // here (v1 classes other than balanced are accepted-but-inactive).
  optional string storage_class = 10;
}

// TD-TIER-1 SC1: observed storage-class status (read-side projection of the
// desired policy; never an input). Mirrors the v1 `StorageClassStatus`.
message V2StorageClassStatus {
  // "active" (balanced in effect) | "not_active" (policy persisted, dependency
  // not implemented — the collection serves balanced behavior) | "warming" |
  // "ready" | "degraded" (TD-TIER-1 SC4-5 PERFORMANCE residency proof).
  string state = 1;
  // Names the missing dependency when state is not_active; empty when active.
  string reason = 2;
  // Monotonic generation of the desired policy: 0 = never set (pre-SC1
  // records), 1 = set at create. The class is immutable after create in v1,
  // so generation does not advance yet.
  uint64 policy_generation = 3;
  // Reserved bytes under residency admission (SC3). 0 until then.
  uint64 reserved_bytes = 4;
  // Bytes resident in the serving cache (SC4). 0 until then.
  uint64 resident_bytes = 5;
  // Bytes covered by the READY coverage set (SC4). 0 until then.
  uint64 covered_bytes = 6;
  // TD-TIER-1 SC4-5: the committed segment-set generation the coverage was
  // proven against; 0 when no proof was attempted.
  uint64 covered_generation = 7;
}

message V2Collection {
  string id = 1;
  V2CollectionConfig config = 2;
  int64 created_at = 3;
  int64 updated_at = 4;
  // TD-TIER-1 SC1: observed status alongside the echoed desired class in
  // `V2CollectionConfig.storage_class` — desired and observed are distinct.
  optional V2StorageClassStatus storage_class_status = 5;
}

message V2GetCollectionRequest {
  string collection_id = 1;  // name or id
}

message V2ListCollectionsRequest {
  optional uint32 limit = 1;
  optional uint32 offset = 2;
}

message V2ListCollectionsResponse {
  repeated V2Collection collections = 1;
}

message V2DeleteCollectionRequest {
  string collection_id = 1;
}

message V2DeleteCollectionResponse {
  bool success = 1;
}

// =============================================================================
// SQL query (v2 — parity with v1 QueryService.ExecuteQuery).
// Rows reuse the v2 TypedValue so the SDK's existing decoders apply.
// =============================================================================
message V2QueryRequest {
  string query = 1;
  string collection_id = 2;
  optional uint32 limit = 3;
  optional uint32 offset = 4;
}

message V2QueryRow {
  map<string, TypedValue> values = 1;
}

message V2QueryResponse {
  repeated V2QueryRow rows = 1;
  repeated string columns = 2;
  uint64 rows_returned = 3;
  uint64 execution_time_ms = 4;
}

// Point record get-by-id (v2 parity with v1 VectorService.VectorGet).
message GetRecordRequest {
  string collection_id = 1;
  string id = 2;
  bool include_vector = 3;
}

message GetRecordResponse {
  bool found = 1;
  ProximaRecord record = 2;
}

// =============================================================================
// gRPC Service definition
// =============================================================================
service ProximaRecordService {
  // Record operations
  rpc InsertRecords(ProximaRecordBatch) returns (ProximaRecordBatchResponse);
  rpc UpsertRecords(ProximaRecordBatch) returns (ProximaRecordBatchResponse);
  rpc UpdateRecords(ProximaRecordBatch) returns (ProximaRecordBatchResponse);
  rpc DeleteRecords(ProximaRecordBatch) returns (ProximaRecordBatchResponse);

  // Streaming write operations
  // Client streams batches of records, server streams acknowledgments with backpressure
  rpc BatchWriteStream(stream BatchWriteStreamRequest) returns (stream BatchWriteStreamResponse);

  // Search operations
  rpc Search(TypedSearchRequest) returns (TypedSearchResponse);
  rpc SearchStream(TypedSearchRequest) returns (stream TypedSearchResult);

  // Schema operations
  rpc CreateSchema(CreateSchemaRequest) returns (CreateSchemaResponse);
  rpc GetSchema(GetSchemaRequest) returns (GetSchemaResponse);
  rpc ListSchemas(ListSchemasRequest) returns (ListSchemasResponse);
  rpc EvolveSchema(EvolveSchemaRequest) returns (EvolveSchemaResponse);

  // Collection management (v2 parity with v1 CollectionService)
  rpc CreateCollection(V2CollectionConfig) returns (V2Collection);
  rpc GetCollection(V2GetCollectionRequest) returns (V2Collection);
  rpc ListCollections(V2ListCollectionsRequest) returns (V2ListCollectionsResponse);
  rpc DeleteCollection(V2DeleteCollectionRequest) returns (V2DeleteCollectionResponse);

  // SQL over gRPC (TD-121/TD-135): SSO/bearer-authenticated programmatic SQL.
  // gRPC carries bearer/JWT in request metadata, which pgwire (Postgres-native
  // password/MD5) cannot — so this is the token-authenticated SQL path. Serves
  // vector/graph-extension queries (e.g. VECTOR_SEARCH) AND tenant-scoped
  // relational SQL: SELECT reads route through the SAME relational pipeline
  // pgwire uses (ComputeScheduler → DataFusion/Volcano), and DDL (CREATE/ALTER/
  // DROP) + DML (INSERT/UPDATE/DELETE) route through the SAME tenant-scoped
  // DdlService/DmlService seams pgwire uses — all with the `x-tenant-id` tenant
  // scoping reads and writes to its partition (TD-064). Multi-statement
  // transactions (BEGIN/COMMIT) remain pgwire-only (this RPC is single-statement).
  // For bulk columnar results prefer Arrow Flight; for UQL/AQL/Federated (non-SQL)
  // use /api/v2/query.
  rpc ExecuteQuery(V2QueryRequest) returns (V2QueryResponse);

  // Point record get-by-id (v2 parity with v1 VectorService.VectorGet)
  rpc GetRecord(GetRecordRequest) returns (GetRecordResponse);
}
