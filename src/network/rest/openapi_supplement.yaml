          type: [integer, "null"]
          format: uint32
    RankOverrides:
      type: object
      properties:
        second_phase: { $ref: "#/components/schemas/RankPhaseOverride" }
        global_phase: { $ref: "#/components/schemas/RankPhaseOverride" }
    RankSearchRequest:
