  # TD-SPECRAT-1 wave 8 — rank search + program census resolution.
  # POST /api/v2/rank/search: the multi-phase ranking pipeline (R-7c.1),
  # mounted unconditionally in handlers.rs; no per-route permission gate.
  # The DEFAULT server wires RankServices (the pipeline serves 200s);
  # 501 fires only in non-default constructions (embedded/test AppState
  # without RankServices). 404 = named rank profile not found; 400 =
  # invalid profile; 500 = pipeline failure. Responses carry per-hit
  # score vectors only when a rank profile was attached (retrieval-only
  # mode omits them).
  /api/v2/rank/search:
    post:
      tags: [Rank]
      operationId: rankSearch
      summary: Multi-phase ranked search (retrieval + optional rerank profile).
      description: |
        Runs the rank pipeline over the target collection: candidate
        retrieval (vector + optional BM25 text leg), then the global
        composition phase, then an optional profile-driven second phase.
        `rank_profile` selects a named profile from the server registry;
        when omitted, the response is retrieval-only (no score vectors —
        the zero-cost-when-unused contract). `rank_overrides` tweak
        per-phase knobs on top of the resolved profile. `query_vector`
        is the POST-embedding vector (the caller computed it).
        The optional `X-Tenant-ID` header is not consulted by this
        handler beyond the standard tenant middleware context.
        Extractor rejections (malformed JSON, missing required field,
        wrong content-type) are normalized to the canonical JSON error
        envelope with status 400/415/422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RankSearchRequest"
      responses:
        "200":
          description: Ranked hits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RankSearchResponse"
        "400":
          description: |
            Invalid rank profile or malformed JSON. Both handler and extractor
            errors use the canonical JSON envelope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415":
          description: Request body is missing the application/json content type.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: JSON body has the wrong shape or omits a required field.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500": { $ref: "#/components/responses/InternalError" }
        "501":
          description: |
            The server was constructed without RankServices — NOT the
            default deployment (the default server wires the pipeline
            and returns 200s); reachable in embedded/test constructions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  # ── Hybrid search (free-form passthrough). ──────────────────────────────
  /api/v2/hybrid/search:
    post:
      tags: [Hybrid]
      operationId: hybridSearch
      summary: BM25 + vector hybrid (fusion) search.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collection]
              additionalProperties: true
              properties:
                collection: { type: string }
                vector: { type: array, items: { type: number } }
                text_query: { type: string }
                top_k: { type: integer }
                fusion_strategy: { type: string }
      responses:
        "200":
          description: Fused results.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v2/hybrid/index:
    post:
      tags: [Hybrid]
      operationId: hybridIndex
      summary: Index documents for BM25 full-text search.
      requestBody:
        required: true
        content:
