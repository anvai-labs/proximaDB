            application/json:
              schema:
                $ref: "#/components/schemas/AbacPredicateObjectsResponse"
        "401": { $ref: "#/components/responses/AbacUnauthorized" }
        "403": { $ref: "#/components/responses/AbacForbidden" }
        "503": { $ref: "#/components/responses/AbacUnavailable" }
  /api/v2/abac/predicate-objects/{object_id}:
    parameters:
