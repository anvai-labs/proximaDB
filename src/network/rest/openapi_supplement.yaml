  # TD-SPECRAT-1 wave 4 — collections-admin operator surfaces
  # (src/network/rest/canonical/{pinning,affinity,primary_pod}.rs,
  # mounted unconditionally in handlers.rs). Notes:
  #   * pinning + affinity carry NO per-route permission gate — and the
  #     auth MIDDLEWARE itself only attaches when REST auth is enabled
  #     + a security coordinator exists (the shipped default config
  #     disables it): in an auth-disabled deployment these six
  #     cluster-wide, cross-tenant, state-mutating operations are
  #     reachable UNAUTHENTICATED. primary-pod IS operator-gated
  #     (SystemAdmin/ConfigureSystem) in each handler — and in an
  #     auth-disabled deployment every primary-pod call 401s
  #     (missing_auth_context), because the gate has no context.
  #   * pinning/affinity registries are collection-keyed and
  #     cross-tenant by construction (no tenant scoping); primary-pod
  #     is (tenant_id, collection_id)-scoped via the path.
  #   * plain-text error bodies on pinning/affinity (axum (StatusCode,
  #     String)); JSON flat error on primary-pod 401/403.
  /api/v2/collections/{collection_id}/pin:
    parameters:
      - name: collection_id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Collections]
      operationId: patchCollectionPin
      summary: Set or clear a collection pin.
      description: |
        Pins a collection to a physical medium (or unpins it). Returns
        immediately with the new pin state; physical data movement
        happens out of band — the access-pattern engine reads the
        registry on its next evaluation.
        The optional `X-Tenant-ID` header is not consulted by this
        handler (the pin registry is collection-keyed, not
        tenant-scoped).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinRequest"
      responses:
        "200":
          description: The resulting pin state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinResponse"
        "400":
          description: |
            `pinned: true` without `target`. The body is PLAIN TEXT
            (axum `(StatusCode, String)` error path), not JSON.
          content:
            text/plain:
              schema: { type: string }
    get:
      tags: [Collections]
      operationId: getCollectionPin
      summary: Read a collection's pin state.
      description: |
        200 with `status: "pinned"` + state when pinned; 200 with
        `status: "unpinned"` when not pinned.
        The optional `X-Tenant-ID` header is not consulted by this
        handler (the pin registry is collection-keyed, not
        tenant-scoped).
      responses:
        "200":
          description: Current pin state (pinned or unpinned).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinResponse"
  /api/v2/collections/pinning:
    get:
      tags: [Collections]
      operationId: listCollectionPins
      summary: List every pinned collection.
      description: |
        Operator-dashboard view of all currently pinned collections
        (cross-tenant — the registry is collection-keyed).
        The optional `X-Tenant-ID` header is not consulted by this
        handler.
      responses:
        "200":
          description: All pin entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinListResponse"
  /api/v2/collections/{collection_id}/affinity:
    parameters:
      - name: collection_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Collections]
      operationId: getCollectionAffinity
      summary: Read this node's cache-affinity entry for a collection.
      description: |
        Returns `status: "affinitized"` (with query count, age, and a
        `stale` flag) when an entry exists — including stale entries,
        so operators can see which collections went cold — and
        `status: "not_affinitized"` when there is no entry at all.
        Routing has already stopped using stale entries.
        The optional `X-Tenant-ID` header is not consulted by this
        handler (the affinity registry is per-node, collection-keyed).
      responses:
        "200":
          description: The affinity entry (or its absence).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffinityResponse"
    delete:
      tags: [Collections]
      operationId: deleteCollectionAffinity
      summary: Drop this node's cache-affinity entry for a collection.
      description: |
        Invalidates the affinity hint so routing re-evaluates on the
        next query. 200 always; `dropped` distinguishes an actual
        removal from a no-op.
        The optional `X-Tenant-ID` header is not consulted by this
        handler.
      responses:
        "200":
          description: Drop outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffinityDeleteResponse"
  /api/v2/collections/affinity:
    get:
      tags: [Collections]
      operationId: listCollectionAffinities
      summary: List every cache-affinity entry on this node.
      description: |
        Sorted by collection_id; includes stale entries so operators
        can see which collections went cold.
        The optional `X-Tenant-ID` header is not consulted by this
        handler.
      responses:
        "200":
          description: All affinity entries on this node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffinityListResponse"
  /api/v2/primary-pod/{tenant_id}/{collection_id}:
    parameters:
      - name: tenant_id
        in: path
        required: true
        schema: { type: string }
      - name: collection_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Collections]
      operationId: getPrimaryPod
      summary: Look up a (tenant, collection)'s primary pod.
      description: |
        200 with `status: "bound"` + the assignment when one exists;
        200 with `status: "unbound"` when none does (never 404).
        The optional `X-Tenant-ID` header is not consulted by this
        handler — the `tenant_id` PATH segment governs.
        Requires REST auth enabled — in an auth-disabled
        deployment every call to this operation returns 401
        `missing_auth_context`.
      responses:
        "200":
          description: The binding (bound or unbound).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrimaryPodLookupResponse"
        "401": { $ref: "#/components/responses/PodUnauthorized" }
        "403": { $ref: "#/components/responses/PodForbidden" }
    put:
      tags: [Collections]
      operationId: putPrimaryPod
      summary: Assign a (tenant, collection)'s primary pod.
      description: |
        Operator-gated (SystemAdmin ∪ ConfigureSystem) — these expose
        cross-tenant placement and drive WAL write routing. The
        assignment is mirrored to the catalog; a mirror failure is
        logged and counted but does NOT fail the request (PUT-success
        means the binding is in effect for routing; the catalog
        reconciles on the next write).
        The optional `X-Tenant-ID` header is not consulted by this
        handler — the `tenant_id` PATH segment governs.
        Requires REST auth enabled — in an auth-disabled
        deployment every call to this operation returns 401
        `missing_auth_context`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrimaryPodAssignRequest"
      responses:
        "200":
          description: The assignment (with the previous binding when re-assigning).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrimaryPodAssignResponse"
        "401": { $ref: "#/components/responses/PodUnauthorized" }
        "403": { $ref: "#/components/responses/PodForbidden" }
    delete:
      tags: [Collections]
      operationId: deletePrimaryPod
      summary: Unassign a (tenant, collection)'s primary pod.
      description: |
        200 always; `removed` distinguishes an actual removal from a
        no-op. Catalog-mirror policy is the same as PUT (logged, not
        fatal).
        The optional `X-Tenant-ID` header is not consulted by this
        handler — the `tenant_id` PATH segment governs.
        Requires REST auth enabled — in an auth-disabled
        deployment every call to this operation returns 401
        `missing_auth_context`.
      responses:
        "200":
          description: Unassign outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrimaryPodUnassignResponse"
        "401": { $ref: "#/components/responses/PodUnauthorized" }
        "403": { $ref: "#/components/responses/PodForbidden" }
  /api/v2/primary-pod:
    get:
      tags: [Collections]
      operationId: listPrimaryPods
      summary: List every primary-pod binding (all tenants).
      description: |
        Cross-tenant operator view — the registry is keyed by
        (tenant_id, collection_id).
        The optional `X-Tenant-ID` header is not consulted by this
        handler.
        Requires REST auth enabled — in an auth-disabled
        deployment every call to this operation returns 401
        `missing_auth_context`.
      responses:
        "200":
          description: All bindings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrimaryPodListResponse"
        "401": { $ref: "#/components/responses/PodUnauthorized" }
        "403": { $ref: "#/components/responses/PodForbidden" }
  # TD-SPECRAT-1 wave 5 — catalog routing/explain operator surface
  # (handlers.rs: get_catalog_table_routing / explain_table_write_route;
  # mounted unconditionally, NO per-route permission gate — the global
  # auth middleware applies when REST auth is enabled). The enterprise
  # external-catalog surface (/api/v2/catalogs/*, enterprise-catalogs
  # feature gate) is a separate area, explicitly deferred (TD).
  /api/v2/catalog/table-routing:
    get:
      tags: [Catalog]
      operationId: getCatalogTableRouting
      summary: Table-level xCatalog routing metadata.
      description: |
        Serves `information_schema.table_routing` as a table-shaped
        result — the same projection pgwire/SQL clients see. All cell
        values are strings.
        The optional `X-Tenant-ID` header is not consulted by this
        handler (the introspection projection is cluster-scope).
        The filter dispatch is LEXICAL over the composed SQL text, so a
        `table_name` containing SQL fragments (e.g. ` from
        xcatalog.namespaces`) can be misread as a different view — do
        not treat this endpoint as a structured query interface
        (TD-SPECRAT-3 tracks the structured-filter fix). Names match
        case-insensitively; a name containing a single quote silently
        truncates the filter at the quote.
      parameters:
        - name: table_name
          in: query
          required: false
          schema: { type: string }
          description: Filter to one table (case-insensitive name match).
      responses:
        "200":
          description: Routing rows (columns/column_types/rows, all strings).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogIntrospectionResult"
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v2/catalog/table-write/explain:
    post:
      tags: [Catalog]
      operationId: explainTableWriteRoute
      summary: Explain table-write route selection WITHOUT executing.
      description: |
        Runs the DML write planner in explain-only mode: resolves the
        target (and source) tables, plans the copy/write, and returns
        the full route decision — selected backend + access method,
        write lane (+ rejected lanes with reasons), candidate/rejected
        paths, estimated cost and data movement, required guards, and
        the write intent summary. Nothing is written.
        Provide EITHER `source_table` OR `source_sql` (400 otherwise).
        Extractor rejections (malformed JSON body, duplicate query
        params) bypass the JSON error envelope and return axum's
        plain-text 400/415/422 bodies — the typed envelope below covers
        handler-emitted errors only.
        The optional `X-Tenant-ID` header is not consulted — tenant
        context, if any, rides the body's `tenant_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableWriteExplainRequest"
      responses:
        "200":
          description: The route explanation (no write executed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableWriteRouteExplanation"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
components:
  parameters:
    GraphId:
      name: graph_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    NodeId:
      name: node_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    EdgeId:
      name: edge_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnifiedBadRequest:
      description: Malformed JSON or invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnifiedBareError"
    UnifiedUnsupportedMediaType:
      description: Request body is not application/json.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnifiedBareError"
    UnifiedUnprocessableEntity:
      description: JSON body does not match the request schema.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnifiedBareError"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication required or insufficient permissions.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AbacUnauthorized:
      description: |
        Missing auth context (401) — the request reached the handler with
        no resolved principal, indicating the auth middleware itself is
        misconfigured for this deployment (`error: "missing_auth_context"`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AbacOperatorErrorResponse"
    AbacForbidden:
      description: |
        Authenticated but lacks `SystemAdmin` or `ConfigureSystem`
        (`error: "operator_permission_required"`) — this is a
        cluster-scope operator surface; a tenant's own admin permissions
        do not satisfy it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AbacOperatorErrorResponse"
    AbacTenantUnresolved:
      description: |
        The tenant path/body segment has no durable stable id and the
        configured catalog could not mint one (`error:
        "tenant_unresolved"`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AbacOperatorErrorResponse"
    AbacUnavailable:
      description: |
        ABAC is compiled in (`abac-policy`) but no durable store is open
        for this process (no `data_dir`), or the underlying store returned
        an error (`error: "abac_unavailable"` / `"grant_store_error"` /
        `"posture_store_error"` / `"tenant_mint_failed"`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AbacOperatorErrorResponse"
    PodUnauthorized:
      description: |
        Missing auth context (401) — the request reached the handler
        with no resolved principal (`error: "missing_auth_context"`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PrimaryPodOperatorErrorResponse"
    PodForbidden:
      description: |
        Authenticated but lacks `SystemAdmin` or `ConfigureSystem`
        (`error: "operator_permission_required"`) — a cluster-scope
        operator gate.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PrimaryPodOperatorErrorResponse"
    InternalError:
      description: Internal server error (canonical error envelope).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    GraphBadRequest:
      description: |
        Invalid argument — the FULL graph envelope with success=false
        and error.code INVALID_ARGUMENT (a genuine handler-emitted JSON
        400 exists only on updateGraphSchema; axum extractor rejections
        — malformed JSON, wrong content-type, missing required field —
        are 400/415/422 with PLAIN-TEXT bodies and no envelope).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GraphErrorResponse"
    GraphNotFound:
      description: |
        Not found — the FULL graph envelope with success=false and
        error.code NOT_FOUND.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GraphErrorResponse"
    GraphInternal:
      description: |
        Internal error — the FULL graph envelope with success=false and
        error.code INTERNAL_ERROR.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GraphErrorResponse"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
        version:
          type: string
        uptime_seconds:
          type: number
    ProbeResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
    CapabilitiesResponse:
      type: object
      additionalProperties: true
      properties:
        api_version:
          type: string
        surface:
          type: string
        features:
          type: array
          items:
            type: string
        limits:
          type: object
          additionalProperties: true
        error_envelope:
          type: object
          additionalProperties: true
    # ── Graph schemas (v2). Reconciled against the proximadb-api graph
    # handler; server is authoritative for the wire contract. ───────────
    # ── Graph surface schemas (wave 6: envelope-corrected). ──────────────
    # The graph handlers all return {success, data?, error?, metadata?};
    # each Graph*Response below is that envelope around its payload type.
    GraphErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [NOT_FOUND, ALREADY_EXISTS, INVALID_ARGUMENT, CONSTRAINT_VIOLATION, INTERNAL_ERROR, TIMEOUT, PERMISSION_DENIED]
        message: { type: string }
        details: {}
    GraphErrorResponse:
      type: object
      required: [success, error]
      description: |
        The graph envelope in its error form — what every graph error
        status actually carries on the wire ({success: false, error:
        {code, message, details?}, metadata?}; `data` is absent.
      properties:
        success:
          type: boolean
        error: { $ref: "#/components/schemas/GraphErrorBody" }
        metadata: { $ref: "#/components/schemas/GraphResponseMetadata" }
    GraphResponseMetadata:
      type: object
      properties:
        request_id: { type: string }
        execution_time_ms:
          type: integer
          format: uint64
    GraphEmbedding:
      type: object
      required: [model_id, model_version, vector, dimension]
      properties:
        model_id: { type: string }
        model_version: { type: string }
        vector:
          type: array
          items: { type: number }
        dimension:
          type: integer
          format: uint32
    CanonicalNode:
      type: object
      required: [id, labels, properties, created_at, updated_at]
      properties:
        id: { type: string }
        labels:
          type: array
          items: { type: string }
        properties:
          type: object
          additionalProperties: true
        embedding: { $ref: "#/components/schemas/GraphEmbedding" }
        created_at: { type: string }
        updated_at: { type: string }
    CanonicalEdge:
      type: object
      required: [id, from_node_id, to_node_id, edge_type, properties, created_at, updated_at]
      properties:
        id: { type: string }
        from_node_id: { type: string }
        to_node_id: { type: string }
        edge_type: { type: string }
        properties:
          type: object
          additionalProperties: true
        weight: { type: number }
        created_at: { type: string }
        updated_at: { type: string }
    GraphNodeResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        data: { $ref: "#/components/schemas/CanonicalNode" }
        error: { $ref: "#/components/schemas/GraphErrorBody" }
        metadata: { $ref: "#/components/schemas/GraphResponseMetadata" }
    GraphEdgeResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        data: { $ref: "#/components/schemas/CanonicalEdge" }
        error: { $ref: "#/components/schemas/GraphErrorBody" }
        metadata: { $ref: "#/components/schemas/GraphResponseMetadata" }
    GraphNodeListResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        data:
          type: array
          items: { $ref: "#/components/schemas/CanonicalNode" }
        error: { $ref: "#/components/schemas/GraphErrorBody" }
        metadata: { $ref: "#/components/schemas/GraphResponseMetadata" }
    GraphCollectionResponse:
      type: object
      required: [success]
      description: |
        Envelope around the serialized graph-collection object. The
        payload is the port's collection record rendered as JSON — an
        open object (the field set is the proto collection's, subject to
        port evolution).
      properties:
        success: { type: boolean }
        data:
          type: object
          additionalProperties: true
        error: { $ref: "#/components/schemas/GraphErrorBody" }
        metadata: { $ref: "#/components/schemas/GraphResponseMetadata" }
    GraphCollectionListResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        error: { $ref: "#/components/schemas/GraphErrorBody" }
        metadata: { $ref: "#/components/schemas/GraphResponseMetadata" }
    GraphTraversalStats:
      type: object
      required: [nodes_visited, edges_traversed, max_depth_reached]
      properties:
        nodes_visited:
          type: integer
          format: uint64
        edges_traversed:
          type: integer
          format: uint64
        max_depth_reached:
          type: integer
          format: uint32
        execution_time_ms:
          type: integer
          format: uint64
    GraphTraversalData:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items: { $ref: "#/components/schemas/CanonicalNode" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/CanonicalEdge" }
        paths:
          type: array
          items:
            type: array
            items: { type: string }
        stats: { $ref: "#/components/schemas/GraphTraversalStats" }
    GraphTraversalResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        data: { $ref: "#/components/schemas/GraphTraversalData" }
        error: { $ref: "#/components/schemas/GraphErrorBody" }
        metadata: { $ref: "#/components/schemas/GraphResponseMetadata" }
    GraphStats:
      type: object
      required:
        - total_nodes
        - total_edges
        - label_stats
        - edge_type_stats
        - total_properties
        - memory_usage_bytes
        - average_degree
        - max_degree
        - connected_components
      properties:
        total_nodes:
          type: integer
          format: uint64
        total_edges:
          type: integer
          format: uint64
        label_stats:
          type: array
          items: {}
        edge_type_stats:
          type: array
          items: {}
        total_properties:
          type: integer
          format: uint64
        memory_usage_bytes:
          type: integer
          format: uint64
        average_degree: { type: number }
        max_degree:
          type: integer
          format: uint32
        connected_components:
          type: integer
          format: uint32
    GraphStatsResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        data: { $ref: "#/components/schemas/GraphStats" }
        error: { $ref: "#/components/schemas/GraphErrorBody" }
        metadata: { $ref: "#/components/schemas/GraphResponseMetadata" }
    GraphNodeBatchResults:
      type: object
      required: [created_count, updated_count, failed_count, results, errors]
      properties:
        created_count:
          type: integer
          format: uint64
        updated_count:
          type: integer
          format: uint64
        failed_count:
          type: integer
          format: uint64
        results:
          type: array
          items: { $ref: "#/components/schemas/CanonicalNode" }
        errors:
          type: array
          items: {}
    GraphEdgeBatchResults:
      type: object
      required: [created_count, updated_count, failed_count, results, errors]
      properties:
        created_count:
          type: integer
          format: uint64
        updated_count:
          type: integer
          format: uint64
        failed_count:
          type: integer
          format: uint64
        results:
          type: array
          items: { $ref: "#/components/schemas/CanonicalEdge" }
        errors:
          type: array
          items: {}
    GraphBatchNodesResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        data: { $ref: "#/components/schemas/GraphNodeBatchResults" }
        error: { $ref: "#/components/schemas/GraphErrorBody" }
        metadata: { $ref: "#/components/schemas/GraphResponseMetadata" }
    GraphBatchEdgesResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        data: { $ref: "#/components/schemas/GraphEdgeBatchResults" }
        error: { $ref: "#/components/schemas/GraphErrorBody" }
        metadata: { $ref: "#/components/schemas/GraphResponseMetadata" }
    GraphNodeQueryResults:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CanonicalNode" }
        total_count:
          type: integer
          format: uint64
        has_more: { type: boolean }
        next_token: { type: string }
    GraphEdgeQueryResults:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CanonicalEdge" }
        total_count:
          type: integer
          format: uint64
        has_more: { type: boolean }
        next_token: { type: string }
    GraphNodeQueryResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        data: { $ref: "#/components/schemas/GraphNodeQueryResults" }
        error: { $ref: "#/components/schemas/GraphErrorBody" }
        metadata: { $ref: "#/components/schemas/GraphResponseMetadata" }
    GraphEdgeQueryResponse:
      type: object
      required: [success]
      properties:
