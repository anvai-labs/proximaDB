# OpenAPI supplement fragment (TD-126 Phase 1).
#
# This fragment carries the published REST surfaces that are NOT yet generated
# from `#[utoipa::path]` annotations on the live handlers. The generator
# (src/network/rest/openapi.rs) deep-merges this on top of the utoipa-generated
# core document to produce docs/openapi/proximadb-openapi.yaml, and the CI drift
# gate covers the merged result.
#
# Why these surfaces are here rather than annotated in code (tracked for later
# TD-126 increments):
#   * /health*, /api/v2/_meta/capabilities  — handlers return dynamic JSON
#     (serde_json::Value), no concrete DTO to derive ToSchema on yet.
#   * /api/v2/graphs/*                       — handlers + DTOs live in the
#     `proximadb-api` crate with private request types (RestNodeInput, ...).
#   * hybrid / document-collections /
#     observability                          — free-form passthrough endpoints.
#   * abac / pinning / affinity / primary-pod — operator & control-plane
#     routes excluded from the utoipa `ApiDoc` by convention (registered in
#     `operator_and_control_v2_routes` / its siblings in handlers.rs), not
#     because they lack concrete DTOs.
#
# The SDK contract gates (Python/Rust/Go/TS openapi_contract tests) exercise
# several of these (graphs, health probes), so they MUST stay in the published
# spec. Keep this fragment in sync with the live handlers until they are
# annotated; until then it is the source of truth for these operations only.
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Get server health.
      security: []
      responses:
        "200":
          description: Health status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Kubernetes liveness probe.
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Kubernetes readiness probe.
      security: []
      responses:
        "200":
          description: Server is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"
  /api/v2/_meta/capabilities:
    get:
      tags: [Meta]
      operationId: getCapabilities
      summary: Negotiate server capabilities.
      description: >
        Advertises API version, supported features, limits, and the error-
        envelope contract so SDKs can adapt instead of hard-coding assumptions.
      security: []
      responses:
        "200":
          description: Capability document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"
  # ── Graph surface (v2) — handlers live in the proximadb-api crate
  # (crates/platform/proximadb-api/src/rest/canonical/graph.rs). Every
  # operation returns the graph envelope: {success, data?, error?,
  # metadata?} (schemas Graph*Response below) — this wave (6) corrected
  # the previously-published FLAT response models, which could not parse
  # the real wire format. Error statuses (400/404/500) carry the same
  # envelope with success=false and a SCREAMING_SNAKE_CASE error code.
  # Extractor rejections (malformed JSON) are plain text (axum default).
  # NOT exposed here, deliberately: /rag (501 until the port lands),
  # branch-merge (free-form response, TD deferral), and the legacy
  # 308-redirect shims (/api/v2/nodes|edges|stats — clients must use the
  # canonical graph-scoped paths).
  /api/v2/graphs:
    post:
      tags: [Graphs]
      operationId: createGraph
      summary: Create a graph collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGraphRequest"
      responses:

        "201":
          description: Graph collection created (envelope; data = serialized collection).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphCollectionResponse"
        "400": { $ref: "#/components/responses/GraphBadRequest" }
        "500": { $ref: "#/components/responses/GraphInternal" }
    get:
      tags: [Graphs]
      operationId: listGraphs
      summary: List graph collections.
      responses:
        "200":
          description: Graph collection listing (envelope; data = array).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphCollectionListResponse"
        "500": { $ref: "#/components/responses/GraphInternal" }
  /api/v2/graphs/{graph_id}:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    get:
      tags: [Graphs]
      operationId: getGraph
      summary: Get a graph collection by id.
      responses:
        "200":
          description: Graph collection metadata (envelope; data = serialized collection).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphCollectionResponse"
        "404": { $ref: "#/components/responses/GraphNotFound" }
        "500": { $ref: "#/components/responses/GraphInternal" }
    delete:
      tags: [Graphs]
      operationId: deleteGraph
      summary: Delete a graph collection.
      description: |
        204 on success (the handler's success body is not transmitted on
        a 204). Not-found maps to 404 with the envelope error.
      responses:
        "204": { description: Graph collection deleted. }
        "404": { $ref: "#/components/responses/GraphNotFound" }
        "500": { $ref: "#/components/responses/GraphInternal" }
  /api/v2/graphs/{graph_id}/schema:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    put:
      tags: [Graphs]
      operationId: updateGraphSchema
      summary: Update a graph collection's schema.
      description: |
        The body carries the schema as free-form JSON (the handler
        deserializes it into the port's GraphSchema). 200 returns the
        updated collection (envelope; data = serialized collection);
        invalid schema JSON maps to 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGraphSchemaRequest"
      responses:

        "200":
          description: Updated collection (envelope).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphCollectionResponse"
        "400": { $ref: "#/components/responses/GraphBadRequest" }
        "404": { $ref: "#/components/responses/GraphNotFound" }
        "500": { $ref: "#/components/responses/GraphInternal" }
  /api/v2/graphs/{graph_id}/nodes:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    post:
      tags: [Graphs]
      operationId: createNode
      summary: Create a node in a graph.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNodeRequest"
      responses:

        "201":
          description: Created node (envelope).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphNodeResponse"
        "400": { $ref: "#/components/responses/GraphBadRequest" }
        "404": { $ref: "#/components/responses/GraphNotFound" }
        "500": { $ref: "#/components/responses/GraphInternal" }
  /api/v2/graphs/{graph_id}/nodes/{node_id}:
    parameters:
      - $ref: "#/components/parameters/GraphId"
      - $ref: "#/components/parameters/NodeId"
    get:
      tags: [Graphs]
      operationId: getNode
      summary: Get a node by id.
      responses:
        "200":
          description: Node payload (envelope).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphNodeResponse"
        "404": { $ref: "#/components/responses/GraphNotFound" }
        "500": { $ref: "#/components/responses/GraphInternal" }
    put:
      tags: [Graphs]
      operationId: updateNode
      summary: Replace a node.
      description: |
        Full replacement: the body is the complete node input (its `id`
        is overwritten by the path's `node_id`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeInput"
      responses:

        "200":
          description: Updated node (envelope).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphNodeResponse"
        "400": { $ref: "#/components/responses/GraphBadRequest" }
        "404": { $ref: "#/components/responses/GraphNotFound" }
        "500": { $ref: "#/components/responses/GraphInternal" }
    delete:
      tags: [Graphs]
      operationId: deleteNode
      summary: Delete a node by id.
      responses:
        "200":
          description: Deleted node (envelope — the deleted node is echoed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphNodeResponse"
        "404": { $ref: "#/components/responses/GraphNotFound" }
        "500": { $ref: "#/components/responses/GraphInternal" }
  /api/v2/graphs/{graph_id}/nodes/{node_id}/neighbors:
    parameters:
      - $ref: "#/components/parameters/GraphId"
      - $ref: "#/components/parameters/NodeId"
    get:
      tags: [Graphs]
      operationId: getNodeNeighbors
      summary: Get a node's neighbors.
      responses:
        "200":
          description: Neighbor nodes (envelope; data = node array).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphNodeListResponse"
        "404": { $ref: "#/components/responses/GraphNotFound" }
        "500": { $ref: "#/components/responses/GraphInternal" }
  /api/v2/graphs/{graph_id}/edges:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    post:
      tags: [Graphs]
      operationId: createEdge
      summary: Create an edge in a graph.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEdgeRequest"
      responses:

        "201":
          description: Created edge (envelope).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphEdgeResponse"
        "400": { $ref: "#/components/responses/GraphBadRequest" }
        "404": { $ref: "#/components/responses/GraphNotFound" }
        "500": { $ref: "#/components/responses/GraphInternal" }
  /api/v2/graphs/{graph_id}/edges/{edge_id}:
    parameters:
      - $ref: "#/components/parameters/GraphId"
      - $ref: "#/components/parameters/EdgeId"
    get:
      tags: [Graphs]
      operationId: getEdge
      summary: Get an edge by id.
      responses:
        "200":
          description: Edge payload (envelope).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphEdgeResponse"
        "404": { $ref: "#/components/responses/GraphNotFound" }
        "500": { $ref: "#/components/responses/GraphInternal" }
    put:
      tags: [Graphs]
      operationId: updateEdge
      summary: Replace an edge.
      description: |
        Full replacement: the body is the complete edge input (its `id`
        is overwritten by the path's `edge_id`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdgeInput"
      responses:

        "200":
          description: Updated edge (envelope).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphEdgeResponse"
        "400": { $ref: "#/components/responses/GraphBadRequest" }
        "404": { $ref: "#/components/responses/GraphNotFound" }
        "500": { $ref: "#/components/responses/GraphInternal" }
    delete:
      tags: [Graphs]
      operationId: deleteEdge
      summary: Delete an edge by id.
      responses:
        "200":
          description: Deleted edge (envelope — the deleted edge is echoed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphEdgeResponse"
        "404": { $ref: "#/components/responses/GraphNotFound" }
        "500": { $ref: "#/components/responses/GraphInternal" }
  /api/v2/graphs/{graph_id}/nodes/batch:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    post:
      tags: [Graphs]
      operationId: batchCreateNodes
      summary: Create multiple nodes in a single call.
      description: |
        Per-item rejections ride `failed_count`/`errors[]` while
        `results[]` carries what landed; the HTTP status stays 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchCreateNodesRequest"
      responses:

        "200":
          description: Batch outcome (envelope).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphBatchNodesResponse"
        "400": { $ref: "#/components/responses/GraphBadRequest" }
        "404": { $ref: "#/components/responses/GraphNotFound" }
        "500": { $ref: "#/components/responses/GraphInternal" }
  /api/v2/graphs/{graph_id}/edges/batch:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    post:
      tags: [Graphs]
      operationId: batchCreateEdges
      summary: Create multiple edges in a single call.
      description: |
        Per-item rejections ride `failed_count`/`errors[]` while
        `results[]` carries what landed; the HTTP status stays 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchCreateEdgesRequest"
      responses:

        "200":
          description: Batch outcome (envelope).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphBatchEdgesResponse"
        "400": { $ref: "#/components/responses/GraphBadRequest" }
        "404": { $ref: "#/components/responses/GraphNotFound" }
        "500": { $ref: "#/components/responses/GraphInternal" }
  /api/v2/graphs/{graph_id}/traverse:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    post:
      tags: [Graphs]
      operationId: traverseGraph
      summary: Traverse a graph from a start node.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TraverseRequest"
      responses:

        "200":
          description: Traversal result (envelope).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphTraversalResponse"
        "400": { $ref: "#/components/responses/GraphBadRequest" }
        "404": { $ref: "#/components/responses/GraphNotFound" }
        "500": { $ref: "#/components/responses/GraphInternal" }
  /api/v2/graphs/{graph_id}/walk:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    post:
      tags: [Graphs]
      operationId: walkGraph
      summary: BFS walk from a start node.
      description: |
        A traverse with the algorithm pinned to BFS (defaults:
        max_depth 2, limit 100).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalkRequest"
      responses:

        "200":
          description: Walk result (envelope; traversal shape).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphTraversalResponse"
        "400": { $ref: "#/components/responses/GraphBadRequest" }
        "404": { $ref: "#/components/responses/GraphNotFound" }
        "500": { $ref: "#/components/responses/GraphInternal" }
  /api/v2/graphs/{graph_id}/step:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    post:
      tags: [Graphs]
      operationId: stepGraph
      summary: Single-step navigation (neighbors of one node).
      description: |
        Returns the neighbors of `node_id` (optionally restricted to one
        `edge_type`) in the traversal result shape.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalkStepRequest"
      responses:

        "200":
          description: Step result (envelope).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphTraversalResponse"
        "400": { $ref: "#/components/responses/GraphBadRequest" }
        "404": { $ref: "#/components/responses/GraphNotFound" }
        "500": { $ref: "#/components/responses/GraphInternal" }
  /api/v2/graphs/{graph_id}/shortest-path:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    post:
      tags: [Graphs]
      operationId: shortestPath
      summary: Shortest path between two nodes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShortestPathRequest"
      responses:

        "200":
          description: Shortest-path result (envelope; found=false when unreachable).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphShortestPathResponse"
        "400": { $ref: "#/components/responses/GraphBadRequest" }
        "404": { $ref: "#/components/responses/GraphNotFound" }
        "500": { $ref: "#/components/responses/GraphInternal" }
  /api/v2/graphs/{graph_id}/query:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    post:
      tags: [Graphs]
      operationId: executeGraphQuery
      summary: Execute a graph query.
      description: |
        Executes the query text through the port's JSON query path.
        `language` (default `native`) and `timeout_ms` are accepted but
        currently unused server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GraphQueryRequest"
      responses:

        "200":
          description: Query result (envelope; data carries rows and row_count).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphQueryResponse"
        "400": { $ref: "#/components/responses/GraphBadRequest" }
        "404": { $ref: "#/components/responses/GraphNotFound" }
        "500": { $ref: "#/components/responses/GraphInternal" }
  /api/v2/graphs/{graph_id}/query/nodes:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    post:
      tags: [Graphs]
      operationId: queryNodes
      summary: Query nodes by labels/properties.
      description: |
        Paginated: `limit` (default 100) + `offset`, or a
        `continuation_token` of the form `offset:<n>`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GraphNodeQuery"
      responses:

        "200":
          description: Matching nodes (envelope; QueryResults shape).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphNodeQueryResponse"
        "400": { $ref: "#/components/responses/GraphBadRequest" }
        "404": { $ref: "#/components/responses/GraphNotFound" }
        "500": { $ref: "#/components/responses/GraphInternal" }
  /api/v2/graphs/{graph_id}/query/edges:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    post:
      tags: [Graphs]
      operationId: queryEdges
      summary: Query edges by type/endpoints/properties.
      description: |
        Paginated: `limit` (default 100) + `offset`, or a
        `continuation_token` of the form `offset:<n>`. `edge_type`
        defaults to the empty string (matches untyped edges).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GraphEdgeQuery"
      responses:

        "200":
          description: Matching edges (envelope; QueryResults shape).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphEdgeQueryResponse"
        "400": { $ref: "#/components/responses/GraphBadRequest" }
        "404": { $ref: "#/components/responses/GraphNotFound" }
        "500": { $ref: "#/components/responses/GraphInternal" }
  /api/v2/graphs/{graph_id}/components:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    get:
      tags: [Graphs]
      operationId: getConnectedComponents
      summary: Get the graph's connected components.
      responses:
        "200":
          description: Components (envelope; data carries the node-id arrays).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphComponentsResponse"
        "404": { $ref: "#/components/responses/GraphNotFound" }
        "500": { $ref: "#/components/responses/GraphInternal" }
  /api/v2/graphs/{graph_id}/cycles:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    get:
      tags: [Graphs]
      operationId: checkCycles
      summary: Check whether the graph contains a cycle.
      responses:
        "200":
          description: Cycle check (envelope; data carries has_cycle).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphCyclesResponse"
        "404": { $ref: "#/components/responses/GraphNotFound" }
        "500": { $ref: "#/components/responses/GraphInternal" }
  /api/v2/graphs/{graph_id}/constraints/unique:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    post:
      tags: [Graphs]
      operationId: addUniqueConstraint
      summary: Add a unique constraint on (label, property).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UniqueConstraintRequest"
      responses:

        "200":
          description: DDL outcome (envelope; data carries success).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphDdlResponse"
        "400": { $ref: "#/components/responses/GraphBadRequest" }
        "404": { $ref: "#/components/responses/GraphNotFound" }
        "500": { $ref: "#/components/responses/GraphInternal" }
    delete:
      tags: [Graphs]
      operationId: removeUniqueConstraint
      summary: Remove a unique constraint on (label, property).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UniqueConstraintRequest"
      responses:

        "200":
          description: DDL outcome (envelope; data carries success).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphDdlResponse"
        "400": { $ref: "#/components/responses/GraphBadRequest" }
        "404": { $ref: "#/components/responses/GraphNotFound" }
        "500": { $ref: "#/components/responses/GraphInternal" }
  /api/v2/graphs/{graph_id}/stats:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    get:
      tags: [Graphs]
      operationId: getGraphStats
      summary: Get graph statistics.
      responses:
        "200":
          description: Graph statistics (envelope; data = GraphStats).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphStatsResponse"
        "404": { $ref: "#/components/responses/GraphNotFound" }
        "500": { $ref: "#/components/responses/GraphInternal" }

  # TD-SPECRAT-1 wave 7 — time-series surface (TD-TS-1; handlers in
  # src/network/rest/v2/timeseries.rs, mounted unconditionally in the v2
  # router; backed by the process-global TimeSeriesService over the
  # native TST engine — real, not stubs). UNLIKE the other supplement
  # surfaces, these handlers consume TenantContext from the middleware —
  # the optional X-Tenant-ID header IS consulted (per-tenant structural
  # isolation: each tenant gets its own engine rooted at
  # <data>/timeseries/<tenant>). Responses are FLAT (no envelope). All
  # handler errors map to 500 with the canonical error envelope (no 404
  # exists on this surface); an UNKNOWN collection is NOT an error —
  # query/aggregate return 200 with empty points/buckets, delete returns
  # 200 with success:false. Extractor rejections are plain text.
  # Aggregate buckets are free-form JSON (the aggregation result
  # objects).
  /api/v2/timeseries/collections:
    post:
      tags: [Timeseries]
      operationId: createTimeseriesCollection
      summary: Create a time-series collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TsCollectionConfig"
      responses:
        "200":
          description: Created (echoes the tenant-clean name).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TsCreateResponse"
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      tags: [Timeseries]
      operationId: listTimeseriesCollections
      summary: List this tenant's time-series collections.
      responses:
        "200":
          description: Tenant-scoped collection configs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TsListResponse"
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v2/timeseries/collections/{collection_id}:
    parameters:
      - name: collection_id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Timeseries]
      operationId: deleteTimeseriesCollection
      summary: Delete a time-series collection.
      description: |
        Always 200; `success` distinguishes an actual deletion from a
        no-op (unknown collection).
      responses:
        "200":
          description: Deletion outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TsDeleteResponse"
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v2/timeseries/collections/{collection_id}/ingest:
    parameters:
      - name: collection_id
        in: path
        required: true
        schema: { type: string }
    post:
