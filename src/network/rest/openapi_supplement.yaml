  # TD-SPECRAT-1 wave 3 (TD-ABAC control-plane / ADR-090 grants / TD-SEC-2
  # posture — src/network/rest/canonical/abac_admin.rs). Every operation
  # below:
  #   * is an OPERATOR (cluster-scope SystemAdmin/ConfigureSystem) surface,
  #     never the calling tenant's own data-plane scope;
  #   * is registered ONLY in builds compiled with `--features abac-policy`
  #     (default OFF, TD-FOUNDATION-3). A default build does not mount these
  #     routes at all — an unmatched path returns a generic axum 404, not
  #     the typed AbacOperatorErrorResponse documented below;
  #   * returns AbacOperatorErrorResponse (a FLAT {error, message, code}
  #     shape distinct from the canonical nested ErrorResponse envelope —
  #     this is the handler's real wire format, carried verbatim, not
  #     normalized into the canonical shape);
  #   * resolves tenant path segments from a STRING to the durable stable
  #     u64 server-side at write/read time (never accepts a raw stable id).
  /api/v2/abac/policy-bindings/{tenant}/{object_id}:
    parameters:
      - name: tenant
        in: path
        required: true
        schema: { type: string }
      - name: object_id
        in: path
        required: true
        schema: { type: integer, format: uint64 }
    put:
      tags: [ABAC]
      operationId: putPolicyBinding
      summary: Upsert an ABAC policy binding.
      description: |
        Provisions (or replaces) the policy binding at `object_id` for
        `tenant` — a constraint-layer rule (`scope` + `effect`, optionally a
        `predicate_ref` row filter and a `field_mask`). Writes through the
        same store the live enforcer reads: visible on the next request, no
        restart. `Deny` wins during resolution; the default is deny.
        The optional `X-Tenant-ID` header is not consulted by this
        handler — the tenant path segment governs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbacPutPolicyBindingRequest"
      responses:
        "200":
          description: The stored binding (tenant string resolved to its stable id).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbacPolicyBinding"
        "401": { $ref: "#/components/responses/AbacUnauthorized" }
        "403": { $ref: "#/components/responses/AbacForbidden" }
        "422": { $ref: "#/components/responses/AbacTenantUnresolved" }
        "503": { $ref: "#/components/responses/AbacUnavailable" }
    delete:
      tags: [ABAC]
      operationId: deletePolicyBinding
      summary: Remove an ABAC policy binding.
      description: |
        Idempotent — 204 whether or not a binding existed at `object_id`.
        The optional `X-Tenant-ID` header is not consulted by this
        handler — the tenant path segment governs.
      responses:
        "204": { description: Binding removed (or already absent). }
        "401": { $ref: "#/components/responses/AbacUnauthorized" }
        "403": { $ref: "#/components/responses/AbacForbidden" }
        "422": { $ref: "#/components/responses/AbacTenantUnresolved" }
        "503": { $ref: "#/components/responses/AbacUnavailable" }
  /api/v2/abac/policy-bindings/{tenant}:
    parameters:
      - name: tenant
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [ABAC]
      operationId: listPolicyBindings
      summary: List a tenant's live ABAC policy bindings.
      description: |
        The exact binding set the enforcer composes for reads under
        `tenant` — an operator inspection endpoint, not a per-tenant
        self-service one.
        The optional `X-Tenant-ID` header is not consulted by this
        handler — the tenant path segment governs.
      responses:
        "200":
          description: The tenant's policy bindings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbacPolicyBindingsResponse"
        "401": { $ref: "#/components/responses/AbacUnauthorized" }
        "403": { $ref: "#/components/responses/AbacForbidden" }
        "422": { $ref: "#/components/responses/AbacTenantUnresolved" }
        "503": { $ref: "#/components/responses/AbacUnavailable" }
  /api/v2/abac/tenant-posture/{tenant}:
    parameters:
      - name: tenant
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [ABAC]
      operationId: getTenantPosture
      summary: Get a tenant's explicit ABAC grant-enforcement posture.
      description: |
        404 means the tenant has NO explicit record — meaningfully
        different from `Off`, since an absent record means the tenant
        inherits the process default, which may itself be `Enforce`.
        The optional `X-Tenant-ID` header is not consulted by this
        handler — the tenant path segment governs.
      responses:
        "200":
          description: The tenant's explicit posture.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbacTenantSecurityPosture"
        "401": { $ref: "#/components/responses/AbacUnauthorized" }
        "403": { $ref: "#/components/responses/AbacForbidden" }
        "404":
          description: No explicit posture record (tenant inherits the process default).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbacOperatorErrorResponse"
        "422": { $ref: "#/components/responses/AbacTenantUnresolved" }
        "503": { $ref: "#/components/responses/AbacUnavailable" }
    put:
      tags: [ABAC]
      operationId: putTenantPosture
      summary: Set a tenant's ABAC grant-enforcement posture.
      description: |
        Intended rollout: `Off` -> `Audit` (watch would-be-denials fall to
        zero for this tenant) -> `Enforce`. Skipping the `Audit` rehearsal
        is how an operator breaks a customer's traffic.
        The optional `X-Tenant-ID` header is not consulted by this
        handler — the tenant path segment governs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbacPutTenantPostureRequest"
      responses:
        "200":
          description: The tenant's updated posture.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbacTenantSecurityPosture"
        "401": { $ref: "#/components/responses/AbacUnauthorized" }
        "403": { $ref: "#/components/responses/AbacForbidden" }
        "422": { $ref: "#/components/responses/AbacTenantUnresolved" }
        "503": { $ref: "#/components/responses/AbacUnavailable" }
  /api/v2/abac/grants:
    post:
      tags: [ABAC]
      operationId: postGrant
      summary: Provision an ADR-090 grant (cross-tenant entitlement).
      description: |
        Grants are the entitlement layer: "this grantee may perform these
        actions on this resource", where the grantee MAY be a foreign
        tenant or a foreign tenant's user — the one place cross-tenant
        sharing is expressible. Both the owner and the grantee tenant must
        resolve (fail-closed on unminted tenants); the grantee subject is
        deliberately NOT validated against the principal registry, so a
        share may be provisioned before its recipient's first login.
        The optional `X-Tenant-ID` header is not consulted by this
        handler — the body `tenant` field governs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbacPostGrantRequest"
      responses:
        "200":
          description: The provisioned grant id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbacPostGrantResponse"
        "401": { $ref: "#/components/responses/AbacUnauthorized" }
        "403": { $ref: "#/components/responses/AbacForbidden" }
        "422": { $ref: "#/components/responses/AbacTenantUnresolved" }
        "503": { $ref: "#/components/responses/AbacUnavailable" }
  /api/v2/abac/grants/{owner_tenant}:
    parameters:
      - name: owner_tenant
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [ABAC]
      operationId: listGrants
      summary: List an owner tenant's grants.
      description: |
        Revoked grants stay listed with `revoked_at_ms` set — the audit
        trail is the point, not a live-only view.
        The optional `X-Tenant-ID` header is not consulted by this
        handler — the tenant path segment governs.
      responses:
        "200":
          description: The owner's grants (including revoked/expired ones).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AbacGrantRecord"
        "401": { $ref: "#/components/responses/AbacUnauthorized" }
        "403": { $ref: "#/components/responses/AbacForbidden" }
        "422": { $ref: "#/components/responses/AbacTenantUnresolved" }
        "503": { $ref: "#/components/responses/AbacUnavailable" }
  /api/v2/abac/grants/{owner_tenant}/{grant_id}:
    parameters:
      - name: owner_tenant
        in: path
        required: true
        schema: { type: string }
      - name: grant_id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [ABAC]
      operationId: deleteGrant
      summary: Revoke a grant.
      description: |
        Idempotent — 204 whether the grant existed (and was revoked) or was
        already unknown/revoked. Revocation under the wrong owner cannot
        even name the grant (the store is owner-partitioned).
        The optional `X-Tenant-ID` header is not consulted by this
        handler — the tenant path segment governs.
      responses:
        "204": { description: Grant revoked (or already unknown/revoked). }
        "401": { $ref: "#/components/responses/AbacUnauthorized" }
        "403": { $ref: "#/components/responses/AbacForbidden" }
        "422": { $ref: "#/components/responses/AbacTenantUnresolved" }
        "503": { $ref: "#/components/responses/AbacUnavailable" }
  /api/v2/abac/attribute-bindings:
    get:
      tags: [ABAC]
      operationId: listAttributeBindings
      summary: List every ABAC attribute binding.
      description: |
        Cluster-operator scope — every `(subject, tenant)` attribute
