        timeout_ms:
          type: [integer, "null"]
          format: uint32
          description: Accepted but currently unused server-side.

    # ── Observability (wave-1 spec rationalization: TD-SPECRAT-1) ──────────────
    CreateObservabilityNamespaceRequest:
      type: object
      required: [name]
      description: |
        Body for `POST /api/v2/observability/namespaces`. Retention days
        default to hot=1, warm=7, cold=30.
      properties:
        name:
          type: string
          minLength: 1
        hot_retention_days:
          type: integer
          format: uint32
          default: 1
        warm_retention_days:
          type: integer
          format: uint32
          default: 7
        cold_retention_days:
          type: integer
          format: uint32
          default: 30
    CreateObservabilityNamespaceResponse:
      type: object
      required: [success, namespace]
      properties:
        success:
          type: boolean
        namespace:
          type: string
    LogEntryInput:
      type: object
      required: [message]
      description: |
        A single log entry for ingestion. `severity` defaults to `info`;
        `fields` carries arbitrary structured attributes.
      properties:
        timestamp_ns:
          type: integer
          format: int64
          nullable: true
        message:
          type: string
        severity:
          type: string
          default: info
          description: "Canonical: trace, debug, info, warn, error, fatal. Aliases accepted (case-insensitive): verbose->trace, information->info, warning->warn, err->error, critical->fatal. Unknown values fall back to info."
        source:
          type: string
          nullable: true
        service:
          type: string
          nullable: true
        fields:
          type: object
          additionalProperties: true
    BulkLogIngestRequest:
      type: object
      required: [logs]
      properties:
        logs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/LogEntryInput"
    MetricSampleInput:
      type: object
      required: [name, value]
      properties:
        name:
          type: string
          minLength: 1
        value:
          type: number
          format: double
        timestamp_ns:
          type: integer
          format: int64
          nullable: true
          description: Defaults to server receive time.
        labels:
          type: object
          additionalProperties: { type: string }
    BulkMetricIngestRequest:
      type: object
      required: [metrics]
      properties:
        metrics:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/MetricSampleInput"
    ObservabilityIngestResponse:
      type: object
      required: [ingested, failed, success]
      properties:
        ingested:
          type: integer
          format: uint64
        failed:
          type: integer
          format: uint64
        success:
          type: boolean
    MetricAggregationInput:
      type: object
      required: [metric_name, start_time_ns, end_time_ns]
      properties:
        metric_name:
          type: string
          minLength: 1
        start_time_ns:
          type: integer
          format: int64
        end_time_ns:
          type: integer
          format: int64
        aggregation:
          type: string
          default: avg
          description: "Canonical: min, max, avg, sum, count. Percentile/rate forms also accepted: p50, p90, p95, p99, rate. Unknown values fall back to avg."
        step_seconds:
          type: integer
          format: uint32
          default: 60
        group_by:
          type: array
          items: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
    MetricDataPoint:
      type: object
      required: [timestamp_ns, value]
      properties:
        timestamp_ns:
          type: integer
          format: int64
        value:
          type: number
          format: double
    MetricTimeSeries:
      type: object
      required: [labels, points]
      properties:
        labels:
          type: object
          additionalProperties: { type: string }
        points:
          type: array
          items:
            $ref: "#/components/schemas/MetricDataPoint"
    MetricAggregationResult:
      type: object
      required: [series, query_time_ms]
      properties:
        series:
          type: array
          items:
            $ref: "#/components/schemas/MetricTimeSeries"
        query_time_ms:
          type: integer
          format: uint64
    NlTranslateRequest:
      type: object
      required: [query]
      description: |
        Body for `POST /api/v2/nl/translate`.
      properties:
        query:
          type: string
          minLength: 1
    NlTranslateResult:
      type: object
      required: [normalized_query, views, final_query]
      description: |
        Model-generated translation output — the final query string is not
        validated SQL/AQL; validate before executing it.
      properties:
        normalized_query:
          type: string
        views:
          type: array
          items: { type: string }
        final_query:
          type: string
    AbacOperatorErrorResponse:
      type: object
      required: [error, message, code]
      description: |
        The FLAT error shape every ABAC operator endpoint returns —
        `{error, message, code}` where `error` is a short machine-readable
        slug (e.g. `"tenant_unresolved"`). This is deliberately DISTINCT
        from the canonical nested `ErrorResponse` (`{error: {type,
        message, code}}`) used elsewhere in this spec; it is the actual
        wire format of `abac_admin::OperatorErrorResponse`, carried
        verbatim rather than normalized.
      properties:
        error:
          type: string
          description: Machine-readable error slug.
        message:
          type: string
        code:
          type: integer
          description: The HTTP status code, repeated in the body.
    AbacScope:
      description: |
        The catalog container a policy/grant governs — a stable-id-keyed,
        externally-tagged Rust enum. Exactly one of `Namespace`, `Table`,
        or `Column` is present.
      oneOf:
        - type: object
          required: [Namespace]
          properties:
            Namespace: { type: integer, minimum: 0, maximum: 65535 }
        - type: object
          required: [Table]
          properties:
            Table: { type: integer, format: uint32 }
        - type: object
          required: [Column]
          properties:
            Column: { $ref: "#/components/schemas/AbacColumnScope" }
    AbacColumnScope:
      type: object
      required: [table, column]
      description: The `Column` variant payload of [AbacScope](#/components/schemas/AbacScope).
      properties:
        table: { type: integer, format: uint32 }
        column: { type: integer, format: uint32 }
    AbacEffect:
      type: string
      enum: [Permit, Deny]
      description: Permit or deny; deny wins during policy resolution.
    AbacFieldMask:
      type: string
      enum: ["Null", Redact, Forbid]
      description: |
        Column-level masking. `Forbid` rejects the read (existence must
        not leak); `Null`/`Redact` are projection rewrites.
    AbacAttrValue:
      description: |
        An ABAC subject attribute value — an externally-tagged Rust enum;
        exactly one of `Str`, `Int`, `Bool`, or `List` is present.
      oneOf:
        - type: object
          required: [Str]
          properties: { Str: { type: string } }
        - type: object
          required: [Int]
          properties: { Int: { type: integer, format: int64 } }
        - type: object
          required: [Bool]
          properties: { Bool: { type: boolean } }
        - type: object
          required: [List]
          properties:
            List: { type: array, items: { type: string } }
    AbacComparisonOperator:
      type: string
      enum:
        - Equals
        - NotEquals
        - GreaterThan
        - GreaterThanOrEqual
        - LessThan
        - LessThanOrEqual
        - In
        - NotIn
        - Contains
        - StartsWith
        - EndsWith
        - Between
        - IsNull
        - IsNotNull
        - Like
    AbacFilterExpression:
      type: object
      additionalProperties: true
      description: |
        A predicate-object row filter — a RECURSIVE, externally-tagged Rust
        enum (`proximadb_filter_expression::FilterExpression`). Modeled
        here as free-form JSON (rather than a typed `oneOf`) because the
        self-referential union is not representable in a form the SDK
        codegen tooling can process (openapi-python-client cannot resolve
        a `oneOf` branch whose `items` `$ref`s the union being defined);
        this is the one schema in the ABAC surface where the generated
        client falls back to an untyped object. Construct exactly one of:

        * `{"Comparison": {"field": <string>, "operator": <one of
          "Equals","NotEquals","GreaterThan","GreaterThanOrEqual",
          "LessThan","LessThanOrEqual","In","NotIn","Contains",
          "StartsWith","EndsWith","Between","IsNull","IsNotNull","Like">,
          "value": <any JSON value>}}`
        * `{"And": [<AbacFilterExpression>, ...]}`
        * `{"Or": [<AbacFilterExpression>, ...]}`
        * `{"Not": <AbacFilterExpression>}`

        See [AbacComparisonOperator](#/components/schemas/AbacComparisonOperator)
        for the authoritative operator enum (referenced here for docs only;
        not structurally, for the same recursion reason).
    AbacPutPolicyBindingRequest:
      type: object
      required: [scope, effect]
      description: Body for `PUT /api/v2/abac/policy-bindings/{tenant}/{object_id}`.
      properties:
        scope: { $ref: "#/components/schemas/AbacScope" }
        effect: { $ref: "#/components/schemas/AbacEffect" }
        predicate_ref:
          type: [integer, "null"]
          format: uint64
          description: |
            The predicate object this binding carries (a row-level rule).
            Omit for a predicate-free table-level grant. A dangling ref
            resolves fail-closed at read time.
        field_mask:
          oneOf:
            - $ref: "#/components/schemas/AbacFieldMask"
            - type: "null"
    AbacPolicyBinding:
      type: object
      required: [object_id, tenant_stable_id, scope, effect]
      properties:
        object_id: { type: integer, format: uint64 }
        tenant_stable_id: { type: integer, format: uint64 }
        scope: { $ref: "#/components/schemas/AbacScope" }
        effect: { $ref: "#/components/schemas/AbacEffect" }
        predicate_ref:
          type: [integer, "null"]
          format: uint64
        field_mask:
          oneOf:
            - $ref: "#/components/schemas/AbacFieldMask"
            - type: "null"
    AbacPolicyBindingsResponse:
      type: object
      required: [tenant, tenant_stable_id, count, bindings]
      properties:
        tenant: { type: string }
        tenant_stable_id: { type: integer, format: uint64 }
        count: { type: integer, format: uint64 }
        bindings:
          type: array
          items: { $ref: "#/components/schemas/AbacPolicyBinding" }
    AbacPostAttributeBindingRequest:
      type: object
      required: [subject_id, tenant, attrs]
      description: Body for `POST /api/v2/abac/attribute-bindings`.
      properties:
        subject_id: { type: string }
        tenant:
          type: string
          description: Tenant display name; resolved to the stable u64 server-side.
        attrs:
          type: object
          additionalProperties: { $ref: "#/components/schemas/AbacAttrValue" }
    AbacAttributeBinding:
      type: object
      required: [subject_id, tenant_stable_id, attrs]
      properties:
        subject_id: { type: string }
        tenant_stable_id: { type: integer, format: uint64 }
        attrs:
          type: object
          additionalProperties: { $ref: "#/components/schemas/AbacAttrValue" }
    AbacAttributeBindingsResponse:
      type: object
      required: [count, bindings]
      properties:
        count: { type: integer, format: uint64 }
        bindings:
          type: array
          items: { $ref: "#/components/schemas/AbacAttributeBinding" }
    AbacPredicateObjectResponse:
      type: object
      required: [object_id, expression]
      properties:
        object_id: { type: integer, format: uint64 }
        expression: { $ref: "#/components/schemas/AbacFilterExpression" }
    AbacPredicateObjectsResponse:
      type: object
      required: [count, objects]
      properties:
        count: { type: integer, format: uint64 }
        objects:
          type: array
          items: { $ref: "#/components/schemas/AbacPredicateObjectResponse" }
    AbacGrantee:
      description: |
        Who a grant admits — an externally-tagged Rust enum. Exactly one
        of `Tenant` (every subject of that tenant) or `User` (one specific
        subject, possibly of a foreign tenant) is present.
      oneOf:
        - type: object
          required: [Tenant]
          properties:
            Tenant: { type: integer, format: uint64 }
        - type: object
          required: [User]
          properties:
            User: { $ref: "#/components/schemas/AbacGranteeUser" }
    AbacGranteeUser:
      type: object
      required: [tenant_stable_id, subject]
      description: The `User` variant payload of [AbacGrantee](#/components/schemas/AbacGrantee).
      properties:
        tenant_stable_id: { type: integer, format: uint64 }
        subject: { type: string }
    AbacGrantAction:
      type: string
      enum: [Read, Write, Ddl, Grant]
      description: |
        `Grant` is delegation authority (further re-grant); it is not
        consulted for data access, only by the admin surface.
    AbacGrantGranteeRequest:
      type: object
      required: [tenant]
      description: |
        Grantee as provisioned over the wire: a tenant-wide share when
        `subject` is omitted/empty, else one user of (possibly foreign)
        `tenant`. Clients supply tenant/subject strings; stable ids are
        resolved server-side.
      properties:
        tenant: { type: string }
        subject:
          type: [string, "null"]
    AbacPostGrantRequest:
      type: object
      required: [owner_tenant, resource, grantee, actions]
      description: Body for `POST /api/v2/abac/grants`.
      properties:
        owner_tenant:
          type: string
          description: The resource-owner tenant (string; resolved and must be minted).
        resource: { $ref: "#/components/schemas/AbacScope" }
        grantee: { $ref: "#/components/schemas/AbacGrantGranteeRequest" }
        actions:
          type: array
          items: { $ref: "#/components/schemas/AbacGrantAction" }
          uniqueItems: true
        predicate_ref:
          type: [integer, "null"]
          format: uint64
        field_mask:
          oneOf:
            - $ref: "#/components/schemas/AbacFieldMask"
            - type: "null"
        expires_at_ms:
          type: [integer, "null"]
          format: int64
    AbacPostGrantResponse:
      type: object
      required: [grant_id, owner_tenant_stable_id]
      properties:
        grant_id: { type: string }
        owner_tenant_stable_id: { type: integer, format: uint64 }
    AbacGrantRecord:
      type: object
      required:
        - grant_id
        - owner_tenant_stable_id
        - resource
        - grantee
        - actions
        - created_at_ms
      properties:
        grant_id: { type: string }
        owner_tenant_stable_id: { type: integer, format: uint64 }
        resource: { $ref: "#/components/schemas/AbacScope" }
        grantee: { $ref: "#/components/schemas/AbacGrantee" }
        actions:
          type: array
          items: { $ref: "#/components/schemas/AbacGrantAction" }
        predicate_ref:
          type: [integer, "null"]
          format: uint64
        field_mask:
          oneOf:
            - $ref: "#/components/schemas/AbacFieldMask"
            - type: "null"
        created_at_ms: { type: integer, format: int64 }
        expires_at_ms:
          type: [integer, "null"]
          format: int64
        revoked_at_ms:
          type: [integer, "null"]
          format: int64
          description: Set once revoked; the record stays listed (audit trail).
    AbacGrantEnforcement:
      type: string
      enum: ["Off", Audit, Enforce]
      description: |
        Rollout is intended `Off` -> `Audit` (would-be-denials logged, read
        still admitted) -> `Enforce` (no applicable grant denies).
    AbacPutTenantPostureRequest:
      type: object
      required: [grant_enforcement]
      properties:
        grant_enforcement: { $ref: "#/components/schemas/AbacGrantEnforcement" }
    AbacTenantSecurityPosture:
      type: object
      required: [tenant_stable_id, grant_enforcement, updated_at_ms]
      properties:
        tenant_stable_id: { type: integer, format: uint64 }
        grant_enforcement: { $ref: "#/components/schemas/AbacGrantEnforcement" }
        updated_at_ms: { type: integer, format: int64 }
    PinTarget:
      type: string
      enum: [memory, nvme_ssd, cloud]
      description: |
        Physical medium to pin to. `cloud` effectively means "do not
        promote this collection" (an explicit unpin-in-spirit).
    PinRequest:
      type: object
      required: [pinned]
      description: |
        Body for `PATCH /api/v2/collections/{collection_id}/pin`. Either
        `{pinned: true, target: ..., replicas?: ...}` or `{pinned: false}`
        (target/replicas ignored when unpinning; `target` is REQUIRED
        when pinning — a plain-text 400 otherwise). `replicas` defaults
        to 1.
      properties:
        pinned: { type: boolean }
        target:
          oneOf:
            - $ref: "#/components/schemas/PinTarget"
            - type: "null"
        replicas:
          type: [integer, "null"]
          format: uint32
    PinResponse:
      type: object
      required: [status, collection_id]
      description: |
        Internally tagged by `status` (snake_case). `status: "pinned"`
        carries `target`/`replicas`/`pinned_at_ns`; `status: "unpinned"`
        carries `was_pinned` (true when the request removed an existing
        pin — useful for audit logs; false on a no-op or read of an
        unpinned collection).
      properties:
        status:
          type: string
          enum: [pinned, unpinned]
        collection_id: { type: string }
        target: { $ref: "#/components/schemas/PinTarget" }
        replicas:
          type: integer
          format: uint32
        pinned_at_ns:
          type: integer
          format: int64
        was_pinned: { type: boolean }
    PinListItem:
      type: object
      required: [collection_id, target, replicas, pinned_at_ns]
      properties:
        collection_id: { type: string }
        target: { $ref: "#/components/schemas/PinTarget" }
        replicas: { type: integer, format: uint32 }
        pinned_at_ns: { type: integer, format: int64 }
    PinListResponse:
      type: object
      required: [count, items]
      properties:
        count: { type: integer, format: uint64 }
        items:
          type: array
          items: { $ref: "#/components/schemas/PinListItem" }
    AffinityResponse:
      type: object
      required: [status, collection_id]
      description: |
        Internally tagged by `status` (snake_case). `status:
        "affinitized"` carries the entry — including STALE entries
        (routing already ignores them; `stale: true` flags them for the
        operator) — with `query_count` (monotonic queries served while
        this node held affinity) and `age_seconds` (seconds since the
        last recorded query). `status: "not_affinitized"` means no
        entry exists at all.
      properties:
        status:
          type: string
          enum: [affinitized, not_affinitized]
        collection_id: { type: string }
        node_id: { type: string }
        query_count:
          type: integer
          format: uint64
        age_seconds:
          type: integer
          format: uint64
        stale: { type: boolean }
    AffinityDeleteResponse:
      type: object
      required: [status, collection_id, dropped]
      description: |
        `status` is always `"dropped"`; the `dropped` flag
        distinguishes an actual removal from a no-op.
      properties:
        status:
          type: string
          enum: [dropped]
        collection_id: { type: string }
        dropped: { type: boolean }
    AffinityListItem:
      type: object
      required: [collection_id, node_id, query_count, age_seconds, stale]
      properties:
        collection_id: { type: string }
        node_id: { type: string }
        query_count: { type: integer, format: uint64 }
        age_seconds: { type: integer, format: uint64 }
        stale: { type: boolean }
    AffinityListResponse:
      type: object
      required: [count, items]
      properties:
        count: { type: integer, format: uint64 }
        items:
          type: array
          items: { $ref: "#/components/schemas/AffinityListItem" }
    AssignmentReason:
      type: string
      enum: [create, operator, failover, rebalance, catalog_replay]
      description: |
        Why an assignment was made (locked vocabulary for dashboards /
        EXPLAIN). `catalog_replay` = loaded from durable state at
        restart, not freshly assigned.
    PrimaryPod:
      type: object
      required: [pod, assigned_at_ns, reason]
      properties:
        pod:
          type: string
          description: Pod identifier (typically a k8s pod name); opaque.
        assigned_at_ns:
          type: integer
          format: int64
          description: Wall-clock nanoseconds when last set; reassignments advance it.
        reason: { $ref: "#/components/schemas/AssignmentReason" }
    PrimaryPodLookupResponse:
      type: object
      required: [status, tenant_id, collection_id]
      description: |
        Internally tagged by `status` (snake_case). `status: "bound"`
        carries `primary`; `status: "unbound"` means no binding (never
        a 404).
      properties:
        status:
          type: string
          enum: [bound, unbound]
        tenant_id: { type: string }
        collection_id: { type: string }
        primary: { $ref: "#/components/schemas/PrimaryPod" }
    PrimaryPodAssignRequest:
      type: object
      required: [pod]
      description: |
        Body for `PUT /api/v2/primary-pod/{tenant_id}/{collection_id}`.
        `reason` defaults to `"operator"` when omitted.
      properties:
        pod: { type: string }
        reason: { $ref: "#/components/schemas/AssignmentReason" }
    PrimaryPodAssignResponse:
      type: object
      required: [tenant_id, collection_id, primary]
      properties:
        tenant_id: { type: string }
        collection_id: { type: string }
        primary: { $ref: "#/components/schemas/PrimaryPod" }
        previous:
          oneOf:
            - $ref: "#/components/schemas/PrimaryPod"
            - type: "null"
          description: The prior binding on re-assignment; null on first assignment.
    PrimaryPodUnassignResponse:
      type: object
      required: [tenant_id, collection_id, removed]
      properties:
        tenant_id: { type: string }
        collection_id: { type: string }
        removed:
          type: boolean
          description: True when a binding was actually removed; false when nothing was bound.
    PrimaryPodListItem:
      type: object
      required: [tenant_id, collection_id, primary]
      properties:
        tenant_id: { type: string }
        collection_id: { type: string }
        primary: { $ref: "#/components/schemas/PrimaryPod" }
    PrimaryPodListResponse:
      type: object
      required: [count, items]
      properties:
        count: { type: integer, format: uint64 }
        items:
          type: array
          items: { $ref: "#/components/schemas/PrimaryPodListItem" }
    PrimaryPodOperatorErrorResponse:
      type: object
      required: [error, message, code]
      description: |
        The FLAT error shape the primary-pod operator endpoints return
        (`{error, message, code}`, `error` a short machine-readable
        slug). Same convention as `AbacOperatorErrorResponse`; carried
        as its own schema because the two handler families define the
        type independently.
      properties:
        error: { type: string }
        message: { type: string }
        code: { type: integer }
    CatalogIntrospectionResult:
      type: object
      required: [columns, column_types, rows]
      description: |
        Table-shaped catalog metadata (the projection pgwire/SQL clients
        see). Every cell value is a string.
      properties:
        columns:
          type: array
          items: { type: string }
        column_types:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            type: array
            items: { type: string }
    TableWriteExplainRequest:
      type: object
      required: [target_table]
      description: |
        Body for `POST /api/v2/catalog/table-write/explain`. Provide
        EITHER `source_table` OR `source_sql` — both, or neither, is a
        400. `write_mode` (default `append`) accepts, case-insensitive:
        append | insert | insert_only | insert-only | upsert | overwrite
        | insert_overwrite | insert-overwrite | overwrite_table |
        overwrite-table | merge. `distribution` (default `auto`) accepts:
        auto | local | local_only | local-only | pseudo |
        pseudo_distributed | pseudo-distributed | distributed. Upsert/
        merge imply upsert conflict policy; everything else errors on
        conflict.
      properties:
        target_table:
          type: string
          description: Dotted name (`[namespace.]…table`); last segment is the table.
        source_table:
          type: [string, "null"]
        source_sql:
          type: [string, "null"]
        write_mode:
          type: [string, "null"]
        distribution:
          type: [string, "null"]
        target_columns:
          type: [array, "null"]
          items: { type: string }
        tenant_id:
          type: [string, "null"]
        actor:
          type: [string, "null"]
        idempotency_key:
          type: [string, "null"]
        row_count_hint:
          type: [integer, "null"]
          format: uint64
        estimated_bytes:
          type: [integer, "null"]
          format: uint64
        requires_row_level_semantics:
          type: [boolean, "null"]
        batch_local_constraints_sufficient:
          type: [boolean, "null"]
    TableWriteRouteExplanation:
      type: object
      required:
        - target_table
        - source
        - write_mode
        - distribution
        - write_intent
        - write_lane
        - write_lane_reason
        - write_lane_required_guards
        - rejected_write_lanes
        - selected_backend
        - selected_access_method
        - estimated_cost
        - data_movement
        - required_guards
        - route_metadata
        - candidate_paths
        - rejected_paths
      description: |
        The full DML write-planner route decision (explain-only; nothing
        was written). `write_mode`/`distribution` echo the resolved
        canonical enum names (PascalCase, e.g. `Append`,
        `PseudoDistributed`). `execution_*` fields appear only for
        EXPLAIN ANALYZE (never set by this REST explain path).
      properties:
        target_table: { type: string }
        source: { type: string }
        write_mode: { type: string }
        distribution: { type: string }
        write_intent: { $ref: "#/components/schemas/TableWriteIntentExplanation" }
        write_lane: { type: string }
        write_lane_reason: { type: string }
        write_lane_required_guards:
          type: array
          items: { type: string }
        rejected_write_lanes:
          type: array
          items: { $ref: "#/components/schemas/TableWriteRejectedLaneExplanation" }
        selected_backend: { type: string }
        selected_access_method: { type: string }
        estimated_cost: { $ref: "#/components/schemas/TableWriteCostExplanation" }
        data_movement: { $ref: "#/components/schemas/TableWriteDataMovementExplanation" }
        required_guards:
          type: array
          items: { type: string }
        route_metadata: { $ref: "#/components/schemas/TableWriteRouteMetadataExplanation" }
        candidate_paths:
          type: array
          items: { $ref: "#/components/schemas/TableWriteCandidateExplanation" }
        rejected_paths:
          type: array
          items: { $ref: "#/components/schemas/TableWriteRejectedPathExplanation" }
        execution_elapsed_us:
          type: integer
          format: uint64
        execution_rows_written:
          type: integer
          format: uint64
    TableWriteIntentExplanation:
      type: object
      required:
        - target_table
        - operation_kind
        - durability
        - isolation
        - projection_freshness
        - requires_row_level_semantics
        - batch_local_constraints_sufficient
      properties:
        target_table: { type: string }
        operation_kind: { type: string }
        durability: { type: string }
        isolation: { type: string }
        projection_freshness: { type: string }
        tenant_id:
          type: [string, "null"]
        actor:
          type: [string, "null"]
        idempotency_key:
          type: [string, "null"]
        catalog_schema_version:
          type: [integer, "null"]
          format: uint64
        row_count_hint:
          type: [integer, "null"]
          format: uint64
        estimated_bytes:
          type: [integer, "null"]
          format: uint64
        requires_row_level_semantics: { type: boolean }
        batch_local_constraints_sufficient: { type: boolean }
    TableWriteRejectedLaneExplanation:
      type: object
      required: [lane, reason]
      properties:
        lane: { type: string }
        reason: { type: string }
    TableWriteCostExplanation:
      type: object
      required: [relative_cost, reason]
      properties:
        rows:
          type: [integer, "null"]
          format: uint64
        bytes:
          type: [integer, "null"]
          format: uint64
        relative_cost:
          type: number
          description: Relative cost (unitless planner estimate).
        reason: { type: string }
    TableWriteDataMovementExplanation:
      type: object
      required: [estimate_source, stats_freshness]
      properties:
        source_rows:
          type: [integer, "null"]
          format: uint64
        source_bytes:
          type: [integer, "null"]
          format: uint64
        target_rows_before_write:
          type: [integer, "null"]
          format: uint64
        target_bytes_before_write:
          type: [integer, "null"]
          format: uint64
        estimated_read_bytes:
          type: [integer, "null"]
          format: uint64
        estimated_write_bytes:
          type: [integer, "null"]
          format: uint64
        estimated_rewrite_bytes:
          type: [integer, "null"]
          format: uint64
        estimate_source: { type: string }
        source_last_analyzed_ms:
          type: [integer, "null"]
          format: int64
        target_last_analyzed_ms:
          type: [integer, "null"]
          format: int64
        source_stats_age_ms:
          type: [integer, "null"]
          format: uint64
        target_stats_age_ms:
          type: [integer, "null"]
          format: uint64
        freshness_sla_ms:
          type: [integer, "null"]
          format: uint64
        stats_freshness: { type: string }
    TableWriteRouteMetadataExplanation:
      type: object
      required:
        - authority_mode
        - workload_profile
        - storage_specialization
        - projection_metadata
        - policy_boundary
        - constraint_enforcement
        - constraint_gaps
      properties:
        authority_mode: { type: string }
        workload_profile: { type: string }
        storage_specialization: { type: string }
        primary_format:
          type: [string, "null"]
        preferred_compute_route:
          type: [string, "null"]
        partitioning:
          type: [string, "null"]
        isolation_profile:
          type: [string, "null"]
        freshness_sla:
          type: [string, "null"]
        projection_freshness_state:
          type: [string, "null"]
        projection_metadata:
          type: array
          items: { $ref: "#/components/schemas/ProjectionRouteMetadataExplanation" }
        policy_boundary: { type: string }
        constraint_enforcement: { type: string }
        constraint_gaps:
          type: array
          items: { type: string }
    ProjectionRouteMetadataExplanation:
      type: object
      required:
        - name
        - kind
        - physical_format
        - rebuild_source
        - freshness
        - freshness_state
        - rebuildable
        - lossy
        - support_status
      properties:
        name: { type: string }
        kind: { type: string }
        physical_format: { type: string }
        rebuild_source: { type: string }
        freshness: { type: string }
        freshness_state: { type: string }
        max_lag_ms:
          type: [integer, "null"]
          format: int64
        source_range:
          type: [string, "null"]
        last_included_position:
          type: [string, "null"]
        rebuildable: { type: boolean }
        invalidation_policy:
          type: [string, "null"]
        policy_boundary:
          type: [string, "null"]
        lossy: { type: boolean }
        support_status: { type: string }
        benchmark_gate:
          type: [string, "null"]
    TableWriteCandidateExplanation:
      type: object
      required: [backend, access_method, estimated_cost, required_guards, pushdown]
      properties:
        backend: { type: string }
        access_method: { type: string }
        estimated_cost: { $ref: "#/components/schemas/TableWriteCostExplanation" }
        required_guards:
          type: array
          items: { type: string }
        pushdown:
          type: array
          items: { type: string }
    TableWriteRejectedPathExplanation:
      type: object
      required: [backend, access_method, reason, required_guards]
      properties:
        backend: { type: string }
        access_method: { type: string }
        reason: { type: string }
        required_guards:
          type: array
          items: { type: string }
    TsValueColumn:
      type: object
      required: [name]
      properties:
        name: { type: string }
        unit:
          type: [string, "null"]
