# ProximaDB Configuration - Minimal with Smart Defaults
# Full configuration documentation: https://docs.proximadb.com/configuration

[server]
node_id = "proximadb-local"
bind_address = "127.0.0.1"
port = 5678
data_dir = "/tmp/proximadb/data"

# Request tenant resolution at protocol edges.
# mode = "auto" preserves compatibility; set "multi_tenant" for SaaS.
[server.tenant]
mode = "single_tenant"
default_tenant = "default"

# Read-only embedded admin dashboard at /admin. Off by default; enable only for
# local standalone instances (not Kubernetes pods or embedded/UDS deployments).
# See docs/04-operations/admin-dashboard.adoc.
[server.admin_ui]
enabled = false
# Client-side auto-refresh of the dashboard. When false (default) the
# auto-refresh toggle in the UI is rendered disabled (greyed out) and the page
# only refreshes on an explicit click. Set true to allow live polling.
auto_refresh = false
# Auto-refresh poll interval in seconds (only effective when auto_refresh = true).
refresh_interval_seconds = 30

[storage]
# Metadata storage (collection definitions, schemas)
metadata_url = "file:///tmp/proximadb/metadata"

# Data storage locations - ProximaDB distributes collections across these.
# Optional per-location I/O budget (TD-IOBUDGET-1): sizes the ranged GETs the
# engine issues against THAT location. disk_class: "ssd" | "hdd" | "cloud";
# explicit min_bytes/target_bytes/max_bytes override the class profile
# (validated: 64 KiB <= min <= target <= max, fail-closed at startup).
# Unset => the URL-scheme default; PROXIMADB_DISK_CLASS=hdd stays the
# per-pod override for locations without an explicit disk_class.
[[storage.storage_locations]]
url = "file:///tmp/proximadb/d1"
weight = 1
tags = ["local", "disk1"]
#[storage.storage_locations.io_budget]
#disk_class = "ssd"
#target_bytes = 1048576
#max_bytes = 8388608

[[storage.storage_locations]]
url = "file:///tmp/proximadb/d2"
weight = 1
tags = ["local", "disk2"]

[[storage.storage_locations]]
url = "file:///tmp/proximadb/d3"
weight = 1
tags = ["local", "disk3"]

# Assignment configuration (optional - smart defaults applied)
# [storage.assignment_config]
# strategy = "hash"  # Options: hash, round-robin, weighted
# affinity = true    # Keep collection data together on same disk

# Performance optimization settings
[storage.optimization]
# Enable memory-mapped I/O for large files (40-60% faster reads)
enable_mmap = true
# Enable zone map pruning to skip irrelevant blocks (30-50% faster search)
enable_zone_map_pruning = true
# Enable AXIS indexes for approximate nearest neighbor search.
# ADR-070: false by default — the co-design PAX scan + survivor cache is the
# default ANN path; collections opt into AXIS per-collection via index_configs.
enable_axis_indexes = false
# Default index type for new collections: flat, hnsw, ivf, lsh
default_index_type = "hnsw"
# Enable progressive quantization search (Binary → INT8 → FP32)
enable_progressive_search = true
# Enable block-level bloom filters for metadata filtering
enable_bloom_filters = true

# RL-based Adaptive Query Planner Configuration
[query.rl_planner]
# Enable RL-based planning (false = use static heuristics)
enabled = true
# Use Thompson Sampling (true) or epsilon-greedy (false) for action selection
thompson_sampling = true
# Exploration rate for epsilon-greedy fallback (0.0 - 1.0)
exploration_rate = 0.1
# Size of experience replay buffer for batch learning
experience_buffer_size = 10000
# Number of experiences before batch policy update
batch_update_interval = 100
# Log all query executions to JSONL for offline analysis
log_all_executions = true
# Path for execution logs (JSONL format) - leave empty for no file logging
# log_path = "/tmp/proximadb/rl_planner.jsonl"
# Default optimization goal: MinLatency, MaxRecall, MaxThroughput, Balanced
default_goal = "Balanced"

# Cross-modal reranking policy. Defaults are neutral and disabled so result
# scoring is driven by engine scores unless an operator explicitly opts in.
[query.reranking]
enabled = false
semantic_rerank = false
diversity_optimization = false
diversity_weight = 0.0
mmr_lambda = 1.0
context_aware = false
missing_score = "zero"
missing_semantic_score = 0.0
semantic_base_weight = 0.7
semantic_signal_weight = 0.3
navigational_min_base_score = 0.9
generate_explanations = false
diversity_model_weight = 0.5
diversity_dissimilarity_weight = 0.5
explanation_empty_confidence = 0.5
rerank_top_k = 100

[query.reranking.model_weights]
vector = 1.0
document = 1.0
graph = 1.0
observability = 1.0

[query.reranking.intent_boosts]
similarity_vector = 0.0
relationship_graph = 0.0
navigational_high_confidence = 0.0
informational = 0.0
analytical_observability = 0.0
required_model = 0.0

[query.reranking.temporal]
recent_weight = 0.0
historical_weight = 0.0
recent_half_life_hours = 24.0
historical_half_life_hours = 720.0

[query.reranking.diversity_similarity]
same_model_weight = 0.0
metadata_overlap_weight = 0.0
score_proximity_weight = 0.0

[hybrid]
# Default seeding strategy for hybrid query execution: AVERAGE, PER_SEED, NONE
seeding_strategy = "AVERAGE"
# Fusion weights for [vector, graph]
fusion_weights = [0.6, 0.4]
# Auto execution strategy thresholds for metadata filter selectivity.
# selectivity < filter_first_max_selectivity => filter-first
# selectivity > vector_first_min_selectivity => vector-first
# otherwise => parallel
filter_first_max_selectivity = 0.1
vector_first_min_selectivity = 0.5

[api]
# Local single-tenant development only. Set false before enabling [security].
enable_pgwire = true
# Unified Port Mode - all protocols on single port
unified_mode = true

# Multi-Port Mode
grpc_port = 5679
rest_port = 5678
arrow_flight_port = 5680

# Protocol-specific settings (apply in both modes)
[api.protocols.rest]
enabled = true
compression = false

[api.protocols.grpc]
enabled = true
max_message_size_mb = 64
compression = true
reflection = true

[api.protocols.arrow_flight]
enabled = true
max_message_size_mb = 512

[monitoring]
log_level = "info"
# Dashboard refresh interval in seconds (default: 60, minimum: 15)
dashboard_refresh_interval_seconds = 60

# Durable per-query io_trace ETL sink (TD-TRACE-2 / ADR-066). Default OFF.
# When enabled, each query's IoTraceSnapshot is enqueued to a bounded in-memory
# spool and a background worker writes JSONL+zstd segments to `local_dir`, sealing
# on `segment_bytes` OR `flush_interval_s` (whichever first). Object-store dispatch
# (object_store_uri / access_tier / partition_by / retention_days) arrives in S2.
# Per-field env overrides: PROXIMADB_IO_TRACE_SINK[_LOCAL_DIR|_SEGMENT_BYTES|...].
[observability.io_trace_sink]
enabled = false
# local_dir = "./log/io_trace"
# segment_bytes = 4194304          # 4 MiB
# flush_interval_s = 60
# compression = "zstd"
# format = "jsonl"
# spool_max_bytes = 268435456      # 256 MiB; drop-oldest on overflow
# object_store_uri = "az://acct/container"   # S2 dispatch target (else local-only)
# access_tier = "cold"                        # S2 at-rest tier (hot/cool/cold/archive)
# warehouse_compaction_interval_s = 900       # S4b: compact envelopes → Iceberg Parquet
                                              #      every N s (0/unset = off; needs object_store_uri)

# ==============================================================================
# LLM Integration Configuration (Q4 2025)
# ==============================================================================
# Enables embedding generation, RAG pipelines, and semantic caching.
# Uses Victor (codingagent) framework for LLM/embedding providers.

[llm]
# Enable LLM integration
enabled = true
# Default collection for embeddings
default_collection = "embeddings"
# Cache TTL in hours
cache_ttl_hours = 24

[llm.embedding]
# Embedding provider: sentence-transformers (local), openai, cohere, ollama
provider = "sentence-transformers"
# Model name for the provider
model_name = "BAAI/bge-small-en-v1.5"
# Batch size for embedding generation
batch_size = 32

# OpenAI embedding configuration (when provider = "openai")
# [llm.embedding.openai]
# api_key = "${OPENAI_API_KEY}"
# model_name = "text-embedding-3-small"

# Ollama embedding configuration (when provider = "ollama")
# [llm.embedding.ollama]
# base_url = "http://localhost:11434"
# model_name = "qwen3-embedding:8b"

[llm.rag]
# Enable RAG pipeline
enabled = true
# Number of documents to retrieve
retrieval_top_k = 10
# Number of documents to include in context
context_top_k = 5
# Maximum tokens in context
max_context_tokens = 2000
# Similarity threshold for retrieval (0.0-1.0)
similarity_threshold = 0.5
# Default LLM provider for generation
llm_provider = "ollama"
# Default LLM model for generation
llm_model = "llama3.1:8b"
# Generation temperature
temperature = 0.7
# Maximum response tokens
max_tokens = 1024

[llm.semantic_cache]
# Enable semantic caching for RAG responses
enabled = true
# Collection name for cache storage
collection_name = "_rag_cache"
# Similarity threshold for cache hits (0.0-1.0, higher = stricter)
similarity_threshold = 0.95
# Cache TTL in hours
ttl_hours = 24
# Maximum cache entries
max_entries = 10000

# Advanced Configuration (optional - smart defaults applied)
# Uncomment and modify only if you need to override defaults

[storage.wal_config]
# Global manifest location (centralized tracking of all WAL files)
global_manifest_url = "file:///tmp/proximadb/manifest"
memory_flush_size_bytes = 16777216
global_flush_threshold = 4294967296
enable_wal = true
distribution_strategy = "LoadBalanced"
collection_affinity = true

# [storage.sst_config]
# block_size_kb = 2048
# compression = "zstd"
# vector_encoding_strategy = "FullVector"
# segment_invariants_cache_mb = 256
# survivor_cache_mb = 1024
# Optional persistent local warm tier. This must be a local filesystem path
# (SSD/NVMe recommended for latency); unset preserves the DRAM-only path.
# cache_local_disk_path = "/var/lib/proximadb/cache"
# cache_local_disk_max_gb = 100
# Populate immutable PAX bytes only after atomic publication:
# "none" | "invariant" (default) | "all".
# cache_on_write = "invariant"
# L0 batches five write files; query-visible L1+ levels merge at three ready
# files. A completed job re-evaluates the collection so cascaded work drains
# without leaving three or more ready files at one level. The multiplier
# defaults to 1.0 between higher levels; values outside [1.0, 1.5] emit a
# warning. Total steady segment count is workload/level dependent and must be
# verified after quiescence. A TOML override must currently specify the complete
# CompactionConfig object (partial inline objects are rejected by serde).

# TD-064 / tier-migration integration
#
# When enabled, the SST engine attaches an SstTieringIntegration at
# bootstrap and the flush / search / compaction hooks begin emitting
# access events + flush-tier decisions + compaction-time migration
# evaluations to the policy engine. Physical byte-movement between tier
# paths is still deferred — the policy engine generates migration tasks
# but no executor moves the bytes yet.
#
# Default: disabled (the entire [storage.sst_config.tiering] block can
# be omitted, in which case the engine ships with no tiering hooks).
#
# [storage.sst_config.tiering]
# enabled = true
# evaluation_interval_secs = 300            # background policy eval cadence
# max_concurrent_migrations = 4
# auto_evaluate = true                       # run background evaluator on a timer
# migration_cooldown_secs = 3600             # min interval between migrations for same item
# hot_tier_path = "file:///fast-ssd/proximadb/hot"
# warm_tier_path = "file:///proximadb/warm"
# cold_tier_path = "s3://proximadb-cold-bucket/cold"
# archive_tier_path = "s3://proximadb-archive-bucket/archive"
# default_tier = "Warm"                      # tier for newly-flushed data
# cold_age_threshold_days = 7                # demote to Cold after this many days
# archive_age_threshold_days = 30            # archive after this many days
# hot_access_threshold = 100                 # promote to Hot after N accesses

# PAX coarse-probe (IVF) — the master cloud-cost lever. Compaction trains +
# emits the A0 coarse directory; search probes the nearest `nprobe` cells
# instead of full-scanning. Cuts GETs/query ~4x and per-tenant COGS ~4x vs
# full-scan (COGS measurement arc), recall ~0.98 (floor 0.975 since
# 2026-09-03 — TD-IOBUDGET-2). Env overrides still win:
# PROXIMADB_PAX_READ_COARSE_PROBE, PROXIMADB_PAX_READ_COARSE_NPROBE,
# PROXIMADB_PAX_WRITE_A0_TRAIN.
# Default: all ON, geometric nprobe (sqrt(ncells) x multiplier).
#
# [storage.sst_config.coarse_probe]
# enable_read_probe = true                   # search probes A0 (kill-switch)
# enable_write_train = true                  # compaction emits v3/A0 (the COGS unblock)
# nprobe_multiplier = 2.0                    # nprobe = ceil(sqrt(ncells) x mult)
#                                            # 2.0 is the compiled default. 1.0 was measured
#                                            # BELOW the recall floor (0.9795 at k_c=30, vs the
#                                            # then-0.98 ratchet; the floor is 0.975 since
#                                            # 2026-09-03) -- do not copy it. Lower only behind
#                                            # a representative recall gate.
# nprobe_min = 3
# nprobe_max = 0                             # 0 = unlimited (capped at ncells)
# ncomp_floor = 0                            # 0 = legacy coarse-PCA width formula (TD-IVF-3)

# [storage.viper_config]
# row_group_size = 100000
# compression = "zstd"

# [cache]
# total_memory_mb = 512

[security]
enabled = false  # Enable for production
mode = "development"  # development | production | enterprise

# [security.tenant]  # TD-TENANT-1: tenant-identity trust
# Bare tenant-assertion trust policy applied to EVERY network surface
# (REST X-Tenant-ID, gRPC/Arrow Flight x-tenant-id metadata, pgwire startup
# database / tenant session vars). Unset => deployment-mode preset
# ("open"; "authenticated-only" under multi-tenant strict mode). The
# PROXIMADB_TENANT_HEADER_TRUST env var overrides both.
# header_trust = "open"  # open | authenticated-only | gateway-only
# Tier-claim trust policy (ADR-0053 W8) for the entitlement claim (REST
# X-Tenant-Tier, gRPC x-tenant-tier, pgwire proximadb_tier startup param).
# Unset => same deployment-mode preset ladder; PROXIMADB_TIER_HEADER_TRUST
# overrides. A rejected claim is DROPPED (never a 4xx): the tenant resolves
# its default tier.
# tier_header_trust = "open"  # open | authenticated-only | gateway-only

[security.authentication]
enabled = false
methods = ["api_key"]
require_authentication = false
default_session_timeout_minutes = 60

[security.authentication.api_keys]
# TD-TENANT-1 follow-up (a): a legacy config-backed entry may carry
# roles = ["gateway"] to make the key a gateway principal — enabling
# GatewayOnly tenant delegation. Registry-backed `pxk_` keys use their own
# authoritative identity path and do not inherit this claim. Delegation ONLY:
# it grants no UnifiedPermission.
"dev-key" = { user_id = "devuser", permissions = ["*"], ip_restrictions = [] }

# Generic OIDC provider (TD-SSO-1): bearer tokens from ANY compliant IdP,
# validated against its JWKS. Roles sanitize at the seam: ONLY the
# role_allowlist crosses — anything else the IdP asserts is dropped.
# Supports: Kanidm, Keycloak, Okta, Azure Entra ID, Google Workspace.
#
# ── Kanidm (tested, working on dataserver3) ──
# [security.authentication.oidc]
# enabled = true
# NOTE: requires methods = [..., "jwt"] above — the OIDC path rides the jwt
# method; without it every bearer token reads "JWT authentication disabled".
# Pair with [security.rbac] default_deny = true: with the permissive default,
# any principal that can obtain a token for `audience` from the IdP is an
# authorized data-plane principal (adversarial-review finding F4).
# issuer_url = "https://sso.singh.local:8443/oauth2/openid/proximadb"
# audience = ["proximadb"]
# roles_claim = "groups"
# tenant_claim = "tenant"
# ca_cert_path = "/etc/proximadb/sso-ca.pem"       # internal PKI
#
# ── Azure Entra ID (single-tenant v2.0) ──
# issuer_url = "https://login.microsoftonline.com/{tenant}/v2.0"
# audience = ["api://{client-id}", "{client-id}"]   # both forms accepted
# roles_claim = "roles"                              # or "groups" with claims
# tenant_claim = "tid"
# allowed_algorithms = ["RS256", "ES256"]
#
# ── Keycloak ──
# issuer_url = "https://kc.example.com/realms/{realm}"
# audience = ["account"]
# roles_claim = "realm_access.roles"                 # nested path (dot notation)
# allowed_algorithms = ["RS256", "ES256"]
#
# ── Okta ──
# issuer_url = "https://xxx.okta.com/oauth2/default"
# audience = ["api://default"]
# roles_claim = "groups"
#
# ── Google Workspace ──
# issuer_url = "https://accounts.google.com"
# issuer_aliases = ["accounts.google.com"]           # bare-hostname iss form
# audience = ["{client-id}"]
# NOTE: Workspace groups are NOT in ID tokens (require Admin SDK call);
# role mapping is structurally unavailable on this provider.
#
# Timing knobs (all optional, these are the defaults):
# clock_skew_seconds = 60
# jwks_cache_seconds = 3600
# http_timeout_seconds = 10
# role_allowlist = []             # deliberate business-role opt-in
# allow_delegation_roles = false  # gateway/operator groups grant
#                                 # cross-tenant delegation only when you opt in

[security.authentication.jwt]
enabled = false
secret = "dev-secret-change-me"
access_token_expiration_minutes = 60
refresh_token_expiration_days = 7
issuer = "proximadb"
audience = "proximadb-clients"
algorithm = "HS256"

[security.authentication.sso]
enabled = false
providers = []
token_cache_ttl_minutes = 60

[security.rbac]
enabled = false
enable_field_level_permissions = false
enable_audit_logging = false
default_deny = false
cache_permissions = true
permission_cache_ttl_minutes = 60

[security.audit]
enable_audit_logging = false
encryption_enabled = false
retention_days = 30
enable_real_time_alerts = false
compliance_frameworks = []

[security.audit.storage_backend]
File = { directory = "/tmp/proximadb/audit" }

[security.compliance]
frameworks = []
encryption_at_rest = false
encryption_in_transit = false

# ==============================================================================
# TLS/mTLS Configuration
# ==============================================================================
# Enables encrypted connections and optional mutual TLS authentication.
#
# ## TLS Modes:
# - Standard TLS: Server presents certificate, client validates server
# - mTLS: Both server and client present certificates for mutual authentication
#
# ## Quick Setup:
# 1. Development (auto-generated certs):
#    - Set `auto_generate = true` and `enabled = true`
#    - Certs will be created in data_dir/certs/
#
# 2. Production (existing certs):
#    - Set `enabled = true`
#    - Provide paths to cert_file, key_file
#    - For mTLS, also provide ca_file and set require_client_certs = true
#
# ## Certificate Management:
# ProximaDB includes built-in certificate generation using rcgen.
# For production, use certificates from a proper CA (Let's Encrypt, etc.)

[security.tls]
# Enable TLS for all server endpoints (REST, gRPC, Arrow Flight)
enabled = false
# Server certificate file (PEM format)
cert_file = ""
# Server private key file (PEM format)
key_file = ""
# CA certificate file for mTLS client verification
ca_file = ""
# Require client certificates (enables mTLS mode)
require_client_certificates = false
# Auto-generate self-signed certificates for development
# WARNING: Only use in development - self-signed certs should not be used in production
auto_generate = false
# Certificate validity period in days (for auto-generated certs)
validity_days = 365
# Days before expiration to trigger renewal warnings
renewal_threshold_days = 30

# Subject information for auto-generated certificates
[security.tls.subject]
common_name = "localhost"
organization = "ProximaDB"
organizational_unit = "Development"
country = "US"
state = ""
locality = ""
email = ""

# Subject Alternative Names for auto-generated certificates
# Required for browsers to accept the certificate
[security.tls.san]
dns_names = ["localhost", "proximadb", "*.local"]
ip_addresses = ["127.0.0.1", "::1"]

# mTLS (mutual TLS) authentication configuration
# When enabled, clients must present valid certificates signed by the CA
[security.mtls]
# Enable mTLS authentication
enabled = false
# Allowed CN patterns for client certificates
# Supports exact match and wildcards (*.example.com matches client.example.com)
# Empty list = allow all valid certificates from trusted CA
allowed_cn_patterns = []
# Default roles assigned to mTLS authenticated users
# These roles can be used for authorization decisions
default_roles = ["reader"]
# Reject expired client certificates
reject_expired = true
# Check certificate revocation (requires CRL/OCSP configuration)
check_revocation = false

# Map certificate CNs to user IDs
# Useful for mapping service account certificates to specific identities
# If CN is not in mapping, the CN itself is used as the user ID
[security.mtls.cn_to_user_mapping]
# "service-a.internal" = "service-account-a"
# "admin.internal" = "admin-user"

# ==============================================================================
# Distributed Operations Configuration (Q3 2025)
# ==============================================================================
# Enables horizontal scaling through sharding and replication.
# Set enabled = true for multi-node deployments.

[distributed]
# Enable distributed mode (multi-node cluster)
enabled = false
# Unique cluster identifier
cluster_id = "proximadb-cluster"
# Node ID (use environment variable for dynamic assignment)
# node_id = "${NODE_ID}"

[distributed.sharding]
# Enable automatic sharding for collections
enabled = true
# Default number of shards per collection
default_shard_count = 3
# Minimum shards per collection
min_shards = 1
# Maximum shards per collection
max_shards = 256
# Enable automatic rebalancing
auto_rebalance = true
# Rebalance threshold (load imbalance percentage, 0.0-1.0)
rebalance_threshold = 0.2
# Maximum concurrent rebalance operations
max_concurrent_rebalance = 2

[distributed.replication]
# Default replication factor for new collections
default_factor = 2
# Default consistency level: One, Quorum, All, LocalQuorum
default_consistency = "Quorum"
# Maximum replication lag in milliseconds
max_lag_ms = 1000
# Replication timeout in milliseconds
timeout_ms = 5000
# Enable async replication (eventual consistency)
async_mode = false
# Enable compression for replication traffic
compression = true
# Batch size for replication entries
batch_size = 100

[distributed.routing]
# Load balancing strategy: RoundRobin, LeastLoaded, LeastLatency, Random, WeightedRoundRobin
load_balancing = "RoundRobin"
# Enable read replicas for load distribution
enable_read_replicas = true
# Maximum retries for failed requests
max_retries = 3
# Routing decision timeout in milliseconds
timeout_ms = 100
# Enable sticky sessions for consistency
sticky_sessions = false
# Enable locality-aware routing (prefer local nodes)
locality_aware = true

[distributed.consensus]
# Consensus algorithm: raft (default)
algorithm = "raft"
# Election timeout in milliseconds
election_timeout_ms = 1000
# Heartbeat interval in milliseconds
heartbeat_interval_ms = 150
# Snapshot interval (number of log entries)
snapshot_interval = 10000
# External etcd endpoints (optional, for etcd-based consensus)
# etcd_endpoints = ["localhost:2379"]

[distributed.nodes]
# Seed nodes for cluster discovery
# seed_nodes = ["node1:5679", "node2:5679", "node3:5679"]
# Advertise address for this node
# advertise_addr = "127.0.0.1:5679"

# Node health check configuration
[distributed.health]
# Health check interval in seconds
check_interval_seconds = 5
# Timeout for health checks in milliseconds
timeout_ms = 2000
# Number of failed checks before marking node unhealthy
failure_threshold = 3
# Enable automatic node removal after sustained failures
auto_remove_failed = false
# Time before removing failed node (seconds)
removal_delay_seconds = 300

# ============================================================================
# Async-ingest queue (proximadb-queue)
# ============================================================================
# When this section is present (with at least `root` set), ProximaDB opens
# the tiered persistent queue at startup, threads the client into the v3
# REST `/documents?mode=async` handler, and spawns the embedding drainer
# with the production BulkLoadDrainerSink.
#
# Override precedence (highest wins):
#   1. CLI flag (none today; reserved for future)
#   2. Environment variable (PROXIMADB_QUEUE_ROOT,
#      PROXIMADB_QUEUE_OBJECT_ARCHIVE, PROXIMADB_QUEUE_SYNC_MODE,
#      PROXIMADB_EMBED_DRAINER_PARTITIONS) — emergency per-pod tuning
#   3. TOML [queue] section — the canonical declarative artifact
#   4. Compiled-in defaults
#
# Why TOML is authoritative: this file is checked into version control
# and downloadable from object store, identical across replicas, and
# survives container restarts. Env vars are ephemeral and intended only
# for emergency per-pod overrides without rebuilding the artifact.
#
# Leave the entire [queue] section commented out to keep async ingest
# disabled. The v3 handler then falls back to inline embed.
#
# [queue]
# # Filesystem URL where queue segments live. Required to enable async
# # ingest. Typical k8s: a PVC-backed local path; ECS with object-store-
# # direct: adls://... or s3://... once the proximadb-filesystem
# # extraction lands.
# root = "file:///var/lib/proximadb/queue"
#
# # Optional second-tier archive URL. Sealed segments are mirrored here
# # so the queue survives ECS pod loss / k8s reschedule onto a fresh-disk
# # node. Highly recommended for production.
# # object_archive = "adls://anvaiops/queue-cold"
#
# # "strict" (default, fsync-before-ack — embed events cannot be re-
# # derived if lost) or "lazy" (memory-only ack; higher throughput,
# # acceptable for events the producer can replay).
# sync_mode = "strict"
#
# # Partition range this replica drains, e.g. "0..16" (default) or
# # "0,3..6,9". Single-replica leaves it unset; multi-replica deployments
# # pass disjoint ranges per pod (the queue's cross-process leases then
# # enforce ownership).
# drainer_partitions = "0..16"
