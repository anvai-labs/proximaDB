# ProximaDB Production Configuration
# Secure defaults for enterprise deployment

[server]
node_id = "proximadb-prod"
bind_address = "0.0.0.0"
port = 5678
data_dir = "/var/lib/proximadb/data"

[server.tenant]
mode = "multi_tenant"
default_tenant = "default"

[storage]
# Production metadata URL with backup
metadata_url = "file:///var/lib/proximadb/metadata"

# Production storage locations
[[storage.storage_locations]]
url = "file:///var/lib/proximadb/data"
weight = 1
tags = ["production", "primary"]

# Assignment configuration
[storage.assignment_config]
strategy = "hash"
affinity = true

# Production memory settings
mmap_enabled = true
cache_size_mb = 8192  # 8GB cache for production

[storage.wal_config]
write_buffer_size_mb = 16384  # 16GB for high-throughput production
memory_flush_size_bytes = 67108864  # 64MB per batch
memtable_type = "BTree"
sync_mode = "PerBatch"
write_buffer_directory = "/var/lib/proximadb/write_buffer"
enable_wal = true

[storage.sst_config]
level_count = 7
compaction_threshold = 5  # Fewer L0 files in the window = fewer per-query cascades (measured 3.2x faster on SIFT 1M)
block_size_kb = 4096  # 4MB blocks for production throughput
compaction_strategy = "leveled"
compression = "zstd"
compression_enabled = true
compression_level = 6  # Higher compression for production storage efficiency
cache_size_mb = 2048  # 2GB SST cache
max_files_per_level = 20
level_size_multiplier = 10.0
max_levels = 7
background_thread_count = 8  # More threads for production
data_directory = "/var/lib/proximadb/sst_data"
mmap_enabled = true
prefetch_enabled = true
prefetch_size_kb = 128

[storage.bloom_filter_config]
bits_per_key = 12  # Higher precision for production
enabled = true

[storage.viper_config]
row_group_size = 250000  # Larger row groups for production
compression = "zstd"
compression_enabled = true
compression_level = 6
enable_statistics = true
data_directory = "/var/lib/proximadb/viper_data"
cache_size_mb = 4096  # 4GB VIPER cache

[storage.filesystem_config]
enable_write_strategy_cache = true
temp_strategy = "SameDirectory"

[storage.filesystem_config.atomic_config]
enable_local_atomic = true
enable_object_store_atomic = true  # Enable for cloud storage
cleanup_temp_on_startup = true

[api]
# Trust-only pgwire is not admitted with security enabled.
enable_pgwire = false
grpc_port = 5679
rest_port = 5678
max_request_size_mb = 256  # Higher limit for production
timeout_seconds = 60  # Longer timeout for complex queries
enable_tls = true  # TLS enabled by default in production
ttl_sweep_interval_seconds = 300  # More frequent cleanup

# TLS Configuration for production
[api.tls]
cert_file = "/etc/proximadb/tls/server.crt"
key_file = "/etc/proximadb/tls/server.key"
ca_file = "/etc/proximadb/tls/ca.crt"  # For mTLS
require_client_cert = false  # Set to true for mTLS

[monitoring]
metrics_enabled = true
log_level = "info"
metrics_port = 9090  # Prometheus metrics endpoint

[consensus]
node_id = 1
cluster_peers = []  # Configure for multi-node deployment
election_timeout_ms = 3000  # Shorter timeout for production
heartbeat_interval_ms = 500  # More frequent heartbeats
snapshot_threshold = 100

[performance]
sync_mode = "PerBatch"
max_concurrent_operations = 1000
connection_pool_size = 100

# Security Configuration - Production Secure Defaults
[security]
enabled = true
mode = "production"  # Secure production mode

[security.authentication]
# Multiple authentication methods for production
methods = ["jwt", "api_key", "mtls"]  # "sso" removed — legacy SSO is gone; OIDC rides the "jwt" method
require_authentication = true  # Always require authentication
default_session_timeout_minutes = 480
enabled = true  # When true and security is configured, REST auth middleware is enabled

[security.authentication.api_keys]
# Production API keys (configure via environment variables)
# Example: "prod-api-key" = { user_id = "service-account", tenant_id = "production", permissions = ["read", "write"] }

[security.authentication.jwt]
enabled = true
# JWT secret should be loaded from environment variable PROXIMADB_JWT_SECRET
secret = "${PROXIMADB_JWT_SECRET}"
access_token_expiration_minutes = 15  # Short-lived access tokens
refresh_token_expiration_days = 7
issuer = "proximadb-production"
audience = "proximadb-clients"
algorithm = "HS256"

[security.rbac]
enabled = true
enable_field_level_permissions = true
enable_audit_logging = true
default_deny = true  # Zero-trust: deny by default
cache_permissions = true
permission_cache_ttl_minutes = 15

[security.audit]
enable_audit_logging = true
encryption_enabled = true
retention_days = 2555  # 7 years for compliance
enable_real_time_alerts = true
# alert_webhook_url = "${PROXIMADB_SECURITY_WEBHOOK}"
compliance_frameworks = ["SOC2", "GDPR", "HIPAA"]

[security.audit.storage_backend]
File = { directory = "/var/log/proximadb/audit" }

[security.tls]
enabled = true
require_client_certificates = true  # mTLS enabled
cert_file = "/etc/proximadb/tls/server.crt"
key_file = "/etc/proximadb/tls/server.key"
ca_file = "/etc/proximadb/tls/ca.crt"

# Enterprise compliance frameworks
[security.compliance]
frameworks = ["SOC2", "GDPR", "HIPAA"]
data_residency = "US"  # Configure based on requirements
encryption_at_rest = true
encryption_in_transit = true
