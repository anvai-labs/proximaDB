# TD-OBJSTORE-5 S4 (ADR-063 D8 nightly tier): GCS (fake-gcs) restart + recall,
# BEST-EFFORT — off the promotion path. fake-gcs/object_store incompatibilities
# are documented, so failures warn + surface here for issue-filing; they never
# block a merge or a promotion (GCS is explicitly NOT a gate while warn-only).
name: Object-store nightly (GCS best-effort)

on:
  schedule:
    - cron: "17 8 * * *" # daily, off-peak for the shared runner pool
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  objstore-nightly-gcs:
    name: GCS restart + recall (fake-gcs, best-effort)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /home/runner/.cache/sccache
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-objstore-nightly"
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: actions/cache@v6
        with:
          path: /home/runner/.cache/sccache
          key: sccache-nightly-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: sccache-nightly-${{ runner.os }}-
      - name: GCS restart + recall (best-effort)
        run: bash scripts/run_cloud_emulator_tests.sh --nightly
