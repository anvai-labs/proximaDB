# Auto-rerun CI / QA Gate jobs killed by runner infrastructure (NOT by test failures).
#
# The long compile-bound jobs (Rust Tests (unit) in CI; the QA Gate's
# cloud-emulator / coverage / SIFT1M jobs) occasionally die with "The runner has
# received a shutdown signal" / exit 143 — a hosted-runner reclamation/OOM kill,
# not a code failure. Historically a human had to notice and run
# `gh run rerun <id> --failed`. This workflow does that once, automatically, and
# ONLY when every failed job carries the infra-kill signature — a genuine test
# failure is never retried. (This is a SAFETY NET for non-deterministic infra
# kills; the deterministic cold-compile OOM is fixed at the source — e.g. the
# cloud-emulator job runs CARGO_BUILD_JOBS=1, see run_cloud_emulator_tests.sh.)
#
# NOTE: workflow_run triggers execute from the DEFAULT branch's copy of this
# file, so this becomes active once promoted to main.
name: Flake Rerun

on:
  workflow_run:
    workflows: ["CI", "QA Gate"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  rerun-infra-flakes:
    name: Rerun infra-killed jobs (once)
    runs-on: ubuntu-latest
    # max 0.1 min green step span over 60 runs since 2026-10-09 (9 green);
    # one `gh api` rerun call. 1.5x is under the 15-min floor, so the floor applies.
    timeout-minutes: 15
    # Only first attempts: one automatic retry, never a loop.
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    steps:
      - name: Rerun failed jobs if all failures are runner shutdowns
        uses: actions/github-script@v9
        with:
          script: |
            const run_id = context.payload.workflow_run.id;
            const { owner, repo } = context.repo;

            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              { owner, repo, run_id, filter: 'latest', per_page: 100 }
            );
            // The aggregator job fails whenever any dependency fails; ignore it
            // when deciding whether the failure set is pure infrastructure.
            const failed = jobs.filter(
              (j) => j.conclusion === 'failure' && j.name !== 'CI Success'
            );
            if (failed.length === 0) {
              core.info('No non-aggregator failed jobs; nothing to do.');
              return;
            }

            const SIGNATURE = 'The runner has received a shutdown signal';
            let allInfra = true;
            for (const job of failed) {
              const annotations = await github.paginate(
                github.rest.checks.listAnnotations,
                { owner, repo, check_run_id: job.id, per_page: 100 }
              );
              const infra = annotations.some((a) =>
                (a.message || '').includes(SIGNATURE)
              );
              core.info(`${job.name}: infra-kill=${infra}`);
              if (!infra) allInfra = false;
            }

            if (!allInfra) {
              core.info('At least one failure is not an infra kill; not rerunning.');
              return;
            }

            core.notice(
              `All ${failed.length} failed job(s) show the runner-shutdown ` +
              'signature; rerunning failed jobs once.'
            );
            await github.rest.actions.reRunWorkflowFailedJobs({ owner, repo, run_id });
