# Auto-rerun CI / QA Gate jobs killed by runner infrastructure (NOT by test failures).
#
# The long compile-bound jobs (Rust Tests (unit) in CI; the QA Gate's
# cloud-emulator / coverage / SIFT1M jobs) occasionally die with "The runner has
# received a shutdown signal" / exit 143 — a hosted-runner reclamation/OOM kill,
# not a code failure. Historically a human had to notice and run
# `gh run rerun <id> --failed`. This workflow does that once, automatically, and
# ONLY when every failed job carries the infra-kill signature — a genuine test
# failure is never retried. The signature lives in the job LOG ("##[error]The
# runner has received a shutdown signal"); the annotation only says "exit code
# 143", which is why the annotation-only matcher this replaced never fired. (This is a SAFETY NET for non-deterministic infra
# kills; the deterministic cold-compile OOM is fixed at the source — e.g. the
# cloud-emulator job runs CARGO_BUILD_JOBS=1, see run_cloud_emulator_tests.sh.)
#
# NOTE: workflow_run triggers execute from the DEFAULT branch's copy of this
# file, so this becomes active once promoted to main.
name: Flake Rerun

on:
  workflow_run:
    workflows: ["CI", "QA Gate"]
    types: [completed]

permissions:
  actions: write   # rerun-failed-jobs; also covers reading job logs
  checks: read     # check-run annotations (the exit-143 fallback)
  contents: read   # checkout of the default branch's scripts/

jobs:
  rerun-infra-flakes:
    name: Rerun infra-killed jobs (once)
    runs-on: ubuntu-latest
    # max 0.1 min green step span over 60 runs since 2026-10-09 (9 green);
    # one `gh api` rerun call. 1.5x is under the 15-min floor, so the floor applies.
    timeout-minutes: 15
    # Only first attempts: one automatic retry, never a loop.
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    steps:
      # workflow_run executes the DEFAULT branch's copy of this file, and this
      # checkout is that same trusted ref -- never the failed run's head.
      - uses: actions/checkout@v7
      - name: Rerun failed jobs if all failures are runner shutdowns
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        # The matcher reads each failed job's LOG (the shutdown text is never
        # in an annotation), falls back to the exit-143 annotation only when
        # the log is unreadable, and reruns only when EVERY failure matches.
        # Tested against real log excerpts in tests/scripts/test_flake_rerun.py.
        run: python3 scripts/flake_rerun.py --repo "${{ github.repository }}" --run-id "$RUN_ID"
