name: QA Gate

# The qa branch is the promotion gate between develop and main:
#   develop --(PR)--> qa --(PR)--> main
# This workflow runs the heavier integration + coverage gates that the qa branch
# is responsible for. Its job names are wired as REQUIRED status checks on `qa`
# (and `main`) via branch protection.

on:
  pull_request:
    branches: [qa, main]
  push:
    branches: [qa]
  workflow_dispatch:
    inputs:
      # WS8 SIFT1M PAX recall ratchet (see the `sift-pax-recall` job). 100000 =
      # the fast CI floor; 1000000 = the full gating artifact for the default-on
      # flip (Phase F).
      sift_n:
        description: "SIFT base-vector count (100000 floor | 1000000 full gate)"
        required: false
        default: "100000"

concurrency:
  group: qa-gate-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # false (not true): a develop→qa promotion PR has head=develop, so every push
  # to develop fires a `synchronize` event landing in the SAME per-PR group —
  # with cancel-in-progress:true that killed the in-flight run before TPC-H/DS
  # could finish (the promotion never completed during develop churn). false lets
  # the in-flight run finish; GitHub still keeps only the newest *pending* run per
  # group (older pendings are auto-dropped), so there is no runaway stacking.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# Least-privilege default GITHUB_TOKEN scope (CodeQL actions/missing-workflow-permissions).
# Read-only is sufficient: every job only checks out and runs tests/ratchets — none
# writes to the repo, posts comments, or uses OIDC.
permissions:
  contents: read

jobs:
  # Defense in depth for the main promotion path. The trusted metadata-only
  # branch-route-guard workflow enforces all develop/qa/main PR routes.
  promotion-source-guard:
    name: Promotion Source Guard (main <- qa only)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: main PRs must originate from qa
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "qa" ]; then
            echo "::error::main can only be promoted from 'qa' (got '$HEAD_REF'). Flow is develop -> qa -> main."
            exit 1
          fi
          echo "ok: main PR originates from qa"

  # Catch a SEVERED promotion ancestry before it compounds.
  #
  # develop -> qa promotions were squash-merged for several cycles. A squash gives
  # qa develop's *content* with no link to its *history*, so the merge-base between
  # the branches stops advancing: it sat at 1ab38bac7 (2026-07-21) while develop ran
  # 377 commits ahead, and git recomputed that whole diff on every promotion —
  # 47 conflicts, essentially all phantom, growing worse each cycle.
  #
  # Nothing on the feature -> develop path can see this; it is a property of how the
  # promotion PR itself is merged. So assert it here, where promotions are gated.
  # A promotion opened from a current base has a merge-base at (or very near) the
  # base tip; a severed one is hundreds of commits back.
  promotion-ancestry-guard:
    name: Promotion Ancestry Guard (merge-base is current)
    if: github.event_name == 'pull_request' && (github.base_ref == 'qa' || github.base_ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: the target must be fully contained in this branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF" >/dev/null 2>&1
          base_tip="$(git rev-parse "origin/$BASE_REF")"
          merge_base="$(git merge-base "$base_tip" HEAD)"
          behind="$(git rev-list --count "$merge_base..$base_tip")"
          echo "base=$BASE_REF tip=${base_tip:0:9} merge-base=${merge_base:0:9} behind=$behind"
          # The invariant is exact, so assert it exactly rather than pick a
          # threshold: the merge-base must BE the base tip, i.e. the target is an
          # ancestor of this branch. Anything else means the target holds commits
          # this branch has never seen, which is precisely when a promotion
          # explodes into phantom conflicts.
          #
          # Calibrated against real history: promotion branches that had merged the
          # target in measure 0; the r5 branch cut as a bare develop snapshot
          # measured 44. An earlier draft of this guard allowed 150 and would have
          # passed the broken case — hence the exact check.
          if [ "$behind" -ne 0 ]; then
            echo "::error::'$BASE_REF' is $behind commits ahead of this branch's merge-base — the target is not fully merged in."
            echo "::error::Fix: 'git merge origin/$BASE_REF' (or 'git merge -s ours origin/$BASE_REF' if you have verified the target carries no unique work), then push."
            echo "::error::If this recurs every cycle, the previous promotion was SQUASHED. Squashing discards the merge that reconciled the branches, so the target never gains the source's ancestry and the next promotion re-diffs from the last real merge. Promotion PRs must be merged with a MERGE COMMIT."
            exit 1
          fi
          echo "ok: '$BASE_REF' is fully contained in this branch"

  # SINGLE combined job: compile all pgwire + recall test binaries ONCE on this
  # runner, then run them. Same runner => the compiled target/ is reused across
  # the runs (cargo sees its own artifacts as up-to-date, no recompile between
  # suites). The previous separate-jobs design (a `build` job + per-suite
  # `needs:[build]` jobs) wasted a ~40m build job because Swatinem/rust-cache
  # cannot reliably ferry target/ ACROSS runners — cargo recompiled each suite
  # from scratch on its own runner. Building once here and running sequentially
  # eliminates both the redundant compiles and the cross-runner cache misses.
  # The e2e tests embed the server (tokio::spawn), so they link the lib; a shared
  # compiled target/ is the lever, not a pre-built server binary. The PAX recall
  # step is the storage-format mandate (#8/#10) recall@k ratchet (≥0.90 vs f32).
  # Sequential runs (not parallel) for reliability: clear per-suite pass/fail and
  # no cross-suite memory contention on the materialize-heavy pgwire suites.
  pgwire-recall-tests:
    name: Integration tests (TPC-H/DS pgwire + PAX recall)
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      # 8MB worker stack: correlated subqueries + recall ratchets produce
      # deep-but-finite async call chains that overflow the default ~2MB.
      RUST_MIN_STACK: "8388608"
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /home/runner/.cache/sccache
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-qa-integration"
      # sccache complements rust-cache: content-addressed per-rustc-invocation, so
      # it hits even when the target/ artifact cache misses (Cargo.lock churn).
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: actions/cache@v6
        with:
          path: /home/runner/.cache/sccache
          key: sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: sccache-${{ runner.os }}-
      - name: Build all integration test binaries (once)
        env:
          CARGO_BUILD_JOBS: "4"
        run: |
          cargo test --test tpch_pgwire_e2e --test tpcds_pgwire_e2e --no-run
          cargo test -p proximadb-block-format --lib --no-run
          cargo test --test embedded_flush_recovery --no-run
          # TD-182 P0b: previously-orphaned vector recall ratchets (gate them here).
          cargo test --test vector_ann_recall_e2e --test nova_cold_search_recall_test \
            --test td112_postflush_recall_e2e --test raptor_recall_test \
            --test helix_cold_search_recall_test --no-run
      - name: Run TPC-H over pgwire
        env:
          # 8MB worker stack: correlated subqueries (Q2/Q20-Q22) produce
          # deep-but-finite async call chains that overflow the default ~2MB.
          RUST_MIN_STACK: "8388608"
        run: cargo test --test tpch_pgwire_e2e -- --nocapture
      - name: Run TPC-DS over pgwire
        run: cargo test --test tpcds_pgwire_e2e -- --nocapture
      - name: Run PAX recall ratchets
        run: cargo test -p proximadb-block-format --lib recall -- --nocapture
      - name: Run cold-read recall ratchet (TD-163/TD-165)
        # Guards the SST cold-read path TD-163 now relies on (free_wal=true): after a
        # flush+reopen, recall@k must not regress the hot memtable path. Catches the
        # cold-read ranking regression the vec_0-only assertion in
        # sst_block_serialization_roundtrip missed (why TD-165 was marked Resolved
        # prematurely). Well-separated seeded vectors → recall@10 = 1.0 on both paths.
        run: cargo test --test embedded_flush_recovery recall -- --nocapture
      - name: Run deletion-vector ratchet (TD-DELVEC-1 F3v)
        # F3v cold-tier deletion vectors — gates the develop→qa→main promotion.
        # Currently runs the OID→position resolver substrate (ORP1+CRC32 format,
        # footer-region round-trip, add_record capture-order, end-to-end
        # "writer→footer→fetch region→deserialize"). WI-3 extends this with the
        # delete→scan-survivors scenarios (the actual deletion correctness) — add
        # them here as they land.
        run: |
          cargo test -p proximadb-storage-common --lib oid_position_resolver -- --nocapture
          cargo test -p proximadb-storage-common --lib oid_resolver -- --nocapture
      # TD-182 P0b: vector-recall ratchets that previously ran in NO CI tier
      # (orphaned). Each asserts recall@k / exact-match vs an f32 baseline. The
      # td112 suite runs only its `recall` test here; its `axis_index_rebuilt_*`
      # test is a separate pre-existing AXIS-rebuild regression tracked as TD-184.
      - name: Run vector ANN recall ratchet (TD-182 P0b)
        run: cargo test --test vector_ann_recall_e2e -- --nocapture
      - name: Run NOVA bounds-prune recall ratchet (TD-182 P0b)
        run: cargo test --test nova_cold_search_recall_test -- --nocapture
      - name: Run HELIX cold-search recall ratchet (TD-182 P0b)
        run: cargo test --test helix_cold_search_recall_test -- --nocapture
      - name: Run RAPTOR recall-after-reopen ratchet (TD-182 P0b)
        run: cargo test --test raptor_recall_test -- --nocapture
      - name: Run TD-112 post-flush recall ratchet (TD-182 P0b)
        run: cargo test --test td112_postflush_recall_e2e recall -- --nocapture

  # WS8: real-dataset PAX RaBitQ→SQ8 recall artifact. Runs on promotion PRs and
  # workflow_dispatch. It downloads the SIFT1M corpus (~525 MB) and runs a heavy
  # release-mode recall gate, so it remains separate from normal PR CI.
  # Produces the dated recall@10 ≥ 0.90 artifact that GATES the PAX default-on
  # flip (Phase F): the existing `pax-recall-ratchet` is a synthetic DIM=64 CI
  # floor only (representativeness caveat in BENCHMARK_EVIDENCE.toml WS8). The
  # Local runs may skip when the corpus is absent. This QA job sets
  # PROXIMADB_RECALL_DATASET_REQUIRED=1, so a missing/corrupt corpus fails loud.
  sift-pax-recall:
    name: SIFT1M PAX RaBitQ recall ratchet (WS8)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-qa-sift"
      - name: Cache SIFT1M corpus (TEXMEX .fvecs — no native dep)
        uses: actions/cache@v6
        with:
          path: ~/sift1m
          key: sift1m-texmem-fvecs-v1
      - name: Download SIFT1M corpus (HTTPS Hugging Face mirror)
        run: |
          mkdir -p "$HOME/sift1m"
          cd "$HOME/sift1m"
          base=https://huggingface.co/datasets/qbo-odp/sift1m/resolve/main
          for f in sift_base.fvecs sift_query.fvecs sift_groundtruth.ivecs; do
            if [ ! -s "$f" ]; then
              echo "::group::download $f"
              curl -L --fail --retry 3 -o "$f" "$base/$f"
              echo "::endgroup::"
            fi
          done
          ls -lh "$HOME/sift1m"
      - name: Build ratchet binary
        env:
          CARGO_BUILD_JOBS: "4"
        # --features io-trace: the paired-evidence cohort gate is fail-closed
        # without it (cache probes no-op ⇒ outcome=unknown ⇒ zero admissible
        # pairs). Mirrors the ci.yml sift-recall-ratchet contract.
        run: cargo test --release --features io-trace --test sift_pax_recall_ratchet_test --no-run
      - name: Run SIFT PAX recall ratchet (N=${{ inputs.sift_n || '100000' }})
        env:
          PROXIMADB_SIFT_DATASET_DIR: /home/runner/sift1m
          PROXIMADB_SIFT_N: ${{ inputs.sift_n || '100000' }}
          PROXIMADB_SIFT_QUERIES: "1000"
          PROXIMADB_RECALL_DATASET_REQUIRED: "1"
          PROXIMADB_SIFT_CENTROID_MAX_RECALL_DROP: "0"
        run: cargo test --release --features io-trace --test sift_pax_recall_ratchet_test -- --nocapture

  # Validate the object-store access-tier cost lever (TD-168/TD-173) against REAL
  # cloud APIs via emulators — Azurite (Azure), MinIO (S3), fake-gcs (GCP) — the
  # "develop→qa upfront validation" for the cold-payload tier. The default CI only
  # exercises put_with_tier on memory:// (where the tier degrades to a plain put),
  # so a native-class mapping regression that a real cloud API would 4xx is
  # invisible there; this job runs the tier path end-to-end. Azure + S3 are strict
  # (PUT-with-tier accepted + round-trip); GCS is best-effort (the test self-skips
  # on a fake-gcs/object_store incompatibility). All orchestration lives in
  # scripts/run_cloud_emulator_tests.sh so the CI path == `make cloud-emulator-test`.
  # TD-OBJSTORE-5 S3 (ADR-063 D8 QA tier): full-server restart proofs per strict
  # store (Azure then S3, Azurite stopped before the S3 group so cross-store
  # leakage fails loudly) + the cold recall ratchet on Azure. One cloud-full
  # server build (jobs=1, 16GB OOM ceiling) — separate runner from the
  # cloud-emulator job so neither compile budget starves the other. The 90m cap
  # is a measured ratchet: record the first cold-cache wall time in
  # TD-OBJSTORE-5 and tighten.
  objstore-restart-qa-tier:
    name: Object-store QA tier (restart Azure+S3 + recall)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /home/runner/.cache/sccache
    steps:
      - name: Reclaim disk space
        run: |
          echo "Disk before reclaim:"; df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/boost || true
          echo "Disk after reclaim:"; df -h /
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-objstore-qa-tier"
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: actions/cache@v6
        with:
          path: /home/runner/.cache/sccache
          key: sccache-qa-tier-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: sccache-qa-tier-${{ runner.os }}-
      - name: Restart proofs (Azure strict, S3 strict) + recall ratchet (Azure)
        run: bash scripts/run_cloud_emulator_tests.sh --qa

  cloud-emulator-object-store:
    name: Cloud object-store emulators (Azurite/MinIO/fake-gcs)
    runs-on: ubuntu-latest
    # The --all scope compiles the full main crate under CARGO_BUILD_JOBS=2 (see
    # scripts/run_cloud_emulator_tests.sh) — a middle ground that stays off the 16GB
    # runner's OOM cliff while halving the old jobs=1 ~35-40m serialized compile that
    # grew past this budget and got cancelled mid-build (#882). sccache (below)
    # covers the COLD compile that rust-cache misses when Cargo.lock churns (e.g. a
    # promotion merge) — that cold ~35-40m compile + emulator round-trips pushed this
    # job past the old 60m cap on #980. 90m leaves headroom for the first (cold) run
    # while sccache warms; subsequent runs compile far less.
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /home/runner/.cache/sccache
      # #941-class OOM mitigations, applied here after the 2026-08-01 promotion
      # (#1378) had this job runner-shutdown-killed TWICE mid-compile: the
      # workspace outgrew the jobs=2 middle ground (#882) on the 16GB runner.
      # Dropping debuginfo halves rustc peak memory and target size; the swap
      # step below turns any residual spike into a slowdown, not a dead runner.
      # Scoped to this job only — the other qa-gate jobs pass within budget.
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-qa-cloud-emulator"
      # sccache complements rust-cache: content-addressed per-rustc-invocation, so
      # it hits even when the target/ artifact cache misses (Cargo.lock churn).
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: actions/cache@v6
        with:
          path: /home/runner/.cache/sccache
          key: sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: sccache-${{ runner.os }}-
      - name: Add swap headroom
        run: |
          sudo fallocate -l 12G /mnt/swapfile-ci
          sudo chmod 600 /mnt/swapfile-ci
          sudo mkswap /mnt/swapfile-ci
          sudo swapon /mnt/swapfile-ci
          free -h
      - name: Validate Cool tier against Azure/S3/GCS emulators
        # docker + aws/az CLIs are preinstalled on ubuntu-latest runners.
        run: bash scripts/run_cloud_emulator_tests.sh

  # SDK Coverage Ratchet moved to ci.yml (develop early-detection, path-gated on
  # clients/python/**) — see ci.yml `sdk-coverage-ratchet`. Catches an SDK coverage
  # regression on the introducing feat→develop PR instead of only at develop→qa.

  rust-coverage-ratchet:
    name: Rust Coverage Ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # FIRST CUT: cargo-llvm-cov over the full workspace is heavy. 60m was too
    # tight — it timed out mid-lib-test-run (deep into the graph/index tests),
    # so the seed artifact was never produced. 90m lets it complete + emit the
    # seed (rust-coverage-seed.json), the prerequisite to baseline rust:* in
    # COVERAGE_BASELINE.json. Still non-blocking (continue-on-error); flip to
    # required (remove continue-on-error) only AFTER a clean run seeds the
    # baseline AND it stays green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: llvm-tools-preview
      - name: Install system deps + cargo-llvm-cov + cargo-nextest
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
          cargo install cargo-llvm-cov --locked
          cargo install cargo-nextest --locked
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-qa-llvmcov"
      - name: Coverage (lib) + ratchet
        env:
          CARGO_BUILD_JOBS: "1"
        run: |
          # Run under nextest (process-per-test isolation), NOT libtest's shared
          # process. Four lib tests that touch process-global singletons
          # (axis_flush_hook boot-global, eventlog restart/recovery, datafusion
          # document-pax ranged-pushdown) flake under shared-process
          # `cargo test --lib` — verified locally: 7424 pass / 4 fail under
          # `cargo test --lib`; the SAME 4 PASS under `cargo nextest`. Matching
          # every other CI job (which already uses nextest, mandate #11) removes
          # the intermittent gate failure and is the prerequisite to flipping
          # this job from continue-on-error to required.
          cargo llvm-cov nextest --lib --no-report -p proximadb
          cargo llvm-cov report --json --output-path /tmp/llvm-cov.json
          python3 scripts/coverage_ratchet.py normalize --rust /tmp/llvm-cov.json -o /tmp/rust-current.json
          # Seed the baseline if absent (first run), else ratchet-check.
          if python3 -c "import json,sys; d=json.load(open('docs/_internal/roadmap/COVERAGE_BASELINE.json')); sys.exit(0 if any(k.startswith('rust:') for k in d) else 1)"; then
            python3 scripts/coverage_ratchet.py check \
              --baseline docs/_internal/roadmap/COVERAGE_BASELINE.json \
              --current /tmp/rust-current.json
          else
            echo "::warning::no rust baseline yet — emitting current as artifact to seed it"
            cp /tmp/rust-current.json rust-coverage-seed.json
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rust-coverage
          path: |
            /tmp/llvm-cov.json
            rust-coverage-seed.json
          if-no-files-found: ignore
