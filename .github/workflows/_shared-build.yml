  # ============================================================================
  # BUILD SDIST - Skipped if cache hit
  # ============================================================================
  build-sdist:
    name: Build Source Distribution
    needs: cache-check
    if: needs.cache-check.outputs.cache-hit != 'true'
    runs-on: ubuntu-22.04
    outputs:
      built-count: ${{ steps.summary.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Maturin
        run: pip install maturin

      - name: Build sdist (main package)
        run: maturin sdist --out dist

      # NOTE: Superseded — this rationale was stale: the bindings live in crates/binding/proximadb-embedded and build via the ROOT pyproject (see release-python.yml). Kept disabled here because release-python.yml is the canonical pipeline.
      # TODO: Re-enable when embedded package has proper Rust bindings
      # - name: Build sdist (embedded package)
      #   working-directory: clients/python-embedded
      #   run: maturin sdist --out dist

      - name: Save to Build Cache
        uses: actions/cache/save@v6
        with:
          # NOTE: embedded sdist temporarily disabled - see above
          path: dist/*.tar.gz
          key: sdist-${{ inputs.cache-key }}-${{ github.run_id }}

      - name: Upload sdist Artifact
        if: inputs.upload-artifacts == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          # NOTE: embedded sdist temporarily disabled - see above
          path: dist/*.tar.gz
          retention-days: 7

      - name: Build Summary
        id: summary
        run: echo "count=2" >> $GITHUB_OUTPUT

  # ============================================================================
  # CACHE ARTIFACTS - Save final cache entry
  # ============================================================================
  save-cache:
    name: Save Build Cache
    # NOTE: build-wheels and build-embedded-wheels removed from dependencies - see above for TODOs
    needs: [cache-check, build-binaries, build-sdist]
    if: always() && needs.cache-check.outputs.cache-hit != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Create Cache Manifest
        run: |
          mkdir -p build-cache
          echo "version=${{ inputs.version }}" > build-cache/manifest.txt
          echo "cache-key=${{ inputs.cache-key }}" >> build-cache/manifest.txt
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> build-cache/manifest.txt

      - name: Save Primary Cache Entry
        uses: actions/cache/save@v6
        with:
          path: build-cache/
          key: ${{ needs.cache-check.outputs.cache-key }}

  # ============================================================================
  # SUMMARY
  # ============================================================================
  summary:
    name: Build Summary
    # NOTE: build-wheels and build-embedded-wheels removed from dependencies - see above for TODOs
    needs: [cache-check, build-binaries, build-sdist]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      total-count: ${{ steps.count.outputs.total }}
    steps:
      - name: Count Artifacts
        id: count
        run: |
          if [ "${{ needs.cache-check.outputs.cache-hit }}" = "true" ]; then
            echo "::notice::Used cached artifacts"
            echo "total=cached" >> $GITHUB_OUTPUT
          else
            # NOTE: Wheel builds temporarily disabled - see above for TODOs
            BINARIES=${{ needs.build-binaries.outputs.built-count }}
            # WHEELS=${{ needs.build-wheels.outputs.built-count }}
            SDIST=${{ needs.build-sdist.outputs.built-count }}
            TOTAL=$((BINARIES + SDIST))
            echo "total=$TOTAL" >> $GITHUB_OUTPUT
          fi
