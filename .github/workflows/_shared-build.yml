# =============================================================================
# ProximaDB Shared Build Workflow (Reusable)
# =============================================================================
# This reusable workflow defines all build jobs that can be shared between
# prerelease-ci and release workflows.
#
# Usage:
#   jobs:
#     build:
#       uses: ./.github/workflows/_shared-build.yml
#       with:
#         version: "0.2.0"
#         cache-key: "build-${{ github.sha }}"
#         upload-artifacts: true
#   validate:
#     needs: build
#     runs-on: ubuntu-latest
#     steps:
#       - uses: actions/download-artifact@v4
# =============================================================================

name: Shared Build

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to build'
        required: true
        type: string
      cache-key:
        description: 'Unique cache key for artifact caching'
        required: true
        type: string
      upload-artifacts:
        description: 'Whether to upload as workflow artifacts'
        required: false
        type: boolean
        default: true
      skip-cache:
        description: 'Skip cache and always rebuild'
        required: false
        type: boolean
        default: false
    outputs:
      binaries-built:
        description: 'Number of binary artifacts built'
        value: ${{ jobs.build-binaries.outputs.built-count }}
      # NOTE: build-wheels temporarily disabled - see TODO in job definition
      # wheels-built:
      #   description: 'Number of wheel artifacts built'
      #   value: ${{ jobs.build-wheels.outputs.built-count }}
      sdist-built:
        description: 'Number of sdist artifacts built'
        value: ${{ jobs.build-sdist.outputs.built-count }}
      total-artifacts:
        description: 'Total artifacts built'
        value: ${{ jobs.summary.outputs.total-count }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

permissions:
  contents: read
  actions: write  # For caching

jobs:
  # ============================================================================
  # CACHE CHECK - Check if we can reuse artifacts
  # ============================================================================
  cache-check:
    name: Check Build Cache
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
      cache-key: ${{ steps.cache.outputs.key }}
    steps:
      - name: Generate Cache Key
        id: cache
        run: |
          if [ "${{ inputs.skip-cache }}" = "true" ]; then
            echo "cache-hit=false" >> $GITHUB_OUTPUT
            echo "key=skip-${{ github.run_id }}" >> $GITHUB_OUTPUT
            echo "::notice::Cache skip requested, will rebuild"
          else
            KEY="artifacts-${{ inputs.cache-key }}"
            echo "key=$KEY" >> $GITHUB_OUTPUT
            echo "Checking for cache: $KEY"
          fi

      - name: Restore Cached Artifacts
        uses: actions/cache/restore@v6
        id: restore
        with:
          path: |
            build-cache/
            !build-cache/**/*.log
          key: ${{ steps.cache.outputs.key }}
          restore-keys: |
            artifacts-

      - name: Verify Cache
        run: |
          if [ "${{ steps.restore.outputs.cache-hit }}" = "true" ]; then
            echo "::notice::Cache hit! Found cached artifacts"
            ls -la build-cache/ || echo "Cache dir empty"
            echo "cache-hit=true" >> $GITHUB_STEP_SUMMARY
          else
            echo "::notice::Cache miss, will build"
            echo "cache-hit=false" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # BUILD BINARIES - Skipped if cache hit
  # ============================================================================
  build-binaries:
    name: Build ${{ matrix.target }}
    needs: cache-check
    if: needs.cache-check.outputs.cache-hit != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # NOTE: Temporarily disabled cross-compilation targets for v0.2.0
          # The aarch64-unknown-linux-gnu, x86_64-unknown-linux-musl, and
          # aarch64-apple-darwin builds require cross/Docker setup that has
          # OpenSSL linking issues. We'll fix these post-v0.2.0.
          #
          # - target: x86_64-unknown-linux-musl
          #   os: ubuntu-22.04
          #   archive: tar.gz
          # - target: aarch64-unknown-linux-gnu
          #   os: ubuntu-22.04
          #   archive: tar.gz
          #   cross: true
          # - target: aarch64-apple-darwin
          #   os: macos-14
          #   archive: tar.gz
          #
          # Native builds (working):
          # NOTE: macOS builds temporarily disabled due to ring crate compilation
          # error on Apple Silicon (CPU feature detection assertion failure).
          # TODO: Fix ring dependency or update to newer version for macOS support.
          #
          # - target: aarch64-apple-darwin
          #   os: macos-latest
          #   archive: tar.gz
          #
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            archive: zip
    outputs:
      built-count: ${{ steps.summary.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Cross
        if: matrix.cross
        run: |
          # Install cross from a temp directory to avoid rust-version downgrade
          # The project's Cargo.toml specifies rust-version = "1.88" which causes
          # cargo to downgrade, but cross 0.2.5 requires Rust 1.92+
          cd /tmp
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "${{ inputs.cache-key }}-${{ matrix.target }}"
          shared-key: "shared-build"

      - name: Build Binaries
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} \
              --bin proximadb-server \
              --bin proximadb-bench \
              --bin proximadb-migrate
          else
            cargo build --release --target ${{ matrix.target }} \
              --bin proximadb-server \
              --bin proximadb-bench \
              --bin proximadb-migrate
          fi
        shell: bash

      - name: Create Archive (Unix)
        if: runner.os != 'Windows'
        run: |
          VERSION="${{ inputs.version }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE_NAME="proximadb-${VERSION}-${TARGET}"
          mkdir -p "${ARCHIVE_NAME}"
          cp target/${TARGET}/release/proximadb-server "${ARCHIVE_NAME}/"
          cp target/${TARGET}/release/proximadb-bench "${ARCHIVE_NAME}/"
          cp target/${TARGET}/release/proximadb-migrate "${ARCHIVE_NAME}/"
          cp -r config "${ARCHIVE_NAME}/" 2>/dev/null || true
          tar -czvf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
          shasum -a 256 "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}.tar.gz" >> $GITHUB_ENV

      - name: Create Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = "${{ inputs.version }}"
          $TARGET = "${{ matrix.target }}"
          $ARCHIVE_NAME = "proximadb-${VERSION}-${TARGET}"
          New-Item -ItemType Directory -Path $ARCHIVE_NAME -Force
          Copy-Item "target/${TARGET}/release/proximadb-server.exe" "${ARCHIVE_NAME}/"
          Copy-Item "target/${TARGET}/release/proximadb-bench.exe" "${ARCHIVE_NAME}/"
          Copy-Item "target/${TARGET}/release/proximadb-migrate.exe" "${ARCHIVE_NAME}/"
          Copy-Item -Recurse "config" "${ARCHIVE_NAME}/" -ErrorAction SilentlyContinue
          Compress-Archive -Path $ARCHIVE_NAME -DestinationPath "${ARCHIVE_NAME}.zip"
          $hash = Get-FileHash "${ARCHIVE_NAME}.zip" -Algorithm SHA256
          "$($hash.Hash.ToLower())  ${ARCHIVE_NAME}.zip" | Out-File -Encoding ascii "${ARCHIVE_NAME}.zip.sha256"
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}.zip" >> $env:GITHUB_ENV

      - name: Save to Build Cache
        uses: actions/cache/save@v6
        with:
          path: |
            proximadb-*.${{ matrix.archive }}
            proximadb-*.${{ matrix.archive }}.sha256
          key: binaries-${{ inputs.cache-key }}-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload Binary Artifact
        if: inputs.upload-artifacts == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: |
            proximadb-*.${{ matrix.archive }}
            proximadb-*.${{ matrix.archive }}.sha256
          retention-days: 7

      - name: Build Summary
        id: summary
        run: echo "count=1" >> $GITHUB_OUTPUT

