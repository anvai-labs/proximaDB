# =============================================================================
# ProximaDB Release Pipeline
# =============================================================================
#
# OVERVIEW:
#   This workflow creates and publishes ProximaDB releases across multiple
#   platforms and package registries. It builds native binaries and publishes
#   to GitHub Releases, crates.io (proximadb-sdk) and npm
#   (@anvailabs/proximadb-client).
#
# ONE TAG, ONE VERSION (TD-RELTAG-1):
#   ONE tag `vX.Y.Z` releases EVERY registry, and every package carries the
#   IDENTICAL version X.Y.Z:
#     release.yml         (this file)  GitHub Release binaries, crates.io, npm
#     release-python.yml  (same tags)  PyPI: proximadb + proximadb_embedded
#   Both workflows trigger on the identical tag list and both run
#   `scripts/version-sync.sh check-tag` before building, so a tag that
#   disagrees with any published manifest fails before anything is built.
#   The two files stay SEPARATE on purpose: npm's trusted publisher is bound to
#   `release.yml` and PyPI's to `release-python.yml`; renaming or merging them
#   breaks OIDC publishing until the owner re-registers on npmjs.com/pypi.org.
#   There is no per-registry tag (the old per-package Python tag family is
#   retired) and no per-package version hold. Guarded by
#   scripts/check_release_build_features.py (check_unified_release_tag).
#
# TRIGGER MODES:
#   1. Tag Push: Automatically triggered by pushing a version tag (v0.2.0, v0.2.0-beta.1)
#   2. Manual (workflow_dispatch): Manually triggered with version input and options
#
# WORKFLOW STAGES:
#   ┌─────────────────────────────────────────────────────────────────────────┐
#   │  1. PREPARE          Extract version, validate Cargo.toml              │
#   ├─────────────────────────────────────────────────────────────────────────┤
#   │  2. BUILD (parallel)                                                   │
#   │     ├── build-binaries    2 platform targets (Linux/Windows)           │
#   │     ├── (build-wheels disabled - pure Python package)              │
#   │     ├── build-embedded    5 embedded wheel variants                    │
#   │     └── build-sdist       Source distributions                         │
#   ├─────────────────────────────────────────────────────────────────────────┤
#   │  3. VALIDATE          Pre-release artifact validation (GATE)           │
#   │     └── Verifies ALL expected artifacts exist before publishing        │
#   ├─────────────────────────────────────────────────────────────────────────┤
#   │  4. PUBLISH (sequential, gated)                                        │
#   │     ├── create-release    GitHub Release with all artifacts            │
#   │     (Python → PyPI/TestPyPI: release-python.yml on the SAME vX.Y.Z     │
#   │     tag; its trusted publisher is bound to that file name.)            │
#   │     ├── publish-crates    crates.io (stable only)                      │
#   │     ├── publish-npm       npm via OIDC (stable only)                   │
#   │     └── update-homebrew   Homebrew formula artifact                    │
#   ├─────────────────────────────────────────────────────────────────────────┤
#   │  5. VERIFY             Registries list the version (verify-release),   │
#   │                        then release-smoke.yml installs + exercises     │
#   │                        every published artifact and proves the tag is  │
#   │                        a QA-proven qa->main merge (release evidence)   │
#   ├─────────────────────────────────────────────────────────────────────────┤
#   │  6. CLEANUP            Remove workflow artifacts                       │
#   └─────────────────────────────────────────────────────────────────────────┘
#
# EXPECTED ARTIFACTS:
#   Binaries (2 targets for the v0.2 MVP trust corridor):
#     - proximadb-{version}-x86_64-unknown-linux-gnu.tar.gz
#     - proximadb-{version}-x86_64-pc-windows-msvc.zip
#
#   Python Wheels are NOT built here. The pure-Python SDK (`proximadb`) and the
#   native embedded engine (`proximadb_embedded`, one abi3 wheel per platform,
#   CPython 3.11+) are built and published by `release-python.yml`, triggered by
#   the SAME `vX.Y.Z` tag. This workflow only builds the server binaries, the
#   sdist, and the OS packages below.
#
# SAFEGUARDS:
#   - dry_run: Builds all artifacts but skips publishing (test the pipeline)
#   - Artifact validation gate: Blocks publishing if any artifact is missing
#   - Environment protection: crates-io requires approval
#   Checksum verification: SHA256 checksums for all artifacts
#
# v0.2.0 SCOPE:
#   - Only x86_64-linux-gnu and x86_64-windows are built
#   - musl, aarch64 targets disabled due to cross-compilation issues
#   - macOS DMG disabled (no macOS binaries)
#   - Python packages are pure Python (no Rust wheels)
#
# MANUAL RELEASE PROCESS:
#   1. Ensure every manifest is at the intended version
#      (`bash scripts/version-sync.sh set X.Y.Z` in a PR; the gate rejects drift)
#   2. Run workflow manually with:
#      - version: "0.2.0" (without 'v' prefix)
#      - prerelease: true/false
#      - dry_run: true (recommended first)
#   3. Review dry_run output, verify all artifacts built successfully
#   4. Re-run with dry_run: false to publish
#
# TAG-BASED RELEASE PROCESS (runbook: docs/04-operations/release/release-procedure.md):
#   1. `bash scripts/version-sync.sh set X.Y.Z` merged; `check-tag vX.Y.Z` passes
#   2. Create and push ONE tag: git tag vX.Y.Z && git push origin vX.Y.Z
#   3. release.yml AND release-python.yml both trigger on it
#   4. Stable releases go to crates.io + npm (here) and PyPI (release-python.yml),
#      all at the identical version X.Y.Z
#
# TROUBLESHOOTING:
#   - Build failures: Check platform-specific build logs
#   - Missing artifacts: Validate job shows which artifacts are missing
#   - crates.io failures: Verify CARGO_REGISTRY_TOKEN secret
#
# MAINTENANCE:
#   - Update EXPECTED_BINARY_TARGETS when adding new platforms
#   - Update EXPECTED_WHEEL_MATRIX when changing Python version support
#   - Review retention-days settings periodically
#
# =============================================================================

name: Release

on:
  push:
    # MUST stay identical to release-python.yml's list -- enforced by
    # scripts/check_release_build_features.py (check_unified_release_tag).
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'  # Pre-releases like v0.2.0-beta.1
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.2.0)'
        required: true
        type: string
      prerelease:
        description: 'Is this a pre-release?'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (skip publishing)'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

permissions:
  contents: write
  packages: write

jobs:
  # ============================================================================
  # PREPARATION - Extract version, validate, and prepare release
  # ============================================================================
  prepare:
    # 120, not 30: "Await Pre-Release CI" below waits up to 110 min for
    # prerelease-ci.yml (~55 min) to pass on the tagged commit, which is
    # normally still running when the tag is pushed right after the qa->main merge.
    timeout-minutes: 120
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      dry_run: ${{ steps.version.outputs.dry_run }}
      # The Pre-Release CI run that passed on this commit; build-binaries
      # downloads its binaries instead of rebuilding them. Empty on a dry run.
      prerelease_run_id: ${{ steps.prerelease.outputs.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            PRERELEASE="${{ inputs.prerelease }}"
            DRY_RUN="${{ inputs.dry_run }}"
          else
            # Extract version from tag (remove 'v' prefix)
            VERSION="${GITHUB_REF#refs/tags/v}"
            # Check if it's a pre-release (contains hyphen)
            if [[ "$VERSION" == *"-"* ]]; then
              PRERELEASE="true"
            else
              PRERELEASE="false"
            fi
            DRY_RUN="false"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "dry_run=$DRY_RUN" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION (prerelease: $PRERELEASE, dry_run: $DRY_RUN)"

      # TD-RELTAG-1 version gate. This was a ::warning:: that compared only
      # Cargo.toml and stripped any pre-release suffix, so a tag could publish
      # packages carrying a different version. Now a HARD failure: the release
      # version (tag, or the dispatch input) must equal EVERY manifest that
      # `version-sync.sh check` covers -- Cargo workspace, clients/rust
      # (crates.io), clients/nodejs-embedded (npm), both pyprojects (PyPI, via
      # release-python.yml's identical gate). Every other job needs `prepare`,
      # so nothing builds or publishes on a mismatch.
      - name: Version gate (release version == every manifest)
        run: |
          bash scripts/version-sync.sh check-tag "v${{ steps.version.outputs.version }}"

      # Waits for the verdict rather than demanding it already exists. The v0.4.1
      # tag was pushed one minute after the qa->main merge, while Pre-Release CI
      # for that commit was still running, and the old single query failed the
      # release with nothing built. A red Pre-Release CI still fails fast.
      - name: Await Pre-Release CI
        id: prerelease
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/await_prerelease_ci.sh "${{ github.repository }}" "${{ github.sha }}" 110 10

  # ============================================================================
  # BUILD RUST BINARIES - Cross-platform binary builds
  # ============================================================================
  # CI redesign PR1: Pre-Release CI (prerelease-ci.yml) already built these
  # exact archives -- same commit (await_prerelease_ci.sh matches head_sha),
  # same matrix, same `cloud-full` features -- so this job first DOWNLOADS them
  # from the run `prepare` waited on and checks their SHA-256. It rebuilds only
  # when there is nothing to download: a dry run (no Pre-Release wait), or the
  # artifact expired (prerelease-ci.yml keeps it 14 days) or is missing. A
  # checksum or name MISMATCH fails the job rather than rebuilding: that is a
  # corrupt or unexpected artifact, not an absent one.
  build-binaries:
    timeout-minutes: 150
    name: Fetch or build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    # Job-level permissions replace the workflow default: `actions: read` lets
    # download-artifact read another run's artifacts.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (glibc)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
            features: "cloud-full"

          # Linux x86_64 (musl - static) - DISABLED for v0.2.0
          # Target installation issue - requires manual musl target setup
          # - target: x86_64-unknown-linux-musl
          #   os: ubuntu-22.04
          #   archive: tar.gz
          #   features: ""

          # Linux aarch64 - DISABLED for v0.2.0
          # Cross-compilation requires additional toolchain setup
          # - target: aarch64-unknown-linux-gnu
          #   os: ubuntu-22.04
          #   archive: tar.gz
          #   features: ""
          #   cross: true

          # macOS aarch64 (Apple Silicon) - DISABLED for v0.2.0
          # Ring 0.17.14 has CPU feature detection issues on CI macOS runners
          # Multiple dependencies pull in ring (jsonwebtoken, pgwire, rustls, rcgen)
          # Re-enable in v0.2.1 with alternative crypto stack or rustls upgrade
          # - target: aarch64-apple-darwin
          #   os: macos-latest
          #   archive: tar.gz
          #   features: ""

          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            archive: zip
            features: "cloud-full"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch Pre-Release CI binaries
        id: fetch
        if: needs.prepare.outputs.prerelease_run_id != '' && needs.prepare.outputs.dry_run != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: binaries-${{ matrix.target }}
          run-id: ${{ needs.prepare.outputs.prerelease_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: prerelease-binaries

      - name: Verify fetched binaries (name + SHA-256)
        if: steps.fetch.outcome == 'success'
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          cd prerelease-binaries
          expected="proximadb-${VERSION}-${TARGET}.${ARCHIVE}"
          ls -la
          if [ ! -f "$expected" ] || [ ! -f "$expected.sha256" ]; then
            echo "::error::Pre-Release run ${{ needs.prepare.outputs.prerelease_run_id }} has no ${expected} (+ .sha256) -- its version differs from this release's."
            exit 1
          fi
          # Compare hashes directly: the Windows .sha256 is written by
          # PowerShell (CRLF), which `sha256sum -c` does not parse portably.
          want="$(tr -d '\r' < "$expected.sha256" | awk '{print tolower($1)}')"
          have="$(sha256sum "$expected" | awk '{print $1}')"
          if [ -z "$want" ] || [ "$want" != "$have" ]; then
            echo "::error::SHA-256 mismatch for ${expected}: recorded '${want}', downloaded '${have}'."
            exit 1
          fi
          echo "sha256 OK: ${expected} ${have}"
          mv "$expected" "$expected.sha256" ..
          echo "ARCHIVE_NAME=${expected}" >> "$GITHUB_ENV"

      - name: Install Rust Toolchain
        if: steps.fetch.outcome != 'success'
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Cross (for cross-compilation)
        if: steps.fetch.outcome != 'success' && matrix.cross
        run: |
          # Install cross from a temp directory to avoid rust-version downgrade
          # The project's Cargo.toml specifies rust-version = "1.88" which causes
          # cargo to downgrade, but cross 0.2.5 requires Rust 1.92+
          cd /tmp
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Install Linux Dependencies
        if: steps.fetch.outcome != 'success' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            sudo apt-get install -y musl-tools
          fi

      - name: Setup Rust Cache
        if: steps.fetch.outcome != 'success'
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-${{ matrix.target }}"
          shared-key: "release"

      - name: Build Binaries
        if: steps.fetch.outcome != 'success'
        run: |
          FEATURES="${{ matrix.features }}"
          if [ -n "$FEATURES" ]; then
            FEATURES_FLAG="--features $FEATURES"
          else
            FEATURES_FLAG=""
          fi

          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} $FEATURES_FLAG \
              -p proximadb-server \
              -p proximadb-bench \
              -p proximadb-migrate
          else
            cargo build --release --target ${{ matrix.target }} $FEATURES_FLAG \
              -p proximadb-server \
              -p proximadb-bench \
              -p proximadb-migrate
          fi
        shell: bash

      - name: Create Archive (Unix)
        if: steps.fetch.outcome != 'success' && runner.os != 'Windows'
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE_NAME="proximadb-${VERSION}-${TARGET}"

          mkdir -p "${ARCHIVE_NAME}"
          cp target/${TARGET}/release/proximadb-server "${ARCHIVE_NAME}/"
          cp target/${TARGET}/release/proximadb-bench "${ARCHIVE_NAME}/"
          cp target/${TARGET}/release/proximadb-migrate "${ARCHIVE_NAME}/"
          cp README.adoc LICENSE "${ARCHIVE_NAME}/" 2>/dev/null || true
          cp -r config "${ARCHIVE_NAME}/" 2>/dev/null || true

          tar -czvf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"

          # Generate checksums
          shasum -a 256 "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"

          echo "ARCHIVE_NAME=${ARCHIVE_NAME}.tar.gz" >> $GITHUB_ENV

      - name: Create Archive (Windows)
        if: steps.fetch.outcome != 'success' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = "${{ needs.prepare.outputs.version }}"
          $TARGET = "${{ matrix.target }}"
          $ARCHIVE_NAME = "proximadb-${VERSION}-${TARGET}"

          New-Item -ItemType Directory -Path $ARCHIVE_NAME -Force
          Copy-Item "target/${TARGET}/release/proximadb-server.exe" "${ARCHIVE_NAME}/"
          Copy-Item "target/${TARGET}/release/proximadb-bench.exe" "${ARCHIVE_NAME}/"
          Copy-Item "target/${TARGET}/release/proximadb-migrate.exe" "${ARCHIVE_NAME}/"
          Copy-Item "README.adoc" "${ARCHIVE_NAME}/" -ErrorAction SilentlyContinue
          Copy-Item "LICENSE" "${ARCHIVE_NAME}/" -ErrorAction SilentlyContinue
          Copy-Item -Recurse "config" "${ARCHIVE_NAME}/" -ErrorAction SilentlyContinue

          Compress-Archive -Path $ARCHIVE_NAME -DestinationPath "${ARCHIVE_NAME}.zip"

          # Generate checksum
          $hash = Get-FileHash "${ARCHIVE_NAME}.zip" -Algorithm SHA256
          "$($hash.Hash.ToLower())  ${ARCHIVE_NAME}.zip" | Out-File -Encoding ascii "${ARCHIVE_NAME}.zip.sha256"

          echo "ARCHIVE_NAME=${ARCHIVE_NAME}.zip" >> $env:GITHUB_ENV

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: |
            proximadb-*.${{ matrix.archive }}
            proximadb-*.${{ matrix.archive }}.sha256
          retention-days: 7

  # NOTE: Python embedded wheels are built by `release-python.yml` (native
  # `proximadb_embedded`, one abi3 wheel per platform, CPython 3.11+), NOT here.
  # A previously commented-out `build-embedded-wheels` job lived here; it was
  # removed as dead — its premise ("clients/python-embedded is pure Python, not
  # Rust") is also wrong now that the embedded engine is the root PyO3/maturin
  # package.

  # ============================================================================
  # BUILD SOURCE DISTRIBUTION - Python sdist
  # ============================================================================
  build-sdist:
    timeout-minutes: 45
    name: Build Source Distribution
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Maturin
        run: pip install maturin

      - name: Build sdist (main package)
        run: maturin sdist --out dist

      # DISABLED: clients/python-embedded is pure Python (no Cargo.toml)
      # Re-enable in v0.2.1 with proper setuptools build
      # - name: Build sdist (embedded package)
      #   working-directory: clients/python-embedded
      #   run: |
      #     pip install build
      #     python -m build --sdist --outdir dist

      - name: Upload sdist Artifact
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 7


  # ============================================================================
  # BUILD PLATFORM PACKAGES - RPM, DEB, MSI for v0.2.0
  # DISABLED: DMG (macOS binary not built due to ring crate issues)
  # ============================================================================

  build-rpm:
    timeout-minutes: 45
    name: Build RPM Package
    needs: [prepare, build-binaries]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Binary Artifact
        uses: actions/download-artifact@v8
        with:
          name: binaries-x86_64-unknown-linux-gnu
          path: binary

      - name: Install fpm
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install fpm

      - name: Build RPM
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          mkdir -p rpm_build/usr/bin
          mkdir -p rpm_build/etc/proximadb
          mkdir -p rpm_build/usr/lib/systemd/system
          mkdir -p rpm_build/var/lib/proximadb
          mkdir -p rpm_build/var/log/proximadb
          mkdir -p rpm_build/tmp

          tar -xzf binary/proximadb-*.tar.gz -C rpm_build/usr/bin --strip-components=1
          cp config/config.toml rpm_build/etc/proximadb/
          cp deploy/packaging/systemd/proximadb.service rpm_build/usr/lib/systemd/system/
          cp deploy/packaging/scripts/postinstall.sh rpm_build/tmp/postinstall.sh
          cp deploy/packaging/scripts/preremove.sh rpm_build/tmp/preremove.sh

          fpm -s dir -t rpm \
            -n proximadb \
            -v "$VERSION" \
            --epoch 1 \
            --description "ProximaDB - Cloud-native vector database" \
            --url "https://github.com/anvai-labs/proximaDB" \
            --license "Apache-2.0" \
            --vendor "ProximaDB" \
            --rpm-dist "el8" \
            --after-install rpm_build/tmp/postinstall.sh \
            --before-remove rpm_build/tmp/preremove.sh \
            rpm_build/=/

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v7
        with:
          name: rpm-package
          path: "*.rpm"
          retention-days: 7

  build-deb:
    timeout-minutes: 45
    name: Build DEB Package
    needs: [prepare, build-binaries]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Binary Artifact
        uses: actions/download-artifact@v8
        with:
          name: binaries-x86_64-unknown-linux-gnu
          path: binary

      - name: Install fpm
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install fpm

      - name: Build DEB
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          mkdir -p deb_build/usr/bin
          mkdir -p deb_build/etc/proximadb
          mkdir -p deb_build/var/lib/proximadb
          mkdir -p deb_build/var/log/proximadb
          mkdir -p deb_build/tmp
          mkdir -p deb_build/lib/systemd/system

          tar -xzf binary/proximadb-*.tar.gz -C deb_build/usr/bin --strip-components=1
          cp config/config.toml deb_build/etc/proximadb/
          cp deploy/packaging/systemd/proximadb.service deb_build/lib/systemd/system/
          cp deploy/packaging/scripts/postinstall.sh deb_build/tmp/postinstall.sh
          cp deploy/packaging/scripts/preremove.sh deb_build/tmp/preremove.sh

          # Build DEB with systemd support
          # Note: --deb-systemd flag removed - using manual scripts instead
          fpm -s dir -t deb \
            -n proximadb \
            -v "$VERSION" \
            --description "ProximaDB - Cloud-native vector database" \
            --url "https://github.com/anvai-labs/proximaDB" \
            --license "Apache-2.0" \
            --vendor "ProximaDB" \
            --deb-priority "optional" \
            --after-install deb_build/tmp/postinstall.sh \
            --before-remove deb_build/tmp/preremove.sh \
            deb_build/=/

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v7
        with:
          name: deb-package
          path: "*.deb"
          retention-days: 7

  # build-dmg:
  #   DISABLED for v0.2.0 - macOS builds not available (ring crate issues)
  #   name: Build DMG Installer
  #   ...

  build-msi:
    timeout-minutes: 45
    name: Build MSI Installer
    needs: [prepare, build-binaries]
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Binary Artifact
        uses: actions/download-artifact@v8
        with:
          name: binaries-x86_64-pc-windows-msvc
          path: binary

      - name: Install WiX v4
        run: dotnet tool install --global wix --version 4.0.0

      - name: Extract and Prepare Binaries
        run: |
          # Extract to temp location
          Expand-Archive -Path binary\proximadb-*.zip -DestinationPath msi_temp -Force
          # Move only executable files (not directories) to avoid conflicts
          $exePath = Get-ChildItem -Path msi_temp\proximadb-*\*.exe
          foreach ($exe in $exePath) {
            Move-Item $exe.FullName .
          }
          # Copy config file
          Copy-Item config\config.toml .
          # Clean up temp
          Remove-Item -Recurse -Force msi_temp -ErrorAction SilentlyContinue

      - name: Build MSI
        run: |
          $VERSION = "${{ needs.prepare.outputs.version }}"
          wix build -d "Version=$VERSION" -o "proximadb-$VERSION-x64.msi" deploy\packaging\wix\proximadb.wxs

      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v7
        with:
          name: msi-installer
          path: "*.msi"
          retention-days: 7

  # VALIDATE ARTIFACTS - Pre-release validation gate
  # ============================================================================
  # This job acts as a gate before publishing. It verifies that ALL expected
  # artifacts were successfully built across all platforms before proceeding
  # to create the release. This prevents partial/broken releases.
  # ============================================================================
  validate-artifacts:
    timeout-minutes: 30
    name: Validate Release Artifacts
    needs: [prepare, build-binaries, build-sdist, build-rpm, build-deb, build-msi]
    runs-on: ubuntu-latest
    outputs:
      validation_passed: ${{ steps.validate.outputs.passed }}
      artifact_report: ${{ steps.validate.outputs.report }}
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Validate Artifact Manifest
        id: validate
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          VALIDATION_PASSED=true
          MISSING_ARTIFACTS=""
          FOUND_ARTIFACTS=""

          echo "=============================================="
          echo "ProximaDB Release Artifact Validation"
          echo "Version: $VERSION"
          echo "=============================================="
          echo ""

          # ----------------------------------------
          # Expected Binary Targets (2 platforms for v0.2.0)
          # macOS disabled due to ring crate CI compatibility issues
          # ----------------------------------------
          echo "## Binary Artifacts"
          echo ""

          EXPECTED_BINARIES=(
            "proximadb-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            "proximadb-${VERSION}-x86_64-pc-windows-msvc.zip"
          )

          BINARY_COUNT=0
          BINARY_MISSING=0
          for binary in "${EXPECTED_BINARIES[@]}"; do
            if find artifacts -name "$binary" -type f | grep -q .; then
              echo "  [OK] $binary"
              FOUND_ARTIFACTS="$FOUND_ARTIFACTS\n  - $binary"
              BINARY_COUNT=$((BINARY_COUNT+1))
            else
              echo "  [MISSING] $binary"
              MISSING_ARTIFACTS="$MISSING_ARTIFACTS\n  - $binary"
              BINARY_MISSING=$((BINARY_MISSING+1))
              VALIDATION_PASSED=false
            fi
          done
          echo ""
          echo "  Binary Summary: $BINARY_COUNT/${#EXPECTED_BINARIES[@]} found"
          echo ""

          # Verify SHA256 checksums exist for binaries
          echo "## Binary Checksums"
          echo ""
          CHECKSUM_COUNT=0
          for binary in "${EXPECTED_BINARIES[@]}"; do
            CHECKSUM="${binary}.sha256"
            if find artifacts -name "$CHECKSUM" -type f | grep -q .; then
              echo "  [OK] $CHECKSUM"
              CHECKSUM_COUNT=$((CHECKSUM_COUNT+1))
            else
              echo "  [MISSING] $CHECKSUM"
              # Checksums are important but not blocking
            fi
          done
          echo ""

          # ----------------------------------------
          # Python Wheels — validated & published by release-python.yml, not here
          # ----------------------------------------
          # This `v*` workflow builds no Python wheels (SDK + embedded abi3 wheels
          # ship from release-python.yml on the same `vX.Y.Z` tag), so there is nothing
          # to validate here. The prior per-Python-version count checks (expecting
          # 5 wheels for 3.8-3.12) were orphaned when the wheel-build jobs moved
          # out — they force-failed VALIDATION_PASSED against wheels this run never
          # produces, blocking the publish gate. Removed.
          echo "## Python Wheel Artifacts"
          echo "  (built & published by release-python.yml on the same vX.Y.Z tag — not validated here)"
          echo ""

          # ----------------------------------------
          # Source Distributions
          # ----------------------------------------
          echo "## Source Distributions"
          echo ""

          SDIST_COUNT=$(find artifacts -path "*/sdist/*.tar.gz" -type f 2>/dev/null | wc -l)
          echo "  Source distributions found: $SDIST_COUNT (expected >= 1)"
          if [ "$SDIST_COUNT" -lt 1 ]; then
            echo "  [MISSING] No source distribution found"
            VALIDATION_PASSED=false
          fi
          echo ""

          # ----------------------------------------
          # Platform Packages (v0.2.0: RPM, DEB, MSI only)
          # DMG disabled due to ring crate issues on macOS CI
          # ----------------------------------------
          echo "## Platform Packages"
          echo ""

          RPM_COUNT=$(find artifacts -name "*.rpm" -type f 2>/dev/null | wc -l)
          DEB_COUNT=$(find artifacts -name "*.deb" -type f 2>/dev/null | wc -l)
          DMG_COUNT=$(find artifacts -name "*.dmg" -type f 2>/dev/null | wc -l)
          MSI_COUNT=$(find artifacts -name "*.msi" -type f 2>/dev/null | wc -l)

          echo "  RPM packages: $RPM_COUNT (expected >= 1)"
          echo "  DEB packages: $DEB_COUNT (expected >= 1)"
          echo "  DMG installers: $DMG_COUNT (disabled for v0.2.0)"
          echo "  MSI installers: $MSI_COUNT (expected >= 1)"
          echo ""

          # Only validate RPM, DEB, MSI for v0.2.0
          if [ "$RPM_COUNT" -lt 1 ] || [ "$DEB_COUNT" -lt 1 ] || [ "$MSI_COUNT" -lt 1 ]; then
            echo "  [WARNING] Missing required platform packages (RPM, DEB, or MSI)"
            VALIDATION_PASSED=false
          fi

          if [ "$DMG_COUNT" -gt 0 ]; then
            echo "  [INFO] DMG found (not required for v0.2.0)"
          fi
          echo ""

          # ----------------------------------------
          # Final Summary
          # ----------------------------------------
          echo "=============================================="
          echo "VALIDATION SUMMARY"
          echo "=============================================="

          if [ "$VALIDATION_PASSED" = "true" ]; then
            echo ""
            echo "  STATUS: PASSED"
            echo ""
            echo "  All expected artifacts are present."
            echo "  Release can proceed safely."
            echo ""
            echo "passed=true" >> $GITHUB_OUTPUT
          else
            echo ""
            echo "  STATUS: FAILED"
            echo ""
            echo "  Some expected artifacts are missing!"
            echo "  Review the output above and fix build issues."
            echo ""
            if [ -n "$MISSING_ARTIFACTS" ]; then
              echo "  Missing artifacts:"
              echo -e "$MISSING_ARTIFACTS"
            fi
            echo ""
            echo "passed=false" >> $GITHUB_OUTPUT
          fi

          # Generate artifact report for downstream jobs
          ARTIFACT_LIST=$(find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.whl" \) | sort)
          echo ""
          echo "## Complete Artifact List"
          echo ""
          echo "$ARTIFACT_LIST" | head -50
          ARTIFACT_COUNT=$(echo "$ARTIFACT_LIST" | wc -l)
          if [ "$ARTIFACT_COUNT" -gt 50 ]; then
            echo "  ... and $((ARTIFACT_COUNT - 50)) more"
          fi
          echo ""
          echo "  Total artifact files: $ARTIFACT_COUNT"

          # Save report
          echo "report<<EOF" >> $GITHUB_OUTPUT
          echo "Version: $VERSION" >> $GITHUB_OUTPUT
          echo "Binaries: $BINARY_COUNT/${#EXPECTED_BINARIES[@]}" >> $GITHUB_OUTPUT
          echo "SDists: $SDIST_COUNT" >> $GITHUB_OUTPUT
          echo "Status: $VALIDATION_PASSED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate Validation Summary
        run: |
          echo "## Release Artifact Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.prepare.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Dry Run:** ${{ needs.prepare.outputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
          echo "**Pre-release:** ${{ needs.prepare.outputs.prerelease }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.validate.outputs.passed }}" = "true" ]; then
            echo ":white_check_mark: **All artifact validations passed**" >> $GITHUB_STEP_SUMMARY
          else
            echo ":x: **Artifact validation failed - release blocked**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifact Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.validate.outputs.report }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # CREATE GITHUB RELEASE - Consolidate all artifacts
  # ============================================================================
  create-release:
    timeout-minutes: 30
    name: Create GitHub Release
    needs: [prepare, build-binaries, build-sdist, build-rpm, build-deb, build-msi, validate-artifacts]
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.dry_run != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Organize Release Assets
        run: |
          mkdir -p release-assets

          # Collect binary archives
          find artifacts -name "proximadb-*.tar.gz" -exec cp {} release-assets/ \;
          find artifacts -name "proximadb-*.zip" -exec cp {} release-assets/ \;
          find artifacts -name "*.sha256" -exec cp {} release-assets/ \;

          # Collect wheels
          find artifacts -name "*.whl" -exec cp {} release-assets/ \;

          # Collect sdists
          find artifacts -name "*.tar.gz" ! -name "proximadb-*" -exec cp {} release-assets/ \;

          # Collect platform packages
          find artifacts -name "*.rpm" -exec cp {} release-assets/ \;
          find artifacts -name "*.deb" -exec cp {} release-assets/ \;
          find artifacts -name "*.dmg" -exec cp {} release-assets/ \;
          find artifacts -name "*.msi" -exec cp {} release-assets/ \;

          # Create combined checksums file
          cd release-assets
          shasum -a 256 *.tar.gz *.zip *.whl *.rpm *.deb *.dmg *.msi 2>/dev/null | sort > SHA256SUMS.txt || true

          ls -la

      - name: Generate Release Notes
        id: release-notes
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          cat << 'EOF' > release-notes.md
          ## ProximaDB ${{ needs.prepare.outputs.version }}

          ### Installation

          #### Binary Installation

          Download the appropriate binary for your platform:

          | Platform | Architecture | Archive |
          |----------|--------------|---------|
          | Linux | x86_64 (glibc) | `proximadb-${{ needs.prepare.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz` |
          | Windows | x86_64 | `proximadb-${{ needs.prepare.outputs.version }}-x86_64-pc-windows-msvc.zip` |

          Linux musl, Linux aarch64, and macOS archives are not built by this
          workflow and are therefore not advertised in this release.

          #### Packages (every registry at the identical version ${{ needs.prepare.outputs.version }})

          This one tag publishes every registry: PyPI from `release-python.yml`,
          crates.io and npm from `release.yml`.

          ```bash
          # Python client SDK and the in-process embedded engine (PyPI)
          pip install proximadb==${{ needs.prepare.outputs.version }}
          pip install proximadb-embedded==${{ needs.prepare.outputs.version }}

          # Rust client SDK (crates.io)
          cargo add proximadb-sdk@${{ needs.prepare.outputs.version }}

          # Node/TypeScript client SDK (npm)
          npm install @anvailabs/proximadb-client@${{ needs.prepare.outputs.version }}
          ```

          #### Build From Source

          ```bash
          git clone https://github.com/anvai-labs/proximaDB
          cd proximaDB
          # `cloud-full` = the S3 + Azure + GCS object-store backends, which the
          # published binaries and container image are built with. Omit it and
          # `file://` still works, but an `s3://`/`az://`/`gs://` URL fails with
          # "feature for AmazonS3 not enabled" -- not compiled in.
          cargo build --release --features cloud-full -p proximadb-server --bin proximadb-server
          ```

          #### Platform Packages (RPM/DEB/MSI)

          **Linux (RPM - RHEL/CentOS/Fedora):**
          ```bash
          sudo rpm -ivh proximadb-${{ needs.prepare.outputs.version }}-1.el8.x86_64.rpm
          sudo systemctl start proximadb
          ```

          **Linux (DEB - Debian/Ubuntu):**
          ```bash
          sudo dpkg -i proximadb_${{ needs.prepare.outputs.version }}_amd64.deb
          sudo systemctl start proximadb
          ```

          **Windows (MSI):**
          ```powershell
          # Double-click proximadb-${{ needs.prepare.outputs.version }}-x64.msi
          # Or install from command line:
          msiexec /i proximadb-${{ needs.prepare.outputs.version }}-x64.msi
          ```

          ### Included Binaries

          - **proximadb-server**: Main database server (REST + gRPC)
          - **proximadb-bench**: Performance benchmarking suite
          - **proximadb-migrate**: Schema migration utility

          ### Verification

          All release artifacts include SHA256 checksums. Verify with:

          ```bash
          sha256sum -c SHA256SUMS.txt
          ```

          ### Changelog

          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: ProximaDB v${{ needs.prepare.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          files: release-assets/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # PUBLISH TO CRATES.IO - Rust package registry
  # ============================================================================
  # SAFEGUARDS:
  # - Requires successful artifact validation
  # - Uses GitHub Environment protection rules (configure in repo settings)
  # - Only runs for stable releases (not pre-releases)
  # - Pre-publish verification step
  # ============================================================================
  publish-crates:
    timeout-minutes: 30
    name: Publish to crates.io
    needs: [prepare, build-binaries, validate-artifacts, create-release]
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.dry_run != 'true' && needs.prepare.outputs.prerelease != 'true' && needs.validate-artifacts.outputs.validation_passed == 'true'
    environment:
      name: crates-io
      url: https://crates.io/crates/proximadb-sdk
    steps:
      - name: Pre-Publish Verification
        run: |
          echo "=============================================="
          echo "crates.io PUBLISH VERIFICATION"
          echo "=============================================="
          echo ""
          echo "Version: ${{ needs.prepare.outputs.version }}"
          echo "Pre-release: ${{ needs.prepare.outputs.prerelease }}"
          echo "Artifact Validation: ${{ needs.validate-artifacts.outputs.validation_passed }}"
          echo ""
          echo "This step will publish to crates.io (production)."
          echo "Install with: cargo add proximadb-sdk --version ${{ needs.prepare.outputs.version }}"
          echo ""
          echo "=============================================="

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          toolchain: stable

      # The only crates.io-publishable member is the client-only SDK
      # (proximadb-sdk): the root `proximadb` monolith and the other members
      # carry path dependencies with no registry version. The SDK keeps its
      # embedded-engine deps in [dev-dependencies] so `cargo publish`
      # packages it clean; `embedded`/`full` are workspace-local features.
      # Belt-and-braces over `prepare`'s gate: the version `cargo publish`
      # uploads is the manifest's, so assert it IS the release version.
      - name: Assert crate version == release version
        working-directory: clients/rust
        run: |
          CRATE_VERSION=$(python3 -c 'import tomllib;print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          if [ "$CRATE_VERSION" != "${{ needs.prepare.outputs.version }}" ]; then
            echo "::error::clients/rust/Cargo.toml is $CRATE_VERSION, release is ${{ needs.prepare.outputs.version }} (TD-RELTAG-1)"
            exit 1
          fi

      - name: Verify Package
        working-directory: clients/rust
        run: cargo package --list

      - name: Publish Rust SDK to crates.io
        working-directory: clients/rust
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-npm:
    timeout-minutes: 30
    name: Publish Node SDK to npm
    needs: [prepare, build-binaries, validate-artifacts, create-release]
    runs-on: ubuntu-latest
    # Same gating as publish-crates: no dry-runs, no pre-releases, artifacts validated.
    if: needs.prepare.outputs.dry_run != 'true' && needs.prepare.outputs.prerelease != 'true' && needs.validate-artifacts.outputs.validation_passed == 'true'
    environment:
      name: npm
      url: https://www.npmjs.com/package/@anvailabs/proximadb-client
    # OIDC trusted publishing, mirroring anvai-labs/agentbrowser's npm-publish
    # job, which has shipped this way since 1.8.x (latest 1.16.1, 2026-10-10)
    # with NO npm secret in the repo at all.
    #
    # v0.4.0 failed here: `npm error code E404 ... PUT
    # /@anvailabs%2fproximadb-client`. The package already existed at 0.3.0, so
    # it was not a first publish or a missing --access; npm answers 404 rather
    # than 403 on a PUT when the token lacks rights to an existing package. The
    # classic NPM_TOKEN (secret last updated 2026-09-03) had stopped being
    # accepted -- consistent with npm's own banner: "npm tokens that bypass 2FA
    # are being restricted -- account changes (Aug 2026) and direct publishing
    # (Jan 2027)".
    #
    # `id-token: write` is what lets the runner mint the OIDC token. The claims
    # must match the trusted publisher registered on npm for this package:
    #   repository anvai-labs/proximaDB, workflow release.yml, environment npm
    # The `environment: npm` above is part of that match -- registering the
    # publisher WITHOUT the environment name while this job declares one makes
    # the environment claim mismatch and the publish is refused.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node 24, not 22: OIDC trusted publishing needs npm >= 11.5.1 and node 22
      # ships npm 10.x. The guard below fails loudly rather than letting npm
      # fall back to a credential it does not have.
      #
      # NO `registry-url:` (v0.4.1 follow-up). With it, setup-node writes an
      # .npmrc holding `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` and
      # points NPM_CONFIG_USERCONFIG at it -- the stale-token line #1990 had to
      # neutralise. Without it there is no token line anywhere for npm to
      # prefer over the OIDC exchange; the registry is the npm default, and the
      # publish step pins it explicitly.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Require an npm new enough for OIDC trusted publishing
        run: |
          NPM_VERSION="$(npm --version)"
          echo "npm ${NPM_VERSION}"
          MIN=11.5.1
          if [ "$(printf '%s\n%s\n' "$MIN" "$NPM_VERSION" | sort -V | head -1)" != "$MIN" ]; then
            echo "::error::npm ${NPM_VERSION} is older than ${MIN}; OIDC trusted publishing is unavailable and this job has no fallback credential"
            exit 1
          fi

      # The SDK is a standalone package (single public dep: openapi-fetch).
      # Its version field is NOT an independent source of truth: it must equal
      # the release version (TD-RELTAG-1). `prepare` gates that for the whole
      # tree and the publish step below re-asserts it, so npm can no longer
      # lag (0.4.0 skipped npm; from 0.4.1 every registry ships the same X.Y.Z).
      #
      # `npm ci`, NOT `npm install`: this is the one job whose tree becomes a
      # published artifact, and `npm install` RE-RESOLVES rather than installing
      # what the lockfile pinned — then rewrites the lock in the runner, where
      # the rewrite is discarded. So the package users download would be built
      # from a tree no committed lockfile describes, and a transitive release
      # between CI and the tag would silently enter it. `npm ci` installs the
      # lock exactly and fails closed if the lock and manifest disagree, which
      # is the property every other npm job in this repo already relies on.
      # Verified under both npm majors; see the Node-pin contract in
      # scripts/check_deterministic_commit_contract.py.
      - name: Build
        working-directory: clients/nodejs-embedded
        run: |
          npm ci
          npm run build

      # Idempotent: the tag's version may already be on npm (manual bootstrap
      # publish, or a re-run after a partial failure) — skip, don't fail.
      - name: Check version and whether it is already on npm
        id: npmver
        working-directory: clients/nodejs-embedded
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "${{ needs.prepare.outputs.version }}" ]; then
            echo "::error::clients/nodejs-embedded/package.json is $VERSION, release is ${{ needs.prepare.outputs.version }} (TD-RELTAG-1)"
            exit 1
          fi
          if curl -sf -A "proximadb-release" \
            "https://registry.npmjs.org/@anvailabs%2fproximadb-client" \
            | grep -q "\"${VERSION}\""; then
            echo "::notice::${VERSION} already on npm — skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # v0.4.1 failed twice here with ENEEDAUTH and nothing else: npm runs the
      # OIDC exchange itself (npm/cli v11 lib/utils/oidc.js) but swallows every
      # failure at `verbose` log level and falls through to "not logged in".
      # This step performs the SAME two requests npm does, so a refusal fails
      # HERE with its HTTP status and the registry's message:
      #   1. GET $ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org
      #      (Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN)
      #   2. POST https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/<escaped name>
      #      (Authorization: Bearer <GitHub id token>, no body)
      # It prints the id token's identity claims (repository, workflow ref,
      # environment) -- the fields npm's trusted-publisher match compares --
      # but never either token: both are masked the moment they exist, a
      # success body (which carries the npm token) is never echoed, and an
      # error body is reduced to a fixed field allowlist.
      - name: Preflight the npm OIDC token exchange
        if: steps.npmver.outputs.published != 'true'
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::No GitHub OIDC request variables -- the job lacks 'permissions: id-token: write'."
            exit 1
          fi
          resp="$(curl -sS -w '\n%{http_code}' \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            -H "Accept: application/json" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")"
          code="${resp##*$'\n'}"
          body="${resp%$'\n'*}"
          if [ "$code" != "200" ]; then
            echo "::error::GitHub OIDC id-token request failed: HTTP ${code}"
            jq -c '{error, message, code}' <<<"$body" 2>/dev/null || echo "(non-JSON body withheld)"
            exit 1
          fi
          id_token="$(jq -r '.value // empty' <<<"$body")"
          if [ -z "$id_token" ]; then
            echo "::error::GitHub OIDC response had no id token"
            exit 1
          fi
          echo "::add-mask::${id_token}"
          claims="$(cut -d. -f2 <<<"$id_token" | tr '_-' '/+')"
          while [ $(( ${#claims} % 4 )) -ne 0 ]; do claims="${claims}="; done
          echo "id-token claims npm matches against the trusted publisher:"
          base64 -d <<<"$claims" 2>/dev/null \
            | jq '{aud, repository, repository_owner, workflow_ref, job_workflow_ref, environment, ref, event_name, repository_visibility}' \
            || echo "(claims not decodable)"

          url="https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@anvailabs%2fproximadb-client"
          resp="$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer ${id_token}" \
            -H "Accept: application/json" \
            "$url")"
          code="${resp##*$'\n'}"
          body="${resp%$'\n'*}"
          npm_token="$(jq -r '.token // empty' <<<"$body" 2>/dev/null || true)"
          if [ -n "$npm_token" ]; then
            echo "::add-mask::${npm_token}"
          fi
          if [ "${code:0:1}" != "2" ] || [ -z "$npm_token" ]; then
            echo "::error::npm OIDC token exchange refused: HTTP ${code} from POST ${url}"
            # A fixed allowlist, never "the body minus .token": a renamed token
            # field would otherwise be printed. A non-JSON body is withheld.
            jq -c '{error, message, code, reason}' <<<"$body" 2>/dev/null \
              || echo "(non-JSON response body withheld)"
            echo "::error::Compare the claims above with 'npm trust list @anvailabs/proximadb-client' (repository, workflow file release.yml, environment npm)."
            exit 1
          fi
          echo "npm OIDC exchange OK (HTTP ${code}); npm will repeat it inside 'npm publish'."

      - name: Publish to npm via OIDC
        if: steps.npmver.outputs.published != 'true'
        working-directory: clients/nodejs-embedded
        env:
          # A fresh, EMPTY user config (created below) instead of /dev/null.
          # npm keeps the exchanged token in memory -- oidc.js sets
          # `opts["//registry.npmjs.org/:_authToken"]` and
          # `config.set(..., 'user')`, and config.set() only mutates the
          # in-memory layer -- so neither choice blocks it; but a real empty
          # file guarantees no `_authToken` line from anywhere (setup-node no
          # longer writes one: see "Setup Node") and stays writable if npm
          # ever persists to the user layer.
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npmrc-oidc
          npm_config_registry: https://registry.npmjs.org/
        run: |
          : > "$NPM_CONFIG_USERCONFIG"
          # --loglevel verbose prints oidc.js's own messages (the exchange's
          # failure reason is logged ONLY at verbose).
          npm publish --access public --provenance --loglevel verbose

      - name: Verify the registry actually has this version
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          for attempt in 1 2 3 4 5 6; do
            if curl -sf -A "proximadb-release" \
              "https://registry.npmjs.org/@anvailabs%2fproximadb-client" \
              | grep -q "\"${VERSION}\""; then
              echo "npm: @anvailabs/proximadb-client ${VERSION} live"
              exit 0
            fi
            sleep 20
          done
          echo "::error::${VERSION} not on npm after publish"
          exit 1

  # ============================================================================
  # UPDATE HOMEBREW FORMULA - macOS package manager
  # ============================================================================
  update-homebrew:
    timeout-minutes: 30
    name: Update Homebrew Formula
    needs: [prepare, create-release]
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.dry_run != 'true' && needs.prepare.outputs.prerelease != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate Homebrew Formula
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          cat << EOF > proximadb.rb
          class Proximadb < Formula
            desc "Multi-model vector database for AI applications"
            homepage "https://github.com/${{ github.repository }}"
            version "$VERSION"
            license "Apache-2.0"

            on_macos do
              on_intel do
                url "https://github.com/${{ github.repository }}/releases/download/v$VERSION/proximadb-$VERSION-x86_64-apple-darwin.tar.gz"
                # sha256 will be updated after release
              end
              on_arm do
                url "https://github.com/${{ github.repository }}/releases/download/v$VERSION/proximadb-$VERSION-aarch64-apple-darwin.tar.gz"
                # sha256 will be updated after release
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/${{ github.repository }}/releases/download/v$VERSION/proximadb-$VERSION-x86_64-unknown-linux-gnu.tar.gz"
                # sha256 will be updated after release
              end
              on_arm do
                url "https://github.com/${{ github.repository }}/releases/download/v$VERSION/proximadb-$VERSION-aarch64-unknown-linux-gnu.tar.gz"
                # sha256 will be updated after release
              end
            end

            def install
              bin.install "proximadb-server"
              bin.install "proximadb-bench"
              bin.install "proximadb-migrate"
              etc.install "config" => "proximadb"
            end

            service do
              run [opt_bin/"proximadb-server", "--config", etc/"proximadb/config.toml"]
              keep_alive true
              working_dir var/"proximadb"
              log_path var/"log/proximadb.log"
              error_log_path var/"log/proximadb.error.log"
            end

            test do
              system bin/"proximadb-server", "--version"
            end
          end
          EOF

      - name: Upload Homebrew Formula
        uses: actions/upload-artifact@v7
        with:
          name: homebrew-formula
          path: proximadb.rb
          retention-days: 30

  # ============================================================================
  # DRY RUN SUMMARY - Report when running in dry-run mode
  # ============================================================================
  # This job provides a comprehensive summary when running in dry-run mode.
  # It shows what WOULD happen during a real release without actually publishing.
  # ============================================================================
  dry-run-summary:
    timeout-minutes: 30
    name: Dry Run Summary
    needs: [prepare, build-binaries, build-sdist, build-rpm, build-deb, build-msi, validate-artifacts]
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.dry_run == 'true'
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate Dry Run Report
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          PRERELEASE="${{ needs.prepare.outputs.prerelease }}"
          VALIDATION="${{ needs.validate-artifacts.outputs.validation_passed }}"

          echo ""
          echo "============================================================"
          echo "          DRY RUN COMPLETE - NO PUBLISHING OCCURRED         "
          echo "============================================================"
          echo ""
          echo "  Version:           $VERSION"
          echo "  Pre-release:       $PRERELEASE"
          echo "  Validation Passed: $VALIDATION"
          echo ""
          echo "============================================================"
          echo "                      ARTIFACT SUMMARY                       "
          echo "============================================================"
          echo ""

          # Count artifacts
          BINARY_COUNT=$(find artifacts -name "proximadb-*.tar.gz" -o -name "proximadb-*.zip" | grep -v sha256 | wc -l)
          CHECKSUM_COUNT=$(find artifacts -name "*.sha256" | wc -l)
          WHEEL_COUNT=$(find artifacts -name "*.whl" | wc -l)
          SDIST_COUNT=$(find artifacts -path "*/sdist/*.tar.gz" | wc -l)
          RPM_COUNT=$(find artifacts -name "*.rpm" | wc -l)
          DEB_COUNT=$(find artifacts -name "*.deb" | wc -l)
          MSI_COUNT=$(find artifacts -name "*.msi" | wc -l)

          echo "  Binary archives:     $BINARY_COUNT"
          echo "  Checksum files:      $CHECKSUM_COUNT"
          echo "  Python wheels:       $WHEEL_COUNT"
          echo "  Source distributions: $SDIST_COUNT"
          echo "  Platform packages:   RPM=$RPM_COUNT, DEB=$DEB_COUNT, MSI=$MSI_COUNT"
          echo ""

          # Calculate total size (binaries, wheels, platform packages)
          TOTAL_SIZE=$(find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.whl" -o -name "*.rpm" -o -name "*.deb" -o -name "*.msi" \) -exec du -ch {} + | tail -1 | cut -f1)
          echo "  Total artifact size: $TOTAL_SIZE"
          echo ""

          echo "============================================================"
          echo "                  WHAT WOULD HAVE HAPPENED                  "
          echo "============================================================"
          echo ""

          if [ "$VALIDATION" = "true" ]; then
            echo "  [OK] Artifact validation passed"
            echo ""

            if [ "$PRERELEASE" = "true" ]; then
              echo "  WOULD PUBLISH TO:"
              echo "    - GitHub Releases (pre-release: true)"
              echo "    - TestPyPI (release-python.yml, same tag)"
              echo ""
              echo "  WOULD NOT PUBLISH TO:"
              echo "    - PyPI, crates.io, npm (stable releases only)"
            else
              echo "  WOULD PUBLISH TO (all at version $VERSION, ONE tag v$VERSION):"
              echo "    - GitHub Releases (pre-release: false)"
              echo "    - crates.io (https://crates.io/crates/proximadb-sdk)"
              echo "    - npm (https://www.npmjs.com/package/@anvailabs/proximadb-client)"
              echo "    - PyPI proximadb + proximadb_embedded (release-python.yml, same tag)"
              echo ""
              echo "  WOULD ALSO:"
              echo "    - Generate Homebrew formula"
              echo "    - Verify package installations"
            fi
          else
            echo "  [FAIL] Artifact validation failed"
            echo ""
            echo "  WOULD NOT PUBLISH:"
            echo "    - Publishing blocked due to validation failure"
            echo "    - Review validation output above to identify missing artifacts"
          fi

          echo ""
          echo "============================================================"
          echo "                      NEXT STEPS                            "
          echo "============================================================"
          echo ""
          echo "  To perform an actual release:"
          echo ""
          echo "  1. Review artifacts above to confirm everything is correct"
          echo "  2. Re-run workflow with dry_run: false"
          echo "     OR push a version tag: git tag v$VERSION && git push origin v$VERSION"
          echo ""
          echo "============================================================"

      - name: Generate Summary
        run: |
          echo "## Dry Run Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.prepare.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Pre-release:** ${{ needs.prepare.outputs.prerelease }}" >> $GITHUB_STEP_SUMMARY
          echo "**Validation:** ${{ needs.validate-artifacts.outputs.validation_passed }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### No Publishing Occurred" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This was a **dry run**. All artifacts were built and validated, but nothing was published." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To perform an actual release, re-run this workflow with \`dry_run: false\` or push a version tag." >> $GITHUB_STEP_SUMMARY

      - name: Fail if Validation Failed
        if: needs.validate-artifacts.outputs.validation_passed != 'true'
        run: |
          echo "::warning::Dry run completed but validation failed. Fix issues before real release."
          exit 1

  # ============================================================================
  # POST-RELEASE VERIFICATION
  # ============================================================================
  verify-release:
    timeout-minutes: 30
    name: Verify Release
    # `publish-npm` is in `needs` on purpose. It was absent, so this job neither
    # waited for npm nor checked it -- and on v0.4.0 it reported SUCCESS while
    # the npm publish had failed with a 404. A failed dependency now skips this
    # job instead, which is honest; a green "Verify Release" over a broken
    # registry is the one outcome that must not happen.
    needs: [prepare, publish-crates, publish-npm, validate-artifacts]
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.dry_run != 'true' && needs.prepare.outputs.prerelease != 'true' && needs.validate-artifacts.outputs.validation_passed == 'true'
    steps:
      # Registry APIs, not `pip install` / `cargo install`. The previous steps
      # could not fail: every command ended in `|| echo ...` or `|| true`, so a
      # missing package printed a note and the step went green. They also
      # verified the wrong things -- PyPI is published by release-python.yml,
      # not here, and `cargo install proximadb-sdk` installs a LIBRARY crate, so
      # the `proximadb-server --version` that followed could never have worked.
      #
      # Querying the registries directly also drops the Python and Rust
      # toolchain setup this job used to need.
      - name: Verify the registries actually serve this version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -uo pipefail

          # crates.io REQUIRES a User-Agent and errors without one, which looks
          # exactly like "version missing" if you do not know to set it.
          UA='proximadb-release-verify (+https://github.com/anvai-labs/proximaDB)'

          check() {
            name="$1"; url="$2"; needle="$3"
            for attempt in 1 2 3 4 5 6 7 8; do
              body="$(curl -sSL -A "$UA" "$url" 2>/dev/null || true)"
              if printf '%s' "$body" | grep -q -- "$needle"; then
                echo "  OK   ${name}: ${VERSION} is live"
                return 0
              fi
              echo "  ...  ${name}: ${VERSION} not visible yet (attempt ${attempt}/8)"
              sleep 20
            done
            echo "::error::${name} does not serve ${VERSION} after ~160s of propagation time"
            return 1
          }

          rc=0
          check "crates.io proximadb-sdk" \
                "https://crates.io/api/v1/crates/proximadb-sdk" \
                "\"num\":\"${VERSION}\"" || rc=1
          check "npm @anvailabs/proximadb-client" \
                "https://registry.npmjs.org/@anvailabs%2fproximadb-client" \
                "\"${VERSION}\"" || rc=1

          if [ "$rc" -ne 0 ]; then
            echo "::error::release verification FAILED -- at least one registry is missing ${VERSION}"
            exit 1
          fi
          echo "All registries serve ${VERSION}."

  # ============================================================================
  # RELEASE SMOKE - evidence that the PUBLISHED artifacts are QA-based and work
  # ============================================================================
  # `verify-release` only proves crates.io and npm LIST the version. This calls
  # release-smoke.yml, which installs every published artifact from its registry
  # (Docker Hub, GitHub Release binary, PyPI x2, npm, crates.io, Homebrew tap),
  # exercises it against a live server, and proves the tag is a QA-proven
  # qa->main merge. It is a `workflow_call`, not a `workflow_run`, on purpose: a
  # red smoke must turn THIS run red, and a workflow_run would leave it green.
  # PyPI is published by release-python.yml in parallel, so the registry wait is
  # long (150 min) and bounded.
  release-smoke:
    name: Release Smoke (evidence)
    needs: [prepare, create-release, verify-release]
    if: needs.prepare.outputs.dry_run != 'true' && needs.prepare.outputs.prerelease != 'true'
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/release-smoke.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      registry_wait_minutes: '150'

  # ============================================================================
  # CLEANUP - Remove old artifacts
  # ============================================================================
  # Cleanup runs after all publishing jobs complete (success or failure).
  # Artifacts are retained for 7 days anyway, but this helps clean up early.
  # In dry-run mode, artifacts are still cleaned up after the summary.
  # ============================================================================
  cleanup:
    timeout-minutes: 30
    name: Cleanup Old Artifacts
    needs: [prepare, validate-artifacts, create-release, publish-crates, dry-run-summary]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Cleanup Summary
        run: |
          echo "Cleanup triggered"
          echo "  Dry run: ${{ needs.prepare.outputs.dry_run }}"
          echo "  Validation: ${{ needs.validate-artifacts.outputs.validation_passed }}"

      - name: Delete Workflow Artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            binaries-*
            wheel-*
            embedded-wheel-*
            sdist
            rpm-package
            deb-package
            dmg-installer
            msi-installer
          failOnError: false
