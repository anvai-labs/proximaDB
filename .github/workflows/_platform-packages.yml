# =============================================================================
# ProximaDB Platform Packages Workflow (Reusable)
# =============================================================================
# Builds platform-specific packages (RPM, DEB, DMG, MSI)
# =============================================================================

name: Platform Packages

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to build'
        required: true
        type: string
      cache-key:
        description: 'Cache key to locate binary artifacts'
        required: true
        type: string
      upload-artifacts:
        description: 'Whether to upload as workflow artifacts'
        required: false
        type: boolean
        default: true
    outputs:
      rpm-built:
        description: 'Number of RPM packages built'
        value: ${{ jobs.build-rpm.outputs.built }}
      deb-built:
        description: 'Number of DEB packages built'
        value: ${{ jobs.build-deb.outputs.built }}
      dmg-built:
        description: 'Number of DMG installers built'
        value: ${{ jobs.build-dmg.outputs.built }}
      msi-built:
        description: 'Number of MSI installers built'
        value: ${{ jobs.build-msi.outputs.built }}

permissions:
  contents: read
  actions: write

jobs:
  # ============================================================================
  # BUILD RPM
  # ============================================================================
  build-rpm:
    name: Build RPM Package
    runs-on: ubuntu-22.04
    # NO green history: `workflow_call` reusable workflow with zero recorded
    # runs. Peer: release.yml's own `Build RPM Package` -- the same fpm recipe
    # over a prebuilt binary, fpm install included -- max 1.2 min green step
    # span over 60 runs since 2026-02-20 (5 green). Nothing here compiles.
    # 1.5x is under the 15-min floor, so the floor applies.
    timeout-minutes: 15
    outputs:
      built: ${{ steps.build.outputs.success }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore Binary from Cache
        uses: actions/cache/restore@v6
        id: restore
        with:
          path: binary-cache/
          key: binaries-${{ inputs.cache-key }}-x86_64-unknown-linux-gnu
          restore-keys: |
            binaries-${{ inputs.cache-key }}-

      - name: Download Binary if Cache Miss
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v8
        with:
          name: binaries-x86_64-unknown-linux-gnu
          path: binary-cache/

      - name: Install fpm
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install fpm

      - name: Build RPM
        id: build
        run: |
          VERSION="${{ inputs.version }}"
          mkdir -p rpm_build/usr/bin
          mkdir -p rpm_build/etc/proximadb
          mkdir -p rpm_build/usr/lib/systemd/system
          mkdir -p rpm_build/var/lib/proximadb
          mkdir -p rpm_build/var/log/proximadb

          # Extract from cache or downloaded artifact
          if [ -f "binary-cache/proximadb-*.tar.gz" ]; then
            tar -xzf binary-cache/proximadb-*.tar.gz -C rpm_build/usr/bin --strip-components=1
          fi
          cp -r config/* rpm_build/etc/proximadb/
          cp deploy/packaging/systemd/proximadb.service rpm_build/usr/lib/systemd/system/

          fpm -s dir -t rpm \
            -n proximadb \
            -v "$VERSION" \
            --epoch 1 \
            --description "ProximaDB - Cloud-native vector database" \
            --url "https://github.com/anvai-labs/proximaDB" \
            --license "Apache-2.0" \
            --vendor "ProximaDB" \
            --rpm-dist "el8" \
            --after-install deploy/packaging/scripts/postinstall.sh \
            --before-remove deploy/packaging/scripts/preremove.sh \
            rpm_build/=/

          echo "success=true" >> $GITHUB_OUTPUT

      - name: Upload RPM Artifact
        if: inputs.upload-artifacts == 'true' && steps.build.outputs.success == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: rpm-package
          path: "*.rpm"
          retention-days: 7

      - name: Save to Cache
        if: steps.build.outputs.success == 'true'
        uses: actions/cache/save@v6
        with:
          path: "*.rpm"
          key: rpm-${{ inputs.cache-key }}-${{ github.run_id }}

  # ============================================================================
  # BUILD DEB
  # ============================================================================
  build-deb:
    name: Build DEB Package
    runs-on: ubuntu-22.04
    # NO green history (reusable workflow, zero recorded runs). Peer:
    # release.yml `Build DEB Package`, max 1.0 min green step span over 60 runs
    # since 2026-02-20 (5 green). Floor applies.
    timeout-minutes: 15
    outputs:
      built: ${{ steps.build.outputs.success }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore Binary from Cache
        uses: actions/cache/restore@v6
        id: restore
        with:
          path: binary-cache/
          key: binaries-${{ inputs.cache-key }}-x86_64-unknown-linux-gnu
          restore-keys: |
            binaries-${{ inputs.cache-key }}-

      - name: Download Binary if Cache Miss
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v8
        with:
          name: binaries-x86_64-unknown-linux-gnu
          path: binary-cache/

      - name: Install fpm
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install fpm

      - name: Build DEB
        id: build
        run: |
          VERSION="${{ inputs.version }}"
          mkdir -p deb_build/usr/bin
          mkdir -p deb_build/etc/proximadb
          mkdir -p deb_build/var/lib/proximadb
          mkdir -p deb_build/var/log/proximadb

          if [ -f "binary-cache/proximadb-*.tar.gz" ]; then
            tar -xzf binary-cache/proximadb-*.tar.gz -C deb_build/usr/bin --strip-components=1
          fi
          cp -r config/* deb_build/etc/proximadb/

          fpm -s dir -t deb \
            -n proximadb \
            -v "$VERSION" \
            --description "ProximaDB - Cloud-native vector database" \
            --url "https://github.com/anvai-labs/proximaDB" \
            --license "Apache-2.0" \
            --vendor "ProximaDB" \
            --deb-priority "optional" \
            --deb-systemd \
            --after-install deploy/packaging/scripts/postinstall.sh \
            --before-remove deploy/packaging/scripts/preremove.sh \
            deb_build/=/

          echo "success=true" >> $GITHUB_OUTPUT

      - name: Upload DEB Artifact
        if: inputs.upload-artifacts == 'true' && steps.build.outputs.success == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: deb-package
          path: "*.deb"
          retention-days: 7

      - name: Save to Cache
        if: steps.build.outputs.success == 'true'
        uses: actions/cache/save@v6
        with:
          path: "*.deb"
          key: deb-${{ inputs.cache-key }}-${{ github.run_id }}

  # ============================================================================
  # BUILD DMG
  # ============================================================================
  build-dmg:
    name: Build DMG Installer
    runs-on: macos-14
    # NO green history AND no peer: release.yml packages rpm/deb/msi but has no
    # DMG job, so there is no measured datum for this one anywhere. Cap from
    # the work: `brew install create-dmg` on macos-14 plus hdiutil over an
    # already-built binary -- no compilation. Set above the 15-min floor only
    # for the unmeasured Homebrew install. Re-measure once a caller exists.
    timeout-minutes: 20
    outputs:
      built: ${{ steps.build.outputs.success }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore Binaries from Cache
        uses: actions/cache/restore@v6
        id: restore
        with:
          path: binary-cache/
          key: binaries-darwin-${{ inputs.cache-key }}
          restore-keys: |
            binaries-${{ inputs.cache-key }}-

      - name: Download Binaries if Cache Miss
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*apple-darwin
          path: binary-cache
          merge-multiple: true

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        id: build
        run: |
          VERSION="${{ inputs.version }}"
          mkdir -p dmg_build/ProximaDB

          for tar in binary-cache/proximadb-*.tar.gz; do
            tar -xzf "$tar" 2>/dev/null || true
          done

          mkdir -p dmg_build/ProximaDB.app/Contents/MacOS
          mkdir -p dmg_build/ProximaDB.app/Contents/Resources

          if [ -f "proximadb-${VERSION}-aarch64-apple-darwin/proximadb-server" ]; then
            cp proximadb-${VERSION}-aarch64-apple-darwin/proximadb-server dmg_build/ProximaDB.app/Contents/MacOS/
            cp proximadb-${VERSION}-aarch64-apple-darwin/proximadb-bench dmg_build/ProximaDB.app/Contents/MacOS/
            cp proximadb-${VERSION}-aarch64-apple-darwin/proximadb-migrate dmg_build/ProximaDB.app/Contents/MacOS/
          elif [ -f "proximadb-${VERSION}-x86_64-apple-darwin/proximadb-server" ]; then
            cp proximadb-${VERSION}-x86_64-apple-darwin/proximadb-server dmg_build/ProximaDB.app/Contents/MacOS/
            cp proximadb-${VERSION}-x86_64-apple-darwin/proximadb-bench dmg_build/ProximaDB.app/Contents/MacOS/
            cp proximadb-${VERSION}-x86_64-apple-darwin/proximadb-migrate dmg_build/ProximaDB.app/Contents/MacOS/
          fi

          cat > dmg_build/ProximaDB.app/Contents/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>proximadb-server</string>
            <key>CFBundleIdentifier</key>
            <string>com.proximadb.server</string>
            <key>CFBundleName</key>
            <string>ProximaDB</string>
            <key>CFBundleVersion</key>
            <string>VERSION</string>
          </dict>
          </plist>
          EOF

          create-dmg \
            --volname "ProximaDB" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 185 \
            --icon "ProximaDB.app" 150 185 \
            "ProximaDB-${VERSION}.dmg" \
            dmg_build/

          echo "success=true" >> $GITHUB_OUTPUT

      - name: Upload DMG Artifact
        if: inputs.upload-artifacts == 'true' && steps.build.outputs.success == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dmg-installer
          path: "*.dmg"
          retention-days: 7

      - name: Save to Cache
        if: steps.build.outputs.success == 'true'
        uses: actions/cache/save@v6
        with:
          path: "*.dmg"
          key: dmg-${{ inputs.cache-key }}-${{ github.run_id }}

  # ============================================================================
  # BUILD MSI
  # ============================================================================
  build-msi:
    name: Build MSI Installer
    runs-on: windows-2022
    # NO green history (reusable workflow, zero recorded runs). Peer:
    # release.yml `Build MSI Installer` -- the same WiX recipe over a prebuilt
    # binary -- max 2.5 min green step span over 60 runs since 2026-02-20
    # (5 green). Floor applies.
    timeout-minutes: 15
    outputs:
      built: ${{ steps.build.outputs.success }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore Binary from Cache
        uses: actions/cache/restore@v6
        id: restore
        with:
          path: binary-cache/
          key: binaries-${{ inputs.cache-key }}-x86_64-pc-windows-msvc
          restore-keys: |
            binaries-${{ inputs.cache-key }}-

      - name: Download Binary if Cache Miss
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v8
        with:
          name: binaries-x86_64-pc-windows-msvc
          path: binary-cache/

      - name: Install WiX v4
        run: dotnet tool install --global wix --version 4.0.0

      - name: Extract Binaries
        run: |
          Expand-Archive -Path binary-cache\proximadb-*.zip -DestinationPath msi_build -Force

      - name: Build MSI
        id: build
        run: |
          $VERSION = "${{ inputs.version }}"
          wix build -o "proximadb-$VERSION.msi" deploy\packaging\wix\proximadb.wxs
          echo "success=true" >> $GITHUB_OUTPUT

      - name: Upload MSI Artifact
        if: inputs.upload-artifacts == 'true' && steps.build.outputs.success == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: msi-installer
          path: "*.msi"
          retention-days: 7

      - name: Save to Cache
        if: steps.build.outputs.success == 'true'
        uses: actions/cache/save@v6
        with:
          path: "*.msi"
          key: msi-${{ inputs.cache-key }}-${{ github.run_id }}
