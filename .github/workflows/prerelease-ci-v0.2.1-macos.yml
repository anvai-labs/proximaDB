name: Prerelease macOS v0.2.1 Notes

on:
  workflow_dispatch:

concurrency:
  # Dedup push+PR of the same branch into one group; cancel superseded
  # runs on feature/PR branches, but let protected-branch runs finish.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' && github.ref_name != 'develop' }}

# Least-privilege default GITHUB_TOKEN scope (CodeQL actions/missing-workflow-permissions).
# Read-only is sufficient: no job here writes to the repo, posts comments, or uses OIDC.
permissions:
  contents: read

jobs:
  notes:
    name: Documentation Notes
    runs-on: ubuntu-latest
    # NO green history: the 60 recorded runs (2026-02-22..2026-03-08) predate
    # this file being made parseable and produced no job at all. The job is two
    # `echo`s, so the 15-min floor is the cap.
    timeout-minutes: 15
    steps:
      - name: Explain usage
        run: |
          echo "This workflow file was previously documentation-only and caused CI parsing failures."
          echo "Use .github/workflows/prerelease-ci.yml for real prerelease automation."
