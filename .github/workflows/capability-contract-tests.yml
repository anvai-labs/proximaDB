# Capability Contract Tests
# NOTE: This workflow is DISABLED for v0.2.0 release
# The capability_contract_test.rs file is in tests/query/ subdirectory
# but Cargo test discovery expects tests to be directly in tests/ directory
# Re-enable after moving test file or fixing test discovery

name: Capability Contract Tests (DISABLED)

on:
  pull_request:
    paths:
      - 'src/storage/**'
      - 'src/query/capability/**'
      - 'src/errors/capability_error.rs'
      - 'src/query/validator.rs'
      - 'SUPPORTED_SURFACE.md'
  push:
    branches:
      - main
    paths:
      - 'src/storage/**'
      - 'src/query/capability/**'

concurrency:
  # Dedup push+PR of the same branch into one group; cancel superseded
  # runs on feature/PR branches, but let protected-branch runs finish.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' && github.ref_name != 'develop' }}

# Least-privilege default GITHUB_TOKEN scope (CodeQL actions/missing-workflow-permissions).
# Read-only is sufficient: no job here writes to the repo, posts comments, or uses OIDC.
permissions:
  contents: read

jobs:
  capability-contract-tests:
    name: Capability Contract Tests
    runs-on: ubuntu-latest
    # NO green history: `if: false` (disabled), so every run since 2026-09-07
    # records this job skipped, never green. Cap from the work --
    # `cargo test --test capability_contract_test` on a cold cache is one debug
    # build of the workspace, which ci.yml's own test jobs are capped at 60-120
    # min for. Re-measure when this job is re-enabled.
    timeout-minutes: 60
    if: false  # DISABLED - test file in wrong directory

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run capability contract tests
        run: |
          cargo test --test capability_contract_test --verbose

  capability-snapshot-check:
    name: Check Capability Snapshots
    runs-on: ubuntu-latest
    # NO green history (`if: false`, skipped in every run since 2026-09-07).
    # Same cold-cache workspace build as `capability-contract-tests` above;
    # re-measure when re-enabled.
    timeout-minutes: 60
    if: false  # DISABLED - test file in wrong directory

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Generate capability snapshots
        run: |
          cargo test --test capability_contract_test generate_snapshots -- --nocapture

      - name: Check for snapshot drift
        run: |
          git diff --exit-code snapshots/capabilities/ || {
            echo "❌ Capability snapshots have changed!"
            echo "Please run: ./scripts/generate_capability_snapshots.sh"
            echo "Then commit the updated snapshots."
            exit 1
          }

      - name: Check SUPPORTED_SURFACE.md consistency
        run: |
          if [ "SUPPORTED_SURFACE.md" != "$(git diff --name-only origin/main...HEAD | grep -q SUPPORTED_SURFACE.md && echo 'SUPPORTED_SURFACE.md' || echo '')" ]; then
            echo "⚠️ SUPPORTED_SURFACE.md should be updated when capabilities change"
          fi

  capability-matrix:
    name: Generate Capability Matrix
    runs-on: ubuntu-latest
    # NO green history (`if: false`, skipped in every run since 2026-09-07).
    # Same cold-cache workspace build as `capability-contract-tests` above;
    # re-measure when re-enabled.
    timeout-minutes: 60
    if: false  # DISABLED - test file in wrong directory

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Generate capability matrix
        run: |
          cargo test --test capability_contract_test generate_capability_matrix -- --nocapture | tee capability-matrix.txt

      - name: Upload capability matrix
        uses: actions/upload-artifact@v7
        with:
          name: capability-matrix
          path: capability-matrix.txt
          retention-days: 30
