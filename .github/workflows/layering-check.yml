name: Workspace Layering Check

on:
  push:
    branches: [ main, develop, qa, 'feature/**' ]
  pull_request:
    branches: [ main, develop, qa ]

concurrency:
  # Dedup push+PR of the same branch into one group; cancel superseded
  # runs on feature/PR branches, but let protected-branch runs finish.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' && github.ref_name != 'develop' }}

# Least-privilege default GITHUB_TOKEN scope (CodeQL actions/missing-workflow-permissions).
# Default read-only; the single job elevates only what it needs.
permissions:
  contents: read

jobs:
  layering-validation:
    name: Validate Workspace Layering
    runs-on: ubuntu-latest
    # max 0.3 min green step span over 60 runs since 2026-10-09 (57 green);
    # script guards only, no build. 1.5x is under the 15-min floor, so the
    # floor applies.
    timeout-minutes: 15
    permissions:
      contents: read        # checkout
      pull-requests: write  # "Post results to PR (on failure)" via actions/github-script

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    # The human drives the code, not the agents: block AI-agent authorship
    # attribution (co-author trailers, "Generated with ...", robot emoji, agent
    # signatures) in the PR title/body. The repo squash-merges, so the PR
    # title/body IS the commit message that lands on the branch — that is the
    # surface to enforce. Per-commit messages are checked locally by the
    # `.githooks/commit-msg` hook; CI does NOT scan the commit range, since on a
    # promotion PR that range contains pre-policy historical commits and would
    # block the merge over messages that never land.
    - name: Block AI-agent attribution (PR title/body)
      if: github.event_name == 'pull_request'
      env:
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BODY: ${{ github.event.pull_request.body }}
      run: |
        printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | python3 scripts/check_no_agent_attribution.py --stdin

    - name: Run layering validation
      run: |
        chmod +x scripts/check-layering.sh
        ./scripts/check-layering.sh

    - name: Run deterministic commit contract
      run: python3 scripts/check_deterministic_commit_contract.py

    # SaaS mandate (CLAUDE.md/AGENTS.md): object-store writes must go through
    # DrPathBuilder. Fails on NEW raw `data/{tenant}/{ns}/...` construction;
    # known, tracked bypasses warn but do not block (run with --strict to gate them).
    - name: Run tenant-path guard (DrPathBuilder mandate)
      run: python3 scripts/check_tenant_path_guard.py

    - name: Run tenant ingress contract guard
      run: python3 scripts/check_tenant_ingress_contract.py

    # TD-CAT-7: `Catalog::create_table` is a provided method carrying the
    # identity post-condition (an authority may not create a table with no
    # object_id — authorization keys on it). Rust has no `final`, so this guard
    # is the seal: backends implement `create_table_inner`, never `create_table`.
    - name: Run catalog seal guard (TD-CAT-7)
      run: python3 scripts/check_catalog_seal.py

    # OSS/enterprise boundary: fails on NEW commercial leaks (pricing/billing/
    # control-plane refs) in non-gated engine code. Known debt is tracked (warn).
    # See docs/12-design/OSS_ENTERPRISE_BOUNDARY_2026_06_17.adoc.
    - name: Run OSS/enterprise boundary guard
      run: python3 scripts/check_oss_boundary.py

    # Billing-never-gated: the perf io-trace emission is gateable (TD-160) but the
    # per-tenant billing meters + observer must stay always-on (ADR-027/ADR-030
    # non-entanglement). Fails if any consumption_metrics symbol or the billing
    # observer is wrapped in cfg(feature = "io-trace").
    - name: Run billing-never-gated guard
      run: python3 scripts/check_billing_never_gated.py

    - name: Report violations
      if: failure()
      run: |
        echo "## Layering Violations Detected" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Run \`python3 scripts/check_workspace_boundaries.py --strict\` locally and review the workspace refactor plan plus ADR-001." >> $GITHUB_STEP_SUMMARY
        echo "For storage decomposition regressions, run \`python3 scripts/check_workspace_boundaries.py --storage-up-edges --max-storage-up-edges 271\` and lower the max when your branch removes edges." >> $GITHUB_STEP_SUMMARY

    - name: Post results to PR (on failure)
      if: failure() && github.event_name == 'pull_request'
      uses: actions/github-script@v9
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.name,
            body: `## Layering Violations Detected

            The workspace layering validation check failed. Please fix the violations before merging.

            **What to check:**
            - Run \`./scripts/check-layering.sh\` locally
            - Run \`python3 scripts/check_workspace_boundaries.py --strict\` directly for the canonical checker
            - Run \`python3 scripts/check_workspace_boundaries.py --storage-up-edges --max-storage-up-edges 271\` for the Slice-D storage decomposition ratchet
            - Review [Workspace Refactor Plan](https://github.com/${context.repo.owner}/${context.repo.name}/blob/main/roadmap/techdebt/WORKSPACE_REFACTOR_PLAN_2026_05_07.adoc)
            **Golden Rule:** Lower layers must not depend on higher layers.

            This check enforces the workspace boundary table used by the refactor plan.`
          })
