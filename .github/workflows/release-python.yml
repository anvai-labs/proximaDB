# Release workflow for the ProximaDB Python packages — independent of the binary/crates
# `release.yml` (which owns `v*` tags). Follows the per-package tag convention used across
# the workspace (`sdk-v*`, `victor-codegraph-v*`).
#
# Publishes TWO separate PyPI projects from ONE release event (the right shape: the pure
# SDK is a universal wheel, the embedded engine is native PyO3 wheels — they cannot be one
# distribution):
#   - proximadb           pure-Python client SDK (clients/python)      universal wheel + sdist
#   - proximadb_embedded  native in-process engine (root maturin pkg)  platform wheels + sdist
#
# Triggers:
#   - Push tag: python-v*  (e.g. python-v0.2.0)
#   - Manual dispatch (dry_run to build without publishing; publish_testpypi for a TestPyPI run)
#
# Publishing uses PyPI Trusted Publishing (OIDC) — NO API token secret. Configure one
# trusted publisher PER PyPI project (one-time):
#   https://pypi.org/manage/account/publishing/ -> add a GitHub publisher with
#     owner=anvai-labs  repo=proximaDB  workflow=release-python.yml  environment=pypi
#   Repeat for projects `proximadb` and `proximadb_embedded` (and environment `testpypi`).
# TestPyPI is advisory/optional (continue-on-error) — PyPI never waits on it.

name: Release Python

on:
  push:
    tags:
      - 'python-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build only, do not publish'
        required: false
        default: false
        type: boolean
      publish_testpypi:
        description: 'Publish to TestPyPI (advisory)'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.12'

jobs:
  # ---- Pure-Python SDK: proximadb (universal wheel + sdist) --------------------------
  build-sdk:
    name: Build SDK (proximadb)
    runs-on: ubuntu-latest
    # max 0.4 min green step span over 16 runs since 2026-07-06 (16 green);
    # pure-Python wheel. 1.5x is under the 15-min floor, so the floor applies.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build wheel + sdist
        working-directory: clients/python
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --outdir dist
          twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: sdk-dist
          path: clients/python/dist/*

  # ---- Native engine: proximadb_embedded (platform wheels via maturin) ---------------
  build-embedded-wheels:
    name: Build embedded wheels (${{ matrix.os }} ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # Slowest leg governs: max 59 min green step span (`windows-2022 x86_64`),
    # then `macos-14 aarch64` at 53 min, over 16 runs since 2026-07-06 (3-5
    # green per leg). 1.5x of 59 -> 90. Legs measured under their EXPANDED
    # names; the pre-rename `(x86_64)`/`(aarch64)` spellings in the API are the
    # same legs under the older `name:` template and are included.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # proximadb_embedded links the full Rust engine. It is unix-native (the
        # storage layer uses unix syscalls + memmap2), so Linux AND macOS build;
        # only Windows is blocked (proximadb-storage-common: no MSVC port —
        # std::os::unix / libc / mmap across dozens of files; tracked as an
        # engine-portability effort in TD-EMBED-1, NOT a build-config fix).
        # Each target builds NATIVELY on its own runner (no cross-toolchain):
        # the engine's C deps (aws-lc-sys rustls crypto, vendored OpenSSL) don't
        # cross-compile cleanly, but compile the same way natively per-arch.
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
          # Native ARM runner (not cross-compile): the engine's C deps —
          # aws-lc-sys (rustls crypto) and vendored OpenSSL — fail to
          # cross-compile to aarch64 (aws-lc bcm.c under aarch64-gcc). Building
          # natively on an ARM runner compiles them the same way x86_64 does,
          # avoiding the cross-toolchain entirely.
          - os: ubuntu-24.04-arm
            target: aarch64
            manylinux: auto
          # macOS aarch64 (Apple Silicon) — native arm64 runner. Intel macOS is
          # intentionally NOT built: Apple ships only Apple-Silicon hardware, so
          # x86_64-apple-darwin is no longer a produced target. Watch for the ring
          # 0.17.x aarch64 CAPS_STATIC const-assertion (documented on the macos-14
          # runner in ci.yml's GPU job); fail-fast:false keeps the Linux wheels
          # flowing if it bites, and it surfaces as its own portability follow-up.
          - os: macos-14
            target: aarch64
          # Windows x86_64 (MSVC). Enabled after the windows-compile-ratchet
          # (TD-EMBED-1) proved the whole engine + `python` feature + C-deps
          # compile on x86_64-pc-windows-msvc: two small #[cfg(unix)] gates
          # (memmap2::Advice #800, Unix-domain sockets #808) were the only
          # blockers. Pinned to windows-2022 to match the ratchet-proven env —
          # the runner ships NASM + Strawberry Perl, so openssl/vendored's
          # openssl-src build (VC-WIN64A) works without extra setup.
          - os: windows-2022
            target: x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Build the native `proximadb_embedded` wheel from the ROOT maturin package.
      # (The crate's abi3 setting governs how many Python versions one wheel covers.)
      - name: Build wheels (maturin)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || '' }}
          args: --release --out dist --features python
          # `openssl/vendored` (enabled by the python feature — openssl-sys is
          # transitive via sqlx/reqwest) builds OpenSSL from source inside the
          # manylinux container. openssl-src's Configure needs Perl's IPC::Cmd,
          # which the stock manylinux2014 image lacks. Install it (yum or dnf,
          # whichever the image ships) before the build. Linux-only hook; macOS/
          # Windows system Perl already carries these modules.
          before-script-linux: |
            # perl-core = the full Perl stdlib (IPC::Cmd, Time::Piece,
            # Data::Dumper, Getopt::Long, File::Compare … all of which
            # openssl 3.x's Configure needs). Verified in the manylinux2014
            # container that perl-core supplies every module the build requires.
            if command -v yum >/dev/null 2>&1; then
              yum install -y perl-core
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y perl-core
            elif command -v microdnf >/dev/null 2>&1; then
              microdnf install -y perl-core
            fi
      - uses: actions/upload-artifact@v7
        with:
          name: embedded-wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  build-embedded-sdist:
    name: Build embedded sdist (proximadb_embedded)
    runs-on: ubuntu-latest
    # max 1.5 min green step span over 16 runs since 2026-07-06 (16 green);
    # `maturin sdist` does not compile. Floor applies.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist (maturin, root package)
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: embedded-sdist
          path: dist/*.tar.gz

  # ---- Wheel smoke test (gates publish) ----------------------------------------------
  # The wheel was unbuildable for months without any signal (#1675): the
  # vendored-openssl feature was deleted in the #1021 crate extraction, the
  # jobs in other workflows were commented out behind a stale note, and the
  # only run that would have caught it was the tag push itself. This job makes
  # "the wheel installs and the engine answers" a precondition of publishing —
  # a broken wheel now fails HERE, not in a consumer's pip install.
  test-embedded-wheels:
    name: Smoke test embedded wheel (${{ matrix.os }})
    needs: [build-embedded-wheels]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: macos-14
            target: aarch64
    runs-on: ${{ matrix.os }}
    # max 0.1 min green step span over 16 runs since 2026-07-06 (1 green per
    # leg); installs the built wheel and imports it. Floor applies.
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: embedded-wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist
      - name: Install wheel
        shell: bash
        run: python -m pip install dist/*.whl
      - name: In-process engine answers a graph + vector roundtrip
        shell: bash
        run: |
          python - <<'PY'
          import tempfile

          import proximadb_embedded as pe

          db = pe.ProximaDB(data_dirs=tempfile.mkdtemp())
          db.create_graph("smoke", None)
          db.create_nodes(
              "smoke",
              [
                  pe.GraphNode("a", ["Fn"], {"name": "alpha"}),
                  pe.GraphNode("b", ["Fn"], {"name": "beta"}),
              ],
          )
          # GraphEdge signature: (from_node_id, to_node_id, edge_type, id=..)
          db.create_edges("smoke", [pe.GraphEdge("a", "b", "CALLS", id="e1")])
          out = db.get_outgoing_edges("smoke", "a", None)
          assert len(out) == 1 and out[0].to_node_id == "b", out
          inc = db.get_incoming_edges("smoke", "b", None)
          assert len(inc) == 1 and inc[0].from_node_id == "a", inc
          stats = db.graph_stats("smoke")
          assert stats.total_edges == 1, stats

          # Typed property round-trip (#1698): scalars must keep their Python
          # types across write -> engine -> read. Before the fix every value
          # was stringified at the boundary ("line": 42 stored as "42"), the
          # engine's numeric property index stayed empty, and Array/Object
          # properties were silently dropped on read.
          db.create_nodes(
              "smoke",
              [pe.GraphNode("typed", ["Fn"], {
                  "line": 42,
                  "score": 0.5,
                  "flag": True,
                  "name": "alpha",
                  "tags": ["a", "b"],
              })],
          )
          got = db.get_node("smoke", "typed").properties
          assert got["line"] == 42 and isinstance(got["line"], int), got
          assert got["score"] == 0.5 and isinstance(got["score"], float), got
          assert got["flag"] is True, got
          assert got["name"] == "alpha", got
          assert got["tags"] == ["a", "b"], got
          # Typed equality filter must match a typed stored value.
          hits = db.query_nodes("smoke", None, {"line": 42}, None, None)
          assert [n.id for n in hits] == ["typed"], [n.id for n in hits]
          print("wheel smoke OK: graph + typed-property roundtrip on", pe.__file__)
          PY

  # ---- TestPyPI (advisory/optional) --------------------------------------------------
  publish-testpypi:
    name: Publish to TestPyPI (advisory)
    needs: [build-sdk, build-embedded-wheels, build-embedded-sdist, test-embedded-wheels]
    if: ${{ github.event.inputs.dry_run != 'true' && (github.event.inputs.publish_testpypi == 'true' || startsWith(github.ref, 'refs/tags/python-v')) }}
    continue-on-error: true
    runs-on: ubuntu-latest
    # max 0.2 min green step span over 16 runs since 2026-07-06 (1 green);
    # upload only. Floor applies. Bounding this matters more than the duration
    # suggests: an unbounded publish job holds the `pypi` deployment
    # environment for up to GitHub's 6h default.
    timeout-minutes: 15
    environment:
      name: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: staging
      - name: Stage all distributions
        run: |
          mkdir -p dist
          find staging -name '*.whl' -exec cp {} dist/ \;
          find staging -name '*.tar.gz' -exec cp {} dist/ \;
          ls -la dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # ---- PyPI (authoritative): proximadb SDK ------------------------------------------
  publish-sdk-pypi:
    name: Publish proximadb (SDK) to PyPI
    needs: [build-sdk]
    if: ${{ github.event.inputs.dry_run != 'true' && startsWith(github.ref, 'refs/tags/python-v') && !contains(github.ref, 'alpha') && !contains(github.ref, 'beta') && !contains(github.ref, 'rc') }}
    runs-on: ubuntu-latest
    # max 0.3 min green step span over 16 runs since 2026-07-06 (3 green);
    # upload only. Floor applies.
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/proximadb/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sdk-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true

  # ---- PyPI (authoritative): proximadb_embedded native package ----------------------
  publish-embedded-pypi:
    name: Publish proximadb_embedded to PyPI
    needs: [build-embedded-wheels, build-embedded-sdist, test-embedded-wheels]
    if: ${{ github.event.inputs.dry_run != 'true' && startsWith(github.ref, 'refs/tags/python-v') && !contains(github.ref, 'alpha') && !contains(github.ref, 'beta') && !contains(github.ref, 'rc') }}
    runs-on: ubuntu-latest
    # max 0.4 min green step span over 16 runs since 2026-07-06 (1 green);
    # upload only. Floor applies.
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/proximadb-embedded/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: staging
      - name: Stage embedded wheels + sdist
        run: |
          mkdir -p dist
          find staging -path '*embedded-wheels*' -name '*.whl' -exec cp {} dist/ \;
          find staging -path '*embedded-sdist*' -name '*.tar.gz' -exec cp {} dist/ \;
          ls -la dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true
