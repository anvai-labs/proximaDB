name: CI

on:
  push:
    branches: [main, development, develop, qa]
  pull_request:
    branches: [main, development, develop, qa]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test jobs'
        required: false
        type: boolean
        default: false
      run_benchmarks:
        description: 'Run performance benchmarks'
        required: false
        type: boolean
        default: false

concurrency:
  # Dedup push+PR of the same branch into one group; cancel superseded runs
  # on feature/PR branches, but let protected-branch validation finish.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  # Exempt promotion surfaces (push to qa; PRs targeting qa or main) in addition
  # to main/develop pushes. A develop->qa promotion PR with head=develop lands in
  # the SAME group as develop pushes, so with cancel-in-progress:true every
  # feat->develop synchronize killed the in-flight promotion run before its
  # checks could finish — the promotion never completed during develop churn.
  # qa-gate.yml already sets cancel-in-progress:false for this reason; mirror it
  # here. Feature PRs (base=develop) still cancel superseded runs as before.
  cancel-in-progress: ${{ !(github.event_name == 'pull_request' && contains(fromJson('["qa", "main"]'), github.base_ref)) && !contains(fromJson('["main", "develop", "qa"]'), github.ref_name) }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  # Lean CI compile profiles — cut DWARF line-tables (~1.5–3 GiB off the
  # root-crate test-compile RSS). CI doesn't need backtraces (panics still
  # print file:line via the panic message); local dev keeps line-tables-only
  # via the Cargo.toml [profile.test] default. CARGO_INCREMENTAL=0 above
  # already disables incr-comp, so only debug needs cutting here.
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

# ============================================================================
# This consolidated CI workflow combines:
# - Rust builds, tests, and quality checks
# - Python SDK tests across multiple versions
# - Integration tests between server and SDK
# - Docker container builds and health checks
# - Performance benchmarks (optional)
# - Documentation validation
#
# The workflow uses a dependency graph to minimize build times:
#   quality-checks (parallel) -> rust-build -> integration-tests
#                             -> docker-build
# ============================================================================

# Least-privilege default GITHUB_TOKEN scope (CodeQL actions/missing-workflow-permissions).
# Read-only is sufficient: no job here writes to the repo, posts comments, or uses OIDC.
permissions:
  contents: read

jobs:
  # ============================================================================
  # CHANGES DETECTION - Determine what to build/test
  # ============================================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      # Three-tier CI (feat -> develop -> qa -> main):
      #   * feat -> develop runs the LIGHT jobs (compile + fmt/clippy + layering
      #     + proto + panic-policy + capability + security-audit + lints + docs)
      #     AND, via `test_tier`, the core Rust-correctness suites — rust-test,
      #     the 4 rust-integration-test-* engines, feature-matrix. Surfacing
      #     correctness at the feat→dev boundary catches latent breakage (broken
      #     doctests, feature-gating gaps, test-isolation bugs) on the
      #     introducing PR instead of at develop→qa.
      #   * develop -> qa = MEDIUM: the above plus the qa-gate conformance
      #     suites (TPC-H/TPC-DS over pgwire, ANN recall ratchets).
      #   * qa -> main = FULL (`extensive`): MEDIUM + docker-build, coverage,
      #     python multi-version, cross integration-test, benchmarks, CodeQL.
      #     The heaviest, pre-promotion gate.
      # `test_tier` is true for base develop, qa, or main (and pushes to qa/main);
      # `extensive` is true only for base main (and pushes to main).
      # `medium_tier` is true for base qa or main (and pushes to qa/main) — i.e.
      # develop->qa and qa->main, but NOT feat->develop.
      test_tier: ${{ github.base_ref == 'develop' || github.base_ref == 'qa' || github.base_ref == 'main' || github.ref == 'refs/heads/qa' || github.ref == 'refs/heads/main' }}
      medium_tier: ${{ github.base_ref == 'qa' || github.base_ref == 'main' || github.ref == 'refs/heads/qa' || github.ref == 'refs/heads/main' }}
      extensive: ${{ github.base_ref == 'main' || github.ref == 'refs/heads/main' }}
      rust: ${{ steps.filter.outputs.rust }}
      # Comprehensive code-path superset gating the always-required rust-compile
      # hard gate (skips ONLY on docs/non-code-only diffs). See the `compile:`
      # filter definition below and the rust-compile job comment.
      compile: ${{ steps.filter.outputs.compile }}
      python: ${{ steps.filter.outputs.python }}
      ui: ${{ steps.filter.outputs.ui }}
      docker: ${{ steps.filter.outputs.docker }}
      docs: ${{ steps.filter.outputs.docs }}
      proto: ${{ steps.filter.outputs.proto }}
      panic_policy: ${{ steps.filter.outputs.panic_policy }}
      v1_proto_usage: ${{ steps.filter.outputs.v1_proto_usage }}
      # Granular Rust component detection for targeted testing
      query_changes: ${{ steps.filter.outputs.query_changes }}
      storage_changes: ${{ steps.filter.outputs.storage_changes }}
      graph_changes: ${{ steps.filter.outputs.graph_changes }}
      core_changes: ${{ steps.filter.outputs.core_changes }}
      authz_changes: ${{ steps.filter.outputs.authz_changes }}
      network_changes: ${{ steps.filter.outputs.network_changes }}
      pgwire_accuracy_changes: ${{ steps.filter.outputs.pgwire_accuracy_changes }}
      object_store_cloud_changes: ${{ steps.filter.outputs.object_store_cloud_changes }}
      object_store_restart_changes: ${{ steps.filter.outputs.object_store_restart_changes }}
      # SDK change detection
      go_sdk: ${{ steps.filter.outputs.go_sdk }}
      nodejs_sdk: ${{ steps.filter.outputs.nodejs_sdk }}
      rust_sdk: ${{ steps.filter.outputs.rust_sdk }}
      java_sdk: ${{ steps.filter.outputs.java_sdk }}
      openapi_spec: ${{ steps.filter.outputs.openapi_spec }}
      src_connectors: ${{ steps.filter.outputs.src_connectors }}
      spark_jni: ${{ steps.filter.outputs.spark_jni }}
      # TD-149: on a push to a protected branch (the only branches this workflow's
      # `push:` trigger covers — main/development/develop/qa), run the drift-detecting
      # jobs unconditionally. PRs keep the path-filter so the feat→develop tier stays
      # LIGHT/fast; this catches drift/flakes the instant a merge lands them on the
      # branch, so they can't accumulate invisibly and block the next triggering PR.
      # The drift jobs (rust-format, rust-clippy, proto-compat, openapi-spec-drift,
      # python-lint, the 4 sdk-codegen-drifts, go/nodejs/rust-sdk-lint) OR this `sweep`
      # into their `if:`.
      sweep: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so dorny/paths-filter can reach the merge-base across a
          # large develop→main gap (shallow --deepen fails: "shallow file has changed").
          fetch-depth: 0
      - name: Validate rust-cache key inputs before fan-out
        run: python3 scripts/check_deterministic_commit_contract.py
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              # TD-PROTO-2 review: the v1-mirror drift guard (a #[cfg(test)]
              # in proximadb-proto) runs ONLY in the rust lane — a proto-only
              # change that forgets the hand-maintained v1 mirror must re-run
              # it, so proto edits are rust-lane-visible.
              - 'proto/**'
              - 'src/**'
              # Workspace members that `cargo` compiles, lints, and tests but that
              # the filter previously omitted — a crate-only or app-only change
              # therefore skipped rust-clippy/rust-test/rust-format/feature-matrix
              # etc. and was caught only by the always-required rust-compile gate.
              - 'crates/**'
              - 'apps/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - 'tests/**'
              - 'benches/**'
              # Toolchain pin + cargo config (rustflags) change lint/test outcomes
              # workspace-wide, so a bump must re-run the Rust suite.
              - 'rust-toolchain*'
              - '.cargo/**'
              # This file DEFINES the Rust jobs (clippy args, feature matrix
              # combos, test shapes), so a change to it changes their outcome —
              # but it was not listed, which meant **CI could not validate a
              # change to its own Rust gating**. The PR that added `--tests` to
              # the feature matrix skipped that very matrix and reported green:
              # skipped is not passed. A gate that cannot see the change to
              # itself is the same defect class it exists to catch.
              - '.github/workflows/ci.yml'
            # `compile` gates the rust-compile hard gate. It is a deliberate
            # SUPERSET of every path that can affect `cargo check --workspace`:
            # the root `src/**`, every workspace member under `crates/**` and
            # `apps/**` (NOT covered by `rust:` above), test/bench targets, the
            # manifests + lockfile, build script, toolchain pin, cargo config,
            # and generated-proto inputs. A docs/non-code-only diff matches
            # nothing here, so the compile gate skips; ANY code change matches,
            # so a non-compiling change can never skip the gate (#226 guarantee).
            compile:
              - 'src/**'
              - 'crates/**'
              - 'apps/**'
              - 'tests/**'
              - 'benches/**'
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - '.cargo/**'
              - 'proto/**'
            python:
              - 'clients/python/**'
              - 'clients/python-embedded/**'
              - 'proto/**'
            ui:
              - 'ui/**'
              - '.github/workflows/ci.yml'
            docker:
              - 'Dockerfile*'
              - 'docker-compose*.yml'
              - '.dockerignore'
            docs:
              - 'docs/**'
              - '*.adoc'
              - '*.md'
            proto:
              - 'proto/**'
            panic_policy:
              - 'src/**'
              - 'scripts/count_panic_patterns.sh'
              - 'docs/_internal/roadmap/PANIC_POLICY_BASELINE.json'
            v1_proto_usage:
              - 'src/**'
              - 'crates/**'
              - 'clients/**'
              - 'tests/**'
              - 'proto/**'
              - 'scripts/check_v1_proto_usage.py'
              - 'docs/_internal/roadmap/V1_PROTO_USAGE_BASELINE.json'
            query_changes:
              - 'src/query/**'
              - 'tests/*query*'
              # TD-SPECRAT-1: the AV-SQL translate eval gates the /api/v2/nl
              # surface (engine: src/query/nl) — explicit so eval edits run it.
              - 'tests/nl_translate_eval.rs'
              - 'tests/*federated*'
              # TD-SELECTOR-1: the selector/answer-quality gates are #[path]-included
              # modules of this test file; editing the harness is editing the test.
              - 'tests/retrieval_quality_gates.rs'
              - 'benches/bench_selector_benchmark.rs'
              - 'benches/selector_benchmark_data.rs'
              - 'benches/bench_answer_quality.rs'
              - 'benches/answer_quality_data.rs'
              # The unflushed-tail search path feeds vector recall — changes here
              # must run the recall+leaks E2E (vector_ann_recall_e2e) in the query
              # integration job, which the storage-only filter would otherwise miss.
              - 'src/storage/persistence/write_ahead_log/**'
              - 'src/storage/memtable/**'
              # TD-RECALL-2 / #1406: same lesson, one layer up. Identity/OID minting
              # in src/services (system_catalog.rs) feeds OID resolution on the
              # cross-segment search path, so it can regress ANN recall WITHOUT
              # touching src/query or src/storage. #1406 changed only
              # src/services/{system_catalog,system_catalog_state}.rs + src/network,
              # matched no recall filter, and its PR SKIPPED this job — the cross-tier
              # recall collapse (mean 1.000 → 0.000) surfaced only later on develop and
              # cost a bisect + revert (#1425). Recall is a cross-cutting OUTCOME, so
              # this filter tracks what can break it, not who owns the code.
              - 'src/services/**'
            storage_changes:
              - 'src/storage/**'
              - 'tests/*storage*'
              - 'tests/*sst*'
              - 'tests/*wal*'
              # The recall ratchet itself matched NONE of the globs above, so
              # editing the ratchet did not run the ratchet — a change that
              # weakened it would have gone unmeasured. Same class as
              # TD-RECALL-2/#1406: track what can break the outcome, not who
              # owns the file.
              - 'tests/sift_pax_recall_ratchet_test.rs'
            # Cloud object-store Cool-tier validation (TD-168). The tier-mapping code
            # lives in the object-store crate + the cold-payload store; the orchestration
            # is scripts/run_cloud_emulator_tests.sh. Re-run the (cheap) emulator tier
            # tests when any of those change — catches a real-cloud-API tier regression
            # on the introducing PR instead of at develop→qa.
            object_store_cloud_changes:
              - 'crates/storage/proximadb-object-store/**'
              - 'src/graph/cold_payload_store.rs'
              - 'scripts/run_cloud_emulator_tests.sh'
              - '.github/workflows/ci.yml'
            # Full-server object-store RESTARTABILITY recovery (TD-OBJSTORE-5 S1,
            # ADR-063 D8 PR tier). Any change to the WAL recovery / durable-write /
            # object-store filesystem / catalog-restart path must prove a real
            # process-boundary restart recovers over Azurite before merge — the exact
            # regression class TD-OBJSTORE-1 batch 3 was.
            object_store_restart_changes:
              - 'src/storage/persistence/write_ahead_log/**'
              - 'src/storage/persistence/filesystem/**'
              - 'crates/storage/proximadb-object-store/**'
              - 'crates/control/proximadb-catalog/**'
              - 'src/storage/engine.rs'
              - 'apps/proximadb-server/tests/object_store_restart_recovery.rs'
              - 'scripts/run_cloud_emulator_tests.sh'
            graph_changes:
              - 'src/graph/**'
              - 'tests/*graph*'
            core_changes:
              - 'src/core/**'
              - 'src/compute/**'
              - 'src/lib.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
            network_changes:
              - 'src/network/**'
              - 'src/api_handlers/**'
              - 'proto/**'
            # ADR-090 / TD-AUTHZ-1 authorization e2e. Filters track the OUTCOME
            # (an authorization decision changing) rather than code ownership —
            # the #1430 lesson, where a recall lane skipped on the very PR that
            # broke recall because the changed path matched no filter.
            authz_changes:
              - 'src/security/**'
              - 'src/services/operations/vectors/**'
              - 'crates/control/proximadb-abac/**'
              - 'crates/control/proximadb-catalog/**'
              - 'src/network/rest/canonical/abac_admin.rs'
              - 'src/network/rest/canonical/handlers.rs'
              - 'src/network/shared_services.rs'
              - 'tests/abac_*.rs'
              - '.github/workflows/ci.yml'
            # Multi-modal pgwire value-accuracy e2e suite (TD-182 P0). The suite
            # exercises the SQL/pgwire + relational + DML + cold-path-merge code,
            # so re-run it when any of those change, when the suite files change,
            # or when this workflow itself changes (so wiring edits self-verify).
            pgwire_accuracy_changes:
              - 'src/query/**'
              - 'src/network/**'
              - 'src/services/dml/**'
              - 'src/core/**'
              - 'tests/*pgwire*'
              - 'tests/document_json*'
              - 'tests/events_tsbs*'
              - 'tests/sql_value_roundtrip.rs'
              - '.github/workflows/ci.yml'
            # SDK filters
            go_sdk:
              - 'clients/go/**'
              - 'clients/go-embedded/**'
            nodejs_sdk:
              - 'clients/nodejs-embedded/**'
            rust_sdk:
              - 'clients/rust/**'
            java_sdk:
              - 'clients/java-embedded/**'
            openapi_spec:
              - 'docs/openapi/**'
            src_connectors:
              - 'src/connectors/**'
              - 'tests/connectors_openapi_contract.rs'
              - 'tests/connectors_flight_contract.rs'
              - 'tests/openapi_helpers.rs'
            spark_jni:
              - 'crates/binding/proximadb-spark-jni/**'
              - 'clients/jvm/spark-connector/**'
              - 'src/connectors/spark.rs'

  # NOTE (2026-07-13): the former `gpu-feature-check` (macOS) job was REMOVED.
  # It was pinned to `runs-on: macos-13` — the last free x86_64 macOS image,
  # which GitHub has retired — so the job could never be scheduled: it sat
  # QUEUED for 10+ hours on any PR touching Cargo.toml, holding the whole run
  # "in progress" and blocking `gh run rerun --failed` of legitimately flaked
  # jobs. macos-14+ runners are arm64, where ring 0.17.x's `CAPS_STATIC`
  # const-assertion breaks the build, so there is currently NO runnable free
  # macOS target for `--features gpu` (metal). arm64-macOS GPU coverage stays
  # tracked in issue #184; restore a macOS job there once ring/runner allow.

  # ============================================================================
  # QUALITY CHECKS - Run in parallel, fast feedback
  # ============================================================================
  hygiene-check:
    name: Hygiene Guardrails
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Check for tracked artifact files
        run: |
          bad_files=$(git ls-files | grep -E '(^|/)\.victor($|/)|\.bak[0-9]*$|\.disabled$' || true)
          if [ -n "$bad_files" ]; then
            echo "::error::Forbidden tracked artifacts detected:"
            echo "$bad_files"
            exit 1
          fi
          echo "No tracked artifact files detected."

  deterministic-commit-contract:
    name: Deterministic Commit Contract
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v7
      - name: Validate deterministic guard wiring
        run: python3 scripts/check_deterministic_commit_contract.py

  repository-identity:
    name: Canonical Repository Identity
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v7
      - name: Reject stale pre-organization URLs and publish gates
        run: python3 scripts/check_repository_identity.py

  docs-authority:
    name: Docs Authority (no retired/engine drift)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.sweep == 'true' || needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Lint customer-facing docs vs the support contract
        run: python3 scripts/check_doc_authority.py
      - name: Cross-check perf claims vs BENCHMARK_EVIDENCE.toml
        run: python3 scripts/check_perf_claims.py

  risk-coverage:
    name: Risk-Coverage Contract
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.sweep == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Validate risk→test→tier contract (risk tests are wired into a required tier)
        run: python3 scripts/check_risk_coverage.py

  oss-docs-decontamination:
    name: OSS Docs Decontamination
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v7
      - name: Block commercial $-content in OSS docs
        # ProximaDB OSS ships mechanism + neutral meters; $-policy lives in anvaiops.
        # See docs/12-design/OSS_ENTERPRISE_BOUNDARY_2026_06_17.adoc + scripts/check_no_commercial_docs.sh.
        run: bash scripts/check_no_commercial_docs.sh

  rust-format:
    name: Rust Format
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.sweep == 'true' || needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - run: cargo fmt --all -- --check

  capability-matrix:
    name: Capability Matrix
    runs-on: ubuntu-latest
    needs: changes
    # Run on rust changes (evidence refs point at source) AND on docs changes:
    # the validator now also guards the maturity-contract reconciliation in
    # SUPPORTED_SURFACE / TECHNICAL_DEBT / PRD / VISION, so a docs-only PR that
    # weakens those banners must trip this gate too.
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Validate capability matrix
        run: python3 scripts/validate_capability_matrix.py
      # Benchmark evidence ledger: keeps perf/capability claims tied to a runnable
      # bench + (for 'measured') dated provenance, and bites if a claim is cited at
      # a doc:line that no longer exists.
      - name: Validate benchmark evidence ledger
        run: python3 scripts/validate_benchmark_evidence.py
      - name: Validate MVP Trust Corridor
        run: python3 scripts/check_mvp_trust_corridor.py
      - name: Test canonical MVP smoke client
        run: python3 -m unittest discover -s tests/scripts -p 'test_mvp_smoke.py'
      # Guards the touched-crate fast lane's cost invariant (see the
      # rust-affected-fast job header): the monolith-dependent closure must keep
      # excluding crates whose graph pulls in the root crate. Pure-python, no
      # toolchain needed.
      - name: Test affected-crate selection
        run: python3 -m unittest discover -s tests/scripts -p 'test_affected_crates.py'
      - name: Validate context-corridor benchmark contract
        run: make context-benchmark-check

  # T4.2 (pre-release foundations) — Proto compatibility gate.
  # Runs `make proto-check`: cargo-checks the proximadb-proto crate AND
  # runs the Python gRPC proto-drift + OpenAPI contract tests. Catches
  # non-additive proto edits (field removal, type change, tag reuse) that
  # would silently break Python SDK or REST contract consumers.
  # Also fails if the committed generated proto sources have hand-edited
  # drift from `git`.
  proto-compat:
    name: Proto Compatibility (T4.2)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.sweep == 'true' || needs.changes.outputs.proto == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.python == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          # Match rust-toolchain.toml's declared components + target so `cargo
          # check` doesn't trigger a rustup re-sync that collides installing
          # rustfmt-preview on the runner's existing bin/cargo-fmt (T4.2 red).
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Python SDK (editable) and test deps
        run: |
          cd clients/python
          python -m pip install --upgrade pip
          # The [test] extra is the single source of truth for the unit-suite
          # deps (pyproject optional-dependencies.test) — including the optional
          # data deps some *_cov tests hard-import (pyarrow/pandas/psutil). The
          # former hand-maintained list drifted and left this lane red.
          python -m pip install -e ".[test]"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-proto-compat"
      - name: Run proto compatibility gate
        env:
          PYTHON: python
        run: make proto-check
      - name: Fail on uncommitted drift in generated proto sources
        run: |
          git diff --exit-code -- \
            crates/foundation/proximadb-proto/src/proto/ \
            src/proto/ \
            || (echo "::error::Generated proto sources have drifted from committed copy. Run scripts/regenerate-proto.sh and commit the result." && exit 1)

  # TD-126 Phase 1: the published REST contract (docs/openapi/proximadb-openapi.yaml)
  # is GENERATED from the annotated axum handlers (src/network/rest/openapi.rs),
  # not hand-maintained. This job regenerates it and fails if the committed copy
  # has drifted from the handler code — the same generated-artifact pattern as
  # the proto-sync gate above. Regenerate locally with:
  #   UPDATE_OPENAPI_SPEC=1 cargo test -p proximadb --test openapi_spec_gen
  openapi-spec-drift:
    name: OpenAPI Spec From Code (TD-126)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.sweep == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.openapi_spec == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-openapi-spec-drift"
      - name: Regenerate OpenAPI spec from handlers (drift gate)
        run: cargo test -p proximadb --test openapi_spec_gen -- --nocapture
      - name: Fail on uncommitted drift in generated OpenAPI spec
        run: |
          git diff --exit-code -- docs/openapi/proximadb-openapi.yaml \
            || (echo "::error::docs/openapi/proximadb-openapi.yaml has drifted from the annotated REST handlers. Run 'UPDATE_OPENAPI_SPEC=1 cargo test -p proximadb --test openapi_spec_gen' and commit the result." && exit 1)

  # TD-126 Phase 2 (spec-driven SDK pilot, Go): the Go REST transport's wire
  # plumbing (clients/go/proximadb/internal/genrest) is GENERATED from the
  # published OpenAPI spec via oapi-codegen (pinned in clients/go/codegen/go.mod).
  # This job regenerates it and fails if the committed copy has drifted from the
  # spec — the same generated-artifact pattern as openapi-spec-drift / proto-sync.
  # Regenerate locally with: make gen-go-sdk
  go-sdk-codegen-drift:
    name: Go SDK Codegen Drift (TD-126)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.sweep == 'true' || needs.changes.outputs.go_sdk == 'true' || needs.changes.outputs.openapi_spec == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Python deps for the 3.1->3.0 down-conversion
        run: python -m pip install --upgrade pip pyyaml
      - name: Regenerate the Go REST transport from the OpenAPI spec
        env:
          PYTHON: python
        run: make gen-go-sdk
      - name: Fail on uncommitted drift in the generated Go client
        run: |
          git diff --exit-code -- clients/go/proximadb/internal/genrest/ \
            || (echo "::error::clients/go/proximadb/internal/genrest has drifted from the OpenAPI spec. Run 'make gen-go-sdk' and commit the result." && exit 1)

  # TD-126 Phase 4 (spec-driven SDK pilot, TypeScript): the TS REST transport's
  # wire types (clients/nodejs-embedded/src/generated) are GENERATED from the
  # published OpenAPI spec via openapi-typescript (pinned in the SDK
  # package.json). This job regenerates them and fails if the committed copy has
  # drifted from the spec — the same generated-artifact pattern as
  # go-sdk-codegen-drift / openapi-spec-drift. Regenerate locally with:
  # make gen-ts-sdk
  ts-sdk-codegen-drift:
    name: TS SDK Codegen Drift (TD-126)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.sweep == 'true' || needs.changes.outputs.nodejs_sdk == 'true' || needs.changes.outputs.openapi_spec == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: clients/nodejs-embedded
        run: npm ci
      - name: Regenerate the TypeScript REST transport from the OpenAPI spec
        run: make gen-ts-sdk
      - name: Fail on uncommitted drift in the generated TS client
        run: |
          git diff --exit-code -- clients/nodejs-embedded/src/generated/ \
            || (echo "::error::clients/nodejs-embedded/src/generated has drifted from the OpenAPI spec. Run 'make gen-ts-sdk' and commit the result." && exit 1)

  # TD-126 Phase 4 (spec-driven SDK, Rust): the Rust REST transport's wire
  # plumbing (clients/rust/src/genrest.rs) is GENERATED from the published
  # OpenAPI spec via progenitor (pinned in clients/rust/codegen/Cargo.toml),
  # behind the unchanged hand-written ergonomic facade (clients/rust/src/client.rs).
  # This job regenerates it and fails if the committed copy has drifted from the
  # spec — the same generated-artifact pattern as go-sdk-codegen-drift /
  # openapi-spec-drift / proto-sync. Regenerate locally with: make gen-rust-sdk
  rust-sdk-codegen-drift:
    name: Rust SDK Codegen Drift (TD-126)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.sweep == 'true' || needs.changes.outputs.rust_sdk == 'true' || needs.changes.outputs.openapi_spec == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Python deps for the 3.1->3.0 down-conversion
        run: python -m pip install --upgrade pip pyyaml
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-sdk-codegen-drift"
          workspaces: clients/rust/codegen
      - name: Regenerate the Rust REST transport from the OpenAPI spec
        # ADR-068 D6: regeneration is ADVISORY here. progenitor 0.14 panics on
        # some inline-structured OpenAPI responses (`response_types.len() <= 1`,
        # the #1103 class) — a generator TOOLING limit unrelated to real drift.
        # `continue-on-error` stops that panic red-PR'ing spec-evolution work;
        # the merge-blocking SDK gate is the live round-trip (python-sdk-round-trip).
        continue-on-error: true
        env:
          PYTHON: python
        run: make gen-rust-sdk
      - name: Report uncommitted drift in the generated Rust client (advisory)
        # ADR-068 D6: advisory — `::warning::`, never fails the job. Real drift is
        # caught by the blocking round-trip gate, not by a text diff.
        continue-on-error: true
        run: |
          git diff --exit-code -- clients/rust/src/genrest.rs \
            || (echo "::warning::clients/rust/src/genrest.rs has drifted from the OpenAPI spec (advisory under ADR-068 D6). Run 'make gen-rust-sdk' and commit the result when intentional." && true)

  # TD-126 Phase 4 (spec-driven SDK, Python): the Python REST transport's wire
  # plumbing (clients/python/src/proximadb_sdk/_generated/rest) is GENERATED from
  # the published OpenAPI spec via openapi-python-client (pinned in
  # clients/python/codegen/requirements.txt), behind the unchanged hand-written
  # ergonomic facade (protocols/rest_sync.py). This job regenerates it and fails
  # if the committed copy has drifted from the spec — the same generated-artifact
  # pattern as go-sdk-codegen-drift / ts-sdk-codegen-drift / rust-sdk-codegen-drift
  # / openapi-spec-drift. Regenerate locally with: make gen-python-sdk
  python-sdk-codegen-drift:
    name: Python SDK Codegen Drift (TD-126)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.sweep == 'true' || needs.changes.outputs.python == 'true' || needs.changes.outputs.openapi_spec == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # The SDK's own black + isort run the deterministic formatting pass inside
      # gen.sh, so install them (the generator itself runs in its own pinned
      # venv that gen.sh provisions from codegen/requirements.txt).
      - name: Install the SDK's formatters (black + isort)
        working-directory: clients/python
        run: pip install -e ".[dev]"
      - name: Regenerate the Python REST transport from the OpenAPI spec
        env:
          PYTHON: python
        run: make gen-python-sdk
      - name: Fail on uncommitted drift in the generated Python client
        run: |
          git diff --exit-code -- clients/python/src/proximadb_sdk/_generated/ \
            || (echo "::error::clients/python/src/proximadb_sdk/_generated has drifted from the OpenAPI spec. Run 'make gen-python-sdk' and commit the result." && exit 1)

  # ADR-068 D5 — the BLOCKING behavioral SDK gate: drive the shipped Python
  # facade through the real REST transport against a live server (create→insert→
  # search→get→delete). The codegen-drift gates cannot see facade bugs (S2a/S2b
  # shipped undetected); this one can. Regeneration is advisory (D6); this is
  # blocking. Promoted once #1141 (the S2b search() fix it enforces) landed on
  # develop. Proven correct: passes with the S2b fix, fails (search returns [])
  # without it.
  python-sdk-round-trip:
    name: Python SDK round-trip (ADR-068 D5)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.sweep == 'true' || needs.changes.outputs.python == 'true' || needs.changes.outputs.openapi_spec == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config curl
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-python-sdk-round-trip"
      - name: Build server binary
        run: cargo build --release --package proximadb-server --bin proximadb-server
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install SDK + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e clients/python
          pip install pytest
      - name: Start server (background) + wait for health
        run: |
          ./target/release/proximadb-server -c config/config.toml -d /tmp/proxima-rt -p 5678 > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:5678/health >/dev/null 2>&1; then echo "server ready"; exit 0; fi
            sleep 1
          done
          echo "::error::server did not become healthy in 90s"; cat /tmp/server.log; exit 1
      - name: Round-trip gate
        run: pytest clients/python/tests/test_round_trip.py -v
        env:
          PROXIMADB_REST_URL: http://127.0.0.1:5678
      - name: Stop server
        if: always()
        run: kill $(cat /tmp/server.pid) 2>/dev/null || true

  panic-policy-report:
    name: Panic Policy Report (WS-2 Stage 1)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.panic_policy == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Generate panic-policy metrics report
        run: |
          mkdir -p artifacts/panic_policy
          bash scripts/count_panic_patterns.sh \
            --mode report \
            --baseline docs/_internal/roadmap/PANIC_POLICY_BASELINE.json \
            --write artifacts/panic_policy/panic_policy_report.json \
            --format text
      - name: Upload panic-policy report artifact
        uses: actions/upload-artifact@v7
        with:
          name: panic-policy-report
          path: artifacts/panic_policy/panic_policy_report.json
          retention-days: 14

  panic-policy-no-regression:
    name: Panic Policy No Regression (WS-2 Stage 2)
    runs-on: ubuntu-latest
    needs: [changes, panic-policy-report]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.panic_policy == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Enforce no-regression baseline
        run: |
          mkdir -p artifacts/panic_policy
          bash scripts/count_panic_patterns.sh \
            --mode no-regression \
            --baseline docs/_internal/roadmap/PANIC_POLICY_BASELINE.json \
            --write artifacts/panic_policy/panic_policy_no_regression.json \
            --format text

  panic-policy-module-guard:
    name: Panic Policy Critical Modules (WS-2 Stage 3)
    runs-on: ubuntu-latest
    needs: [changes, panic-policy-report]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.panic_policy == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Enforce critical module guardrails
        run: |
          mkdir -p artifacts/panic_policy
          bash scripts/count_panic_patterns.sh \
            --mode module-guard \
            --baseline docs/_internal/roadmap/PANIC_POLICY_BASELINE.json \
            --critical-modules network_rest,api_handlers,graph,query \
            --write artifacts/panic_policy/panic_policy_module_guard.json \
            --format text

  # TD-123: ratchet proximadb.v1 proto usage downward. v1 proto is the legacy
  # internal domain model being migrated to v2; no-regression fails on any net
  # INCREASE so the migration only moves one direction. Pure-python (no compile).
  v1-proto-usage-report:
    name: v1 Proto Usage Report (TD-123)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.python == 'true' || needs.changes.outputs.v1_proto_usage == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Generate v1 proto usage report
        run: |
          mkdir -p artifacts/v1_proto_usage
          python3 scripts/check_v1_proto_usage.py \
            --mode report \
            --baseline docs/_internal/roadmap/V1_PROTO_USAGE_BASELINE.json \
            --write artifacts/v1_proto_usage/v1_proto_usage_report.json \
            --format text
      - name: Upload v1 proto usage report artifact
        uses: actions/upload-artifact@v7
        with:
          name: v1-proto-usage-report
          path: artifacts/v1_proto_usage/v1_proto_usage_report.json
          retention-days: 14

  v1-proto-usage-no-regression:
    name: v1 Proto Usage No Regression (TD-123)
    runs-on: ubuntu-latest
    needs: [changes, v1-proto-usage-report]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.python == 'true' || needs.changes.outputs.v1_proto_usage == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Enforce no v1 proto usage increase
        run: |
          mkdir -p artifacts/v1_proto_usage
          python3 scripts/check_v1_proto_usage.py \
            --mode no-regression \
            --baseline docs/_internal/roadmap/V1_PROTO_USAGE_BASELINE.json \
            --write artifacts/v1_proto_usage/v1_proto_usage_no_regression.json \
            --format text

  rust-clippy:
    name: Rust Clippy
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.sweep == 'true' || needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-clippy-nightly"
      # Clippy is authoritative. TD-079 retired the accumulated root-crate
      # lint debt (2026-05-28); any new warning fails CI. If a new lint
      # surfaces from a dependency or toolchain update, prefer fixing it
      # over re-adding `-A warnings`. Targeted `#[allow(...)]` with an
      # inline rationale is acceptable for genuinely infallible / large
      # blast-radius edge cases.
      # Only lint lib+bins to stay within CI memory limits (--all-targets OOMs).
      - name: Run clippy (-D warnings)
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
        run: cargo clippy --lib --bins -- -D warnings

  # Feature-gated code paths that DEFAULT CI never compiles. This is the job
  # that would have caught the cloud-full `ObjectStoreExt` compile-rot (the
  # AnvaiOps ADLS CrashLoopBackOff) at PR time instead of in production:
  # aws/azure/gcp/onnx/cluster/catalog code is gated, so the default build
  # skips it and rot accumulates invisibly. `cargo check` (no link/run) keeps
  # this cheap while still surfacing E0599-class errors. Each combo runs on its
  # own runner (fail-fast: false) so one feature's break doesn't mask others.
  #
  # `--tests` is load-bearing, not tidiness. Plain `cargo check` compiles the
  # LIBRARY ONLY, so a `#[cfg(test)]` module behind a feature is never compiled
  # by CI — the feature is covered and its tests are not. That is how
  # `rest/canonical/catalog.rs`'s test module came to carry a `CatalogNamespace`
  # literal seven fields out of date and stay green while `enterprise-catalogs`
  # sat in this very matrix (TD-CAT-8).
  #
  # `--tests`, NOT `--all-targets`, deliberately. `--all-targets` would add the
  # root crate's 38 benches + 23 examples per combo, and the clippy job above
  # records that `--all-targets` OOMs these runners. That evidence is from a
  # heavier pass (clippy, workspace-wide) than this one (`check -p <pkg>`), so it
  # does not transfer directly — but the headroom warning is real and
  # benches/examples are not the rot class this closes. Verified locally: all 13
  # combos pass with `--tests` (and with `--all-targets`) as of TD-CAT-8.
  feature-matrix:
    name: Feature Matrix (${{ matrix.label }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.test_tier == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The two combos the published images actually ship (PR #78):
          - { label: "cloud-full",          pkg: proximadb-server, args: "--features cloud-full" }
          - { label: "cloud-full+onnx",     pkg: proximadb-server, args: "--features cloud-full,onnx" }
          # Other gated surfaces invisible to default CI:
          - { label: "cluster",             pkg: proximadb,        args: "--features cluster" }
          - { label: "enterprise-catalogs", pkg: proximadb,        args: "--features enterprise-catalogs" }
          # Ledger modality durable backend (S2, ADR-071) — the WAL-backed impl is behind the
          # non-default `durable` feature, so it is invisible to the default workspace check.
          - { label: "ledger-durable",      pkg: proximadb-ledger, args: "--features durable" }
          # Ledger modality gRPC service (S3, ADR-071) — the ProximaLedgerService + its port wiring
          # are behind the non-default `experimental-ledger` feature on the root crate.
          - { label: "experimental-ledger", pkg: proximadb,        args: "--features experimental-ledger" }
          # F2 (ADR-072 D3/D5): the fenced ConditionalKeyStore in the relational insert
          # path is behind the non-default `oltp-integrity` feature; check it compiles so
          # cfg drift in that path is caught (the feature-gated test executes locally).
          - { label: "oltp-integrity",       pkg: proximadb,        args: "--features oltp-integrity" }
          # Refactor/move coverage: these configurations catch cfg drift hidden
          # by the default build. Keep them in the same mandatory matrix rather
          # than relying on a PR being correctly labelled as mechanical.
          - { label: "no-default-features",  pkg: proximadb,        args: "--no-default-features" }
          # AXIS cfg feature (TD-AXIS-4 Superseded): default ON; this variant turns
          # it OFF while keeping the other defaults on — the PAX-exact-scan build that
          # excludes the AXIS index engine + its recall/advisor/drift surfaces. Catches
          # cfg drift where axis code leaks out of the `#[cfg(feature = "axis")]` gates.
          - { label: "no-axis", pkg: proximadb-server, args: "--no-default-features --features sql_frontend,graph-first-sks,unified-facade-routing,canonical-document-store,datafusion-integration,otlp-metering" }
          - { label: "experimental-engines", pkg: proximadb,        args: "--features experimental-engines" }
          # F3v (TD-DELVEC-1): cold-tier deletion vectors — feature-gated PAX flush-path
          # resolver capture. Check it compiles so cfg drift in that path is caught.
          - { label: "cold-deletion-vectors", pkg: proximadb,      args: "--features cold-deletion-vectors" }
          # Embedded crate (default, no language bindings) — validates the extracted
          # crate compiles against root at every tier. Python-feature + wheel build
          # is a qa→main (FULL) concern (heavy pyo3/numpy deps).
          - { label: "embedded",             pkg: proximadb-embedded, args: "" }
          # Small extracted crates batched into one runner (each compiles in <1min;
          # the per-runner overhead — checkout + toolchain + apt + cache — dominates).
          # Space-separate additional small crates here as they are extracted; the
          # step loops over every package in the list.
          - { label: "small-crates",         pkg: "proximadb-mongodb-parser proximadb-catalog-introspection", args: "" }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install System Dependencies
        # g++ provides libstdc++ for the onnxruntime (ort) build script.
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler g++
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-feature-matrix"
          shared-key: ${{ matrix.label }}
      - name: cargo check -p ${{ matrix.pkg }} --tests ${{ matrix.args }}
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
        run: |
          # Batched small-crates entry: check each package sequentially on one runner.
          for pkg in ${{ matrix.pkg }}; do
            echo "::group::cargo check -p $pkg --tests ${{ matrix.args }}"
            cargo check -p "$pkg" --tests ${{ matrix.args }}
            echo "::endgroup::"
          done
      # TD-V1SUNSET-1 census finding 4: this lane COMPILES enterprise-catalogs
      # but never SERVED it — the /api/v1 path collision survived a green lane.
      # Run the (small, filtered) feature-gated catalog tests so the surface's
      # serving contract is verified where it is built. Nextest when present
      # (install-fast-tools convention), libtest fallback otherwise.
      - name: serve enterprise-catalog tests (compile is not verification)
        if: matrix.label == 'enterprise-catalogs'
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
        run: |
          if cargo nextest --version >/dev/null 2>&1; then
            cargo nextest run -p proximadb --lib --features enterprise-catalogs -E 'test(catalog)'
          else
            cargo test -p proximadb --lib --features enterprise-catalogs catalog
          fi
      # Residue-closure (2026-08-30): feature-gated code accumulated 9 clippy
      # lints invisibly — CI's clippy job runs DEFAULT features and this lane
      # only checked+served. Lint the feature code where it is built, so this
      # debt class cannot regrow unseen. lib-only, same as the main clippy job
      # (CI memory limits).
      - name: clippy enterprise-catalogs (feature code is not lint-blind)
        if: matrix.label == 'enterprise-catalogs'
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
        run: cargo clippy -p proximadb --lib --features enterprise-catalogs -- -D warnings

  rust-security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run security audit
        continue-on-error: true
        run: cargo audit || echo "::warning::Security audit found vulnerabilities - review required"

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.sweep == 'true' || needs.changes.outputs.python == 'true' || needs.changes.outputs.proto == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: clients/python/pyproject.toml
      - name: Install SDK Dependencies
        working-directory: clients/python
        run: pip install -e ".[dev]"

      # Python SDK linting
      - name: Run Black (SDK)
        working-directory: clients/python
        run: black --check --diff src tests

      - name: Run isort (SDK)
        working-directory: clients/python
        run: isort --check-only --diff src tests

      - name: Run Ruff (SDK - syntax errors)
        working-directory: clients/python
        run: ruff check src tests --select=E9,F63,F7 --exclude="*_pb2*.py"

      - name: Run mypy (SDK - core modules)
        working-directory: clients/python
        run: |
          mypy \
            src/proximadb_sdk/proto_conversion.py \
            src/proximadb_sdk/integrations/ \
            || echo "::warning::mypy type checking found issues"

  go-lint:
    name: Go SDK Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.sweep == 'true' || needs.changes.outputs.go_sdk == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - name: Run go vet
        working-directory: clients/go
        run: go vet ./...
      - name: Check go fmt
        working-directory: clients/go
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "::error::Go files not formatted: $files"
            exit 1
          fi

  nodejs-lint:
    name: Node.js SDK Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.sweep == 'true' || needs.changes.outputs.nodejs_sdk == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: clients/nodejs-embedded
        run: npm ci
      - name: Run lint
        working-directory: clients/nodejs-embedded
        run: npm run lint

  ui-build:
    name: Admin UI Install + Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        working-directory: ui
        run: npm ci
      - name: Build production bundle
        working-directory: ui
        run: npm run build

  rust-sdk-lint:
    name: Rust SDK Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.sweep == 'true' || needs.changes.outputs.rust_sdk == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: Check formatting
        working-directory: clients/rust
        run: cargo fmt -- --check
      - name: Run clippy
        working-directory: clients/rust
        run: cargo clippy -- -D warnings

  # ===========================================================================
  # SDK OpenAPI CONTRACT GATES (added 2026-05-30, TD-079 follow-up)
  #
  # One job per SDK runs that SDK's contract-gate tests against the
  # canonical spec at `docs/openapi/proximadb-openapi.yaml`. Any drift
  # (SDK calls a path the spec doesn't declare, sends a body without the
  # spec's required keys, uses the wrong verb, etc.) fails the matrix
  # cell — fast feedback to the contributor without waiting for the full
  # integration-test matrix.
  #
  # Triggered by changes to either the SDK source OR the OpenAPI spec.
  # Python's gate is already covered by the `proto-compat` job (which
  # runs `make proto-check` → `test_openapi_contract.py`), so the matrix
  # below covers the three SDKs that gained their gates this round.
  # ===========================================================================
  sdk-contract-gates:
    name: SDK OpenAPI Contract Gate (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.openapi_spec == 'true' ||
      needs.changes.outputs.rust_sdk == 'true' ||
      needs.changes.outputs.go_sdk == 'true' ||
      needs.changes.outputs.nodejs_sdk == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: rust
            setup: rust
          - sdk: go
            setup: go
          - sdk: typescript
            setup: node
    steps:
      - uses: actions/checkout@v7

      # Toolchain setup — one branch per matrix cell
      - if: matrix.setup == 'rust'
        uses: dtolnay/rust-toolchain@1.95.0
      - if: matrix.setup == 'rust'
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-sdk-contract-rust"
          workspaces: "clients/rust -> target"

      - if: matrix.setup == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - if: matrix.setup == 'node'
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: clients/nodejs-embedded/package-lock.json

      # Per-SDK contract gate runs
      - name: Rust contract gate
        if: matrix.sdk == 'rust'
        run: |
          cargo test --manifest-path clients/rust/Cargo.toml --test openapi_contract \
            -- --nocapture

      - name: Go contract gate
        if: matrix.sdk == 'go'
        working-directory: clients/go
        run: |
          go test -v -count=1 -run '^TestOpenAPIContract|MatchesSpec|AllV2OperationsCovered' \
            ./proximadb/internal/rest/...

      - name: TypeScript contract gate
        if: matrix.sdk == 'typescript'
        working-directory: clients/nodejs-embedded
        run: |
          npm ci
          npm test

  # ===========================================================================
  # CONNECTORS — OpenAPI + Flight contract gates (added 2026-05-30, TD-095 follow-up)
  #
  # The 4 Rust connectors at src/connectors/ (DuckDB, Spark, Hadoop, Trino)
  # were scaffolded against /api/v1 paths and never wired to the real REST
  # / Flight surface. After commit a30544f3b the REST-using connectors
  # (DuckDB bind/search/insert + Hadoop flush_now) post spec-correct
  # bodies against /api/v2 endpoints; the Flight-using connector
  # (Trino) has its ticket + descriptor shapes contract-guarded even
  # though the live FlightClient mount is still TD-097 work.
  #
  # Triggered when the OpenAPI spec OR any connector source / test
  # changes. Two cells — REST + Flight — so a Flight-only proto bump
  # doesn't spuriously fail the REST gate and vice versa.
  # ===========================================================================
  connectors-contract-gates:
    name: Connectors Contract Gate (${{ matrix.kind }})
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.openapi_spec == 'true' ||
      needs.changes.outputs.src_connectors == 'true'
    strategy:
      fail-fast: false
      matrix:
        kind: [rest, flight]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-connectors-contract"

      - name: REST contract gate
        if: matrix.kind == 'rest'
        run: |
          cargo test --test connectors_openapi_contract -- --nocapture

      - name: Flight contract gate
        if: matrix.kind == 'flight'
        run: |
          cargo test --test connectors_flight_contract -- --nocapture

  # ===========================================================================
  # SPARK CONNECTOR JNI SMOKE (added 2026-05-31, TD-097 follow-up)
  #
  # End-to-end gate for the Spark connector JNI wire layer:
  #   1. Build the `proximadb-spark-jni` cdylib
  #   2. javac the Java JNI shim + smoke harness
  #   3. java -Djava.library.path=target/debug … NativeProximaDBTest
  #
  # The smoke harness exits non-zero on any failure. Covers all 9 jni_*
  # exports for type-correctness; placeholder return shapes are part of
  # the contract (TD-097 follow-up replaces them with real
  # ConnectorStorageAdapter calls).
  #
  # Triggers when either the Rust JNI crate, the JVM test harness, or
  # the underlying scaffolds in src/connectors/spark.rs change.
  # ===========================================================================
  spark-jni-smoke:
    name: Spark Connector JNI Smoke (TD-097)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.spark_jni == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '19'
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-spark-jni-smoke"
          workspaces: ". -> target"
      - name: Run JNI smoke harness
        run: |
          chmod +x clients/jvm/spark-connector/run-smoke.sh
          clients/jvm/spark-connector/run-smoke.sh

  sdk-security-scan:
    name: SDK Security Scan
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.go_sdk == 'true' ||
      needs.changes.outputs.nodejs_sdk == 'true' ||
      needs.changes.outputs.rust_sdk == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy on Python SDK
        if: needs.changes.outputs.python == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'clients/python'
          format: 'sarif'
          output: 'python-trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy on Go SDK
        if: needs.changes.outputs.go_sdk == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'clients/go'
          format: 'sarif'
          output: 'go-trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy on Node.js SDK
        if: needs.changes.outputs.nodejs_sdk == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'clients/nodejs-embedded'
          format: 'sarif'
          output: 'nodejs-trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy on Rust SDK
        if: needs.changes.outputs.rust_sdk == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'clients/rust'
          format: 'sarif'
          output: 'rust-trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Python Trivy Results
        if: needs.changes.outputs.python == 'true' && always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'python-trivy-results.sarif'
          category: 'python-sdk-security'
        continue-on-error: true

      - name: Upload Go Trivy Results
        if: needs.changes.outputs.go_sdk == 'true' && always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'go-trivy-results.sarif'
          category: 'go-sdk-security'
        continue-on-error: true

      - name: Upload Node.js Trivy Results
        if: needs.changes.outputs.nodejs_sdk == 'true' && always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'nodejs-trivy-results.sarif'
          category: 'nodejs-sdk-security'
        continue-on-error: true

      - name: Upload Rust Trivy Results
        if: needs.changes.outputs.rust_sdk == 'true' && always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'rust-trivy-results.sarif'
          category: 'rust-sdk-security'
        continue-on-error: true

  docs-validation:
    name: Docs Validation
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Backstop against concurrent sessions colliding on a TD/ADR id (e.g. two
      # ADR-031 files, or a new per-file TD reusing a legacy id). Fires on rebase
      # so a number that collides with freshly-merged develop is caught before
      # merge. Convention: docs/12-design/HOW_TO_FILE_TD_AND_ADR.adoc.
      - name: Check TD/ADR id uniqueness
        run: python3 scripts/check_td_adr_unique.py
      - name: Check ADR/TD status coverage and index agreement
        run: python3 scripts/check_design_status_index.py
      - name: Check resolved TD status/body consistency
        run: python3 scripts/check_td_status_consistency.py
      - name: Check documentation links
        run: |
          echo "Checking for broken links in documentation..."
          find docs -name "*.md" -o -name "*.adoc" | head -20 || true
          echo "Documentation validation complete"

  # ============================================================================
  # COMPILE GATE - lib + test shapes, both REQUIRED, in parallel
  # ============================================================================
  # Gated ONLY by the comprehensive `compile` path filter (a deliberate SUPERSET
  # of everything `cargo check --workspace` reads: src/**, crates/**, apps/**,
  # tests/**, benches/**, manifests, lockfile, build.rs, toolchain pin, .cargo/**,
  # proto/**). A non-compiling lib OR test shape must block the merge — this is
  # the guard that would have caught the non-compiling `develop` of #226 (a source
  # file silently `.gitignore`'d away while its `mod` decl landed) and stale
  # integration tests no required job compiled. Because the filter is a superset
  # of ALL code paths, a real code change can never skip this gate; only a
  # docs/non-code-only diff skips it, which is safe (nothing to compile) and saves
  # two runner jobs per docs PR. `ci-success` treats a *skipped* compile (docs
  # only) as pass and blocks only on failure/cancelled — see its "Require Rust
  # compile" step. `cargo check` (no codegen/link) + rust-cache keep it fast.
  # Both matrix legs are in `ci-success.needs`.
  #
  # The `test` shape is `--lib --bins --tests` (unit + integration tests) — the
  # correctness-bearing targets. The `benches` shape compiles the criterion
  # micro-benchmarks so internal-API refactors can no longer rot them silently
  # (TD-BENCH-1: bench_14 was fixed, the 2 unrepairable-against-current-APIs
  # benches are disabled in Cargo.toml; the rest compile). Examples are still
  # excluded (separate rot).
  rust-compile:
    name: Rust Compile (${{ matrix.shape }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.compile == 'true'
    # CARGO_BUILD_JOBS=1: serial compilation keeps peak memory bounded. The
    # `test` shape compiles every crate's test targets at once and OOM-killed the
    # runner (exit 143) under default parallelism; serial is the repo's standard
    # fix for the root-crate test compile (mirrors the rust-test job).
    env:
      CARGO_BUILD_JOBS: 1
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /home/runner/.cache/sccache
    strategy:
      fail-fast: false
      matrix:
        include:
          - shape: lib
            args: "--workspace --lib --bins"
          - shape: test
            args: "--workspace --lib --bins --tests"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-compile-${{ matrix.shape }}"
          shared-key: "build"

      # sccache complements rust-cache: caches individual rustc invocations
      # (content-addressed), so it hits even when the target/ artifact cache misses.
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: actions/cache@v6
        with:
          path: /home/runner/.cache/sccache
          key: sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: sccache-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler

      - name: cargo check ${{ matrix.args }}
        run: cargo check ${{ matrix.args }}

      - name: sccache stats
        run: sccache --show-stats || true

  # Benches compile — split from the rust-compile matrix to gate on medium_tier
  # (develop→qa+). Benches aren't shipped or run on feat→develop; catching their
  # compile rot at develop→qa is sufficient (TD-BENCH-1). Saves ~15min runner
  # time per feat→develop PR.
  rust-compile-benches:
    name: Rust Compile (benches)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.compile == 'true' && needs.changes.outputs.medium_tier == 'true'
    env:
      CARGO_BUILD_JOBS: 1
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /home/runner/.cache/sccache
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-compile-benches"
          shared-key: "benches"
      # sccache MUST be installed: this job sets RUSTC_WRAPPER=sccache, so without
      # the action cargo dies instantly ("could not execute process `sccache`").
      # The step was missing while the env + stats step were present — the job is
      # gated on medium_tier, so it only runs on develop→qa promotions and the gap
      # went unexercised until it hard-failed #1378 across every rerun.
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: actions/cache@v6
        with:
          path: /home/runner/.cache/sccache
          key: sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: sccache-${{ runner.os }}-
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - name: cargo check --workspace --benches
        run: cargo check --workspace --benches
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true

  # ============================================================================
  # BUILD - Compile Rust binaries
  # ============================================================================
  rust-build:
    name: Rust Build (${{ matrix.profile }})
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' && !inputs.skip_tests
    strategy:
      matrix:
        include:
          - profile: dev
            args: ""
          - profile: release
            args: "--release"
    steps:
      - name: Reclaim disk space
        # ubuntu-latest ships ~25 GB of preinstalled toolchains this build never
        # uses (Android SDK, .NET, GHC/Haskell, boost). Removing them frees the
        # disk the large Rust target/ dir needs — otherwise the runner hits
        # "No space left on device" and fails the job at random (infra, not code).
        run: |
          echo "Disk before reclaim:"; df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/boost || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "Disk after reclaim:"; df -h /

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-nightly-${{ matrix.profile }}"
          shared-key: "build"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler

      - name: Build All Binaries
        # feat->develop (medium_tier=false): skip the release leg's ~30m compile —
        # the dev build + clippy + test-compile already cover correctness, and the
        # release binary artifact is only consumed at qa->main (integration-test,
        # extensive). dev always runs; release runs at develop->qa+ (medium_tier).
        if: matrix.profile == 'dev' || needs.changes.outputs.medium_tier == 'true'
        # TD-079 retired the root-crate lint debt 2026-05-28 — no
        # `-A warnings` override needed. Cargo build doesn't fail on
        # warnings by default; the rust-clippy job is the authoritative
        # lint gate.
        run: |
          cargo build ${{ matrix.args }} \
            -p proximadb-server \
            -p proximadb-bench \
            -p proximadb-migrate

      - name: Upload Server Binary
        if: matrix.profile == 'release' && needs.changes.outputs.medium_tier == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: proximadb-server-linux-x64
          path: target/release/proximadb-server
          retention-days: 1

  rust-test:
    name: Rust Tests (${{ matrix.test-type }})
    runs-on: ubuntu-latest
    # Fail fast instead of the 360-min default if a hang sneaks in; the healthy
    # job finishes in ~30-45 min (compile-bound at CARGO_BUILD_JOBS=1).
    timeout-minutes: 90
    needs: [changes, rust-build]
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.test_tier == 'true' && !inputs.skip_tests
    # NO sccache here (reverted from #920): with RUSTC_WRAPPER=sccache this job's
    # root-crate test-binary compile OOM-killed the 16GB runner 3/3 times on
    # 2026-07-13 (exit 143 after ~10min of silence mid-compile — the documented
    # "runner received a shutdown signal" signature CARGO_BUILD_JOBS=1 exists to
    # prevent). The three heavy COMPILE jobs keep sccache (proven green ~20min);
    # this job stays on rust-cache alone, its last-known-good profile.
    strategy:
      fail-fast: false
      matrix:
        include:
          - test-type: unit
            args: "--lib"
            threads: 4
          - test-type: doc
            args: "--doc"
            threads: 4
    env:
      # TD-PROTO-2: the v1-mirror conformance guard runs in this job (unit
      # lane). Requiring protoc keeps a skip distinguishable from a pass —
      # if the protobuf-compiler install ever quietly fails, the gate FAILS
      # instead of disarming to green.
      REQUIRE_PROTOC: "1"
    steps:
      - name: Reclaim disk space
        # ubuntu-latest ships ~25 GB of preinstalled toolchains this build never
        # uses (Android SDK, .NET, GHC/Haskell, boost). Removing them frees the
        # disk the large Rust target/ dir needs — otherwise the runner hits
        # "No space left on device" and fails the job at random (infra, not code).
        run: |
          echo "Disk before reclaim:"; df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/boost || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "Disk after reclaim:"; df -h /

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-nightly-dev"
          shared-key: "build"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler

      # Unit tests run under nextest for process-per-test isolation: the suite
      # has tests that touch process-global statics (WAL registry, metadata
      # provider, request-id counter) and race under libtest's shared-process
      # parallelism. nextest gives each test its own process. Doc tests stay on
      # `cargo test` (nextest does not run doc tests).
      - name: Install nextest
        if: matrix.test-type == 'unit'
        uses: taiki-e/install-action@nextest

      # OOM insurance for the unit matrix row: the root crate's 8400-test lib
      # binary peaks close to the 16GB hosted-runner ceiling during the
      # single-rustc codegen+link phase (CARGO_BUILD_JOBS=1 serializes CRATE
      # compiles but cannot cap that one process). Two runner OOM-kills
      # ("shutdown signal", exit 143) happened on 2026-07-13 even with
      # CARGO_PROFILE_*_DEBUG=0 (#919). 12G of swap on the big ephemeral /mnt
      # disk turns a residual spike into a slowdown instead of a dead runner.
      - name: Add swap headroom
        if: matrix.test-type == 'unit'
        run: |
          sudo fallocate -l 12G /mnt/swapfile-ci
          sudo chmod 600 /mnt/swapfile-ci
          sudo mkswap /mnt/swapfile-ci
          sudo swapon /mnt/swapfile-ci
          free -h

      - name: Run Tests
        run: |
          if [ "${{ matrix.test-type }}" = "unit" ]; then
            # CARGO_BUILD_JOBS=1: the root `proximadb` crate's test binary
            # (8400+ tests) is memory-heavy to compile; serializing crate
            # compilation keeps the 16GB hosted runner from OOMing (it was
            # being killed mid-link with exit 143 / "runner received a shutdown
            # signal"). --test-threads bounds nextest's run-phase memory too.
            CARGO_BUILD_JOBS=1 cargo nextest run --lib --profile unit --test-threads=2
          else
            cargo test ${{ matrix.args }} -- --test-threads=${{ matrix.threads }}
          fi

  # ============================================================================
  # TOUCHED-CRATE FAST LANE (D4 / TD-DECOMP-1 follow-up) — ADVISORY, never a gate.
  # Gives seconds-to-minutes-scale unit-test feedback for LEAF / workspace-member
  # edits by compiling only the crates whose source changed vs origin/develop
  # (scripts/affected_crates.py — DIRECT crates only, no reverse-dependents). The
  # required `rust-test` job still runs the full suite; this is the early signal.
  # Advisory (continue-on-error) AND not in ci-success.needs, so a misfire can
  # never block a merge. The root `proximadb` crate is deliberately SKIPPED here:
  # a src/** edit maps to it, and compiling the ~850K-LOC monolith's lib would be
  # both redundant with rust-test and OOM-prone (the #920 scenario rust-test works
  # around with 12G swap + CARGO_BUILD_JOBS=1). This lane targets leaf edits,
  # where it pays off — more so as TD-DECOMP-1 follow-ups move logic DOWN into
  # leaf crates. rust-cache only (no sccache): leaf crates are small, and sccache
  # adds the #920 OOM risk for no gain at this scale.
  #
  # SKIPPING THE ROOT CRATE BY NAME IS NOT ENOUGH (fixed here). `-p <crate>`
  # compiles that crate's WHOLE dependency graph, and 8 workspace members
  # path-depend on the root monolith (the 3 crates/binding/* bindings, the 4
  # apps/*, and clients/rust `proximadb-sdk` via a non-optional
  # `proximadb-embedded`). So a diff touching e.g. proximadb-embedded selected
  # `-p proximadb-embedded` and dragged the entire monolith back in — the exact
  # cost this lane exists to avoid. Measured: such runs compiled 600+ third-party
  # crates from cold and were still on tantivy/tokenizers/lalrpop when the
  # timeout killed them, burning a full runner slot for ZERO signal (~39% of the
  # runs that actually ran, all at the timeout wall). The cache could never
  # amortize it either: rust-cache saves only on success, and the ONLY cache a
  # PR can inherit — the develop-branch one — is written by develop pushes where
  # `git diff origin/develop...HEAD` is empty by construction, so that cache
  # holds a cargo registry and no compiled artifacts. Every real run therefore
  # started at "No cache found."
  # The fix is to make the selection honor the lane's own name: exclude the root
  # monolith AND its transitive workspace dependents (9 of 124 crates; 115 stay
  # eligible), so this lane only ever compiles genuinely cheap graphs. The 9
  # excluded crates remain covered by the required rust-test job; they become
  # eligible again as TD-DECOMP-1 moves logic out of the monolith.
  # ============================================================================
  rust-affected-fast:
    name: Rust touched-crate fast check (advisory)
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true        # advisory — never a merge gate (also not in ci-success.needs)
    # 10m is a CANARY, not a budget: with the selection fixed this lane is a
    # cheap leaf compile plus fast unit tests. Production-scale ratchets stay in
    # their required, explicitly budgeted lanes below; duplicating one here made
    # 709/710 fast tests pass before the job was cancelled on the final N=100k
    # recall harness. If a future dependency edge makes the remaining graph
    # heavy again, fail after 10 wasted minutes, not 15.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so affected_crates.py's `git diff origin/develop...HEAD`
          # (three-dot, merge-base) resolves across a large develop→main gap.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-affected-fast"
          shared-key: "build"
          # A genuine test/compile FAILURE here is the signal this lane exists to
          # give; saving its (small, leaf-only) target/ means the fix push on the
          # same PR rebuilds warm instead of repeating the cold compile.
          cache-on-failure: true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Affected-only fast unit check
        run: |
          set -euo pipefail
          # --exclude-dependents-of proximadb drops the root monolith AND every
          # workspace member that transitively depends on it (see job header):
          # `-p X` compiles X's whole dependency graph, so those crates are never
          # cheap here. They stay covered by the required rust-test job. The
          # script names the dropped crates on stderr, so the log still says why.
          pkgs="$(python3 scripts/affected_crates.py --exclude-dependents-of proximadb origin/develop)"
          if [ -z "$pkgs" ]; then
            echo 'No eligible leaf crate changed — nothing fast to check here.'
            exit 0
          fi
          # Bare positionals to cargo/nextest are TEST-NAME FILTERS, not package
          # selectors — turn the space-separated list into -p args.
          pkg_args=""
          for p in $pkgs; do
            pkg_args="$pkg_args -p $p"
          done
          echo "Affected leaf crates:$pkg_args"
          # This production-scale synthetic recall ratchet takes minutes by
          # design. The required 90-minute rust-test/unit lane still runs it;
          # only this explicitly advisory fast-feedback lane excludes it.
          # --no-tests=pass: a PR whose touched crates have no #[cfg(test)]
          # unit tests makes nextest exit 4 ("no tests to run"), reddening this
          # lane for a PR that did nothing wrong. Observed on #1701 (typed
          # graph properties). Advisory lanes must stay signal, not noise —
          # a lane that cries wolf is one people stop reading.
          cargo nextest run --lib --profile unit --no-tests=pass \
            -E 'not test(rabitq_cold_recall_harness_n100000_recall_at_10)' \
            $pkg_args

  # TD-168 develop early-detection: run the CHEAP object-store Cool-tier tests
  # (scripts/run_cloud_emulator_tests.sh --fast — compiles only the small
  # object-store crate, ~3-5m; no main-crate compile / no OOM risk) whenever the
  # tier-mapping code changes. This is the regression coverage for the cloud-tier
  # path: the same put_with_tier_* validation that runs at develop→qa now also runs
  # on the introducing feat→develop PR. Path-gated (skipped otherwise) and in
  # ci-success.needs so it gates when it runs (skipped ⇒ pass). Requires Docker
  # (Azurite/MinIO/fake-gcs), preinstalled on ubuntu-latest.
  object-store-emulator-tests:
    name: Object-store Cool tier (emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: |
      !inputs.skip_tests &&
      needs.changes.outputs.test_tier == 'true' &&
      needs.changes.outputs.object_store_cloud_changes == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-cloud-emulator-fast"
      - name: Run object-store tier tests against emulators (--fast)
        # docker + aws/az CLIs are preinstalled on ubuntu-latest runners.
        run: bash scripts/run_cloud_emulator_tests.sh --fast

  # TD-OBJSTORE-5 S1 (ADR-063 D8 PR tier): full-server object-store RESTARTABILITY
  # recovery over Azurite (adls://). Spawns the real proximadb-server against one
  # object-store prefix, SIGKILLs it, and recovers catalog + WAL-replays collections
  # on a fresh local disk — the process-boundary proof for the TD-OBJSTORE-1 batch-3
  # regression class. Path-gated on the WAL-recovery / durable-write / object-store
  # filesystem / catalog code so it runs on the introducing PR (e.g. an in-flight
  # recovery rework) — the exact churn a post-hoc gate would miss. Compiles the
  # server binary (heavy), so it's a dedicated job: reclaim-disk + sccache +
  # CARGO_BUILD_JOBS=1 (in the script) for the 16GB-runner OOM cliff. Path-gated
  # (skipped otherwise) and in ci-success.needs so it gates when it runs.
  object-store-restart-recovery:
    name: Object-store restart recovery (Azurite)
    runs-on: ubuntu-latest
    # The `--restart` scope (scripts/run_cloud_emulator_tests.sh) builds 3 test
    # targets across distinct cloud feature sets (azure; aws,azure,gcp) at
    # CARGO_BUILD_JOBS=1 (OOM-safe on the 16GB runner). No other CI job builds
    # these feature sets, so they are always a COLD compile (~85-90 min) — the
    # prior 90-min budget timed out at the edge. Bumped to 150 for reliable
    # headroom. (Efficiency follow-up: warm these feature sets in a shared
    # earlier job, or split the contract test out of --restart.)
    timeout-minutes: 150
    needs: [changes]
    if: |
      !inputs.skip_tests &&
      needs.changes.outputs.test_tier == 'true' &&
      needs.changes.outputs.object_store_restart_changes == 'true'
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /home/runner/.cache/sccache
    steps:
      - name: Reclaim disk space
        run: |
          echo "Disk before reclaim:"; df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/boost || true
          echo "Disk after reclaim:"; df -h /
      # The `--restart` scope compiles the full root `proximadb` crate as
      # `proximadb-server` under a single rustc invocation (CARGO_BUILD_JOBS=1).
      # Its peak (type-check + monomorphization + codegen of the 940-file crate
      # with the azure object_store generics) exceeds the runner's 16GB RAM, and
      # ubuntu-latest ships with NO swap — so the peak OOM-kills mid-compile
      # (observed: dies ~64 min in, still compiling dev-deps, test never runs).
      # Root cause is the monolithic root crate (tracked for decomposition); the
      # immediate mitigation mirrors the unit-matrix job (the "Add swap headroom"
      # step below this): 12G of swap on the big ephemeral /mnt disk turns the
      # residual spike into a slowdown instead of a dead runner. jobs stays 1
      # (the established OOM-safe setting; jobs=2 would re-risk the kill).
      - name: Add swap headroom
        run: |
          sudo fallocate -l 12G /mnt/swapfile-ci
          sudo chmod 600 /mnt/swapfile-ci
          sudo mkswap /mnt/swapfile-ci
          sudo swapon /mnt/swapfile-ci
          free -h
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-objstore-restart"
          # This job is compile-bound and sits at the edge of its 90-minute
          # budget: a WARM run finishes in ~75 min, a COLD one does not finish at
          # all (observed: 72 min in, still emitting compile warnings, then
          # killed). rust-cache saves `target/` only on success by default, so a
          # single failure starts a loop it cannot leave — the run fails, saves
          # nothing, and the next run is cold again and fails for the same
          # reason. Caching on failure persists the partial `target/` so the next
          # attempt starts warm and completes. (`CARGO_BUILD_JOBS=1` is already
          # set inside run_cloud_emulator_tests.sh for the memory cliff; this is
          # the other half.)
          cache-on-failure: true
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: actions/cache@v6
        with:
          path: /home/runner/.cache/sccache
          key: sccache-restart-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: sccache-restart-${{ runner.os }}-
      - name: Prove full-server restart recovery over Azurite (adls://)
        # docker + aws/az CLIs preinstalled on ubuntu-latest; the script starts
        # Azurite and runs catalog_wal_and_sst_survive_fresh_local_disks.
        run: bash scripts/run_cloud_emulator_tests.sh --restart

  # Targeted integration tests based on changed components
  rust-integration-test-storage:
