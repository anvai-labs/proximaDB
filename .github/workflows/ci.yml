      - name: Run Query Integration Tests
        run: |
          for test_file in tests/*query*.rs tests/*federated*.rs tests/*cache*.rs tests/filtered_ann_recall_bands.rs tests/query_cache_test.rs tests/vector_ann_recall_e2e.rs tests/retrieval_quality_gates.rs tests/nl_translate_eval.rs; do
            if [ -f "$test_file" ]; then
              test_name=$(basename "$test_file" .rs)
              echo "Running $test_name..."
              cargo test --test "$test_name" -- --test-threads=1
            fi
