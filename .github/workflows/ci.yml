      - name: Run Storage Integration Tests
        run: |
          # Run only explicitly named storage test files (avoids compiling all tests)
          for test_file in tests/*sst*.rs tests/*storage*.rs tests/*wal*.rs tests/embedded_tenant_context.rs tests/td112_postflush_recall_e2e.rs tests/mlflow_run_store_test.rs; do
            if [ -f "$test_file" ]; then
              test_name=$(basename "$test_file" .rs)
              echo "Running $test_name..."
              cargo test --test "$test_name" -- --test-threads=1
            fi
          done

  # TD-MLOPS-1 slice 2: real-client MLflow conformance ratchet. Builds the
  # server, spawns it with PROXIMADB_MLFLOW_COMPAT_ENABLE=1, and drives the
  # canonical workflow through the REAL mlflow client (mlflow-skinny, PINNED
  # — unpinned latest would make the counts-only-up ratchet drift upstream).
  # The ratchet high-water lives in clients/python/tests/mlflow_conformance_steps.txt.
  mlflow-conformance:
    name: MLflow conformance (real client)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [changes, rust-build]
    if: |
      !inputs.skip_tests &&
      needs.changes.outputs.test_tier == 'true' &&
      needs.changes.outputs.rust == 'true'
    env:
      PROXIMADB_MLFLOW_COMPAT_ENABLE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-nightly-dev"
          shared-key: "build"
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - name: Build server binary
        run: cargo build -p proximadb-server
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pinned mlflow client
        run: python -m pip install "mlflow-skinny==2.14.3" requests
      - name: Spawn server and run conformance workflow
        run: |
          set -euo pipefail
          DATA_DIR="$(mktemp -d)"
          # The unified server binds its configured port (5678 by default);
          # `-p` does not override it — probe the port it actually serves.
          PORT=5678
          ./target/debug/proximadb-server -d "$DATA_DIR" &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:$PORT/health/live" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -sf "http://127.0.0.1:$PORT/health/live" > /dev/null
          cd clients/python
          python tests/mlflow_conformance.py "http://127.0.0.1:$PORT" | tee /tmp/conformance.log
      - name: Ratchet — passing steps only go up
        run: |
          PASSED=$(grep -c '^PASS ' /tmp/conformance.log || true)
          RATCHET=$(cat clients/python/tests/mlflow_conformance_steps.txt)
          echo "passed=$PASSED ratchet=$RATCHET"
          if [ "$PASSED" -lt "$RATCHET" ]; then
            echo "::error::MLflow conformance regressed: $PASSED < $RATCHET steps. If intentional, lower the ratchet in the same PR with justification."
            exit 1
          fi

  rust-integration-test-authz:
    name: Rust Integration Tests (authz e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # `needs: [changes]` ONLY — deliberately not `rust-build`. `rust-build` is
    # itself gated on the `rust` filter (src/**, crates/**, apps/**, Cargo*),
    # so depending on it makes this lane inherit that gate transitively and skip
    # on any PR that changes only tests/** or .github/** — which is precisely
    # what happened on the first two pushes of #1544. This lane compiles what it
    # needs via its own `cargo test`, so the dependency bought nothing.
    # `rust-integration-test-pgwire-accuracy` gets this right and is the model.
    needs: [changes]
    # The `rust` filter is deliberately NOT ANDed in here: it covers src/**,
    # crates/**, apps/** and the Cargo files, but NOT tests/** or .github/**, so
    # requiring it would skip this lane on exactly the PRs that change the authz
    # tests or this wiring — which is what happened on the first push of #1544.
    # `authz_changes` already scopes the lane correctly on its own.
    # NOTE: this suite is `#![cfg(feature = "abac-policy")]`, which is NOT a
    # default feature — WITHOUT `--features abac-policy` the file compiles to
    # ZERO tests and the job passes while verifying nothing. That is exactly how
    # the suite sat dormant: no lane ran it, and a run without the feature would
    # have looked green anyway.
    if: |
      !inputs.skip_tests &&
      needs.changes.outputs.test_tier == 'true' &&
      needs.changes.outputs.authz_changes == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-nightly-dev"
          shared-key: "build"
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - name: Run Authorization E2E (live transports)
        run: |
          set -uo pipefail
          # NOTE: deliberately NOT `set -e` around the capture. With `-e`, a
          # failing cargo aborts the step BEFORE the echo, so the failure reason
          # is swallowed and the job reports red with no diagnostic — which is
          # exactly what happened on the first run of this lane.
          status=0
          output=$(cargo test --features abac-policy --test abac_relational_transport_e2e -- --test-threads=1 --nocapture 2>&1) || status=$?
          echo "$output"
          if echo "$output" | grep -qE "running 0 tests"; then
            echo "::error::the authz e2e suite compiled to ZERO tests - the abac-policy feature is not enabled, so this job verified nothing."
            exit 1
          fi
          exit "$status"

  rust-integration-test-query:
    name: Rust Integration Tests (query)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, rust-build]
    if: |
