          # Explicitly named only — verify each passes before adding (these were
          # not previously in any CI glob). Add the cdc_* / external_collection_bm25
          # tests as follow-ups once verified (cdc_* require the cdc-kafka feature).
          for test_name in tst_integration_test external_collection_index_in_place_test; do
            if [ -f "tests/${test_name}.rs" ]; then
              echo "Running $test_name..."
              cargo test --test "$test_name" -- --test-threads=1
            fi
          done

  rust-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    # FULL tier only (qa -> main). rust-test runs at the MEDIUM tier (qa), but
    # coverage is expensive, so gate it to the main-promotion gate explicitly.
    needs: [changes, rust-test]
    if: needs.changes.outputs.extensive == 'true'
    continue-on-error: true
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /home/runner/.cache/sccache
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-nightly-coverage"
      # sccache complements rust-cache: caches individual rustc invocations
      # (content-addressed), so it hits even when the target/ artifact cache misses.
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: actions/cache@v6
        with:
          path: /home/runner/.cache/sccache
          key: sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: sccache-${{ runner.os }}-
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
          cargo install cargo-tarpaulin
      - name: Generate Coverage
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
          # Serialize crate compilation: the root crate's instrumented test
          # binary OOM-kills the 16GB runner (exit 143) during the build phase,
          # before the `|| echo continuing` fallback can run. Same peak-rustc
          # -memory issue mitigated in the unit-test job.
          CARGO_BUILD_JOBS: 1
        run: |
          # Use --lib only and limit parallelism to avoid OOM on CI runners
          cargo tarpaulin --lib --timeout 600 \
            --out xml --out html \
            --output-dir coverage \
            --skip-clean \
            --jobs 2 \
            --fail-under 60 || echo "Coverage generation failed (may be OOM), continuing"
      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
      - uses: codecov/codecov-action@v7
        if: always()
        with:
          files: coverage/cobertura.xml
          fail_ci_if_error: false
      - name: sccache stats
        run: sccache --show-stats || true

  # ============================================================================
  # PYTHON SDK TESTS
  # ============================================================================
  python-test:
    name: Python SDK Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Defense-in-depth: the suite runs in ~9min (measured, TD-CI-2; the "~5min"
    # this comment used to claim was stale). If a future test leaks a
    # non-daemon thread / unshutdown pool, the interpreter's atexit join can hang
    # the job for hours. Cap it so a leak fails fast instead of stalling CI.
    timeout-minutes: 20
    needs: changes
    strategy:
      matrix:
        # 3.9 dropped: the package declares requires-python ">=3.10".
        #
        # The matrix WIDTH is the cost dial (TD-CI-2). At promotion the full
        # three-interpreter sweep runs; on feat->develop only 3.12 does, because
        # the failure this lane exists to catch is almost never version-specific
        # -- a broken test breaks on every interpreter -- while the width is
        # what costs runner time. Measured: 8.89 min mean per job-run, so three
        # versions is 26.7 runner-minutes per PR and one is 8.9.
        python-version: >-
          ${{ (needs.changes.outputs.medium_tier == 'true'
               && fromJSON('["3.10", "3.11", "3.12"]'))
              || fromJSON('["3.12"]') }}
    # Runs at promotion (medium_tier) AND on any feat->develop PR that actually
    # touches Python (TD-CI-2). Before this, the suite was medium_tier-only, so
    # ~4,500 tests never ran on the PR that introduced a Python change: measured
    # on #1679, which rewrote large parts of the SDK, five Python gates ran and
    # this one was SKIPPED. Breakage therefore landed on develop and waited for
    # whoever promoted next to diagnose it.
    if: ${{ !inputs.skip_tests && (needs.changes.outputs.medium_tier == 'true' || needs.changes.outputs.python == 'true') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: clients/python/pyproject.toml
      - name: Install dependencies
        working-directory: clients/python
        run: |
          # Optional-feature deps exercised by *_cov tests (arrow/pandas/openapi
          # contract/process metrics). Without them those modules fail to import
          # and pytest aborts at collection.
          pip install -e ".[dev]" pyarrow pandas jsonschema psutil
      # Cache the sentence-transformers model so repeated runs don't re-hit the HF
      # Hub (a 429 there previously aborted pytest collection). tests/embedding_utils
      # falls back to deterministic vectors if the model is still unavailable, so
      # neither the cache miss nor the prefetch failure can break the suite.
      - name: Cache HuggingFace model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-${{ runner.os }}
      - name: Pre-fetch embedding model (best-effort)
        continue-on-error: true
        env:
          HF_HUB_DOWNLOAD_TIMEOUT: "30"
        run: |
          python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')" || true
      - name: Run SDK unit tests
        working-directory: clients/python
        env:
          PROXIMADB_EMBEDDED: "0"
          HF_HUB_DOWNLOAD_TIMEOUT: "30"
        run: |
          # Per-file process isolation for the SDK unit suite.
          #
          # Several *_cov tests stub heavy optional deps (sentence_transformers,
          # torch, openai, ...) into sys.modules — some at MODULE/collection level,
          # some via monkeypatch. These leak across files in a shared interpreter
          # and break later REAL tests (e.g. test_embedding_providers_v2 getting a
          # fake sentence_transformers). The leak is MULTI-FILE emergent (not
          # pairwise-reducible) and collection-time, so neither xdist/forked nor
          # excluding a known subset is airtight. Running EACH file in its own
          # process is the only guaranteed fix — a file's stubs cannot escape its
          # process. Parallelized for speed; failures print with ::error::.
          #
          # Permanently skipped (not isolation-related):
          #   victor_cov -> imports the internal, unpublished `victor` package
          #
          # `chunking_code` used to be listed here as "needs tree-sitter grammars
          # not installed in CI". TD-CG2 S4 deleted the in-SDK grammars, so that
          # reason became false while the exclusion stayed -- and the file was
          # silently red outside the gate. It now skips ITSELF via importorskip
          # on the optional `codegraph` extra, so it is honest in both
          # environments and needs no name-based exclusion here.
          set -u
          SKIP_RE='test_integrations_victor_cov'
          # Run one file in its own process. exit 0 = ok, 5 = no tests collected
          # (e.g. a whole module importorskip-skipped) -> ok; anything else fails.
          test_one() {
            o=$(pytest "$1" -q --timeout=120 -p no:cacheprovider 2>&1); r=$?
            if [ "$r" -ne 0 ] && [ "$r" -ne 5 ]; then
              echo "::error::FAILED $1 (exit $r)"; echo "$o" | tail -25; return 1
            fi
            echo "ok: $1"; return 0
          }
          export -f test_one
          # `xargs -n1 bash -c 'test_one "$0"'` passes each file as $0 (no -I
          # substitution, so no BSD/GNU command-length quirk). xargs exits non-zero
          # (123) if any invocation failed -> the step fails.
          find tests/unit -name 'test_*.py' | sort | grep -vE "$SKIP_RE" | \
            xargs -P 4 -n 1 bash -c 'test_one "$0"'

  # SDK coverage ratchet — moved here from qa-gate.yml so a Python-SDK coverage
  # regression is caught on the introducing feat→develop PR, not at develop→qa.
  # Path-gated on the python filter (clients/python/**, clients/python-embedded/**,
  # proto/**) and wired into ci-success.needs so it gates when it runs (skipped ⇒
  # pass). Tolerates the known _cov sys.modules-leak failures — the ratchet measures
  # coverage, not pass/fail (the python-test matrix owns per-file correctness).
  sdk-coverage-ratchet:
    name: SDK Coverage Ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: ${{ !inputs.skip_tests && needs.changes.outputs.python == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: clients/python/pyproject.toml
      - name: Install SDK + coverage deps
        working-directory: clients/python
        run: pip install -e ".[dev]" pytest-cov pyarrow pandas jsonschema psutil
      - name: Run SDK tests with coverage
        working-directory: clients/python
        env:
          PROXIMADB_EMBEDDED: "0"
          HF_HUB_DOWNLOAD_TIMEOUT: "30"
          PROXIMADB_TEST_FORCE_FALLBACK_EMBEDDINGS: "1"
        run: |
          # Coverage needs a single aggregating process; tolerate the known
          # _cov sys.modules-leak failures (the ratchet measures coverage, not
          # pass/fail). OFFLINE unit tests only: filter out `integration` (needs
          # a running server) and `live` (needs an external dependency / network).
          pytest tests/unit/ -q -p no:cacheprovider --timeout=120 \
            --cov=proximadb_sdk --cov-report=json:/tmp/sdk-cov.json \
            -m "not integration and not live" \
            --ignore=tests/unit/test_chunking_code_cov.py \
            --continue-on-collection-errors || true
          test -f /tmp/sdk-cov.json
      - name: Ratchet check
        run: |
          python3 scripts/coverage_ratchet.py normalize --sdk /tmp/sdk-cov.json -o /tmp/sdk-current.json
          python3 scripts/coverage_ratchet.py check \
            --baseline docs/_internal/roadmap/COVERAGE_BASELINE.json \
            --current /tmp/sdk-current.json

  # TD-CHUNK-1 / ADR-091: the chunking conformance ratchet.
  #
  # Chunking had NO gate at all. `sdk-coverage-ratchet` runs `tests/unit/` only,
  # so `tests/chunking/` was never executed by CI — which is precisely how 56
  # failing tests came to live on develop unnoticed while the subsystem carried no
  # tier in docs/SUPPORTED_SURFACE.adoc.
  #
  # This job runs the invariant sweep (ADR-091's axioms over the shared corpus)
  # against a RECORDED baseline. It is a bidirectional ratchet: a new violation
  # fails, and a *fixed* violation also fails until the baseline is updated in the
  # same commit — so a defect cannot be repaired silently, nor rot back.
  #
  # Deliberately narrow and fast (~30s): it does not run the rest of
  # tests/chunking/, whose pre-existing failures are TD-CG2's business. Widening
  # it to the whole directory is a step in TD-CG2, not here.
  chunking-conformance:
    name: Chunking Conformance + Quality Evals (TD-CHUNK-1/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: ${{ !inputs.skip_tests && needs.changes.outputs.python == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: clients/python/pyproject.toml
      - name: Install SDK
        working-directory: clients/python
        run: pip install -e ".[test]"
      # Runs the whole file, so this covers BOTH gates: the deterministic
      # invariant ratchet and the rubric-scored quality evals. Tests cover what
      # has a right answer; evals cover boundary quality, which does not.
      - name: Run the chunking invariant sweep and the quality evals
        working-directory: clients/python
        # The capability suites are listed explicitly rather than by running
        # tests/chunking/ wholesale: that directory also holds the code-path
        # suites, which need the optional `codegraph` extra this job does not
        # install. Naming them keeps the gate narrow AND keeps it able to SEE
        # the thing it is named for -- the eval floors for TD-CHUNK-3's
        # capabilities were unreachable from this job while it ran only the
        # conformance file.
        run: |
          pytest \
            tests/chunking/test_chunking_conformance.py \
            tests/chunking/test_chunk_passes.py \
            tests/chunking/test_capability_evals.py \
            tests/chunking/test_processor_pass_wiring.py \
            tests/chunking/test_native_boundaries.py \
            -q -p no:cacheprovider --timeout=300 -o addopts=""

  # ============================================================================
  # INTEGRATION TESTS - Server + Python SDK
  # ============================================================================
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, rust-build, python-test]
    if: ${{ !inputs.skip_tests && needs.changes.outputs.extensive == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: clients/python/pyproject.toml

      - name: Download Server Binary
        uses: actions/download-artifact@v8
        with:
          name: proximadb-server-linux-x64

      - name: Install SDK Dependencies
        working-directory: clients/python
        run: pip install -e ".[dev]"

      - name: Generate Protobuf Stubs (if needed)
        run: |
          pip install grpcio-tools
          mkdir -p clients/python/src/proximadb/v1
          python -m grpc_tools.protoc \
            --proto_path=proto \
            --python_out=clients/python/src/proximadb \
            --grpc_python_out=clients/python/src/proximadb \
            proto/proximadb/v1/*.proto || echo "Protobuf generation skipped"
          echo "Protobuf generation complete"

      - name: Verify Protobuf Files Exist
        run: |
          if ls clients/python/src/proximadb/v1/*_pb2*.py 1>/dev/null 2>&1 || \
             ls clients/python/src/proximadb/*_pb2*.py 1>/dev/null 2>&1; then
            echo "Protobuf files found"
          else
            echo "::warning::No protobuf files found - using pre-compiled stubs"
          fi

      - name: Prepare Server
        run: chmod +x proximadb-server

      - name: Start Server
        run: |
          ./proximadb-server --config config/config.toml &
          echo $! > server.pid
          echo "Waiting for server to be ready..."
          timeout 60 bash -c 'until curl -sf http://localhost:5678/health; do sleep 1; done'
          echo "Server is ready"

      - name: Run Integration Tests
        working-directory: clients/python
        run: |
          set +e
          # Skip tests requiring native embedded bindings (PyO3 not built in CI)
          timeout 900 bash -c '
            PROXIMADB_URL=http://localhost:5678 \
            PROXIMADB_GRPC_URL=http://localhost:5679 \
            pytest tests/integration/ -v --tb=short --timeout=120 \
              --ignore=tests/integration/test_batching_real_server.py \
              --ignore=tests/integration/test_connection_pools.py \
              --ignore=tests/integration/test_grpc_sync_real_server.py \
              --ignore=tests/integration/test_operation_router_integration.py \
              --ignore=tests/integration/test_entity_store_comprehensive.py \
              --ignore=tests/integration/test_entity_store_extended.py \
              --ignore=tests/integration/test_sks_graph_first_integration.py \
              --ignore=tests/integration/test_sks_semantic_graph_and_vector.py \
              --ignore=tests/integration/test_sql_integration.py \
              --ignore=tests/integration/test_semantic_chunking_integration.py \
              --ignore=tests/integration/test_integration.py \
              --ignore=tests/integration/test_multilang_code_indexing.py \
              --ignore=tests/integration/test_chunking_embedding_integration.py \
              --ignore=tests/integration/test_chunking_embedding_benchmark.py \
              --ignore=tests/integration/test_graph_operations.py \
              --ignore=tests/integration/test_code_indexing_integration.py \
              --ignore=tests/integration/test_response_cache_integration.py 2>&1 | tee pytest_output.txt
          '
          exit_code=${PIPESTATUS[0]:-$?}
          set -e
          # Handle pytest daemon thread hang (exit 124 = timeout killed)
          if [ "$exit_code" -eq 124 ]; then
            if grep -qE "[0-9]+ passed" pytest_output.txt; then
              echo "WARNING: pytest hung after completion (daemon thread cleanup), treating as completed"
              # Still exit with failure if tests failed, success if all passed
              if grep -qE "[0-9]+ failed|[0-9]+ error" pytest_output.txt; then
                exit 1
              fi
              exit 0
            fi
          fi
          exit ${exit_code}

      - name: Collect Server Logs on Failure
        if: failure()
        run: |
          echo "=== Server process status ==="
          ps aux | grep proximadb || true
          echo "=== Server logs (if available) ==="
          cat /tmp/proximadb*.log 2>/dev/null || echo "No log files found"

      - name: Cleanup
        if: always()
        run: |
          if [ -f server.pid ]; then
            pid=$(cat server.pid)
            if kill -0 "$pid" 2>/dev/null; then
              echo "Stopping server (PID: $pid)..."
              kill "$pid" 2>/dev/null || true
              sleep 2
              # Force kill if still running
              kill -9 "$pid" 2>/dev/null || true
            fi
          fi

  # ============================================================================
  # DOCKER BUILD - Container testing
  # ============================================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: (needs.changes.outputs.docker == 'true' || needs.changes.outputs.rust == 'true') && needs.changes.outputs.extensive == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build Docker Image
        # Build the image we actually publish (deploy/docker/Dockerfile,
        # target `runtime`) so CI exercises the shipped OSS server, not the
        # demo image. The published artifact comes from publish-image.yml.
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: runtime
          push: false
          load: true
          tags: proximadb:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Container Health
        run: |
          docker run -d --name test-container \
            -p 5678:5678 -p 5679:5679 \
            proximadb:test

          echo "Waiting for ProximaDB server to start..."
          if timeout 180 bash -c 'until curl -sf http://localhost:5678/health; do sleep 3; done'; then
            echo "=== Health Check Passed ==="
            curl -s http://localhost:5678/health | jq .
          else
            echo "=== Health Check Failed - Container Logs ==="
            docker logs test-container 2>&1 | tail -100
            docker stop test-container || true
            docker rm test-container || true
            exit 1
          fi

          docker stop test-container
          docker rm test-container

  # ============================================================================
  # BENCHMARKS - Performance testing (optional)
  # ============================================================================
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: [rust-build]
    if: |
      inputs.run_benchmarks ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-nightly-bench"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler

      - name: Run Benchmarks
        run: |
          cargo bench --bench bench_21_query_cache -- --noplot 2>&1 | tee bench-results.txt

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: bench-results.txt
          retention-days: 30

  # ============================================================================
  # TPC PERF EVIDENCE LEDGER (TD-OLAP-4 P0b) — ADVISORY, never a merge gate.
  # Records latency + bytes-scanned per query x route (native vs DataFusion)
  # into a JSON ledger artifact on develop pushes / manual dispatch. Gate
  # (ratchet on a budget) only once variance is bounded — mirror the
  # pax-recall-ratchet advisory-until-stable pattern. NOT in ci-success needs.
  # ============================================================================
  tpc-perf-ledger:
    name: TPC Perf Evidence Ledger (advisory)
    runs-on: ubuntu-latest
    needs: [rust-build]
    continue-on-error: true
    timeout-minutes: 60
    if: |
      inputs.run_benchmarks ||
      (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-tpc-perf"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler

      - name: Run TPC perf ledger harness (small scale, advisory)
        env:
          TPC_PERF_SCALE: "0.001"
          TPC_PERF_LEDGER_OUT: target/tpc-perf-ledger/ledger.json
          # Debug-build planning of join+subquery-heavy TPC shapes runs deep;
          # 16 MiB thread stacks guard against environment-dependent overflow.
          RUST_MIN_STACK: "16777216"
        run: |
          cargo test --test tpc_perf_ledger_e2e -- --ignored --nocapture 2>&1 | tail -40

      - name: Upload ledger artifact
        uses: actions/upload-artifact@v7
        with:
          name: tpc-perf-ledger
          path: target/tpc-perf-ledger/ledger.json
          retention-days: 30

  # ============================================================================
  # PROMOTION FRESHNESS GATE
  # ============================================================================
  # A develop->qa (or qa->main) promotion PR must contain the LATEST commits of
  # its source branch. Promotion PRs deliberately use a fixed `release/...` head
  # (so incoming feat->develop merges can't synchronize/cancel the run), but that
  # means develop can advance *after* the PR is opened, leaving the PR snapshot
  # stale — merging it would DROP the newer commits (the #992 failure, where 47
  # paths / #983/#984/#988/#990 were omitted). This gate fails if the source
  # branch has commits not in the PR head, blocking the merge until the PR is
  # refreshed. Skips on non-promotion PRs (and push events); ci-success treats a
  # `skipped` result as pass.
  promotion-freshness:
    name: Promotion Freshness (head must contain source branch)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && contains(fromJson('["qa", "main"]'), github.base_ref)
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: merge-base --is-ancestor must walk back to the source
          # branch's merge point, which a shallow clone cannot prove.
          fetch-depth: 0
      - name: Verify PR head contains the latest source branch
        run: |
          set -euo pipefail
          case "${{ github.base_ref }}" in
            qa)   SRC="develop" ;;  # develop -> qa promotion
            main) SRC="qa" ;;        # qa -> main promotion
            *)    echo "::notice::not a promotion PR (${{ github.base_ref }}); nothing to check"; exit 0 ;;
          esac
          git fetch origin "$SRC"
          if git merge-base --is-ancestor "origin/$SRC" HEAD; then
            echo "::notice::PR head contains latest origin/$SRC — fresh."
          else
            echo "::error::PR head is STALE: origin/$SRC has commits NOT in this PR. Merging now would DROP them. Refresh this PR from origin/$SRC and rerun CI."
            echo "::group::commits on origin/$SRC missing from this PR"
            git log --oneline HEAD.."origin/$SRC" | head -25
            echo "::endgroup::"
            exit 1
          fi

  # ============================================================================
  # SIFT PAX CASCADE RECALL RATCHET (feat→develop tier)
  # Catches flush/cascade/segment regressions BEFORE they reach develop — the
  # gap that let TD-FLUSH-4 (zero .pax files) land undetected. Path-filtered
  # (only fires on search/WAL/PAX changes), N=10k (fast), floor 0.85.
  # The qa-gate runs the full N=100k version; this is the early-warning tripwire.
  # ============================================================================
  sift-recall-ratchet:
    name: SIFT PAX recall ratchet (N=10k)
    needs: changes
    runs-on: ubuntu-latest
    # Release-mode compile of the recall test binary (pulls the full root crate) +
    # 10k-vector ingest measured 30m17s on 2026-08-09 (#1552) — right at the prior
    # 30m cap, so it tipped to CANCELLED under normal runner variance and blocked
    # every storage/query-touching PR via the `ci-success` aggregator. 45m gives
    # comfortable headroom without masking a genuine hang.
    timeout-minutes: 45
    # only run when search/flush/WAL/PAX/cascade code changes
    # core_changes is required, not decorative: nprobe_multiplier/min/max and the
    # coarse-probe gates live in src/core/config.rs, which matches core_changes
    # and NOT storage_changes. Without it, a PR that lowers the probe count --
    # the single most direct way to trade recall for GETs -- ran no recall
    # ratchet at all.
    if: >
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.storage_changes == 'true' ||
      needs.changes.outputs.core_changes == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-sift-ratchet"
      - name: Cache SIFT corpus
        uses: actions/cache@v6
        with:
          path: ~/sift1m
          key: sift1m-texmem-fvecs-v1
      - name: Download SIFT corpus (first-time only, cached after)
        run: |
          mkdir -p "$HOME/sift1m"
          cd "$HOME/sift1m"
          base=https://huggingface.co/datasets/qbo-odp/sift1m/resolve/main
          for f in sift_base.fvecs sift_query.fvecs sift_groundtruth.ivecs; do
            if [ ! -s "$f" ]; then
              curl -L --fail --retry 3 -o "$f" "$base/$f"
            fi
          done
      - name: Build ratchet binary
        env:
          CARGO_BUILD_JOBS: "4"
        # Cache-regime admission is fail-closed: without `io-trace`, cache
        # probes intentionally no-op and the paired cohort remains `unknown`.
        run: cargo test --release --features io-trace --test sift_pax_recall_ratchet_test --no-run
      - name: Run SIFT PAX recall ratchet (N=10000, floor=0.85)
        env:
          PROXIMADB_SIFT_DATASET_DIR: /home/runner/sift1m
          PROXIMADB_SIFT_N: "10000"
          PROXIMADB_SIFT_QUERIES: "100"
          PROXIMADB_SIFT_RECALL_FLOOR: "0.85"
          PROXIMADB_RECALL_DATASET_REQUIRED: "1"
        run: cargo test --release --features io-trace --test sift_pax_recall_ratchet_test -- --nocapture

  # ============================================================================
  # SUMMARY - Final status check
  # ============================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - deterministic-commit-contract
      - rust-format
      - capability-matrix
      - proto-compat
      - panic-policy-report
      - panic-policy-no-regression
      - panic-policy-module-guard
      - v1-proto-usage-report
      - v1-proto-usage-no-regression
      - rust-compile
      - rust-compile-benches
      - rust-clippy
      - feature-matrix
      - rust-security
      - rust-build
      - rust-test
      - rust-integration-test-storage
      - rust-integration-test-authz
      - rust-integration-test-query
      - rust-integration-test-pgwire-accuracy
      - rust-integration-test-graph
      - rust-integration-test-cluster
      - rust-integration-test-api
      - object-store-emulator-tests
      - object-store-restart-recovery
      - rust-coverage
      - python-lint
      - python-test
      - sdk-coverage-ratchet
      # chunking invariants (ADR-091 axioms) — the subsystem had no gate at all
      - chunking-conformance
      - integration-test
      - docker-build
      - docs-validation
      # SDK linting and security
      - go-lint
      - go-sdk-codegen-drift
      - rust-sdk-codegen-drift
      - nodejs-lint
      - ui-build
      - ts-sdk-codegen-drift
      - python-sdk-codegen-drift
      - python-sdk-round-trip
      - rust-sdk-lint
      - sdk-security-scan
      - sdk-contract-gates
      - connectors-contract-gates
      - spark-jni-smoke
      - openapi-spec-drift
      # gates that encode load-bearing decisions as checks
      - docs-authority
      - risk-coverage
      # SIFT PAX cascade recall ratchet (path-filtered — skips on non-search PRs)
      - sift-recall-ratchet
      # promotion correctness — a promotion PR must not be a stale snapshot
      - promotion-freshness
    if: always()
    steps:
      # HARD GATE — a promotion PR must contain the latest source-branch commits.
      # Promotion PRs use a fixed `release/...` head (churn-immune), so the source
      # branch can advance after the PR opens and leave it stale — merging would
      # DROP commits (#992). `promotion-freshness` skips on non-promotion PRs, so
      # block only on failure/cancelled and treat skipped as pass.
      - name: Require promotion freshness
        if: ${{ needs.promotion-freshness.result == 'failure' || needs.promotion-freshness.result == 'cancelled' }}
        run: |
          echo "::error::Promotion PR is stale — refresh from the source branch before merging (else commits are dropped). See the 'Promotion Freshness' job for the missing commits."
          exit 1

      # HARD GATE — Rust lib + test compile (the `rust-compile` matrix) must pass
      # whenever it runs. `rust-compile` is gated on the comprehensive `compile`
      # path filter (a SUPERSET of all code paths), so it is `skipped` ONLY for a
      # docs/non-code-only diff — safe to let through (nothing to compile).
      # Therefore block on `failure`/`cancelled` and treat `skipped` (and
      # `success`) as pass. A matrix job's `result` is 'success' only when BOTH
      # legs (lib, test) succeed, and 'failure' if either fails. Enforcement uses
      # GitHub's `needs.<job>.result` expression — NOT a shell-grep of
      # `toJSON(needs.*.result)`: the historical grep embedded a multi-line JSON
      # array with unescaped `"` into `results="..."`, which broke bash quoting so
      # it NEVER matched — `CI Success` silently passed through every failure (it
      # let the non-compiling develop of #226 merge). Do NOT restore that grep.
      - name: Require Rust compile (lib + test)
        if: ${{ needs.rust-compile.result == 'failure' || needs.rust-compile.result == 'cancelled' }}
        run: |
          echo "::error::Rust Compile (lib and/or test shape) did not pass — blocking merge."
          {
            echo "## CI Results Summary"
            echo ""
            echo "❌ Rust Compile (lib + test) is a required merge gate and did not pass."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # HARD GATE — every other required job must pass (or be skipped by its path
      # filter). `CI Success` now means ALL of CI is green, not just rust-compile.
      # A `needs.*` result of `failure`/`cancelled` fails the merge; `success` and
      # `skipped` (path-filtered jobs that did not apply) pass. This closes the gap
      # that let PR #264 merge while `openapi-spec-drift` was red: back then CI
      # Success was green solely because only `rust-compile` was hard-gated, so a
      # failing non-compile job did not block the merge.
      - name: Require all required jobs green
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::One or more required CI jobs failed or were cancelled — blocking merge. CI Success requires every required job green (or path-filtered to skipped)."
          {
            echo "## CI Results Summary"
            echo ""
            echo "❌ A required CI job failed or was cancelled."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Compile gate passed
        run: |
          {
            echo "## CI Results Summary"
            echo ""
            echo "✅ Rust Compile (lib + test) passed."
          } >> "$GITHUB_STEP_SUMMARY"
