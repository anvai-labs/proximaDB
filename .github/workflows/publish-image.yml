# Publish the ProximaDB OSS server container image to Docker Hub (multi-arch).
#
# This is the public OSS image (`vjsingh1984/proximadb`), the base AnvaiOps'
# *commercial* pipeline overlays pricing onto and pushes to ACR. It is built for
# BOTH linux/amd64 and linux/arm64 — anvaiops pins ProximaDB to an arm64 node
# pool (ADR-0016 / proximadb_node_arch = "arm64"), and arm64 also covers
# Graviton/Ampere + Apple-Silicon dev.
#
# Strategy: each arch builds natively on its own hosted runner (free for public
# repos: ubuntu-latest = amd64, ubuntu-24.04-arm = arm64), pushes BY DIGEST, and
# a final job merges both digests into one multi-arch manifest carrying the tags.
# Native beats QEMU here — emulating the heavy Rust release build would crawl.
#
# Image built: deploy/docker/Dockerfile, target `runtime` (minimal, non-root,
# Python-free debian-slim glibc OSS server). Tag scheme version + sha + latest.
# Auth: docker/login-action with DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets.
# See deploy/docker/IMAGE_PUBLISH.md for setup.
name: Publish OSS Image (Docker Hub)

on:
  push:
    tags:
      - "v*"
    branches:
      - qa
    paths:
      - "src/**"
      - "crates/**"
      - "apps/**"
      - "clients/**"
      - "proto/**"
      - "config/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deploy/docker/**"
      - ".github/workflows/publish-image.yml"
  workflow_dispatch:
    inputs:
      tag_latest:
        description: "Also tag :latest (use for a promoted build)"
        type: boolean
        default: false
      target:
        description: "Dockerfile runtime target"
        type: choice
        options: [runtime, runtime-full]
        default: runtime

# NOTE: concurrency is set per-job (build/merge) so it can include the matrix
# `target` — runtime and runtime-full publish independently and must not
# serialize against each other. A workflow-level group can't see the matrix.

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    # Only the canonical repo publishes — forks lack the credentials anyway.
    if: ${{ github.repository == 'anvai-labs/proximaDB' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    # Per (target,platform) cell: never cancel an in-flight push; a new run's
    # same cell queues behind the old one. target is in the group so the two
    # targets publish in parallel.
    concurrency:
      group: publish-image-${{ github.ref }}-${{ matrix.target }}-${{ matrix.platform }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        # Cross-product: {runtime,runtime-full} × {amd64,arm64} = 4 native builds.
        # `include` attaches the right runner to each platform.
        target: [runtime, runtime-full]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE_REPO: ${{ vars.DOCKERHUB_IMAGE || 'vjsingh1984/proximadb' }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7

      - name: Prepare platform pair
        id: prep
        run: |
          platform="${{ matrix.platform }}"
          echo "pair=${platform//\//-}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ env.TARGET }}
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.title=proximadb
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: false
          # Push by digest only; tags are applied when the manifest is merged.
          outputs: type=image,name=${{ env.IMAGE_REPO }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.prep.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.prep.outputs.pair }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.target }}-${{ steps.prep.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge ${{ matrix.target }} manifest
    needs: build
    if: ${{ github.repository == 'anvai-labs/proximaDB' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30  # manifest-list merge; no measured history, bounded conservatively
    # One merge per target → two manifest lists (runtime, runtime-full), each
    # carrying its own tag set (the -full suffix is applied in "Derive tags").
    strategy:
      fail-fast: false
      matrix:
        target: [runtime, runtime-full]
    concurrency:
      group: publish-image-merge-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: false
    env:
      IMAGE_REPO: ${{ vars.DOCKERHUB_IMAGE || 'vjsingh1984/proximadb' }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          # Only THIS target's per-arch digests. The `-linux-` anchor is load-
          # bearing: a bare `digests-${{ matrix.target }}-*` for target=runtime
          # also matches `digests-runtime-full-*` (prefix collision), which
          # merged the runtime-full images into the runtime manifest. Platform
          # pairs are always linux-<arch>, so anchoring on `-linux-` disambiguates
          # `digests-runtime-linux-*` from `digests-runtime-full-linux-*`.
          pattern: digests-${{ matrix.target }}-linux-*
          merge-multiple: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Derive tags
        id: tags
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # Tag list per trigger (same scheme as single-arch):
          #  - release tag v*  -> <version>, sha-<sha>, latest
          #  - qa push (develop→qa promotion) -> qa, sha-<sha>  (rolling, no latest)
          #  - manual dispatch -> <version>, sha-<sha> [, latest if requested]
          #
          # NOTE: publish is gated to the develop→qa boundary (not every develop push) — see the
          # `on.push.branches` trigger. Per-develop-push publishes wasted ~15 min of runner time per
          # merge and (while broken) never produced a usable image.
          SUFFIX=""
          if [ "${TARGET}" = "runtime-full" ]; then SUFFIX="-full"; fi
          ARGS=""; PRIMARY=""
          add() { ARGS="${ARGS} -t ${IMAGE_REPO}:$1"; [ -z "$PRIMARY" ] && PRIMARY="$1" || true; }

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            add "${VERSION}${SUFFIX}"; add "sha-${SHORT_SHA}${SUFFIX}"; add "latest${SUFFIX}"
          elif [ "${GITHUB_REF_NAME}" = "qa" ]; then
            add "qa${SUFFIX}"; add "sha-${SHORT_SHA}${SUFFIX}"
          else
            add "${VERSION}${SUFFIX}"; add "sha-${SHORT_SHA}${SUFFIX}"
            if [ "${{ github.event.inputs.tag_latest }}" = "true" ]; then add "latest${SUFFIX}"; fi
          fi
          echo "tag_args=${ARGS}" >> "$GITHUB_OUTPUT"
          echo "primary=${PRIMARY}" >> "$GITHUB_OUTPUT"
          echo "Tags:${ARGS}"

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          # One manifest list carrying all tags, referencing both arch digests.
          # Word-splitting is intentional: tag_args expands to multiple `-t …`
          # flags and printf emits one `repo@sha256:…` source per digest file.
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create ${{ steps.tags.outputs.tag_args }} \
            $(printf "${IMAGE_REPO}@sha256:%s " *)

      - name: Inspect + summary
        run: |
          set -euo pipefail
          REF="${IMAGE_REPO}:${{ steps.tags.outputs.primary }}"
          docker buildx imagetools inspect "$REF"
          {
            echo "### Published multi-arch \`${TARGET}\` image"
            echo ""
            echo "Platforms: linux/amd64 + linux/arm64"
            echo ""
            echo "Tags:"
            echo '```'
            echo "${{ steps.tags.outputs.tag_args }}" | tr ' ' '\n' | grep "^${IMAGE_REPO}" || true
            echo '```'
            echo ""
            echo "Pin downstream (anvaiops, ADR-0016) by the manifest-list digest from the inspect output above."
          } >> "$GITHUB_STEP_SUMMARY"

  # Reclaim Docker Hub storage: delete superseded rolling `sha-*` tags, keeping
  # only the most recent N. Never touches semver, `latest`, or `develop`.
  prune:
    name: Prune old sha- tags
    needs: merge
    if: ${{ github.repository == 'anvai-labs/proximaDB' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30  # registry prune; no measured history, bounded conservatively
    env:
      IMAGE_REPO: ${{ vars.DOCKERHUB_IMAGE || 'vjsingh1984/proximadb' }}
      KEEP: ${{ vars.DOCKERHUB_PRUNE_KEEP || '10' }}
    steps:
      - name: Delete stale sha- tags via Docker Hub API
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          JWT="$(curl -fsSL -H "Content-Type: application/json" \
            -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}" \
            https://hub.docker.com/v2/users/login | jq -r .token)"
          [ -n "$JWT" ] && [ "$JWT" != "null" ] || { echo "Hub login failed"; exit 1; }

          mapfile -t SHA_TAGS < <(
            curl -fsSL -H "Authorization: JWT ${JWT}" \
              "https://hub.docker.com/v2/repositories/${IMAGE_REPO}/tags?page_size=100&ordering=last_updated" \
            | jq -r '.results[].name' | grep -E '^sha-' || true)

          echo "Found ${#SHA_TAGS[@]} sha- tags; keeping newest ${KEEP}."
          i=0
          for tag in "${SHA_TAGS[@]}"; do
            i=$((i+1))
            if [ "$i" -le "${KEEP}" ]; then
              echo "keep   ${tag}"
              continue
            fi
            echo "delete ${tag}"
            curl -fsSL -X DELETE -H "Authorization: JWT ${JWT}" \
              "https://hub.docker.com/v2/repositories/${IMAGE_REPO}/tags/${tag}/" || \
              echo "  (delete failed for ${tag}, continuing)"
          done
