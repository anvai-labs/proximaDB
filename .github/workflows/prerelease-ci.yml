  # ============================================================================
  # PRE-RELEASE SUMMARY - Generate release-ready.json
  # ============================================================================
  prerelease-summary:
    timeout-minutes: 30
    name: Pre-Release Summary
    needs: [prepare, validate-artifacts]
    runs-on: ubuntu-latest
    # `always()` so it still reports when a build leg fails -- but not on an
    # automatic `qa` push, where `prepare` is skipped on purpose and there is
    # nothing to summarise.
    if: ${{ always() && !(github.event_name == 'push' && github.ref_name == 'qa') }}
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate Summary
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          VALIDATION="${{ needs.validate-artifacts.outputs.validation_passed }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          COMMIT="${{ github.sha }}"

          # Count artifacts
          BINARY_COUNT=$(find artifacts -name "binaries-*" -type d | wc -l)
          SDIST_COUNT=$(find artifacts -name "sdist" -type d | wc -l)

          # Generate release-ready.json
          cat > release-ready.json << EOF
          {
            "status": "$([ "$VALIDATION" = "true" ] && echo "ready" || echo "failed")",
            "version": "$VERSION",
            "commit_sha": "$COMMIT",
            "timestamp": "$TIMESTAMP",
            "artifacts": {
              "binaries": $BINARY_COUNT,
              "sdist": $SDIST_COUNT
            },
            "platforms": {
              "linux-x86_64": true,
              "windows-x86_64": true,
              "macos": false,
              "packages": {
                "rpm": false,
                "deb": false,
                "dmg": false,
                "msi": false
              }
            },
            "note": "v0.2.0 minimal release - Linux x86_64 and Windows x86_64 binaries only. Platform packages (RPM, DEB, DMG, MSI) and macOS support coming in v0.2.1."
          }
          EOF

          cat release-ready.json

      - name: Upload release-ready.json
        uses: actions/upload-artifact@v7
        with:
          name: release-ready
          path: release-ready.json
          retention-days: 30

      - name: Generate Step Summary
        run: |
          echo "## Pre-Release CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.prepare.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.validate-artifacts.outputs.validation_passed }}" = "true" ]; then
            echo ":white_check_mark: **Pre-release CI passed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All artifacts built successfully. This commit is ready for release." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Note:** v0.2.0 builds x86_64-linux and x86_64-windows only." >> $GITHUB_STEP_SUMMARY
            echo "Cross-compilation targets (musl, aarch64) are disabled." >> $GITHUB_STEP_SUMMARY
          else
            echo ":x: **Pre-release CI failed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Some artifacts failed to build. Fix issues before releasing." >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # CLEANUP
  # ============================================================================
  cleanup:
    timeout-minutes: 30
    name: Cleanup Artifacts
    needs: [prepare, validate-artifacts, prerelease-summary]
    runs-on: ubuntu-latest
    # Nothing is uploaded on an automatic `qa` push, so there is nothing to
    # delete.
    if: ${{ always() && !(github.event_name == 'push' && github.ref_name == 'qa') }}
    steps:
      - name: Delete Workflow Artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            binaries-*
            sdist
            rpm-package
            deb-package
            dmg-installer
            msi-installer
          failOnError: false
