# =============================================================================
# ProximaDB Pre-Release CI Workflow
# =============================================================================
#
# OVERVIEW:
#   This workflow validates that a commit is ready for release by building
#   all release artifacts WITHOUT publishing them. It acts as a gate before
#   running the full release.yml workflow.
#
# TRIGGERS:
#   1. Push to main branch
#   2. Push to `qa` (or `main`) — see the `on.push.branches` note below
#   3. Manual dispatch with optional version input
#
# WORKFLOW STAGES:
#   ┌─────────────────────────────────────────────────────────────────────────┐
#   │  1. VERSION-CHECK    Validate version consistency                        │
#   ├─────────────────────────────────────────────────────────────────────────┤
#   │  2. PREPARE          Extract version                                    │
#   ├─────────────────────────────────────────────────────────────────────────┤
#   │  3. BUILD (parallel)                                                     │
#   │     ├── build-binaries    2 platform targets (v0.2.0)                   │
#   │     └── build-sdist       Source distributions                          │
#   ├─────────────────────────────────────────────────────────────────────────┤
#   │  4. VALIDATE          Verify all artifacts built                        │
#   ├─────────────────────────────────────────────────────────────────────────┤
#   │  5. BUILD PLATFORM PACKAGES (parallel)                                  │
#   │     ├── build-rpm         RPM package (fpm)                             │
#   │     ├── build-deb         DEB package (fpm)                             │
#   │     ├── build-dmg         DMG installer (create-dmg)                    │
#   │     └── build-msi         MSI installer (WiX v4)                        │
#   ├─────────────────────────────────────────────────────────────────────────┤
#   │  6. SUMMARY          Generate release-ready.json artifact               │
#   └─────────────────────────────────────────────────────────────────────────┘
#
# NOTE: v0.2.0 builds only x86_64 platforms (linux-gnu, windows) due to
#       cross-compilation issues. musl, aarch64 targets are disabled.
#       Python packages are pure Python (setuptools), no Rust wheels.
#
# =============================================================================

name: Pre-Release CI

on:
  push:
    branches:
      - main
      # `qa`, not `development`: there is no `development` branch in this repo
      # (the promotion flow is feat -> develop -> qa -> main), so this trigger
      # matched nothing and the Check Version Consistency gate below ran ONLY on
      # main -- i.e. after the release had already been promoted. `qa` is the
      # MEDIUM tier, which is where a version-consistency failure is still cheap
      # to fix. Deliberately NOT `develop`: this workflow is heavy and mandate #7
      # keeps runner cycles off every feature merge.
      - qa
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to validate (e.g., 0.2.0)'
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

permissions:
  contents: read
  packages: read

concurrency:
  # Dedup push+PR of the same branch into one group; cancel superseded
  # runs on feature/PR branches, but let protected-branch runs finish.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' && github.ref_name != 'qa' && github.ref_name != 'develop' }}

jobs:
  # ============================================================================
  # VERSION CHECK - Validate version consistency across codebase
  # ============================================================================
  version-check:
    timeout-minutes: 30
    name: Check Version Consistency
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Version Sync Check
        id: version-sync
        run: |
          bash scripts/version-sync.sh check

      - name: Extract Version
        id: version
        run: |
          VERSION=$(bash scripts/version-sync.sh get)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Validate Input Version (if provided)
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          CARGO_VERSION="${{ steps.version.outputs.version }}"
          
          # Remove pre-release suffix for comparison
          INPUT_BASE="${INPUT_VERSION%%-*}"
          CARGO_BASE="${CARGO_VERSION%%-*}"
          
          if [ "$INPUT_BASE" != "$CARGO_BASE" ]; then
            echo "::error::Input version ($INPUT_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          
          echo "Version validation passed: $INPUT_VERSION matches $CARGO_VERSION"

  # ============================================================================
  # PREPARE - Set up build parameters
  # ============================================================================
  prepare:
    timeout-minutes: 30
    name: Prepare Build
    needs: version-check
    # On an automatic push to `qa` we want the version gate ONLY. This job is
    # the fan-out point -- build-binaries, build-sdist and validate-artifacts all
    # need it -- and that chain measured 3h25m and 4h13m on its last two main
    # runs. Paying that on every develop->qa promotion to get a one-minute
    # version check is the wrong trade (mandate #7). A push to main still runs
    # the full matrix, and so does an explicit workflow_dispatch against `qa`,
    # which is how you validate a release candidate on purpose.
    if: ${{ !(github.event_name == 'push' && github.ref_name == 'qa') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.version-check.outputs.version }}
    steps:
      - name: Set Version Output
        run: |
          VERSION="${{ needs.version-check.outputs.version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

  # ============================================================================
  # BUILD RUST BINARIES - Cross-platform binary builds
  # ============================================================================
  build-binaries:
    timeout-minutes: 150
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (glibc)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
            features: "cloud-full"

          # Linux x86_64 (musl - static) - DISABLED for v0.2.0
          # Target installation issue - requires manual musl target setup
          # - target: x86_64-unknown-linux-musl
          #   os: ubuntu-22.04
          #   archive: tar.gz
          #   features: ""

          # Linux aarch64 - DISABLED for v0.2.0
          # Cross-compilation requires additional toolchain setup
          # - target: aarch64-unknown-linux-gnu
          #   os: ubuntu-22.04
          #   archive: tar.gz
          #   features: ""
          #   cross: true

          # macOS aarch64 (Apple Silicon) - DISABLED for v0.2.0
          # Ring 0.17.14 has CPU feature detection issues on CI macOS runners
          # Multiple dependencies pull in ring (jsonwebtoken, pgwire, rustls, rcgen)
          # Re-enable in v0.2.1 with alternative crypto stack or rustls upgrade
          # - target: aarch64-apple-darwin
          #   os: macos-latest
          #   archive: tar.gz
          #   features: ""

          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            archive: zip
            features: "cloud-full"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Cross (for cross-compilation)
        if: matrix.cross
        run: |
          cd /tmp
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            sudo apt-get install -y musl-tools
          fi

      - name: Install macOS Dependencies
        if: runner.os == 'macOS'
        run: |
          # Install OpenSSL for ring crate compatibility
          brew install openssl@3 pkg-config
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$(brew --prefix openssl@3)/lib" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> $GITHUB_ENV
          # Workaround for ring crate CPU feature detection issues
          echo "RING_CORE_BACKEND=openssl" >> $GITHUB_ENV
          echo "CFLAGS=-I$(brew --prefix openssl@3)/include" >> $GITHUB_ENV

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-${{ matrix.target }}"
          shared-key: "prerelease"

      - name: Build Binaries
        run: |
          FEATURES="${{ matrix.features }}"
          if [ -n "$FEATURES" ]; then
            FEATURES_FLAG="--features $FEATURES"
          else
            FEATURES_FLAG=""
          fi

          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} $FEATURES_FLAG \
              -p proximadb-server \
              -p proximadb-bench \
              -p proximadb-migrate
          else
            cargo build --release --target ${{ matrix.target }} $FEATURES_FLAG \
              -p proximadb-server \
              -p proximadb-bench \
              -p proximadb-migrate
          fi
        shell: bash

      - name: Create Archive (Unix)
        if: runner.os != 'Windows'
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE_NAME="proximadb-${VERSION}-${TARGET}"

          mkdir -p "${ARCHIVE_NAME}"
          cp target/${TARGET}/release/proximadb-server "${ARCHIVE_NAME}/"
          cp target/${TARGET}/release/proximadb-bench "${ARCHIVE_NAME}/"
          cp target/${TARGET}/release/proximadb-migrate "${ARCHIVE_NAME}/"
          cp README.adoc LICENSE "${ARCHIVE_NAME}/" 2>/dev/null || true
          cp -r config "${ARCHIVE_NAME}/" 2>/dev/null || true

          tar -czvf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"

          # Generate checksums
          shasum -a 256 "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"

          echo "ARCHIVE_NAME=${ARCHIVE_NAME}.tar.gz" >> $GITHUB_ENV

      - name: Create Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = "${{ needs.prepare.outputs.version }}"
          $TARGET = "${{ matrix.target }}"
          $ARCHIVE_NAME = "proximadb-${VERSION}-${TARGET}"

          New-Item -ItemType Directory -Path $ARCHIVE_NAME -Force
          Copy-Item "target/${TARGET}/release/proximadb-server.exe" "${ARCHIVE_NAME}/"
          Copy-Item "target/${TARGET}/release/proximadb-bench.exe" "${ARCHIVE_NAME}/"
          Copy-Item "target/${TARGET}/release/proximadb-migrate.exe" "${ARCHIVE_NAME}/"
          Copy-Item "README.adoc" "${ARCHIVE_NAME}/" -ErrorAction SilentlyContinue
          Copy-Item "LICENSE" "${ARCHIVE_NAME}/" -ErrorAction SilentlyContinue
          Copy-Item -Recurse "config" "${ARCHIVE_NAME}/" -ErrorAction SilentlyContinue

          Compress-Archive -Path $ARCHIVE_NAME -DestinationPath "${ARCHIVE_NAME}.zip"

          # Generate checksum
          $hash = Get-FileHash "${ARCHIVE_NAME}.zip" -Algorithm SHA256
          "$($hash.Hash.ToLower())  ${ARCHIVE_NAME}.zip" | Out-File -Encoding ascii "${ARCHIVE_NAME}.zip.sha256"

          echo "ARCHIVE_NAME=${ARCHIVE_NAME}.zip" >> $env:GITHUB_ENV

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: |
            proximadb-*.${{ matrix.archive }}
            proximadb-*.${{ matrix.archive }}.sha256
          retention-days: 7

  # ============================================================================
  # BUILD PYTHON EMBEDDED WHEELS - DISABLED for v0.2.0
