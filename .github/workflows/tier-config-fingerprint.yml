name: Tier Config Fingerprint

# Asserts config/tier-config.json byte-matches its committed SHA256
# fingerprint. Catches accidental hand-edits of the embedded baseline
# tier config without a corresponding fingerprint update.
#
# When this fails: someone modified config/tier-config.json without
# regenerating config/tier-config.json.sha256. Resolve locally:
#
#   sha256sum config/tier-config.json | awk '{print $1}' > config/tier-config.json.sha256
#   git add config/tier-config.json config/tier-config.json.sha256
#
# Note: this guard covers the OSS-default baseline embedded into the
# proximadb binary via include_str!. Operators who override at runtime
# via PROXIMADB_TIER_CONFIG_PATH or Dockerfile COPY are NOT covered by
# this fingerprint — their overlay layer has its own provenance.
#
# This job is cheap (<5s) so it runs on every push/PR rather than
# path-gating, ensuring no future commit can sneak past the guard.

on:
  push:
    branches: [main, develop, qa, 'feature/**', 'proximadb-**']
  pull_request:
    branches: [main, develop, qa]
  workflow_dispatch:

concurrency:
  # Dedup push+PR of the same branch into one group; cancel superseded
  # runs on feature/PR branches, but let protected-branch runs finish.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  # Mirrors ci.yml. `qa` must be exempt, not just main/develop: this workflow runs
  # on a push to qa AND on the `qa -> main` promotion PR, and both land in the
  # same group because the group key is `head_ref || ref_name` and the PR's
  # head_ref IS `qa`. With cancellation on, whichever started second killed the
  # other, and `gh pr checks` renders a cancelled run as "fail" -- so the
  # promotion PR showed a phantom failure for a check that had actually passed
  # on its own run. That cost two separate misdiagnoses during the v0.4.0 cut.
  # Exempting PRs that target qa/main as well keeps a promotion run alive while
  # the source branch churns, which is why qa-gate.yml sets `false` outright.
  cancel-in-progress: ${{ !(github.event_name == 'pull_request' && contains(fromJson('["qa", "main"]'), github.base_ref)) && !contains(fromJson('["main", "develop", "qa"]'), github.ref_name) }}

# Least-privilege default GITHUB_TOKEN scope (CodeQL actions/missing-workflow-permissions).
# Read-only is sufficient: no job here writes to the repo, posts comments, or uses OIDC.
permissions:
  contents: read

jobs:
  fingerprint-check:
    name: Verify tier-config.json fingerprint
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v7

      - name: Run fingerprint check
        run: bash scripts/check_tier_config_fingerprint.sh

      - name: Failure hint
        if: failure()
        run: |
          echo ""
          echo "::error::config/tier-config.json drifted from its committed SHA256 fingerprint."
          echo ""
          echo "Resolve locally:"
          echo "  sha256sum config/tier-config.json | awk '{print \$1}' > config/tier-config.json.sha256"
          echo "  git add config/tier-config.json config/tier-config.json.sha256"
          echo ""
          echo "Commit BOTH files together so future fingerprint checks pass."
