# Dependabot configuration.
#
# WHY THIS FILE EXISTS: without it, Dependabot opens every PR against the
# repository's DEFAULT branch (`main`). The promotion-source guard in
# `.github/workflows/qa-gate.yml` fails any PR into `main` whose head is not
# `qa` (the flow is develop -> qa -> main), so every Dependabot PR was born
# structurally unmergeable and accumulated open indefinitely (#1188, #1262,
# #1385). `target-branch: develop` puts the bumps at the correct entry point
# of the promotion flow, where they run the LIGHT feat->develop tier and can
# actually merge.
#
# Grouping keeps CI cost bounded: GitHub Actions runners are a shared, finite
# resource and every PR/push triggers a full run, so per-ecosystem groups
# amortize one run across all of that ecosystem's bumps rather than paying a
# runner cycle per dependency (CLAUDE.md mandate #7).
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Without this, Dependabot rewrites Cargo.lock to a version the Cargo.toml
    # requirement does not permit and leaves the manifest alone, so the PR is
    # born unbuildable: CI's `--locked` build dies with "cannot update the lock
    # file ... because --locked was passed" in `Detect Changes`, before anything
    # compiles. That is what happened to #1910 (metal 0.27 -> 0.33), #1911
    # (nalgebra 0.32 -> 0.35), #1912 (pgwire 0.21 -> 0.41) and #1913
    # (google-cloud-storage 0.15 -> 1.16): four PRs that sat open for three
    # weeks having never once been compiled. See TD-DEPS-2.
    #
    # `increase-if-necessary` rather than `increase`: it touches Cargo.toml only
    # when the new version falls outside the declared range, so in-range patch
    # bumps keep the manifest quiet while out-of-range ones become coherent and
    # therefore compile-testable. Note this makes such PRs *buildable*, not
    # *correct* — a 0.x minor bump is still a breaking API change, so expect it
    # to fail on real compile errors. That failure is the point: it is signal
    # about the upgrade instead of a lockfile technicality.
    versioning-strategy: increase-if-necessary
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: gomod
    directories:
      - "/"
      - "/clients/go"
      - "/clients/go/codegen"
      - "/clients/go-embedded"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directories:
      - "/"
      - "/ui"
      - "/clients/nodejs-embedded"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # The legacy admin UI is pinned to the coherent React 17 + Material-UI v4
      # stack. React 18/19 requires an intentional createRoot + MUI + types
      # migration; independent major bumps leave npm's peer graph unsatisfiable.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directories:
      - "/clients/python"
      - "/demo"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-all:
        patterns: ["*"]
    ignore:
      # DO NOT let dependabot touch this one. `dtolnay/rust-toolchain`'s git tag
      # IS the Rust toolchain version, not the action's own version — so a
      # routine "action bump" silently rewrites the COMPILER pin. The first
      # actions-all group PR did exactly that: 1.95.0 -> 1.100.0 across 44 sites
      # in 7 workflows, and Rust 1.100.0 does not exist (static.rust-lang.org
      # returns 404), so every toolchain setup failed with
      # "could not download nonexistent rust version".
      #
      # The toolchain is pinned by rust-toolchain.toml (channel = "1.95.0") and
      # must only ever move by editing that file deliberately. Bump both together
      # by hand when the toolchain moves.
      - dependency-name: "dtolnay/rust-toolchain"
