# Dependabot configuration.
#
# WHY THIS FILE EXISTS: without it, Dependabot opens every PR against the
# repository's DEFAULT branch (`main`). The promotion-source guard in
# `.github/workflows/qa-gate.yml` fails any PR into `main` whose head is not
# `qa` (the flow is develop -> qa -> main), so every Dependabot PR was born
# structurally unmergeable and accumulated open indefinitely (#1188, #1262,
# #1385). `target-branch: develop` puts the bumps at the correct entry point
# of the promotion flow, where they run the LIGHT feat->develop tier and can
# actually merge.
#
# Grouping keeps CI cost bounded: GitHub Actions runners are a shared, finite
# resource and every PR/push triggers a full run, so per-ecosystem groups
# amortize one run across all of that ecosystem's bumps rather than paying a
# runner cycle per dependency (CLAUDE.md mandate #7).
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Dependabot cannot open a buildable PR for a cargo SEMVER-MAJOR bump, so the
    # four below are suppressed rather than reopened weekly. It rewrites
    # Cargo.lock to a version the Cargo.toml requirement does not permit and
    # leaves the manifest alone, so CI's `--locked` build dies in `Detect
    # Changes` with "cannot update the lock file ... because --locked was passed"
    # before anything compiles. #1910, #1911, #1912 and #1913 sat open for three
    # weeks that way, never once compiled.
    #
    # `versioning-strategy` is NOT the fix here: for the cargo ecosystem
    # Dependabot's validator accepts only `lockfile-only` and `auto`, and
    # rejects both `increase` and `increase-if-necessary` with
    #   The property '#/updates/0/versioning-strategy' value "increase" did not
    #   match one of the following values: lockfile-only, auto
    # even though the options reference lists them as supported. Setting one
    # makes this whole file invalid, which stops every update — strictly worse
    # than the problem. Do not add it back.
    #
    # Scoped to these four crates rather than `dependency-name: "*"` on purpose:
    # a blanket major-ignore would also mask a major bump we DO want to see. The
    # cost is that a new 0.x major elsewhere will rot the same way; close it and
    # add it here with a TD entry. The upgrades themselves, each with its gate,
    # are in TD-DEPS-2.
    ignore:
      - dependency-name: "pgwire"
        update-types: ["version-update:semver-major"]
      - dependency-name: "google-cloud-storage"
        update-types: ["version-update:semver-major"]
      - dependency-name: "nalgebra"
        update-types: ["version-update:semver-major"]
      - dependency-name: "metal"
        update-types: ["version-update:semver-major"]
      # ort is a 2.0 pre-release, so rc.14+ arrives inside the minor/patch group,
      # but rc.15 needs one process-wide ONNX Runtime environment shared by two
      # crates, which is a design change and not a bump (TD-ORT-1). Without
      # this ignore, the whole cargo-minor-patch group PR fails to build every week.
      - dependency-name: "ort"
        versions: [">=2.0.0-rc.14"]
      # rand_chacha 0.9 pulls a second rand_core (0.9) while all 19 ChaCha*Rng
      # call sites import SeedableRng from rand 0.8 (rand_core 0.6) — E0599
      # dual-trait scope error at every site. Streams are verified bit-identical
      # 0.3.1 <-> 0.9.0 (seed_from_u64 and from_seed), so the upgrade is a
      # mechanical trait-import migration, tracked in TD-DEPS-2's open list.
      - dependency-name: "rand_chacha"
        versions: [">=0.4"]
      # arrow 60 is not admitted by datafusion 55.x (which rides arrow 59.x):
      # dependabot #2179's lock split the family three ways (60.0.0 beside
      # datafusion's 59.3.x and duckdb's 58.3.0) — arrow/datafusion/parquet
      # must move as one coordinated family (TD-DEPS-2 open list).
      - dependency-name: "arrow"
        versions: [">=60"]
      - dependency-name: "arrow-array"
        versions: [">=60"]
      - dependency-name: "arrow-buffer"
        versions: [">=60"]
      - dependency-name: "arrow-data"
        versions: [">=60"]
      - dependency-name: "arrow-schema"
        versions: [">=60"]
      - dependency-name: "ort-sys"
        versions: [">=2.0.0-rc.14"]
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: gomod
    directories:
      - "/"
      - "/clients/go"
      - "/clients/go/codegen"
      - "/clients/go-embedded"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directories:
      - "/"
      - "/ui"
      - "/clients/nodejs-embedded"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # The legacy admin UI is pinned to the coherent React 17 + Material-UI v4
      # stack. React 18/19 requires an intentional createRoot + MUI + types
      # migration; independent major bumps leave npm's peer graph unsatisfiable.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]

      # `@types/node`'s major IS the Node major it types, so "latest" types a
      # runtime we do not run. CI and the release build on the Node 24 LTS line
      # (NODE_MAJOR in scripts/check_deterministic_commit_contract.py), and types
      # for Node 26 let `tsc` accept calls that are absent at runtime -- a green
      # build that fails in production. Anything at or above 25 is therefore
      # ignored; 24.x and below remain open so patches still flow.
      #
      # Each major also carries a TypeScript floor, published as DefinitelyTyped
      # `ts<x.y>` dist-tags -- the newest @types/node a given `tsc` can parse:
      #
      #   TS 4.9 -> 22.9.3     TS 5.1 -> 24.1.0     TS 5.7+ -> 26.6.5
      #
      # That is why PR #1908 (16.18.126 -> 26.5.1 in /ui) could not have
      # typechecked: /ui was then react-scripts 5.0.1, which held TypeScript at
      # 4.9.5. /ui is now on Vite with TypeScript 5.9, so 24.x is in reach; the
      # typecheck runs inside `npm run build`, so a proposal past the TS floor
      # fails `Admin UI Install + Build` visibly rather than merging silently.
      - dependency-name: "@types/node"
        versions: [">=25.0.0"]

  - package-ecosystem: pip
    directories:
      - "/clients/python"
      - "/demo"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]

  # The Python REST generator, kept apart from the SDK's runtime deps: a
  # generator bump usually changes the generated transport, so the
  # python-sdk-codegen-drift gate fails until someone runs
  # `make gen-python-sdk` and pushes the result. Ungrouped so that one
  # regeneration never blocks unrelated runtime bumps. (Security updates
  # still target the default branch; Dependabot ignores target-branch for
  # them.)
  - package-ecosystem: pip
    directory: "/clients/python/codegen"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 1

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-all:
        patterns: ["*"]
    ignore:
      # DO NOT let dependabot touch this one. `dtolnay/rust-toolchain`'s git tag
      # IS the Rust toolchain version, not the action's own version — so a
      # routine "action bump" silently rewrites the COMPILER pin. The first
      # actions-all group PR did exactly that: 1.95.0 -> 1.100.0 across 44 sites
      # in 7 workflows, and Rust 1.100.0 does not exist (static.rust-lang.org
      # returns 404), so every toolchain setup failed with
      # "could not download nonexistent rust version".
      #
      # The toolchain is pinned by rust-toolchain.toml (channel = "1.99.0") and
      # must only ever move by editing that file deliberately. Bump both together
      # by hand when the toolchain moves.
      - dependency-name: "dtolnay/rust-toolchain"
