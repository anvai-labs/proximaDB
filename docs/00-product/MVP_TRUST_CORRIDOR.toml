schema_version = 1
as_of_date = "2026-08-03"
product_name = "ProximaDB"
positioning = "Object-storage-native context serving for SQL, JSON, and vectors"
deployment = "single-node"
canonical_api = "REST /api/v2"
# The corridor's engine. SST is also the automatic default for a REST/gRPC create that omits the
# engine (TD-ENGSEL-1; pinned by tests/release_smoke_v2.rs rest_v2_create_without_engine_defaults_to_sst).
default_engine = "sst"

[promise]
one_sentence = "Store typed context records once and retrieve them by identifier, metadata, or vector similarity through one canonical API."
buyer = "AI application and platform teams replacing vector-plus-metadata glue on the operational serving path"
proof = "A fresh install completes the canonical create, typed batch write, filtered scan, filtered vector search, route-health, get, and delete roundtrip."

[storage]
quickstart_backend = "local"
object_store_backends = ["s3", "azure", "gcs"]
object_store_tier = "beta"
graduation_gate = "The same crash/restart, correctness, memory, and context-economics suite passes on each backend with dated evidence."

[security]
tenancy_mode = "single-tenant"
metadata_filters_are_authorization = false
multi_tenant_abac_tier = "beta"
graduation_gate = "Stable tenant IDs are total, absent IDs fail closed, and REST, gRPC, Flight, and pgwire pass cross-surface admit/deny tests."

[[surface]]
id = "collection_create"
tier = "supported"
method = "POST"
path = "/api/v2/collections"
evidence = ["tests/release_smoke_v2.rs", "docs/openapi/proximadb-openapi.yaml"]

[[surface]]
id = "record_batch_write"
tier = "supported"
method = "POST"
path = "/api/v2/collections/{collection_id}/records/batch"
evidence = ["tests/release_smoke_v2.rs", "tests/v2_metadata_filter_enforcement_test.rs"]

[[surface]]
id = "filtered_record_scan"
tier = "supported"
method = "POST"
path = "/api/v2/collections/{collection_id}/records/scan"
evidence = ["tests/v2_metadata_filter_enforcement_test.rs"]

[[surface]]
id = "filtered_vector_search"
tier = "supported"
method = "POST"
path = "/api/v2/collections/{collection_id}/search"
evidence = ["tests/release_smoke_v2.rs", "tests/v2_metadata_filter_enforcement_test.rs"]

[[surface]]
id = "record_get"
tier = "supported"
method = "GET"
path = "/api/v2/collections/{collection_id}/records/{record_id}"
evidence = ["tests/release_smoke_v2.rs"]

[[surface]]
id = "record_delete"
tier = "supported"
method = "DELETE"
path = "/api/v2/collections/{collection_id}/records/{record_id}"
evidence = ["tests/release_smoke_v2.rs"]

[[surface]]
id = "route_health"
tier = "diagnostic"
method = "GET"
path = "/api/v2/_diagnostics/collections/{collection_id}/route-health"
evidence = ["tests/release_smoke_v2.rs"]

[[exclusion]]
id = "pgwire"
tier = "beta"
reason = "Beta SQL with transactions (ADR-018 P2.D); pgwire identity/ABAC parity, vector-table tenancy and published-image reachability are not complete. pgwire enters the corridor at roadmap v1.0 (ADR-096)."
tracking = ["docs/10-quality/td/TD-ABAC-10-pgwire-identity-constructor.adoc", "docs/10-quality/td/TD-PGWIRE-VECTENANT-1-pgwire-vector-collections-outside-tenant-boundary.adoc", "docs/10-quality/td/TD-PGWIRE-CONTAINER-1-pgwire-unreachable-in-a-container-without-auth.adoc"]

[[exclusion]]
id = "multi_tenant_abac"
tier = "beta"
reason = "Metadata filters are query predicates, not authorization. Cross-surface fail-closed authorization and retiring the per-row tenant predicate are incomplete (stable tenant IDs landed with TD-ABAC-11)."
tracking = ["docs/10-quality/td/TD-ABAC-10-pgwire-identity-constructor.adoc", "docs/10-quality/td/TD-AUTHZ-1-adr090-program-tracker.adoc", "docs/10-quality/td/TD-TENANT-2-retire-per-row-tenant-predicate.adoc"]

[[exclusion]]
id = "multimodel_projections"
tier = "beta"
reason = "Document, graph, observability, time-series, and event projections do not yet share complete recovery parity."
tracking = ["docs/10-quality/td/TD-WAL-2-multimodal-wal-convergence.adoc"]

[[exclusion]]
id = "distributed_execution"
tier = "experimental"
reason = "Remote execution, replication, and failover are not part of the single-node MVP."
tracking = ["docs/SUPPORTED_SURFACE.adoc"]

[[exclusion]]
id = "full_sql"
tier = "experimental"
reason = "PostgreSQL transaction, constraint, procedural, and broad SQL parity are out of scope."
tracking = ["docs/12-design/adr/ADR-095-postgres-compatible-oltp-on-object-storage.adoc", "docs/10-quality/td/TD-PGOLTP-1-atomic-commit-record-group-commit.adoc", "roadmap/techdebt/TD_110_OLTP_OLAP_HTAP_STORAGE_AND_CONSTRAINTS_PLAN_2026_06_04.adoc"]

[release]
binary_targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
required_commands = [
  "python3 scripts/check_mvp_trust_corridor.py",
  "python3 -m unittest discover -s tests/scripts -p test_mvp_smoke.py",
  "make release-check",
]
required_docs = [
  "README.adoc",
  "docs/SUPPORTED_SURFACE.adoc",
  "docs/00-product/VISION.adoc",
  "docs/00-product/COMPETITIVE_LANDSCAPE.adoc",
  "docs/00-product/MVP_EXECUTION_SCORECARD.adoc",
  "docs/01-quick-start/CONTEXT_SERVING_MVP.adoc",
  "docs/10-quality/benchmarks/CONTEXT_CORRIDOR_BENCHMARK.adoc",
]

[gtm]
primary_workflow = "RAG and agent context serving with typed metadata and vector retrieval"
primary_persona = "AI application engineer"
activation_event = "A user completes the canonical context roundtrip against their own data"
retention_event = "The same deployment serves recurring writes and filtered searches for seven days"
design_partner_target = 5
external_weekly_active_target = 50
public_case_study_target = 3
non_founder_maintainer_target = 2
