notes = "TD-WLP-4/WLP-9 eval (2026-07-15): real SIFT1M N=100000, 100 queries, top-10, Euclidean, brute-force subset GT, --release, rebased on develop incl. #620. Test fn: sift_voe_centroid_prune_compacted_recall_at_10_eval. PCA/IVF reached via the PROXIMADB_PAX_FLUSH_CLUSTER=ivf flush opt-in (the production flush->compaction scheduler is unwired, TD-WLP-7). recall@10 (radius_k=0): sign-bit [keep 1.0/0.7/0.5/0.3/0.15] = 0.987/0.835/0.758/0.696/0.557; pca/ivf = 0.989/0.929/0.867/0.789/0.694. PCA/IVF lifts pruned recall ~+0.11 at fixed keep and tightens block RMS radii (128/block 322->263, -18%). Block-size sweep: block-prune is GET-capped — tight blocks (8-64 vec) recover recall to ~0.99 but explode GETs (10/kept-block vs default 0.13); no sweet spot. VERDICT: clustering validated, but block-centroid pruning is GET-capped at ~0.87 for any tight-block win; the redesign is coalesced binary-tier rerank (TD-RDSTRAT-6). radius_k moved recall <=0.02 (TD-WLP-3 confirmed). WS8 flip stays BLOCKED at keep=0.5 (0.867); defensible at keep=0.7 (0.929, -27% GETs). Indicative local run, not an SLA. RETIRED 2026-07-15 (#1024): the `sift_voe_centroid_prune_compacted_recall_at_10_eval` fn was retired when coalesced scan-then-rerank became the canonical PAX RaBitQ path (ADR-062) — block-centroid-prune is superseded. This entry stays `measured`: it is the HISTORICAL run that grounded ADR-062's GET-capped finding (the data is recorded in the artifact; `bench_command` is the original-run provenance, no longer re-runnable). The canonical coalesced recall/GET measurement is the `coalesced_rabitq_scan_rerank_sift` claim."

