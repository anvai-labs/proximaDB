[[claims]]
id = "rdstrat12_sift1m_inflight_inert"
claim = "TD-RDSTRAT-12 §3 hypothesis (PROXIMADB_READ_RANGES_INFLIGHT raises SIFT1M cold-read p50 latency ≥2× at equal GET count) is NOT supported — the env gate is INERT for the IVF probe path. Measured SIFT1M baseline (INFLIGHT=0) vs treatment (INFLIGHT=32): object_cold p50 49.02ms vs 49.11ms (<1% difference), GETs/q 13.80 vs 13.80 (identical), bytes/q 46.18MB vs 46.18MB (identical), rounds/q 4.61 vs 4.61 (identical). Root cause: the IVF probe code path (src/storage/engines/sst/segment_format.rs:coarse_probe_survivors) issues sequential fs.read_range() calls in a for loop (line 2619-2669) and NEVER calls FileSystem::read_ranges_prefetch() — the only function gated by PROXIMADB_READ_RANGES_INFLIGHT (proximadb-storage-filesystem-types/src/lib.rs:795). The env gate compiles and ships but is unreachable from this workload. This is a certified-dead-code pattern: the mechanism exists, the test ran clean, but the code path it gates is not exercised by the benchmark."
metric = "p50 latency + GETs/query + bytes/query + fetch_rounds/query across baseline/treatment"
status = "measured"
asserted_in = [
  "docs/10-quality/td/TD-RDSTRAT-12-bounded-parallel-read-ranges.adoc",
]
bench_source = "scripts/bench/sift1m_get_reduction.py"
bench_command = "Baseline: PROXIMADB_READ_RANGES_INFLIGHT=0 python3 scripts/bench/sift1m_get_reduction.py --root /tmp/sift1m_baseline --rows 1000000 --port 5678 --binary target/release-server/proximadb-server --queries 100 --top-k 100 --post-write-max-gets 5000; Treatment: same with INFLIGHT=32 and --root /tmp/sift1m_treatment"
artifact = "docs/_internal/status/RDSTRAT12_SIFT1M_INFLIGHT_INERT_2026_08_26.adoc"
hardware = "Local macOS arm64 (Apple Silicon), release-server build 29ed454bf049671ba6f78a9402d057b4f03163267045206c55c9bcb7b2fc599e, git revision 64a29ec5604903aadb2502db6abaab8b18b84164"
date = "2026-08-26"
version = "feat/rdstrat-12-sift1m-evidence off develop @ 8b3665ac7"
notes = "Binary SHA-256 29ed454bf049671ba6f78a9402d057b4f03163267045206c55c9bcb7b2fc599e, built 2026-08-26. Both runs completed with identical recall (~0.987-0.990) and matching GET/bytes profiles, confirming a fair comparison. The IVF probe path calculates its own fetch_rounds metric (line 2697: fetched.len() as u64) independent of read_ranges_prefetch. grep confirmed zero production callers of read_ranges_prefetch outside its own test file. To make PROXIMADB_READ_RANGES_INFLIGHT meaningful for IVF workloads, the coarse_probe_survivors function would need to be rewired to use read_ranges_prefetch() instead of its current for loop; or a different benchmark that exercises the read_ranges_prefetch code path would be needed. Indicative dev-machine run, not an SLA."

