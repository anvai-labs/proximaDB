  /api/v2/abac/policy-bindings/{tenant}/{object_id}:
    parameters:
    - name: tenant
      in: path
      required: true
      schema:
        type: string
    - name: object_id
      in: path
      required: true
      schema:
        type: integer
        format: uint64
    put:
      tags:
      - ABAC
      operationId: putPolicyBinding
      summary: Upsert an ABAC policy binding.
      description: |
        Provisions (or replaces) the policy binding at `object_id` for
        `tenant` — a constraint-layer rule (`scope` + `effect`, optionally a
        `predicate_ref` row filter and a `field_mask`). Writes through the
        same store the live enforcer reads: visible on the next request, no
        restart. `Deny` wins during resolution; the default is deny.
        The optional `X-Tenant-ID` header is not consulted by this
        handler — the tenant path segment governs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbacPutPolicyBindingRequest'
      responses:
        '200':
          description: The stored binding (tenant string resolved to its stable id).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbacPolicyBinding'
        '401':
          $ref: '#/components/responses/AbacUnauthorized'
        '403':
          $ref: '#/components/responses/AbacForbidden'
        '422':
          $ref: '#/components/responses/AbacTenantUnresolved'
        '503':
          $ref: '#/components/responses/AbacUnavailable'
      parameters:
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. An authenticated tenant binding takes precedence and a mismatch is rejected, except that an authenticated gateway principal may delegate an acting tenant when gateway-only trust is configured. Without an authenticated binding, acceptance depends on the configured header trust policy. When absent, a single-tenant deployment selects its configured default tenant; a multi-tenant deployment rejects the request. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
    delete:
      tags:
      - ABAC
      operationId: deletePolicyBinding
      summary: Remove an ABAC policy binding.
      description: |
        Idempotent — 204 whether or not a binding existed at `object_id`.
        The optional `X-Tenant-ID` header is not consulted by this
        handler — the tenant path segment governs.
      responses:
        '204':
          description: Binding removed (or already absent).
        '401':
          $ref: '#/components/responses/AbacUnauthorized'
        '403':
          $ref: '#/components/responses/AbacForbidden'
        '422':
          $ref: '#/components/responses/AbacTenantUnresolved'
        '503':
          $ref: '#/components/responses/AbacUnavailable'
      parameters:
      - name: X-Tenant-ID
