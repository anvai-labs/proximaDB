      description: |
        Grantee as provisioned over the wire: a tenant-wide share when
        `subject` is omitted/empty, else one user of (possibly foreign)
        `tenant`. Clients supply tenant/subject strings; stable ids are
        resolved server-side.
      properties:
        tenant:
          type: string
        subject:
          type:
          - string
          - 'null'
    AbacPostGrantRequest:
      type: object
      required:
      - owner_tenant
      - resource
      - grantee
      - actions
      description: Body for `POST /api/v2/abac/grants`.
      properties:
        owner_tenant:
          type: string
          description: The resource-owner tenant (string; resolved and must be minted).
        resource:
          $ref: '#/components/schemas/AbacScope'
        grantee:
          $ref: '#/components/schemas/AbacGrantGranteeRequest'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/AbacGrantAction'
          uniqueItems: true
        predicate_ref:
          type:
          - integer
          - 'null'
          format: uint64
        field_mask:
          oneOf:
          - $ref: '#/components/schemas/AbacFieldMask'
          - type: 'null'
        expires_at_ms:
          type:
          - integer
          - 'null'
          format: int64
    AbacPostGrantResponse:
      type: object
      required:
      - grant_id
      - owner_tenant_stable_id
      properties:
        grant_id:
          type: string
        owner_tenant_stable_id:
          type: integer
          format: uint64
    AbacGrantRecord:
      type: object
      required:
      - grant_id
      - owner_tenant_stable_id
      - resource
      - grantee
      - actions
      - created_at_ms
      properties:
        grant_id:
          type: string
        owner_tenant_stable_id:
          type: integer
          format: uint64
        resource:
          $ref: '#/components/schemas/AbacScope'
        grantee:
          $ref: '#/components/schemas/AbacGrantee'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/AbacGrantAction'
        predicate_ref:
          type:
          - integer
          - 'null'
          format: uint64
        field_mask:
          oneOf:
          - $ref: '#/components/schemas/AbacFieldMask'
          - type: 'null'
        created_at_ms:
          type: integer
          format: int64
        expires_at_ms:
          type:
          - integer
          - 'null'
          format: int64
        revoked_at_ms:
          type:
          - integer
          - 'null'
          format: int64
          description: Set once revoked; the record stays listed (audit trail).
    AbacGrantEnforcement:
      type: string
      enum:
      - Off
      - Audit
      - Enforce
      description: |
        Rollout is intended `Off` -> `Audit` (would-be-denials logged, read
        still admitted) -> `Enforce` (no applicable grant denies).
    AbacPutTenantPostureRequest:
      type: object
      required:
      - grant_enforcement
      properties:
        grant_enforcement:
          $ref: '#/components/schemas/AbacGrantEnforcement'
    AbacTenantSecurityPosture:
      type: object
      required:
      - tenant_stable_id
      - grant_enforcement
      - updated_at_ms
      properties:
        tenant_stable_id:
          type: integer
          format: uint64
        grant_enforcement:
          $ref: '#/components/schemas/AbacGrantEnforcement'
        updated_at_ms:
          type: integer
          format: int64
    PinTarget:
      type: string
      enum:
      - memory
      - nvme_ssd
      - cloud
      description: |
        Physical medium to pin to. `cloud` effectively means "do not
        promote this collection" (an explicit unpin-in-spirit).
    PinRequest:
      type: object
      required:
      - pinned
      description: |
        Body for `PATCH /api/v2/collections/{collection_id}/pin`. Either
        `{pinned: true, target: ..., replicas?: ...}` or `{pinned: false}`
        (target/replicas ignored when unpinning; `target` is REQUIRED
        when pinning — a plain-text 400 otherwise). `replicas` defaults
        to 1.
      properties:
        pinned:
          type: boolean
        target:
          oneOf:
          - $ref: '#/components/schemas/PinTarget'
          - type: 'null'
        replicas:
          type:
          - integer
          - 'null'
          format: uint32
    PinResponse:
      type: object
      required:
      - status
      - collection_id
      description: |
        Internally tagged by `status` (snake_case). `status: "pinned"`
        carries `target`/`replicas`/`pinned_at_ns`; `status: "unpinned"`
        carries `was_pinned` (true when the request removed an existing
        pin — useful for audit logs; false on a no-op or read of an
        unpinned collection).
      properties:
        status:
          type: string
          enum:
          - pinned
          - unpinned
        collection_id:
          type: string
        target:
          $ref: '#/components/schemas/PinTarget'
        replicas:
          type: integer
          format: uint32
        pinned_at_ns:
          type: integer
          format: int64
        was_pinned:
          type: boolean
    PinListItem:
      type: object
      required:
      - collection_id
      - target
      - replicas
      - pinned_at_ns
      properties:
        collection_id:
          type: string
        target:
          $ref: '#/components/schemas/PinTarget'
        replicas:
          type: integer
          format: uint32
        pinned_at_ns:
          type: integer
          format: int64
    PinListResponse:
      type: object
      required:
      - count
      - items
      properties:
        count:
          type: integer
          format: uint64
        items:
          type: array
          items:
            $ref: '#/components/schemas/PinListItem'
    AffinityResponse:
      type: object
      required:
      - status
      - collection_id
      description: |
        Internally tagged by `status` (snake_case). `status:
        "affinitized"` carries the entry — including STALE entries
        (routing already ignores them; `stale: true` flags them for the
        operator) — with `query_count` (monotonic queries served while
        this node held affinity) and `age_seconds` (seconds since the
        last recorded query). `status: "not_affinitized"` means no
        entry exists at all.
      properties:
        status:
          type: string
          enum:
          - affinitized
          - not_affinitized
        collection_id:
          type: string
        node_id:
          type: string
        query_count:
          type: integer
          format: uint64
        age_seconds:
          type: integer
          format: uint64
        stale:
          type: boolean
    AffinityDeleteResponse:
      type: object
      required:
      - status
      - collection_id
      - dropped
      description: |
        `status` is always `"dropped"`; the `dropped` flag
        distinguishes an actual removal from a no-op.
      properties:
        status:
          type: string
          enum:
          - dropped
        collection_id:
          type: string
        dropped:
          type: boolean
    AffinityListItem:
      type: object
      required:
      - collection_id
      - node_id
      - query_count
      - age_seconds
      - stale
      properties:
        collection_id:
          type: string
        node_id:
          type: string
        query_count:
          type: integer
          format: uint64
        age_seconds:
          type: integer
          format: uint64
        stale:
          type: boolean
    AffinityListResponse:
      type: object
      required:
      - count
      - items
      properties:
        count:
          type: integer
          format: uint64
        items:
          type: array
          items:
            $ref: '#/components/schemas/AffinityListItem'
    AssignmentReason:
      type: string
      enum:
      - create
      - operator
      - failover
      - rebalance
      - catalog_replay
      description: |
        Why an assignment was made (locked vocabulary for dashboards /
        EXPLAIN). `catalog_replay` = loaded from durable state at
        restart, not freshly assigned.
    PrimaryPod:
      type: object
      required:
