          type:
          - string
          - 'null'
          description: Runtime implementation that will execute the immutable contract.
        require_approved:
          type: boolean
          description: Require the latest append-only decision to approve the selected version.
    ResolvedEmbeddingModelResponse:
      type: object
      required:
      - asset_id
      - registry_name
      - registry_revision
      - contract_sha256
      - model
      properties:
        asset_id:
          type: string
        registry_name:
          type: string
        registry_revision:
          type: integer
          format: int64
          minimum: 0
        contract_sha256:
          type: string
        model:
          $ref: '#/components/schemas/CatalogEmbeddingModelVersion'
    ResolvedModelBindingResponse:
      type: object
      required:
      - model
      - dimension
      - model_asset_id
      - model_version
      - contract_sha256
      - snapshot
      properties:
        model:
          type: string
        dimension:
          type: integer
          format: int32
          minimum: 0
        model_asset_id:
          type: string
        model_version:
          type: integer
          format: int64
          minimum: 0
        contract_sha256:
          type: string
        snapshot:
          $ref: '#/components/schemas/ResolvedEmbeddingModelResponse'
    RestColumnDefinition:
      type: object
      description: Column definition for schema
      required:
      - name
      - data_type
      properties:
        name:
          type: string
          description: Column name
        data_type:
          type: string
          description: |-
            Data type

            Supported types:
            - "text": Variable-length UTF-8 text
            - "text_large": Large text with sidecar storage
            - "integer": 64-bit signed integer
            - "float": 64-bit floating point
            - "decimal": 128-bit decimal (precision, scale)
            - "boolean": True/false
            - "timestamp": Microseconds since epoch
            - "timestamp_tz": Timestamp with timezone
            - "date": Days since epoch
            - "time": Microseconds since midnight
            - "uuid": RFC 4122 UUID
            - "binary": Raw bytes
            - "json": Validated JSON
            - "array_text", "array_integer", "array_float", "array_boolean"
            - "map_string_string", "map_string_any"
            - "geo_point": Latitude/longitude point
            - "vector": Fixed-dimension vector (specify dimension)
        nullable:
          type:
          - boolean
          - 'null'
          description: |-
            Whether null values are allowed

            Default: true
        indexed:
          type:
          - boolean
          - 'null'
          description: |-
            Create secondary index for this column

            Improves query performance for equality/range filters.
            Default: false
        filterable:
          type:
          - boolean
          - 'null'
          description: |-
            Enable filtering on this column

            When true, the column can be used in WHERE clauses.
            Default: true for indexed columns, false otherwise
        max_length:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            Maximum length for TEXT/BINARY columns

            Default: no limit
          minimum: 0
        precision:
          type:
          - integer
          - 'null'
          format: int32
          description: Precision for DECIMAL type (1-38)
          minimum: 0
        scale:
          type:
          - integer
          - 'null'
          format: int32
          description: Scale for DECIMAL type (0-precision)
          minimum: 0
        vector_dimension:
          type:
          - integer
          - 'null'
          format: int32
          description: Dimension for VECTOR type
          minimum: 0
    ScanRecordsRequest:
      type: object
      description: |-
        Body of `POST /records/scan`. Mirrors the OpenAPI `ScanRecordsRequest`
        schema; all fields optional so an empty `{}` returns the first page.
      properties:
        cursor:
          type:
          - string
          - 'null'
          description: |-
            Opaque continuation token returned as `next_cursor` from a
            prior page. Omit / null to start from the beginning.
        limit:
          type:
          - integer
          - 'null'
          format: int32
          description: Max records to return in this page. Server enforces upper bound.
          minimum: 0
        filter:
          description: |-
            Metadata filter applied (before the limit) to the scanned page.
            Accepts either the typed list form `[{field,op,value}]` (mirrors
            `searchRecords.filters`) or a simple equality map `{field: value}`.
        include_vector:
          type:
          - boolean
          - 'null'
        include_text:
          type:
          - boolean
          - 'null'
    ScanRecordsResponse:
      type: object
      description: |-
        Response shape for `scanRecords`. Empty `records` + null
        `next_cursor` signals end-of-scan. Each record matches the OpenAPI
        `RecordResponse` schema (same shape used by `getRecord`).
      required:
      - records
      - content_revision
      - content_revision_token
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/RecordV2Response'
        content_revision:
          type: integer
          format: int64
          minimum: 0
        content_revision_token:
          type: string
        next_cursor:
          type:
          - string
          - 'null'
        scanned_count:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
    SchemaChange:
      type: object
      description: Description of a schema change
      required:
      - change_type
      - description
      properties:
        change_type:
          type: string
          description: Type of change
        column:
          type:
          - string
          - 'null'
          description: Affected column (if applicable)
        description:
          type: string
          description: Description of the change
    SchemaDefinition:
      type: object
      description: |-
        Schema definition for a collection

        Defines the typed columns and enforcement rules for ProximaRecord support.
      required:
      - columns
      properties:
        columns:
          type: array
          items:
            $ref: '#/components/schemas/RestColumnDefinition'
          description: Column definitions
        enforcement:
          type:
          - string
          - 'null'
          description: |-
            Schema enforcement mode

            - "strict": All columns must match schema exactly
            - "flexible": Schema on read, no validation at insert
            - "hybrid": Core columns enforced, additional fields allowed (default)
        allow_additional_fields:
          type:
          - boolean
          - 'null'
          description: |-
            Allow additional fields not defined in schema

            Only applies in "hybrid" mode.
            Default: true
    SchemaResponse:
      type: object
      description: Schema response with metadata
      required:
      - schema_id
      - schema_version
      - collection_id
      - schema
      - created_at
      properties:
        schema_id:
          type: string
          description: Schema ID (UUID)
        schema_version:
          type: string
          description: Schema version (semantic versioning)
        collection_id:
          type: string
          description: Collection this schema belongs to
        schema:
          $ref: '#/components/schemas/SchemaDefinition'
          description: Schema definition
        created_at:
          type: string
          description: Creation timestamp
        updated_at:
          type:
          - string
          - 'null'
          description: Last update timestamp
        parent_schema_id:
          type:
          - string
          - 'null'
          description: Parent schema ID (for evolution tracking)
    SearchEntitiesRequest:
      type: object
      properties:
        query_vector:
          type: array
          items:
            type: number
            format: float
          description: Query embedding for vector similarity search. Omit for metadata-only search.
        filters:
          type: object
          description: 'Equality metadata filters as a `{field: value}` JSON object.'
          additionalProperties: {}
          propertyNames:
            type: string
        top_k:
          type: integer
          format: int32
          minimum: 0
    SearchEntitiesResponse:
      type: object
      required:
      - results
      - total
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/EntitySearchResult'
        total:
          type: integer
          format: int32
          minimum: 0
    SqlRequest:
      type: object
      description: |-
        One SQL statement executed through the shared SQL authority.

        Parameter binding is intentionally not advertised yet: the relational
        execution port currently has no typed binding contract. Callers must not be
        offered a field that an adapter would silently ignore or interpolate.
      required:
      - query
      properties:
        query:
          type: string
          maxLength: 1048576
          minLength: 1
        collection:
          type:
          - string
          - 'null'
          description: Optional collection context used by vector/graph SQL extensions.
        timeout_ms:
          type:
          - integer
          - 'null'
          format: int64
          description: Per-request deadline. Defaults to 30 seconds and is capped at 5 minutes.
          maximum: 300000
          minimum: 1
    SqlResponse:
      type: object
      description: |-
        Stable JSON envelope for SQL reads and writes.

        For reads, `rows_returned` is the row count. For DDL/DML, the shared SQL
        authority reports the affected count in `rows_returned` and `rows` is empty.
      required:
      - rows
      - columns
      - column_types
      - rows_returned
      - rows_scanned
      - execution_time_ms
      - request_id
      properties:
        rows:
          type: array
          items:
            type: object
        columns:
          type: array
          items:
            type: string
        column_types:
          type: array
          items:
            type: string
        rows_returned:
          type: integer
          format: int64
          minimum: 0
        rows_scanned:
          type: integer
          format: int64
          minimum: 0
        execution_time_ms:
          type: integer
          format: int64
          minimum: 0
        request_id:
          type: string
    TextFieldInput:
      type: object
      description: |-
        Input format for TEXT fields

        TEXT fields are stored in dedicated columns with optional chunking
        for large content. The storage hint helps optimize storage strategy.
      required:
      - name
      - content
      properties:
        name:
          type: string
          description: Field name
        content:
          type: string
          description: Text content
        storage_hint:
          type:
          - string
          - 'null'
          description: |-
            Storage strategy hint

            - "inline": Store inline in main column (<4KB)
            - "chunked": Split into chunks with embeddings (4KB-1MB)
            - "sidecar": Store in separate sidecar file (>1MB)
            - "adaptive": Auto-select based on content size (default)
    TextFieldOutput:
      type: object
      description: Output format for TEXT fields
      required:
      - name
      - content
      - truncated
      properties:
        name:
          type: string
          description: Field name
        content:
          type: string
          description: Text content (may be truncated for large content)
        chunk_count:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of chunks (for chunked storage)
          minimum: 0
        truncated:
          type: boolean
          description: Whether content was truncated
    TypedFilter:
      type: object
      description: |-
        A typed filter for search operations

        Supports various comparison operators with type-safe values.
      required:
      - field
      - op
      - value
      properties:
        field:
          type: string
          description: Field name to filter on
        op:
          type: string
          description: |-
            Comparison operator

            Supported operators:
            - "eq": Equals
            - "neq": Not equals
            - "gt": Greater than
            - "gte": Greater than or equal
            - "lt": Less than
            - "lte": Less than or equal
            - "contains": String/array contains
            - "between": Value is between two bounds (requires value_upper)
            - "in": Value is in a list
            - "starts_with": String starts with prefix
            - "ends_with": String ends with suffix
        value:
          description: Filter value (type depends on field type)
        value_upper:
          description: Upper bound for "between" operator
    TypedSearchRequest:
      type: object
      description: |-
        Search request with typed filters

        ## Example JSON

        ```json
        {
            "vector": [0.1, 0.2, 0.3],
            "top_k": 10,
            "filters": [
                {"field": "category", "op": "eq", "value": "electronics"},
                {"field": "price", "op": "lt", "value": 500},
                {"field": "in_stock", "op": "eq", "value": true}
            ],
            "include_text": true
        }
        ```
      required:
      - vector
      - top_k
      properties:
        vector:
          type: array
          items:
            type: number
            format: float
          description: Query vector
          minItems: 1
        top_k:
          type: integer
          description: Number of results to return
          minimum: 1
        filters:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TypedFilter'
          description: Typed filters with operator support
        include_text:
          type:
          - boolean
          - 'null'
          description: |-
            Whether to include TEXT fields in results (default: false)

            TEXT fields can be large, so they are excluded by default.
            Set to true to include them in the response.
        include_vector:
          type:
          - boolean
          - 'null'
          description: |-
            Whether to include the vector in results (default: false)

            Vector data can be large, so it is excluded by default.
        debug:
          type:
          - boolean
          - 'null'
          description: |-
            Return the SearchPlanTrace + a human-readable route explain
            in the response (LLD §1 contract). Defaults to `false` so
            non-debug requests don't pay the JSON serialization cost of
            the ~30-field trace envelope.
    TypedSearchResponse:
      type: object
      description: Search response with typed results
      required:
      - results
      - latency_ms
      - request_id
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/TypedSearchResult'
          description: Search results
        total_matches:
          type:
          - integer
          - 'null'
          format: int64
          description: Total number of matching documents (before top_k limit)
          minimum: 0
        latency_ms:
          type: integer
          format: int64
          description: Search latency in milliseconds
          minimum: 0
        request_id:
          type: string
          description: Request ID for tracing
        predicate_shortfall:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/PredicateShortfallWire'
            description: |-
              TD-064: predicate-aware shortfall — present when a filtered search
              returned fewer than the requested `top_k` after the WAL+AXIS+storage
              merge. **Always emitted when present (NOT `debug`-gated)**, unlike
              `search_plan_trace`: a silent `<top_k` under a tenant/RLS filter is
              fail-open, so the client must be able to distinguish "fewer than k
              records match my filter" from "the engine returned my full top-k".
        search_plan_trace:
          description: |-
            SearchPlanTrace (LLD §10) — the per-query telemetry envelope that
            upstream gateways consume for metering and planner-v2 training.
            Phase 0 emits a stub trace populated from request_id + latency; later
            phases fill in the per-stage counters. Only emitted when the request
            sets `debug=true` (LLD §1 contract).
        explain:
          description: |-
            Human-readable explain summary derived from the SearchPlanTrace.
            Only emitted when the request sets `debug=true` — gives an on-call
            operator a one-glance view of the plan, cache result, and any
            actionable hints (high scan fraction, repair triggered, ...).
    TypedSearchResult:
      type: object
      description: Search result with typed fields
      required:
      - id
      - score
      - props
      properties:
        id:
          type: string
          description: Record ID
        score:
          type: number
          format: float
          description: Similarity score (0.0 - 1.0 for cosine, distance for L2)
        vector:
          type:
          - array
          - 'null'
          items:
            type: number
            format: float
          description: Vector embedding (if requested)
        props:
          type: object
          description: Rich properties from the record
          additionalProperties: {}
          propertyNames:
            type: string
        text_fields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TextFieldOutput'
          description: TEXT fields (if include_text is true)
    UpdateSchemaRequest:
      allOf:
      - $ref: '#/components/schemas/SchemaDefinition'
        description: Updated schema definition
      - type: object
        properties:
          force:
            type:
            - boolean
            - 'null'
            description: |-
              Force update even if validation warnings exist

              Use with caution - may cause data compatibility issues.
      description: |-
        Request to update schema

        ## Schema Evolution Rules

        1. **Adding Columns**: New columns must be nullable or have defaults
        2. **Type Changes**: Not allowed (except compatible widening like int32->int64)
        3. **Removing Columns**: Not allowed (use deprecation instead)
        4. **Enforcement Mode**: Can be changed, but strict->flexible may lose validation

        ## Example JSON

        ```json
        {
            "columns": [
                {"name": "category", "data_type": "text", "indexed": true},
                {"name": "price", "data_type": "float", "filterable": true},
                {"name": "tags", "data_type": "array_text", "nullable": true}
            ],
            "enforcement": "hybrid",
            "allow_additional_fields": true
        }
        ```
    UpdateSchemaResponse:
      type: object
      description: Schema update response
      required:
      - schema_id
      - schema_version
      - previous_schema_id
      - changes
      - warnings
      - updated_at
      properties:
        schema_id:
          type: string
          description: Updated schema ID
        schema_version:
          type: string
          description: New schema version
        previous_schema_id:
          type: string
          description: Previous schema ID (for rollback)
        changes:
          type: array
          items:
            $ref: '#/components/schemas/SchemaChange'
          description: List of applied changes
        warnings:
          type: array
          items:
            type: string
          description: Warnings about the update
        updated_at:
          type: string
          description: Update timestamp
    UpsertEntityRequest:
      type: object
      properties:
