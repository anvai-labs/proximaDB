          - string
          - 'null'
        actor:
          type:
          - string
          - 'null'
        idempotency_key:
          type:
          - string
          - 'null'
        catalog_schema_version:
          type:
          - integer
          - 'null'
          format: uint64
        row_count_hint:
          type:
          - integer
          - 'null'
          format: uint64
        estimated_bytes:
          type:
          - integer
          - 'null'
          format: uint64
        requires_row_level_semantics:
          type: boolean
        batch_local_constraints_sufficient:
          type: boolean
    TableWriteRejectedLaneExplanation:
