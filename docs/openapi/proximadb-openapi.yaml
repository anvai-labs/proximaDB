        It uses serde_json::Value for typed fields to support dynamic typing
        at the API boundary, with validation happening during conversion.
      required:
      - vector
      properties:
        id:
          type:
          - string
          - 'null'
          description: Record ID (optional, will be auto-generated if not provided)
