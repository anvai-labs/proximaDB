          format: uint64
        tenant_stable_id:
          type: integer
          format: uint64
        scope:
          $ref: '#/components/schemas/AbacScope'
        effect:
          $ref: '#/components/schemas/AbacEffect'
        predicate_ref:
          type:
          - integer
          - 'null'
          format: uint64
        field_mask:
          oneOf:
          - $ref: '#/components/schemas/AbacFieldMask'
          - type: 'null'
    AbacPolicyBindingsResponse:
