          application/json:
            schema:
              $ref: '#/components/schemas/ExplainQueryRequest'
        required: true
      responses:
        '200':
          description: Query plan and lowering details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
