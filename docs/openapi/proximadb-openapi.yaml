      - max_depth_reached
      properties:
        node_ids:
          type: array
          items:
            type: string
          description: Reached node ids (canonical `oid` = `graph/{graph_id}/node/{id}`).
        edge_count:
          type: integer
          minimum: 0
        max_depth_reached:
          type: integer
          format: int32
          minimum: 0
    IndexConfigInput:
      type: object
      description: REST input for a single index config (mirrors proto `IndexConfig`).
      required:
      - algorithm
      properties:
        index_name:
          type:
          - string
          - 'null'
          description: Optional index name (defaults to `index_<n>`).
        algorithm:
          type: string
          description: 'Algorithm: "hnsw", "ivf", "pq", "flat", "annoy", "lsh".'
        parameters:
          type: object
          description: Free-form algorithm parameters.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        hnsw_config:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/HnswConfigInput'
            description: HNSW tuning (when algorithm == "hnsw").
        ivf_config:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/IvfConfigInput'
            description: IVF tuning (when algorithm == "ivf").
        is_primary:
          type:
          - boolean
          - 'null'
          description: Mark this index as the collection's primary ANN index (gRPC-v2 parity).
    IndexPolicyInput:
      type: object
      description: |-
        REST input for the per-collection index routing policy (mirrors proto
        `IndexPolicy`; ADR-028).
      properties:
        mode:
          type:
          - string
          - 'null'
          description: |-
            Routing mode: "auto" (default) | "exact" | "ivf" | "hnsw" | "helix".
            "auto"/omitted ⇒ cost-derived. "exact" ⇒ always brute-force (no index).
            The engine modes force the collection onto that engine/route.
        rehydrate:
          type:
          - string
          - 'null'
          description: |-
            Cold-start index warming: "auto" (default) | "eager" | "lazy" | "never".
            Index/auto modes only — rejected when `mode = "exact"`.
        byte_budget:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Exact-scan byte budget override (bytes). 0/omitted ⇒ cost-model default
            for the storage class.
          minimum: 0
        nprobe:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            nprobe override for index modes. 0/omitted ⇒ cost-derived. Rejected when
            `mode = "exact"`.
          minimum: 0
    IndexSpecOutput:
      type: object
      description: REST output for a single index config (mirrors gRPC `V2IndexSpec`).
      required:
      - algorithm
      - is_primary
      properties:
        algorithm:
          type: string
          description: 'Algorithm: "hnsw" | "ivf" | "pq" | "flat" | "annoy" | "lsh".'
        hnsw:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/HnswConfigOutput'
            description: HNSW params (present when the index is HNSW).
        ivf:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/IvfConfigOutput'
            description: IVF params (present when the index is IVF).
        is_primary:
          type: boolean
          description: Whether this is the collection's primary ANN index.
    IngestDocument:
      type: object
      description: A single record submitted for native embedding + indexing.
      required:
      - id
      properties:
        id:
          type: string
        text:
          type:
          - string
          - 'null'
          description: |-
            Raw text content. Required when `X-Embed-Source: native` (default);
            optional when the client also supplied a vector.
        vector:
          type:
          - array
          - 'null'
          items:
            type: number
