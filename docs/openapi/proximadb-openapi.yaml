      - code
      properties:
        type:
          type: string
          description: Stable machine-readable error code (snake_case).
          example: collection_not_found
        message:
          type: string
        code:
          type: integer
          format: int32
          description: HTTP status code.
        request_id:
          type:
          - string
          - 'null'
          description: Correlation id (matches the X-Request-ID header).
        details:
          type:
          - object
          - 'null'
          description: Optional structured context (e.g. migration hints).
    ErrorResponse:
      type: object
      description: |-
        Canonical ProximaDB error envelope (`{ error: { type, message, code } }`).

        `request_id` (also returned in the `X-Request-ID` response header) is present
        whenever the request passed through the request-id middleware; quote it in
        bug reports.
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    ExplainQueryRequest:
      type: object
      required:
      - language
      - query
      properties:
        language:
          $ref: '#/components/schemas/QueryLanguage'
        query:
          type: string
          minLength: 1
        collection:
          type:
          - string
          - 'null'
    FusionHit:
      type: object
      required:
      - oid
      - score
      - source_count
      properties:
        oid:
          type: string
        score:
          type: number
          format: float
        source_count:
          type: integer
          minimum: 0
        labels:
          type: array
          items:
            type: string
          description: |-
            Graph node label(s) of the reached node. Exposed so cross-modal-joint
            consumers can correlate a fused hit by its graph label without a separate
            node lookup (#485). The expansion already reaches the node, so this is
            near-free to fill. Additive + back-compat (empty until populated).
    FusionSearchRequest:
      type: object
      required:
      - vector_collection
      - query_vector
      properties:
        vector_collection:
          type: string
          description: Vector collection to seed from (its records co-indexed with this graph by `oid`).
        query_vector:
          type: array
          items:
            type: number
            format: float
          description: Query embedding for the ANN seed.
        limit:
          type: integer
          minimum: 0
        max_depth:
          type: integer
          format: int32
          description: k-hop expansion depth (bounded; default 1 — the validated sweet spot).
          minimum: 0
        edge_types:
          type: array
          items:
            type: string
        max_seeds:
          type: integer
          description: How many of the top vector seeds to expand from (bounded expansion).
          minimum: 0
        vector_weight:
          type:
          - number
          - 'null'
          format: float
        graph_weight:
          type:
          - number
          - 'null'
          format: float
        rrf:
          type: boolean
          description: Use the rank-based RRF fallback instead of PIT-calibrated linear.
        consensus_beta:
          type:
          - number
          - 'null'
          format: float
          description: Consensus boost added to any `oid` present in ≥2 sources.
        grain:
          type:
          - string
          - 'null'
          description: 'Graph contribution grain: `"nodes"` (default), `"edges"`, or `"both"`.'
        min_weight_fraction:
          type:
          - number
          - 'null'
          format: float
          description: |-
            Cost-routing policy inputs (TD-141): drop negligible modalities (weight fraction) and budget each.
            When absent, fusion is unbounded.
        total_budget:
          type:
          - integer
          - 'null'
          minimum: 0
        text_query:
          type:
          - string
          - 'null'
          description: |-
            Optional BM25/full-text query (TD-138). When present (and non-empty), fusion also searches the
            collection's document index and merges BM25 hits into the result by shared `oid` — tri-modal
            (vector + graph + document) fusion. Absent ⇒ vector+graph only (unchanged).
        document_collection:
          type:
          - string
          - 'null'
          description: |-
            Collection whose document index to BM25-search. Defaults to `vector_collection` (documents
            co-indexed with the vectors share the record `oid`, so they merge by `oid`).
        document_weight:
          type:
          - number
          - 'null'
          format: float
          description: Document modality weight (mirrors `vector_weight` / `graph_weight`). Defaults to 1.0.
    FusionSearchResponse:
      type: object
      required:
      - results
      - stats
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/FusionHit'
        stats:
          $ref: '#/components/schemas/FusionStatsDto'
    FusionStatsDto:
      type: object
      required:
