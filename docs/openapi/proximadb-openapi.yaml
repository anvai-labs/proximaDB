          - integer
          - 'null'
          format: int64
        target_last_analyzed_ms:
          type:
          - integer
          - 'null'
          format: int64
        source_stats_age_ms:
          type:
          - integer
          - 'null'
          format: uint64
        target_stats_age_ms:
          type:
          - integer
          - 'null'
          format: uint64
        freshness_sla_ms:
