  /api/v2/query:
    post:
      tags:
      - Query
      summary: Execute AQL or UQL through the shared query facade.
      description: |-
        The canonical unified query surface: UQL (unified multi-modal), federated SQL
        extensions, and AQL. This is NOT plain SQL-over-REST and is NOT deprecated:
        UQL/AQL are non-SQL languages that pgwire and `/api/v2/sql` cannot serve, so
        this endpoint remains their canonical home. Authenticated programmatic SQL
        is available through both gRPC `ExecuteQuery` and `/api/v2/sql`; neither is a
        replacement for this UQL/federated surface.
      operationId: executeQuery
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
        required: true
      responses:
        '200':
          description: Query result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. An authenticated tenant binding takes precedence and a mismatch is rejected, except that an authenticated gateway principal may delegate an acting tenant when gateway-only trust is configured. Without an authenticated binding, acceptance depends on the configured header trust policy. When absent, a single-tenant deployment selects its configured default tenant; a multi-tenant deployment rejects the request. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
