              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/collections/{collection_id}/records/scan:
    post:
      tags:
      - Records
      summary: Paginated scan of records in a collection.
      description: |-
        Returns the next page of records (TD-099 acceptance 2 + 3, live).
        Cursor-based pagination: pass the response's `next_cursor` back as
        `cursor` to fetch the next page; a `null` cursor means the scan is
        exhausted. Cursors are minted and validated against the caller-facing
        collection id in the URL path, expire after 24h (HTTP 410), and reject
        cross-collection reuse (HTTP 400).
      operationId: scanRecords
      parameters:
      - name: collection_id
        in: path
        description: Collection name/ID.
        required: true
        schema:
          type: string
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. An authenticated tenant binding takes precedence and a mismatch is rejected, except that an authenticated gateway principal may delegate an acting tenant when gateway-only trust is configured. Without an authenticated binding, acceptance depends on the configured header trust policy. When absent, a single-tenant deployment selects its configured default tenant; a multi-tenant deployment rejects the request. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanRecordsRequest'
        required: true
      responses:
        '200':
          description: Page of records + optional next cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanRecordsResponse'
        '400':
          description: Invalid request (including a cursor minted for a different collection).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Collection changed during the scan; restart pagination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Cursor expired (older than 24h); restart the scan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/collections/{collection_id}/records/{record_id}:
    get:
      tags:
      - Records
      summary: Get a record by ID.
      description: |-
        Get a single record by ID.

        ## Path Parameters

        - `collection_id`: Collection name/ID
        - `record_id`: Record ID

        ## Query Parameters

        - `include_vector`: Whether to include the vector (default: true)
        - `include_text`: Whether to include TEXT fields (default: false)

        ## Response

        Returns [`RecordV2Response`] with record details.

        ## Errors

        - `404 Not Found`: Collection or record does not exist
        - `500 Internal Server Error`: Retrieval failed
      operationId: getRecord
      parameters:
      - name: collection_id
        in: path
        description: Collection name/ID.
        required: true
        schema:
          type: string
      - name: record_id
        in: path
        description: Record ID.
        required: true
        schema:
          type: string
      - name: include_vector
        in: query
        description: Whether to include the vector in the response
        required: false
        schema:
          type: boolean
      - name: include_text
        in: query
        description: Whether to include TEXT fields in the response
        required: false
        schema:
          type: boolean
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. An authenticated tenant binding takes precedence and a mismatch is rejected, except that an authenticated gateway principal may delegate an acting tenant when gateway-only trust is configured. Without an authenticated binding, acceptance depends on the configured header trust policy. When absent, a single-tenant deployment selects its configured default tenant; a multi-tenant deployment rejects the request. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
      responses:
        '200':
          description: Record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordV2Response'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Records
      summary: Delete a record by ID.
      description: Delete a single record by writing a tombstone through the rich record path.
      operationId: deleteRecord
      parameters:
      - name: collection_id
        in: path
        description: Collection name/ID.
        required: true
        schema:
          type: string
      - name: record_id
        in: path
        description: Record ID.
        required: true
        schema:
          type: string
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. An authenticated tenant binding takes precedence and a mismatch is rejected, except that an authenticated gateway principal may delegate an acting tenant when gateway-only trust is configured. Without an authenticated binding, acceptance depends on the configured header trust policy. When absent, a single-tenant deployment selects its configured default tenant; a multi-tenant deployment rejects the request. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
      responses:
        '200':
          description: Delete accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteRecordV2Response'
  /api/v2/collections/{collection_id}/schema:
    get:
      tags:
      - Schema
      summary: Get collection schema.
      description: |-
        Retrieve the schema definition for a collection.

        ## Path Parameters

        - `collection_id`: Collection name/ID

        ## Response

        Returns [`SchemaResponse`] with full schema details.

        ## Errors

        - `404 Not Found`: Collection or schema does not exist
        - `500 Internal Server Error`: Retrieval failed
      operationId: getCollectionSchema
      parameters:
      - name: collection_id
        in: path
        description: Collection name/ID.
        required: true
        schema:
          type: string
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. An authenticated tenant binding takes precedence and a mismatch is rejected, except that an authenticated gateway principal may delegate an acting tenant when gateway-only trust is configured. Without an authenticated binding, acceptance depends on the configured header trust policy. When absent, a single-tenant deployment selects its configured default tenant; a multi-tenant deployment rejects the request. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
      responses:
        '200':
          description: Collection schema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaResponse'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - Schema
      summary: Update collection schema.
      description: |-
        Update the schema for a collection.

        ## Path Parameters

        - `collection_id`: Collection name/ID

        ## Request Body

        See [`UpdateSchemaRequest`] for the expected JSON format.

        ## Response

        Returns [`UpdateSchemaResponse`] with change details.

        ## Schema Evolution

        Schema updates must follow evolution rules to maintain data compatibility.
        See [`UpdateSchemaRequest`] for detailed rules.

        ## Errors

        - `400 Bad Request`: Invalid schema or evolution violation
        - `404 Not Found`: Collection does not exist
        - `409 Conflict`: Incompatible schema change
        - `500 Internal Server Error`: Update failed
      operationId: updateCollectionSchema
      parameters:
      - name: collection_id
        in: path
        description: Collection name/ID.
        required: true
        schema:
          type: string
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. An authenticated tenant binding takes precedence and a mismatch is rejected, except that an authenticated gateway principal may delegate an acting tenant when gateway-only trust is configured. Without an authenticated binding, acceptance depends on the configured header trust policy. When absent, a single-tenant deployment selects its configured default tenant; a multi-tenant deployment rejects the request. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSchemaRequest'
        required: true
      responses:
        '200':
          description: Schema updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateSchemaResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/collections/{collection_id}/search:
