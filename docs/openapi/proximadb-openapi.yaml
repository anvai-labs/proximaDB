  /api/v2/graphs/{graph_id}/fusion-search:
    post:
      tags:
      - graphs
      summary: '`POST /api/v2/graphs/{graph_id}/fusion-search` — vector seed → graph expand → calibrated fuse-by-oid.'
      operationId: fusion_search_v2
      parameters:
      - name: graph_id
        in: path
        description: Graph ID for traversal expansion
        required: true
        schema:
          type: string
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. An authenticated tenant binding takes precedence and a mismatch is rejected, except that an authenticated gateway principal may delegate an acting tenant when gateway-only trust is configured. Without an authenticated binding, acceptance depends on the configured header trust policy. When absent, a single-tenant deployment selects its configured default tenant; a multi-tenant deployment rejects the request. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FusionSearchRequest'
        required: true
      responses:
        '200':
          description: Fusion results with calibrated scores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FusionSearchResponse'
        '400':
          description: Invalid request (empty query_vector, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Fusion execution failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/graphs/{graph_id}/impact-analysis:
    post:
      tags:
      - graphs
      summary: |-
        `POST /api/v2/graphs/{graph_id}/impact-analysis` — forward/backward blast radius (TD-131). The
