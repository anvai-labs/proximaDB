          minimum: 0
        ef_search:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
    HnswConfigOutput:
      type: object
      description: REST output for HNSW params (mirrors gRPC `V2HnswConfig`).
      properties:
        m:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        ef_construction:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        ef_search:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
    ImpactAnalysisRequest:
      type: object
      required:
      - node_id
      properties:
        node_id:
          type: string
          description: Start symbol node id.
        direction:
          type:
          - string
          - 'null'
          description: '`"forward"` (default — what X impacts) or `"backward"` (what impacts X).'
        edge_types:
          type: array
          items:
            type: string
        max_depth:
          type: integer
          format: int32
          minimum: 0
        limit:
          type: integer
          minimum: 0
    ImpactAnalysisResponse:
