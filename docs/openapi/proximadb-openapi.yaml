          $ref: '#/components/responses/PodUnauthorized'
        '403':
          $ref: '#/components/responses/PodForbidden'
      parameters:
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. An authenticated tenant binding takes precedence and a mismatch is rejected, except that an authenticated gateway principal may delegate an acting tenant when gateway-only trust is configured. Without an authenticated binding, acceptance depends on the configured header trust policy. When absent, a single-tenant deployment selects its configured default tenant; a multi-tenant deployment rejects the request. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
    put:
      tags:
      - Collections
      operationId: putPrimaryPod
      summary: Assign a (tenant, collection)'s primary pod.
      description: |
        Operator-gated (SystemAdmin ∪ ConfigureSystem) — these expose
        cross-tenant placement and drive WAL write routing. The
        assignment is mirrored to the catalog; a mirror failure is
        logged and counted but does NOT fail the request (PUT-success
        means the binding is in effect for routing; the catalog
        reconciles on the next write).
        The optional `X-Tenant-ID` header is not consulted by this
        handler — the `tenant_id` PATH segment governs.
        Requires REST auth enabled — in an auth-disabled
        deployment every call to this operation returns 401
        `missing_auth_context`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrimaryPodAssignRequest'
      responses:
        '200':
          description: The assignment (with the previous binding when re-assigning).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrimaryPodAssignResponse'
        '401':
          $ref: '#/components/responses/PodUnauthorized'
        '403':
          $ref: '#/components/responses/PodForbidden'
      parameters:
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. An authenticated tenant binding takes precedence and a mismatch is rejected, except that an authenticated gateway principal may delegate an acting tenant when gateway-only trust is configured. Without an authenticated binding, acceptance depends on the configured header trust policy. When absent, a single-tenant deployment selects its configured default tenant; a multi-tenant deployment rejects the request. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
    delete:
      tags:
      - Collections
      operationId: deletePrimaryPod
      summary: Unassign a (tenant, collection)'s primary pod.
      description: |
        200 always; `removed` distinguishes an actual removal from a
        no-op. Catalog-mirror policy is the same as PUT (logged, not
        fatal).
        The optional `X-Tenant-ID` header is not consulted by this
        handler — the `tenant_id` PATH segment governs.
        Requires REST auth enabled — in an auth-disabled
        deployment every call to this operation returns 401
        `missing_auth_context`.
      responses:
        '200':
          description: Unassign outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrimaryPodUnassignResponse'
        '401':
          $ref: '#/components/responses/PodUnauthorized'
        '403':
          $ref: '#/components/responses/PodForbidden'
      parameters:
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. An authenticated tenant binding takes precedence and a mismatch is rejected, except that an authenticated gateway principal may delegate an acting tenant when gateway-only trust is configured. Without an authenticated binding, acceptance depends on the configured header trust policy. When absent, a single-tenant deployment selects its configured default tenant; a multi-tenant deployment rejects the request. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
  /api/v2/primary-pod:
    get:
      tags:
      - Collections
      operationId: listPrimaryPods
      summary: List every primary-pod binding (all tenants).
      description: |
        Cross-tenant operator view — the registry is keyed by
        (tenant_id, collection_id).
        The optional `X-Tenant-ID` header is not consulted by this
        handler.
        Requires REST auth enabled — in an auth-disabled
        deployment every call to this operation returns 401
        `missing_auth_context`.
      responses:
        '200':
          description: All bindings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrimaryPodListResponse'
        '401':
          $ref: '#/components/responses/PodUnauthorized'
        '403':
          $ref: '#/components/responses/PodForbidden'
      parameters:
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. An authenticated tenant binding takes precedence and a mismatch is rejected, except that an authenticated gateway principal may delegate an acting tenant when gateway-only trust is configured. Without an authenticated binding, acceptance depends on the configured header trust policy. When absent, a single-tenant deployment selects its configured default tenant; a multi-tenant deployment rejects the request. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
  /api/v2/catalog/table-routing:
    get:
      tags:
      - Catalog
      operationId: getCatalogTableRouting
      summary: Table-level xCatalog routing metadata.
      description: |
        Serves `information_schema.table_routing` as a table-shaped
        result — the same projection pgwire/SQL clients see. All cell
        values are strings.
        The optional `X-Tenant-ID` header is not consulted by this
        handler (the introspection projection is cluster-scope).
        The filter dispatch is LEXICAL over the composed SQL text, so a
        `table_name` containing SQL fragments (e.g. ` from
        xcatalog.namespaces`) can be misread as a different view — do
        not treat this endpoint as a structured query interface
        (TD-SPECRAT-3 tracks the structured-filter fix). Names match
        case-insensitively; a name containing a single quote silently
        truncates the filter at the quote.
      parameters:
      - name: table_name
        in: query
        required: false
        schema:
          type: string
        description: Filter to one table (case-insensitive name match).
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. An authenticated tenant binding takes precedence and a mismatch is rejected, except that an authenticated gateway principal may delegate an acting tenant when gateway-only trust is configured. Without an authenticated binding, acceptance depends on the configured header trust policy. When absent, a single-tenant deployment selects its configured default tenant; a multi-tenant deployment rejects the request. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
      responses:
        '200':
          description: Routing rows (columns/column_types/rows, all strings).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogIntrospectionResult'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v2/catalog/table-write/explain:
    post:
      tags:
      - Catalog
      operationId: explainTableWriteRoute
      summary: Explain table-write route selection WITHOUT executing.
      description: |
        Runs the DML write planner in explain-only mode: resolves the
        target (and source) tables, plans the copy/write, and returns
        the full route decision — selected backend + access method,
        write lane (+ rejected lanes with reasons), candidate/rejected
        paths, estimated cost and data movement, required guards, and
        the write intent summary. Nothing is written.
        Provide EITHER `source_table` OR `source_sql` (400 otherwise).
        Extractor rejections (malformed JSON body, duplicate query
        params) bypass the JSON error envelope and return axum's
        plain-text 400/415/422 bodies — the typed envelope below covers
        handler-emitted errors only.
        The optional `X-Tenant-ID` header is not consulted — tenant
        context, if any, rides the body's `tenant_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableWriteExplainRequest'
      responses:
        '200':
          description: The route explanation (no write executed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableWriteRouteExplanation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. An authenticated tenant binding takes precedence and a mismatch is rejected, except that an authenticated gateway principal may delegate an acting tenant when gateway-only trust is configured. Without an authenticated binding, acceptance depends on the configured header trust policy. When absent, a single-tenant deployment selects its configured default tenant; a multi-tenant deployment rejects the request. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
components:
  schemas:
    ApplyModelRegistryMutationRequest:
      type: object
      required:
      - expected_revision
      - mutation
      properties:
        expected_revision:
          type: integer
          format: int64
          description: Optimistic concurrency token returned by the previous read or mutation.
          minimum: 0
        mutation:
          $ref: '#/components/schemas/CatalogModelRegistryMutation'
          description: Command-shaped mutation; whole-registry replacement is intentionally unsupported.
    CatalogArtifactDescriptor:
      type: object
      description: Content-addressed reference to bytes held outside xCatalog.
      required:
      - uri
      - digest
      - size_bytes
      - media_type
      properties:
        uri:
          type: string
        digest:
          type: string
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        media_type:
          type: string
    CatalogDeploymentBinding:
      type: object
      description: Mutable serving intent that always resolves to an immutable version/digest.
      required:
      - name
      - version
      - artifact_digest
      - runtime
      - endpoint
      - updated_at_ms
      properties:
        name:
          type: string
        version:
          type: integer
          format: int64
          minimum: 0
        artifact_digest:
          type: string
        runtime:
          type: string
        endpoint:
          type: string
        updated_at_ms:
          type: integer
          format: int64
    CatalogDimensionPolicy:
      oneOf:
      - type: string
        enum:
        - fixed
      - type: string
        enum:
        - discrete
      - type: object
        required:
        - range
        properties:
          range:
            $ref: '#/components/schemas/CatalogDimensionRange'
    CatalogDimensionRange:
      type: object
      required:
      - minimum
      properties:
        minimum:
          type: integer
          format: int32
          minimum: 0
    CatalogEmbeddingInputContract:
      type: object
      description: Exact rendered-input and tokenizer budget consumed by an embedding runtime.
      required:
      - model_revision
      - tokenizer_id
      - tokenizer_revision
      - tokenizer_fingerprint
      - declared_context_limit
      - effective_context_limit
      - special_token_count
      - document_template
      - query_template
      properties:
        model_revision:
          type: string
        tokenizer_id:
          type: string
        tokenizer_revision:
          type: string
        tokenizer_fingerprint:
          type: string
        declared_context_limit:
          type: integer
          format: int32
          minimum: 0
        effective_context_limit:
          type: integer
          format: int32
          minimum: 0
        special_token_count:
          type: integer
          format: int32
          minimum: 0
        document_template:
          type: string
        query_template:
          type: string
        document_parameters:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
        query_parameters:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
    CatalogEmbeddingModelRegistry:
      type: object
      description: |-
        Registered embedding model: immutable versions plus separately mutable or
        append-only lifecycle records.
      required:
      - schema_version
      - name
      properties:
        schema_version:
          type: integer
          format: int32
          minimum: 0
        revision:
          type: integer
          format: int64
          description: |-
            Optimistic concurrency token for catalog/API mutations. Old rows default
            to zero; every successful command increments it.
          minimum: 0
        name:
          type: string
        versions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CatalogEmbeddingModelVersion'
          propertyNames:
            type: integer
            format: int64
            minimum: 0
        aliases:
          type: object
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
          propertyNames:
            type: string
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/CatalogEvaluationEvidence'
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/CatalogModelDecision'
        deployments:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CatalogDeploymentBinding'
          propertyNames:
            type: string
        tags:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
    CatalogEmbeddingModelVersion:
      type: object
      description: Immutable executable contract for one registered model version.
      required:
      - version
      - provider_model_id
      - artifact
      - input
      - output
      - created_at_ms
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
        provider_model_id:
          type: string
        artifact:
          $ref: '#/components/schemas/CatalogArtifactDescriptor'
        input:
          $ref: '#/components/schemas/CatalogEmbeddingInputContract'
        output:
          $ref: '#/components/schemas/CatalogEmbeddingOutputContract'
        governance:
          $ref: '#/components/schemas/CatalogModelGovernance'
        lineage:
          $ref: '#/components/schemas/CatalogModelLineage'
        created_at_ms:
          type: integer
          format: int64
        source_run_id:
          type:
          - string
          - 'null'
    CatalogEmbeddingOutputContract:
      type: object
      required:
      - native_dimension
      - dimension_policy
      - supported_dimensions
      - normalized
      - pooling
      properties:
        native_dimension:
          type: integer
          format: int32
          minimum: 0
        dimension_policy:
          $ref: '#/components/schemas/CatalogDimensionPolicy'
        supported_dimensions:
          type: array
          items:
            type: integer
            format: int32
            minimum: 0
        normalized:
          type: boolean
        pooling:
          type: string
    CatalogEvaluationEvidence:
      type: object
      description: Append-only evaluation summary. Large row-level results remain external.
      required:
      - evidence_id
      - version
      - dataset_name
      - dataset_digest
      - evaluator
      - metrics
      - created_at_ms
      properties:
        evidence_id:
          type: string
        version:
          type: integer
          format: int64
          minimum: 0
        dataset_name:
          type: string
        dataset_digest:
          type: string
        evaluator:
          type: string
        metrics:
          type: object
          additionalProperties:
            type: number
            format: double
          propertyNames:
            type: string
        created_at_ms:
          type: integer
          format: int64
    CatalogLineageInput:
      type: object
      description: Digest-pinned input consumed by the execution that produced a model.
      required:
      - kind
      - name
      - digest
      properties:
        kind:
          $ref: '#/components/schemas/CatalogLineageInputKind'
        name:
          type: string
        digest:
          type: string
    CatalogLineageInputKind:
      type: string
      enum:
      - dataset
      - feature_set
      - model
      - artifact
    CatalogModelAccess:
      type: string
      enum:
      - open
      - gated
      - unreviewed
    CatalogModelAliasMutation:
      type: object
      required:
      - alias
      - version
      properties:
        alias:
          type: string
        version:
          type: integer
          format: int64
          minimum: 0
    CatalogModelDecision:
      type: object
      description: Append-only policy/audit decision, intentionally separate from evidence.
      required:
      - decision_id
      - version
      - decision
      - evidence_ids
      - principal
      - created_at_ms
      properties:
        decision_id:
          type: string
        version:
          type: integer
          format: int64
          minimum: 0
        decision:
          $ref: '#/components/schemas/CatalogModelDecisionKind'
        evidence_ids:
          type: array
          items:
            type: string
        principal:
          type: string
        created_at_ms:
          type: integer
          format: int64
    CatalogModelDecisionKind:
      type: string
      enum:
      - approved
      - rejected
      - deprecated
    CatalogModelGovernance:
      type: object
      description: |-
        Supply-chain and runtime policy declared for an immutable model version.
        Approval decisions remain separate append-only audit records.
      properties:
        license_id:
          type: string
        access:
          $ref: '#/components/schemas/CatalogModelAccess'
        requires_remote_code:
          type: boolean
        approved_runtimes:
          type: array
          items:
            type: string
          uniqueItems: true
    CatalogModelLineage:
      type: object
      description: MLMD/OpenLineage-shaped producer execution and its declared inputs.
      properties:
        producer_execution_id:
          type:
          - string
          - 'null'
        code_revision:
          type:
          - string
          - 'null'
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/CatalogLineageInput'
    CatalogModelRegistryMutation:
      oneOf:
      - type: object
        title: RegisterModelVersionMutation
        required:
        - payload
        - operation
        properties:
          payload:
            $ref: '#/components/schemas/CatalogEmbeddingModelVersion'
          operation:
            type: string
            enum:
            - register_version
      - type: object
        required:
        - payload
        - operation
        properties:
          payload:
            $ref: '#/components/schemas/CatalogModelAliasMutation'
          operation:
            type: string
            enum:
            - set_alias
      - type: object
        title: AppendModelEvidenceMutation
        required:
        - payload
        - operation
        properties:
          payload:
            $ref: '#/components/schemas/CatalogEvaluationEvidence'
          operation:
            type: string
            enum:
            - append_evidence
      - type: object
        title: RecordModelDecisionMutation
        required:
        - payload
        - operation
        properties:
          payload:
            $ref: '#/components/schemas/CatalogModelDecision'
          operation:
            type: string
            enum:
            - record_decision
      - type: object
        title: UpsertModelDeploymentMutation
        required:
        - payload
        - operation
        properties:
          payload:
            $ref: '#/components/schemas/CatalogDeploymentBinding'
          operation:
            type: string
            enum:
            - upsert_deployment
      description: |-
        Command-shaped mutations preserve version/evidence/decision immutability at
        the persistence boundary. API adapters lower into these commands instead
        of replacing a whole registry document.
    CollectionStatsV2:
      type: object
      description: Collection statistics for v2 API
      required:
      - storage_size_bytes
      - indexed_fields
      - text_field_count
      properties:
        record_count:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Total number of records, or `null` when the server does not know.

            `null` is a real answer here, not a gap. The counter is maintained by
            `MetadataStore::update_stats`, which the record write path does not call,
            so a collection that has never had stats written carries none. Reporting
            `0` in that case is a *confident wrong answer* — indistinguishable from a
            genuinely empty collection, and it cost one downstream project a false
            durability bug report before the cause was found (#1527).
          minimum: 0
        storage_size_bytes:
          type: integer
          format: int64
          description: Total storage size in bytes
          minimum: 0
        indexed_fields:
          type: integer
          format: int32
          description: Number of indexed fields
          minimum: 0
        text_field_count:
          type: integer
          format: int32
          description: Number of TEXT fields with dedicated storage
          minimum: 0
    CollectionV2Response:
      type: object
      description: Collection details response
      required:
      - collection_id
      - name
      - dimension
      - engine
      - distance_metric
      - proxima_record_enabled
      - stats
      - content_revision
      - content_revision_token
      - index_specs
      - created_at
      properties:
        collection_id:
          type: string
          description: Collection ID
        name:
          type: string
          description: Collection name
        dimension:
          type: integer
          format: int32
          description: Vector dimension
          minimum: 0
        engine:
          type: string
          description: Storage engine
        distance_metric:
          type: string
          description: Distance metric
        proxima_record_enabled:
          type: boolean
          description: Whether ProximaRecord is enabled
        canonical_embedding_precision:
          type:
          - string
          - 'null'
          description: |-
            Canonical embedding precision label for stored vectors.

            Stable string matching the proto `EmbeddingPrecision::as_str_name()`
            (e.g. "EMBEDDING_PRECISION_FP16"). `None` when the collection didn't
            set a non-default (Unspecified/Fp32) precision.
        schema:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SchemaDefinition'
            description: Schema definition (if defined)
        stats:
          $ref: '#/components/schemas/CollectionStatsV2'
          description: Collection statistics
        content_revision:
          type: integer
          format: int64
          description: Monotonic server-owned content revision for cache revalidation.
          minimum: 0
        content_revision_token:
          type: string
          description: Opaque validator that also fences server restarts.
        index_specs:
          type: array
          items:
            $ref: '#/components/schemas/IndexSpecOutput'
          description: |-
            Per-index config (HNSW/IVF params, is_primary) as persisted at create
            time. Mirrors the gRPC-v2 `GetCollection` `index_specs` (TD-122 parity).
        quantization:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/QuantizationConfigOutput'
            description: Quantization config as persisted at create time, or `None` when unset.
        created_at:
          type: string
          description: Creation timestamp
        updated_at:
          type:
          - string
          - 'null'
          description: Last update timestamp
    CollectionV2Summary:
      type: object
      description: Summary of a collection for list operations
      required:
      - collection_id
      - name
      - dimension
      - engine
      - proxima_record_enabled
      properties:
        collection_id:
          type: string
          description: Collection ID
        name:
          type: string
          description: Collection name
        dimension:
          type: integer
          format: int32
          description: Vector dimension
          minimum: 0
        engine:
          type: string
          description: Storage engine
        proxima_record_enabled:
          type: boolean
          description: Whether ProximaRecord is enabled
        record_count:
          type:
          - integer
          - 'null'
          format: int64
          description: Record count (if include_stats is true)
          minimum: 0
    CreateCollectionV2Request:
      type: object
      description: |-
        Request to create a collection with schema support

        ## Example JSON

        ```json
        {
            "name": "products",
            "dimension": 768,
            "engine": "sst",
            "schema": {
                "columns": [
                    {"name": "category", "data_type": "text", "indexed": true},
                    {"name": "price", "data_type": "float", "filterable": true},
                    {"name": "description", "data_type": "text", "max_length": 10000}
                ],
                "enforcement": "hybrid",
                "allow_additional_fields": true
            },
            "enable_proxima_record": true
        }
        ```
      required:
      - name
      - dimension
      properties:
        name:
          type: string
          description: Collection name (required)
          minLength: 1
        dimension:
          type: integer
          format: int32
          description: Vector dimension (required)
          minimum: 1
        engine:
          type:
          - string
          - 'null'
          description: |-
            Storage engine selection

            Options: "auto", "sst", "helix", "viper", "swift", "nova", "raptor", "tst"
            Default: "auto" (system selects optimal engine)
        schema:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SchemaDefinition'
            description: Schema definition with column types
        enable_proxima_record:
          type:
          - boolean
          - 'null'
          description: |-
            Enable ProximaRecord support for this collection

            When enabled:
            - Records can use rich props and text_fields
            - Schema validation is applied at insert time
            - TEXT columns are stored in dedicated columnar format

            Default: false (backward compatible with v1)
        distance_metric:
          type:
          - string
          - 'null'
          description: |-
            Distance metric for vector similarity

            Options: "cosine", "euclidean", "dot_product"
            Default: "cosine"
        initial_capacity:
          type:
          - integer
          - 'null'
          format: int64
          description: Initial capacity hint for pre-allocation
          minimum: 0
        canonical_embedding_precision:
          type:
          - string
          - 'null'
          description: |-
            Canonical embedding precision for stored vectors

            Options: "fp32" (default), "fp16", "bf16", "int8", "uint8".
            Accepts the same string forms as the gRPC / Arrow Flight surfaces
            (e.g. "half", "float16", "EMBEDDING_PRECISION_FP16"). The DDL
            service applies the same normalisation, so SDKs and pgwire
            converge on the same enum discriminant.
        index_configs:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/IndexConfigInput'
          description: |-
            Index configurations (e.g. an explicit IVF or HNSW index).

            Restores v1 parity: the v1 proto create accepted `index_configs`, which
            drive `active_algorithm_for` (e.g. an IVF index → recall-tune dispatches
            to the IVF arm). When omitted, the engine selects a default (HNSW).
        tags:
          type:
          - array
          - 'null'
          items:
            type: string
          description: |-
            Operator metadata tags, e.g. `"recall_target:0.95"`,
            `"target_vector_count:1000"`, `"modalities:text,image"`. Consumed by the
            recall advisor / route-health (`services/collection/recall_target.rs`).
        quantization:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/QuantizationConfigInput'
            description: |-
              Quantization config (gRPC-v2 parity). When omitted, quantization is
              left unset (engine default).
        index_policy:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/IndexPolicyInput'
            description: |-
              Per-collection cold/warm search routing policy (ADR-028). When omitted,
              the system decides cost-derived (`mode = "auto"`). Owners with hard SLAs
              override here; query-time precedence is per-query `search_mode` > this
              policy > cost-model auto-default.
    CreateCollectionV2Response:
      type: object
