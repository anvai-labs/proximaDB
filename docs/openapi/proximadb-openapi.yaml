      properties:
        count:
          type: integer
          format: uint64
        items:
          type: array
          items:
            $ref: '#/components/schemas/PrimaryPodListItem'
    PrimaryPodOperatorErrorResponse:
      type: object
      required:
      - error
      - message
      - code
      description: |
        The FLAT error shape the primary-pod operator endpoints return
        (`{error, message, code}`, `error` a short machine-readable
        slug). Same convention as `AbacOperatorErrorResponse`; carried
        as its own schema because the two handler families define the
        type independently.
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: integer
    CatalogIntrospectionResult:
      type: object
      required:
      - columns
      - column_types
      - rows
      description: |
        Table-shaped catalog metadata (the projection pgwire/SQL clients
        see). Every cell value is a string.
      properties:
        columns:
          type: array
          items:
            type: string
        column_types:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            items:
              type: string
    TableWriteExplainRequest:
      type: object
      required:
      - target_table
      description: |
        Body for `POST /api/v2/catalog/table-write/explain`. Provide
        EITHER `source_table` OR `source_sql` — both, or neither, is a
        400. `write_mode` (default `append`) accepts, case-insensitive:
        append | insert | insert_only | insert-only | upsert | overwrite
        | insert_overwrite | insert-overwrite | overwrite_table |
        overwrite-table | merge. `distribution` (default `auto`) accepts:
        auto | local | local_only | local-only | pseudo |
        pseudo_distributed | pseudo-distributed | distributed. Upsert/
        merge imply upsert conflict policy; everything else errors on
        conflict.
      properties:
        target_table:
          type: string
          description: Dotted name (`[namespace.]…table`); last segment is the table.
        source_table:
          type:
          - string
          - 'null'
        source_sql:
          type:
          - string
          - 'null'
        write_mode:
          type:
          - string
          - 'null'
        distribution:
          type:
          - string
          - 'null'
        target_columns:
          type:
          - array
          - 'null'
          items:
            type: string
        tenant_id:
          type:
          - string
          - 'null'
        actor:
          type:
          - string
          - 'null'
        idempotency_key:
          type:
          - string
          - 'null'
        row_count_hint:
          type:
          - integer
          - 'null'
          format: uint64
        estimated_bytes:
          type:
          - integer
          - 'null'
          format: uint64
        requires_row_level_semantics:
          type:
          - boolean
          - 'null'
        batch_local_constraints_sufficient:
          type:
          - boolean
          - 'null'
    TableWriteRouteExplanation:
      type: object
      required:
      - target_table
      - source
      - write_mode
      - distribution
      - write_intent
      - write_lane
      - write_lane_reason
      - write_lane_required_guards
      - rejected_write_lanes
      - selected_backend
      - selected_access_method
      - estimated_cost
      - data_movement
      - required_guards
      - route_metadata
      - candidate_paths
      - rejected_paths
      description: |
        The full DML write-planner route decision (explain-only; nothing
        was written). `write_mode`/`distribution` echo the resolved
        canonical enum names (PascalCase, e.g. `Append`,
        `PseudoDistributed`). `execution_*` fields appear only for
        EXPLAIN ANALYZE (never set by this REST explain path).
      properties:
        target_table:
          type: string
        source:
          type: string
        write_mode:
          type: string
        distribution:
          type: string
        write_intent:
          $ref: '#/components/schemas/TableWriteIntentExplanation'
        write_lane:
          type: string
        write_lane_reason:
          type: string
        write_lane_required_guards:
          type: array
          items:
            type: string
        rejected_write_lanes:
          type: array
          items:
            $ref: '#/components/schemas/TableWriteRejectedLaneExplanation'
        selected_backend:
          type: string
        selected_access_method:
          type: string
        estimated_cost:
          $ref: '#/components/schemas/TableWriteCostExplanation'
        data_movement:
          $ref: '#/components/schemas/TableWriteDataMovementExplanation'
        required_guards:
          type: array
          items:
            type: string
        route_metadata:
          $ref: '#/components/schemas/TableWriteRouteMetadataExplanation'
        candidate_paths:
          type: array
          items:
            $ref: '#/components/schemas/TableWriteCandidateExplanation'
        rejected_paths:
          type: array
          items:
            $ref: '#/components/schemas/TableWriteRejectedPathExplanation'
        execution_elapsed_us:
          type: integer
          format: uint64
        execution_rows_written:
          type: integer
          format: uint64
    TableWriteIntentExplanation:
      type: object
      required:
      - target_table
      - operation_kind
      - durability
      - isolation
      - projection_freshness
      - requires_row_level_semantics
      - batch_local_constraints_sufficient
      properties:
        target_table:
