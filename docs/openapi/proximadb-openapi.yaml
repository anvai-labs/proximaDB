    AbacGrantee:
      description: |
        Who a grant admits — an externally-tagged Rust enum. Exactly one
        of `Tenant` (every subject of that tenant) or `User` (one specific
        subject, possibly of a foreign tenant) is present.
      oneOf:
      - type: object
        required:
