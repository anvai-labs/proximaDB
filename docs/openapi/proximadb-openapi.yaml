openapi: 3.1.0
info:
  title: ProximaDB REST API
  description: SDK-facing ProximaDB REST contract. This specification is v2-first and centers on ProximaRecord, typed schemas, record search, and collection lifecycle operations. Legacy v1 compatibility routes are intentionally not part of this publishable SDK surface.
  contact:
    name: Vijaykumar Singh
    email: vijay@anvaiops.com
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  version: 0.2.0
servers:
- url: http://localhost:5678
  description: Local ProximaDB server
paths:
  /api/v2/collections:
    get:
      tags:
      - Collections
      summary: List collections.
      description: |-
        List all collections with pagination.

        ## Query Parameters

        - `limit`: Maximum number of collections to return (default: 100)
        - `offset`: Offset for pagination (default: 0)
        - `include_stats`: Whether to include collection statistics

        ## Response

        Returns [`ListCollectionsV2Response`] with collection list.

        ## Errors

        - `500 Internal Server Error`: List operation failed
      operationId: listCollections
      parameters:
      - name: limit
        in: query
        description: 'Maximum number of collections to return (default: 100)'
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: offset
        in: query
        description: 'Offset for pagination (default: 0)'
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: include_stats
        in: query
        description: Whether to include statistics
        required: false
        schema:
          type: boolean
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. An authenticated tenant binding takes precedence and a mismatch is rejected, except that an authenticated gateway principal may delegate an acting tenant when gateway-only trust is configured. Without an authenticated binding, acceptance depends on the configured header trust policy. When absent, a single-tenant deployment selects its configured default tenant; a multi-tenant deployment rejects the request. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
      responses:
        '200':
          description: Collection page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCollectionsV2Response'
    post:
      tags:
      - Collections
      summary: Create a collection with optional schema.
      description: |-
        Create a new collection with optional schema support.

        ## Request Body

        See [`CreateCollectionV2Request`] for the expected JSON format.

        ## Response

        Returns [`CreateCollectionV2Response`] with collection details.

        ## Errors

        - `400 Bad Request`: Invalid request or schema
        - `409 Conflict`: Collection already exists
        - `500 Internal Server Error`: Creation failed
      operationId: createCollection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectionV2Request'
        required: true
      responses:
        '200':
          description: Collection created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCollectionV2Response'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. An authenticated tenant binding takes precedence and a mismatch is rejected, except that an authenticated gateway principal may delegate an acting tenant when gateway-only trust is configured. Without an authenticated binding, acceptance depends on the configured header trust policy. When absent, a single-tenant deployment selects its configured default tenant; a multi-tenant deployment rejects the request. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
  /api/v2/collections/{collection_id}:
    get:
      tags:
      - Collections
      summary: Get collection details.
      description: |-
        Get collection details including schema and statistics.

        ## Path Parameters

        - `collection_id`: Collection name/ID

        ## Response

        Returns [`CollectionV2Response`] with collection details.

        ## Errors

        - `404 Not Found`: Collection does not exist
        - `500 Internal Server Error`: Retrieval failed
      operationId: getCollection
      parameters:
      - name: collection_id
        in: path
        description: Collection name/ID.
        required: true
        schema:
          type: string
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. An authenticated tenant binding takes precedence and a mismatch is rejected, except that an authenticated gateway principal may delegate an acting tenant when gateway-only trust is configured. Without an authenticated binding, acceptance depends on the configured header trust policy. When absent, a single-tenant deployment selects its configured default tenant; a multi-tenant deployment rejects the request. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
      responses:
        '200':
          description: Collection details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionV2Response'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Collections
      summary: Delete a collection.
      description: |-
        Delete a collection by ID/name. This v2 route keeps SDK lifecycle methods on
        the ProximaRecord-era API while delegating to the existing collection control
        plane.
      operationId: deleteCollection
      parameters:
      - name: collection_id
        in: path
        description: Collection name/ID.
        required: true
        schema:
          type: string
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. An authenticated tenant binding takes precedence and a mismatch is rejected, except that an authenticated gateway principal may delegate an acting tenant when gateway-only trust is configured. Without an authenticated binding, acceptance depends on the configured header trust policy. When absent, a single-tenant deployment selects its configured default tenant; a multi-tenant deployment rejects the request. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
      responses:
        '200':
          description: Collection deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCollectionV2Response'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/collections/{collection_id}/documents:
    post:
      tags:
      - Documents
      summary: Ingest documents for native server-side embedding.
      description: Canonical document-ingest surface (ADR-041, spec-driven-primary). Body `{records:[{id,text,metadata}]}`; the server embeds `text` natively under `X-Embed-Source=native` (default) when no per-record `vector` is supplied. `X-Tenant-ID` scopes records to a tenant; `X-Ingest-Mode` carries the billing mode.
      operationId: ingestDocuments
      parameters:
      - name: collection_id
        in: path
        description: Target collection name/ID.
        required: true
        schema:
          type: string
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. An authenticated tenant binding takes precedence and a mismatch is rejected, except that an authenticated gateway principal may delegate an acting tenant when gateway-only trust is configured. Without an authenticated binding, acceptance depends on the configured header trust policy. When absent, a single-tenant deployment selects its configured default tenant; a multi-tenant deployment rejects the request. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestDocumentsRequest'
        required: true
      responses:
        '200':
          description: Ingested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestDocumentsResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Collection not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
