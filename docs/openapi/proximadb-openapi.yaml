      properties:
        primary:
          type: number
          format: float
        phase:
          type: integer
          description: JSON-friendly phase ordinal (not the kernel newtype).
        components:
          type: array
          items:
            $ref: '#/components/schemas/ScoreComponent'
    RankScoredHit:
      type: object
      required:
      - id
      - score
      properties:
        id:
          type: string
        score:
          type: number
          format: float
        score_vector:
          $ref: '#/components/schemas/RankScoreVector'
        match_features:
          type: object
          additionalProperties:
            type: number
            format: double
        summary_features:
          type: object
          additionalProperties:
            type: number
            format: double
    RankSearchResponse:
      type: object
      required:
      - hits
      - phase_truncated
      properties:
        hits:
          type: array
          items:
            $ref: '#/components/schemas/RankScoredHit'
        phase_truncated:
          type: boolean
        rank_profile:
          type:
          - string
          - 'null'
        rank_profile_version:
          type:
          - integer
          - 'null'
          format: uint32
    DocOpenObject:
      type: object
      additionalProperties: true
      description: Serialized collection info (open field set).
    DocCollectionListResponse:
      type: object
      required:
      - collections
      properties:
        collections:
          type: array
          items:
            $ref: '#/components/schemas/DocOpenObject'
    DocCreateCollectionResponse:
      type: object
      required:
      - success
      - collection
      properties:
        success:
          type: boolean
        collection:
          $ref: '#/components/schemas/DocOpenObject'
    DocDeleteAck:
      type: object
      required:
      - success
      properties:
        success:
          type: boolean
        id:
          type: string
          description: Present on document deletes; absent on collection deletes.
    DocIndexDefinition:
      type: object
      required:
      - path
      properties:
        name:
          type:
          - string
          - 'null'
        path:
          type: string
        index_type:
          type: string
          default: btree
          description: |
            btree | hash | inverted | fulltext | geo (unknown values
            fall back to btree).
        unique:
          type: boolean
          default: false
        sparse:
          type: boolean
          default: false
    CreateDocumentCollectionRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        indexes:
          type: array
          items:
            $ref: '#/components/schemas/DocIndexDefinition'
    DocInsertRequest:
      type: object
      required:
      - document
      properties:
        id:
          type:
          - string
          - 'null'
          description: Server-assigned when omitted.
        document:
          description: The document body (free-form JSON).
    DocResponse:
      type: object
      required:
      - id
      - document
      - version
      properties:
        id:
          type: string
        document: {}
        version:
          type: integer
          format: uint64
    DocQueryResponse:
      type: object
      required:
      - documents
      - has_more
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocResponse'
        total_count:
          type:
          - integer
          - 'null'
          format: uint64
        has_more:
          type: boolean
    DocUpdateRequest:
      type: object
      required:
      - updates
      properties:
        updates:
          type: array
          items: {}
          description: Update pipeline steps ({operation, path, value} objects).
        expected_version:
          type:
          - integer
          - 'null'
          format: uint64
          description: Optimistic-concurrency guard; rejects stale writes.
    DocUpdateResponse:
      type: object
      required:
      - success
      - id
      - new_version
      properties:
        success:
          type: boolean
        id:
          type: string
        new_version:
          type: integer
          format: uint64
    DocBatchInsertRequest:
      type: object
      required:
      - documents
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocInsertRequest'
    DocBatchInsertResponse:
      type: object
      required:
      - inserted
      - failed
      properties:
        inserted:
          type: integer
          format: uint64
        failed:
          type: integer
          format: uint64
          description: Count only — per-item failures are not enumerated.
    DocAggregateRequest:
      type: object
      required:
      - pipeline
      properties:
        pipeline:
          type: array
          items: {}
          description: Aggregation pipeline stages (free-form).
    DocAggregateResponse:
      type: object
      required:
      - results
      - query_time_ms
      properties:
        results:
          type: array
          items: {}
        query_time_ms:
          type: integer
          format: uint64
    DocIndexListResponse:
      type: object
      required:
      - indexes
      properties:
        indexes:
          type: array
          items:
            type: object
            required:
            - name
            - path
            - unique
            properties:
              name:
                type:
                - string
                - 'null'
              path:
                type: string
              unique:
                type: boolean
    UnifiedOpenValue:
      description: Free-form JSON (the port's serde_json::Value rendering).
    UnifiedBareError:
      type: object
      required:
      - error
      description: |
        The unified surface's BARE error shape — a plain string under
        `error`, NOT the canonical {error:{type,message,code}} envelope
        other surfaces carry.
      properties:
        error:
          type: string
    UnifiedExecuteRequest:
      type: object
      required:
      - query
      properties:
        query:
          type: string
        parameters:
          type:
          - array
          - 'null'
          items: {}
        collection:
          type: string
        limit:
          type:
          - integer
          - 'null'
          format: uint32
    UnifiedFederatedRequest:
      type: object
      required:
      - query
      properties:
        query:
          type: string
        parameters:
          type:
          - array
          - 'null'
          items: {}
    UnifiedExplainRequest:
      type: object
      required:
      - query
      properties:
        query:
          type: string
        collection:
          type: string
    UnifiedPrepareRequest:
      type: object
      required:
      - query
      properties:
        query:
          type: string
        name:
          type: string
        cache_results:
          type: boolean
          default: false
        ttl_seconds:
          type:
          - integer
          - 'null'
          format: uint64
    UnifiedPrepareResponse:
      type: object
      required:
      - statement_id
      properties:
        statement_id:
          type: string
    UnifiedExecutePreparedRequest:
      type: object
      properties:
        parameters:
          type:
          - array
          - 'null'
          items: {}
        collection:
          type: string
    UnifiedPreparedStatsRequest:
      type: object
      properties:
        statement_ids:
          type: array
          items:
            type: string
    UnifiedDistributedRequest:
      type: object
      required:
      - query
      description: |
        A distributed query plus an optional row limit the implementation
        applies to the result. Parameter binding is not supported on this
        operation; use the federated or prepared surface when needed.
      properties:
        query:
          type: string
        limit:
          type:
          - integer
          - 'null'
          format: uint32
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    GraphId:
      name: graph_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    NodeId:
      name: node_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    EdgeId:
      name: edge_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnifiedBadRequest:
      description: Malformed JSON or invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnifiedBareError'
    UnifiedUnsupportedMediaType:
      description: Request body is not application/json.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnifiedBareError'
    UnifiedUnprocessableEntity:
      description: JSON body does not match the request schema.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnifiedBareError'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required or insufficient permissions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AbacUnauthorized:
      description: |
        Missing auth context (401) — the request reached the handler with
        no resolved principal, indicating the auth middleware itself is
        misconfigured for this deployment (`error: "missing_auth_context"`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AbacOperatorErrorResponse'
    AbacForbidden:
      description: |
        Authenticated but lacks `SystemAdmin` or `ConfigureSystem`
        (`error: "operator_permission_required"`) — this is a
        cluster-scope operator surface; a tenant's own admin permissions
        do not satisfy it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AbacOperatorErrorResponse'
    AbacTenantUnresolved:
      description: |
        The tenant path/body segment has no durable stable id and the
        configured catalog could not mint one (`error:
        "tenant_unresolved"`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AbacOperatorErrorResponse'
    AbacUnavailable:
      description: |
        ABAC is compiled in (`abac-policy`) but no durable store is open
        for this process (no `data_dir`), or the underlying store returned
        an error (`error: "abac_unavailable"` / `"grant_store_error"` /
        `"posture_store_error"` / `"tenant_mint_failed"`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AbacOperatorErrorResponse'
    PodUnauthorized:
      description: |
        Missing auth context (401) — the request reached the handler
        with no resolved principal (`error: "missing_auth_context"`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PrimaryPodOperatorErrorResponse'
    PodForbidden:
      description: |
        Authenticated but lacks `SystemAdmin` or `ConfigureSystem`
        (`error: "operator_permission_required"`) — a cluster-scope
        operator gate.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PrimaryPodOperatorErrorResponse'
    InternalError:
      description: Internal server error (canonical error envelope).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GraphBadRequest:
      description: |
        Invalid argument — the FULL graph envelope with success=false
        and error.code INVALID_ARGUMENT (a genuine handler-emitted JSON
        400 exists only on updateGraphSchema; axum extractor rejections
        — malformed JSON, wrong content-type, missing required field —
        are 400/415/422 with PLAIN-TEXT bodies and no envelope).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GraphErrorResponse'
    GraphNotFound:
      description: |
        Not found — the FULL graph envelope with success=false and
        error.code NOT_FOUND.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GraphErrorResponse'
    GraphInternal:
      description: |
        Internal error — the FULL graph envelope with success=false and
        error.code INTERNAL_ERROR.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GraphErrorResponse'
tags:
- name: Collections
  description: Collection lifecycle.
- name: Schema
  description: Typed schema management.
- name: Records
  description: ProximaRecord write / read / scan.
- name: Search
  description: Vector similarity + typed-filter search.
- name: Query
  description: AQL / UQL query facade.
- name: SQL
  description: Authenticated single-statement SQL transport.
- name: Entities
  description: Entity orchestration (graph node + embeddings + provenance).
- name: Documents
  description: Native-embedding document ingest.
- name: Model Registry
  description: Tenant-scoped embedding-model lifecycle backed by xCatalog.
security:
- bearerAuth: []
