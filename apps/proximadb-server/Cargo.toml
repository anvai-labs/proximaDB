[package]
name = "proximadb-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/anvai-labs/proximaDB"
description = "ProximaDB server binary - cloud-native vector database"

[[bin]]
name = "proximadb-server"
path = "src/main.rs"

[features]
# The server ships the engine's PRODUCTION default feature set. The root `proximadb`
# crate defaults these on, but this crate declares `default-features = false` on it (to
# keep the cloud backends opt-in), which previously ALSO dropped the core engine features
# for every `cargo build -p proximadb-server` / `--bin proximadb-server` build (the
# Dockerfile, CI `_shared-build`, and release workflows) — silently shipping a server with
# NO DataFusion OLAP route, no SQL frontend, etc. They only linked in under the
# whole-workspace `--profile release-server` build by feature-unification side-effect.
# Forward them explicitly so every build path matches the intended production binary.
default = [
    "datafusion-integration",
    "sql_frontend",
    "canonical-document-store",
    "graph-first-sks",
    "unified-facade-routing",
    "otlp-metering",
    "axis",
]
# MLflow UI serving (TD-MLOPS-3) — forwarded to the root crate's feature.
mlflow-ui = ["proximadb/mlflow-ui"]
# In-memory ANN index engine (AXIS: HNSW/IVF/RaBitQ). Default ON for the production
# server — forwarded explicitly (not via workspace feature-unification) so every
# build path (Dockerfile, `_shared-build`, release) links it. Turn OFF only for the
# PAX-exact-scan `no-axis` feature-matrix variant (search then routes to exact scan).
axis = ["proximadb/axis"]
# The cross-modal OLAP query plane (pgwire → DataFusion): the DataFusion engine + the
# cross-modal table functions (vector_search / timeseries_range). Without it, parquet-backed
# tables route to the native Volcano engine and the cross-modal UDTFs are not registered.
datafusion-integration = ["proximadb/datafusion-integration"]
sql_frontend = ["proximadb/sql_frontend"]
canonical-document-store = ["proximadb/canonical-document-store"]
graph-first-sks = ["proximadb/graph-first-sks"]
unified-facade-routing = ["proximadb/unified-facade-routing"]
otlp-metering = ["proximadb/otlp-metering"]
# Build with real ONNX inference. Adds the ort + ndarray runtime, downloads
# a prebuilt ONNX Runtime binary at build time, and links the resulting
# native library into the server. Required for production embedding;
# without it, `EmbeddingService` returns `ModelUnavailable` on first BGE
# request. Pass through to the embedding crate's `onnx` feature.
onnx = ["proximadb-embedding/onnx"]
# CoreML execution provider (macOS / iOS). Implies `onnx`. Lets operators
# set `PROXIMADB_EMBED_PROVIDER=coreml` to route BGE inference through the
# Apple Neural Engine + GPU instead of CPU.
coreml = ["onnx", "proximadb-embedding/coreml"]
# Cloud object_store backends. Forward to the root `proximadb` crate's gated
# features so the server binary links the S3 / ADLS / GCS object_store
# implementations. WITHOUT these the server fails at boot with
# "Unsupported filesystem scheme: adls" (resp. s3/gcs) when storage points at
# a cloud URL — the default build only has the local `file://` backend.
aws = ["proximadb/aws"]
azure = ["proximadb/azure"]
gcp = ["proximadb/gcp"]
# Convenience: all three cloud backends (mirrors the root crate's cloud-full).
cloud-full = ["aws", "azure", "gcp"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
proximadb = { path = "../../", default-features = false }
proximadb-embedding = { path = "../../crates/modalities/proximadb-embedding" }
proximadb-runtime-common.workspace = true
tokio = { version = "1.37", features = ["full"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde.workspace = true
serde_json.workspace = true
libc = "0.2"

[dev-dependencies]
reqwest = { version = "0.11", features = ["json"] }
serde_json.workspace = true
tempfile.workspace = true
uuid = { version = "1.0", features = ["v4"] }
