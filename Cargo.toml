lettre = "0.11"  # Email sending for alert notifications

# OTLP metering push (TD-161 dual-sink, ADR-027). OPTIONAL + default-OFF behind the
# `otlp-metering` feature: the durable per-tenant `_metering` writer is OSS-native (no
# deps); only the external OTLP push pulls these. Pinned to the 0.32 line, which is the
# first to resolve against the repo's own `tonic 0.14` / `prost 0.14` with NO duplicate
# gRPC stack (otlp <=0.30 drags in a second tonic 0.12-0.13 + prost 0.13). `grpc-tonic`
# reuses the existing tonic transport and avoids pulling reqwest 0.12.
opentelemetry = { version = "0.32", optional = true }
# `rt-tokio` + `experimental_metrics_periodicreader_with_async_runtime` gate
# `runtime::Tokio` and the async-runtime `PeriodicReader`, which drive export on the
# tokio runtime — REQUIRED with the grpc-tonic exporter (the default thread-based
# reader block_on's a tonic call with no reactor → runtime panic). The async-runtime
# feature transitively enables `experimental_async_runtime`.
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "experimental_metrics_periodicreader_with_async_runtime", "metrics"], optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "metrics"], optional = true }

# Storage & Memory Management
memmap2 = "0.9"
lru = "0.18"  # LRU cache for disk-backed graph storage
rocksdb = { version = "0.21", optional = true }  # Optional for metadata backend
tokio-postgres = { version = "0.7", optional = true }  # PostgreSQL client for CDC (experimental-cdc-connectors)
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-native-tls", "json", "chrono", "uuid"], optional = true }  # OLTP catalog backends (oltp-catalog)
tempfile = "3.0"
rayon = "1.10"  # Parallel processing for search optimization
