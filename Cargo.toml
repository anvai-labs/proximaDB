# (tests/fp16_rust_sdk_e2e.rs). The SDK lives in clients/rust as a
# workspace member; dev-dep here so we can drive it against an
# in-process server fixture.
proximadb-sdk = { path = "clients/rust", default-features = false, features = ["client"] }
# OpenAPI contract gates for the Rust connectors (tests/connectors_openapi_contract.rs
# and tests/connectors_flight_contract.rs). httpmock is the same crate the SDK
# gate uses at clients/rust/tests/openapi_contract.rs; serde_yaml lets the
# gates load docs/openapi/proximadb-openapi.yaml directly.
httpmock = "0.7"
serde_yaml = "0.9"
# Test-only: integration tests use EmbeddedProximaDB from the embedded crate.
# Dev-deps don't create build cycles (test-mode only).
proximadb-embedded = { path = "crates/binding/proximadb-embedded" }

[features]
# Default feature set as of 2026-05-26 (ADR-020 Tier 2.2 / TD-065 default-enable).
# `canonical-document-store` flips on by default so the canonical WAL path is
# the durable authority for documents. Operators on the legacy non-canonical
# (in-memory-map-as-durable-source) path during one minor-release migration
# window can opt OUT via `default-features = false` + explicit feature selection.
# Plan: remove the feature flag entirely in v0.4 once the migration window closes.
default = ["sql_frontend", "graph-first-sks", "unified-facade-routing", "canonical-document-store", "datafusion-integration", "otlp-metering", "axis"]
# AXIS index engine (HNSW/IVF/RaBitQ ANN) + its recall-advisor / drift / hot-swap surfaces.
# Default ON = zero behavior change (the canonical ANN path). Gate OFF for PAX exact-scan-only
# builds (smaller binary, no AXIS boot/index-build cost); search then routes to the exact-scan
# path (TD-AXIS-4 Superseded; ADR-052). Pure cfg gate — AXIS lives in the root crate, no dep.
axis = []
# Optional surfaces; keep off by default to minimize binary size and public API surface
tenant_access = []
# Experimental storage engines (RAPTOR, SWIFT); disabled by default to prevent
# server panics from unimplemented code paths. Enable for development/testing only.
# RAPTOR fundamentally uses AXIS clustering, so this implies `axis`.
experimental-engines = ["proximadb-raptor-engine/experimental-engines", "axis"]
# Experimental transactional Ledger modality (ADR-071 / TD-LEDGER-1): the durable atomic-CAS
# KV + TTL-lease OLTP surface. Off by default; enables the durable backend + its gRPC service.
experimental-ledger = ["dep:proximadb-ledger", "proximadb-ledger/durable"]
# F2 (ADR-072 D3/D5): enable the fenced ConditionalKeyStore in the relational insert
# path. Off by default → the existing check-then-act PK-uniqueness probe runs unchanged;
# on, a LocalWalKeyStore is wired in and enforces composite-PK uniqueness atomically.
oltp-integrity = ["dep:proximadb-cks-local"]
# FA (TD-FOUNDATION-3): enable ABAC row-level enforcement. Off by default → the
# read primitives run unchanged; on, the compile bridge + admits_with_security
# filter rows by the subject's policy. The abac crate itself stays un-gated
# (a security substrate that never compiles is never tested).
abac-policy = ["dep:proximadb-abac", "proximadb-embedded/abac-policy"]
# F3v (TD-DELVEC-1 / ADR-072 D14): enable cold-tier deletion vectors. Off by
# default → the default flush path is byte-for-byte unchanged; on, PAX segment
# writes capture the OID→position resolver (footer region, WI-2c) so a
# cold-resident delete (WI-3b) can set a deletion-vector bit without rewriting
# the segment. Pure gate (no dep) — the storage-common primitives
# (VersionedDeletionVector, OidPositionResolver, footer region) are unconditional.
cold-deletion-vectors = []
# Experimental SIMD path; not enabled by default
simd-experimental = ["proximadb-codec/simd-experimental"]
# TD-160 / ADR-027 / ADR-030: gate the PERF-CLASS I/O-trace *emission* (the
# per-query structured `tracing` event in `io_trace::IoTrace::emit`). Default OFF
# → zero perf-emission cost in normal operation. The cheap core counters
# (range_gets/bytes_read/compute_ms) and ALL observers (route-cost, cache, and
# the always-on BILLING observer) stay live regardless — billing is never gated
# (ADR-027 non-entanglement; enforced by scripts/check_billing_never_gated.py).
io-trace = ["proximadb-observability-engine/io-trace"]
# TurboQuant data-oblivious quantizer + in-kernel allowlist (ADR-021).
# Gates the QuantizationLevel::TurboQuant variant in proximadb-vector + the
# TurboQuantVectorData struct in src/compute/distance_computation/quantized.rs.
# Tracked in docs/12-design/TURBOQUANT_LLD_2026_05_30.adoc; promoted to beta
# after P9 recall validation closes.
experimental-turboquant = [
    "proximadb-quantization-types/experimental-turboquant",
    "proximadb-quantization-model/experimental-turboquant",
    "proximadb-vector/experimental-turboquant",
    "proximadb-distance-kernel/experimental-turboquant",
    "proximadb-quantization-kernel/experimental-turboquant",
]
# AVX512 intrinsics (requires nightly Rust, disabled by default for CI compatibility)
avx512 = ["proximadb-codec/avx512"]
standalone = []
# Cluster mode - enables distributed consensus (Raft), replication, and health services
# Used for multi-node deployments with leader election and data replication.
# Forwards to proximadb-runtime/cluster so the `ClusterServerConfig` re-export and
# the `MultiServerConfig::cluster_config` field (both `#[cfg(feature = "cluster")]`
# in bootstrap_config.rs) actually compile when this feature is on.
cluster = ["proximadb-runtime/cluster"]
rocksdb = ["dep:rocksdb"]  # RocksDB metadata backend support
# Real ONNX-runtime embedding. Off by default (the `ort` runtime + model files
# are heavyweight and not needed for the default build). Forwards to
# proximadb-embedding/onnx so the in-process BGE embedder produces real vectors;
# without it the BGE route returns ModelUnavailable (synthetic fallback is
# forbidden in production paths). Tests that exercise real embedding are gated
# on this feature.
onnx = ["proximadb-embedding/onnx"]

# Cloud storage features (optional to avoid linking issues during testing)
aws = ["object_store/aws", "proximadb-catalog/aws"]
azure = ["object_store/azure"]
gcp = ["dep:google-cloud-storage"]

# TD-161 external OTLP metering push (default-OFF). Compiles the OTLP exporter that
# ships the per-tenant metering snapshot to a collector; runtime-gated additionally by
# PROXIMADB_OTLP_ENDPOINT so the binary is inert unless explicitly configured. The
