rmp-serde = "1.1"
tonic-prost = "0.14"
# Compression libraries (workspace-inheritable for modality/horizontal crates)
brotli = "6.0"
bzip2 = "0.5"
flate2 = { version = "1.0", default-features = true }
lz4_flex = "0.11"
snap = "1.1"
xz2 = "0.1"
zstd = "0.13"

# Language bindings
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py310"] }  # abi3 floor = CPython 3.10 (our minimum supported Python); one wheel (cp310-abi3) installs on 3.10+
numpy = { version = "0.28" }

# TurboQuant numerics (ADR-021, gated by `experimental-turboquant`).
# Kept here so future modality + benchmark consumers share a single version.
faer = { version = "0.20", default-features = false, features = ["std"] }
statrs = "0.19"

# Python embedded library (cdylib for PyO3)
[lib]
name = "proximadb"
# Default: rlib only (for testing and normal Rust usage)
# cdylib is produced via the pylib feature flag (for PyO3/FFI builds only)
# See ADR-006 for rationale: cdylib caused test modules to be silently excluded
crate-type = ["rlib"]



[dependencies]
# Core async runtime
tokio = { version = "1.37", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Sandhi neutral usage parsers (TD-SANDHI-2 / ADR-0047 D10a): single-sourced, fixture-proven
# (Sandhi TD-0001 W1) usage/cache-split extraction adopted by the generation LLM path — not a
# hand-rolled 4th extractor. `sandhi-core` is serde-only (no reqwest/tokio); dependency direction
# one-way (ProximaDB → Sandhi, ADR-060). Registry release since sandhi v0.1.1.
sandhi-core = "0.1"

# OpenAPI spec-from-code (TD-126 Phase 1). The `ToSchema`/`IntoParams`/`path`
# derives annotate the v2 REST DTOs + handlers so `docs/openapi/proximadb-openapi.yaml`
# is generated from the handler code (see src/network/rest/openapi.rs) with a CI
# drift gate, rather than hand-maintained. Derives are zero runtime cost; the
# aggregated document is only materialized by the generator/test path.
utoipa = { version = "5", features = ["axum_extras", "preserve_order", "yaml"] }
# YAML (de)serialization for the OpenAPI generator: parse the checked-in
