snap = "1.1"             # Snappy compression
zstd = "0.13"            # Zstandard compression
flate2 = { version = "1.0", default-features = true }  # Gzip/Deflate/Zlib compression
brotli = "6.0"           # Brotli compression - Updated from 3.5
bzip2 = "0.5"            # Bzip2 compression - Updated from 0.4
xz2 = "0.1"              # XZ/LZMA2 compression

# System monitoring
sysinfo = "0.30"

# Avro serialization with schema evolution
apache-avro = "0.16"
bytes = "1.5"

# Cloud storage: the canonical object_store crate provides true byte-range
# get_range for S3 + Azure (the bandwidth-optimal ADR-023 cold-load primitive)
# + emulator support (MinIO / Azurite), replacing the pre-GA azure_storage_blobs
# (broken ranged GET) and the heavy aws-sdk-s3 tree. Already transitive (via
# parquet); promoted to a direct dep. Feature-gated via the aws/azure features.
object_store = { workspace = true }
# GCS stays on the google-cloud-storage SDK: object_store's GCS backend speaks
# the XML API, which fake-gcs-server (our test emulator) does not serve, so it
# is unverifiable locally; this SDK uses the JSON API (fake-gcs-compatible) and
# still issues true ranged object downloads (bandwidth-optimal). Feature `gcp`.
google-cloud-storage = { version = "0.15", optional = true }

