http-body-util = "0.1"  # Body utilities for http 1.x (tonic compatibility)
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-full", "decompression-full", "timeout"] }
url = "2.4"
