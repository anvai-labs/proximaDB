[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Vijaykumar Singh <vijay@anvaiops.com>"]
repository = "https://github.com/anvai-labs/proximaDB"
homepage = "https://github.com/anvai-labs/proximaDB"

[workspace.lints.rust]
# Edition-2024 migration for x86_64 SIMD: many `#[target_feature] unsafe fn`s call
# intrinsics / memory ops directly. Keep the pre-2024 "unsafe fn body is an unsafe
# context" behavior workspace-wide; `unused_unsafe` covers the resulting redundancy
# of any explicit `unsafe {}` blocks remaining in those fns. (NEON/AVX SIMD modules.)
unsafe_op_in_unsafe_fn = "allow"
unused_unsafe = "allow"

[workspace.lints.clippy]
# x86_64 SIMD idiom (only ever compiled on x86_64 CI, so it accrued unlinted):
# internal `#[target_feature]` unsafe primitives whose safety contract is uniformly
# "caller ensures the CPU supports the feature", and explicit chunk-index loops that
# read clearer than iterator adapters. Sloppy lints (needless_return / assign_op) are
# fixed in-code, not allowed.
missing_safety_doc = "allow"
needless_range_loop = "allow"

[workspace.dependencies]
anyhow = "1.0"
# R-5b.1.3 workaround: an auto-refactor commit added
# crates/query/proximadb-relational-frontend referencing
# `sqlparser = { workspace = true }` without first declaring the
# dep at the workspace level. Same pin as the root `[dependencies]`
# entry.
sqlparser = { version = "0.59", features = ["visitor"] }
arrow = { version = "58", features = ["prettyprint"] }
arrow-array = { version = "58", default-features = false }
# Workspace-level so the root crate and `proximadb-embedded` resolve the SAME
# datafusion. The embedded Python binding passes `SessionContext`/`DataFrame`
# across the crate boundary, so two independently-specified versions would be two
# distinct types and fail to compile in a way that is tedious to diagnose.
datafusion = { version = "54.0", default-features = false, features = ["sql", "regex_expressions", "unicode_expressions", "datetime_expressions", "math_expressions"] }
