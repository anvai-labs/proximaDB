[package]
name = "proximadb-embedded"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Embedded mode for ProximaDB — in-process database with language bindings (Python/Java/Node.js/C-FFI). Separate artifact from the server binary."

[lib]
name = "proximadb_embedded"
path = "src/lib.rs"
# `cdylib` is what maturin packages as the Python extension module
# (`proximadb_embedded._proximadb_embedded`); the PyO3 entry point lives in
# `src/python.rs` behind the `python` feature. `rlib` must stay: this crate is a
# normal Rust dependency of `proximadb-spark-jni` and a dev-dependency of the
# root crate's integration tests. Dropping either breaks one of those consumers.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Depends on the root proximadb library (one-directional: embedded -> root, no cycle).
# `default-features = false` + the explicit `[features]` forwarding below makes AXIS
# opt-OUT-able: the default mirrors the root's default (AXIS on), but
# `--no-default-features` (or a feature set without `axis`) yields an exact-scan-only
# embedded build (no in-memory HNSW/IVF, no training RSS) for in-process / few-collection
# apps — the PAX-exact-scan direction (TD-AXIS-4, ADR-082). Because embedded's `axis`
# feature forwards `proximadb/axis`, embedded's axis cfg is always in sync with the
# root's, so the flush→AXIS reap's cross-crate type stays consistent in every build.
#
# CI cost note: this edge makes `-p proximadb-embedded` compile the whole root
# monolith, so this crate is excluded from the advisory touched-crate fast lane
# (`rust-affected-fast` in ci.yml, via `affected_crates.py
# --exclude-dependents-of proximadb`). It stays covered by the required
# `rust-test` job. It becomes fast-lane-eligible again if this edge ever goes.
proximadb = { path = "../../..", default-features = false }
# FA-b: optional, behind the `abac-policy` feature. Embedded mode is abac-OFF by
# design (in-process; the host app owns authorization) — this dep exists only so
# the abac verification can compile embedded's calls against root's threaded
# `unified_search_native` signature. See the `abac-policy` feature below.
proximadb-abac = { workspace = true, optional = true }
proximadb-embedded-common = { path = "../../horizontal/proximadb-embedded-common" }
anyhow.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
chrono.workspace = true
proximadb-data-model = { path = "../../foundation/proximadb-data-model" }
arrow = { workspace = true }
proximadb-records = { path = "../../foundation/proximadb-records" }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
arrow-ipc = { version = "59", default-features = false, features = ["lz4", "zstd"] }
libc = "0.2"
hostname = "0.4"
bincode = "1.3"
crc32fast = "1.4"
proximadb-runtime = { path = "../../platform/proximadb-runtime" }
num_cpus = "1.16"
proximadb-hardware = { path = "../../foundation/proximadb-hardware" }
proximadb-tenant = { path = "../../foundation/proximadb-tenant" }

# Language bindings (optional, feature-gated) — were in root, moved here so the
# server binary no longer compiles embedded bindings.
pyo3 = { workspace = true, optional = true }
numpy = { workspace = true, optional = true }
# `python.rs` / `python_dataframe.rs` use these DIRECTLY (`use datafusion::prelude::*`,
# `tracing_subscriber::…`). Having them only as transitive deps of the root crate is
# not enough — a transitive dependency is not in scope — so the `python` feature
# could never compile. Optional + feature-gated so non-Python builds are unaffected.
datafusion = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
# `python_dataframe.rs` uses `proximadb_storage_common::proxima_schema::ProximaSchema`
# directly when inferring a DataFrame schema from a collection.
proximadb-storage-common = { workspace = true, optional = true }
jni = { version = "0.21", optional = true }
napi = { version = "2.14", features = ["napi9"], optional = true }
napi-derive = { version = "2.14", optional = true }

[features]
# Default mirrors the root crate's default (ADR-082): the production feature set
# INCLUDING `axis` (in-memory ANN). Drop `axis` (via `--no-default-features` or a
# curated feature set) for an exact-scan-only embedded build.
default = [
    "datafusion-integration",
    "sql_frontend",
    "canonical-document-store",
    "graph-first-sks",
    "unified-facade-routing",
    "otlp-metering",
    "axis",
]
# Forward each root feature (the dep is `default-features = false`, so every feature
# the embedded default needs must be explicitly forwarded).
datafusion-integration = ["proximadb/datafusion-integration"]
sql_frontend = ["proximadb/sql_frontend"]
canonical-document-store = ["proximadb/canonical-document-store"]
graph-first-sks = ["proximadb/graph-first-sks"]
unified-facade-routing = ["proximadb/unified-facade-routing"]
otlp-metering = ["proximadb/otlp-metering"]
# In-memory ANN index engine (AXIS: HNSW/IVF/RaBitQ). ON by default; OFF
# (`--no-default-features`) yields the exact-scan embedded build.
axis = ["proximadb/axis"]
# FA-b: mirrors root's `abac-policy`. OFF by default — embedded mode is
# in-process and the host application owns authorization, so ABAC (a server-side
# multi-tenant concern) does not apply. The feature exists so the abac
# verification can build embedded against root's threaded signature; run it with
# `--features abac-policy,proximadb-embedded/abac-policy`.
abac-policy = ["proximadb/abac-policy", "dep:proximadb-abac"]
# Python bindings (PyO3 + zero-copy numpy).
# `arrow/pyarrow` is required by the `arrow::pyarrow::{PyArrowType, ToPyArrow}`
# conversions in the binding; without it those items are configured out and the
# feature does not build. It is enabled here rather than on the base `arrow`
# dependency so non-Python builds do not pull pyo3 in through arrow.
python = [
    "dep:pyo3",
    "dep:numpy",
    "dep:datafusion",
    "dep:tracing-subscriber",
    "dep:proximadb-storage-common",
    "arrow/pyarrow",
]
# Java bindings (JNI).
java = ["dep:jni"]
# Node.js bindings (NAPI-RS).
nodejs = ["dep:napi", "dep:napi-derive"]
# C FFI bindings.
c_ffi = []

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
