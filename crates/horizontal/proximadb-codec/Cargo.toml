[package]
name = "proximadb-codec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "ProximaCodec — unified encoding/decoding (baseline, SIMD, GPU) for ProximaDB"

[lib]
name = "proximadb_codec"
path = "src/lib.rs"

[features]
# Mirrors the root crate's `gpu` feature: gates GPU-backend selection + the
# platform-specific CUDA/ROCm/Metal/OpenCL kernel modules.
gpu = ["dep:metal", "proximadb-hardware-caps/gpu"]
# Enable Metal/MPS GPU support on macOS ARM64.
metal = ["dep:metal"]
# Optional experimental SIMD codec entrypoint (forwarded to the active SIMD module).
simd-experimental = []
# Optional AVX-512 SIMD code path (x86_64 only; gated at runtime via
# `is_x86_feature_detected!("avx512f")`). Placeholder feature — never in the
# default set; mirrors the root crate's `avx512` feature.
avx512 = []

[dependencies]
anyhow.workspace = true
rayon.workspace = true
serde.workspace = true
tracing.workspace = true
proximadb-hardware-caps.workspace = true
proximadb-runtime-common.workspace = true
proximadb-compression.workspace = true
# Optional GPU/Metal support (Apple Silicon). Gated behind the `gpu`/`metal` features.
metal = { version = "0.33", optional = true }

[dev-dependencies]
proximadb-config.workspace = true
serde_json.workspace = true

[lints]
workspace = true
