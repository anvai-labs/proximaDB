[package]
name = "proximadb-queue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/anvai-labs/proximaDB"
description = "ProximaDB tiered persistent queue — memory + disk + object-store tiers with per-tenant partitioning and group-commit fsync"

[lib]
name = "proximadb_queue"
path = "src/lib.rs"
# rlib for normal in-process use across the proximadb workspace; cdylib
# when the `python` feature is on so maturin can package a Python wheel
# (clients/python-queue-embedded). Cargo is fine with both crate-types
# simultaneously — non-Python builds just ignore the cdylib output.
crate-type = ["rlib", "cdylib"]

[features]
default = []
# Object-store archival tier. Off by default in tests so the crate compiles
# without bringing in cloud-storage credential plumbing.
object-tier = []
# PyO3 embedded bindings — exposes QueueClient/Producer/Consumer to
# Python via a tokio block_on bridge. See `src/python.rs`. Build the
# wheel from clients/python-queue-embedded/ via `maturin develop`.
python = ["dep:pyo3"]

[dependencies]
# Async runtime
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "time", "macros", "fs"] }
async-trait.workspace = true
uuid = { version = "1.0", features = ["v4"] }
proximadb-runtime-common.workspace = true

# Lock-free bounded queues for the memory tier
crossbeam-queue = "0.3"

# Singleton + concurrent maps
once_cell = "1.19"
dashmap = "6.1.0"

# Stable hashing for partition selection
twox-hash = "1.6"

# Serialization for message envelopes + offset metadata
serde.workspace = true
serde_json.workspace = true
bincode = "1.3"

# Errors + tracing + metrics
anyhow.workspace = true
thiserror.workspace = true
tracing = "0.1"
prometheus = "0.14"

# Python bindings — only pulled in when --features python is set.
# Version pinned to match the workspace's other PyO3 consumer
# (`src/embedded/python.rs` in the root proximadb crate) so both
# resolve to the same `python` native links target.
pyo3 = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "test-util", "rt-multi-thread"] }
tempfile.workspace = true
