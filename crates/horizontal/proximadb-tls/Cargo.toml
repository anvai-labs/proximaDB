[package]
name = "proximadb-tls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "TLS configuration, rustls acceptor, and X.509 certificate management (generation/parsing/mTLS) for ProximaDB"

[lib]
name = "proximadb_tls"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
rustls = { version = "0.23" }
tokio-rustls = "0.26"
rustls-pemfile = "2.0"
rcgen = "0.12"
x509-parser = "0.18"
sha2 = "0.11"
hex = "0.4"
time = { version = "0.3", features = ["std"] }
# Only used by the `network-rest` axum middleware (TlsAcceptorLayer).
axum = { version = "0.8", features = ["json", "ws"], optional = true }

[features]
# Mirrors the root crate's `network-rest` feature: gates the axum TLS acceptor
# layer/middleware. Root propagates its `network-rest` to `proximadb-tls/network-rest`.
network-rest = ["dep:axum"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
