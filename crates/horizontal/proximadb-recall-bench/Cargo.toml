[package]
name = "proximadb-recall-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Recall harness for the embedding-precision rollout — compares top-K overlap between a reference precision config and a candidate config across canonical recall benchmarks (SIFT-1M, GloVe-100, synthetic). LLD: docs/12-design/EMBEDDING_PRECISION_LLD_2026_05_22.adoc §PR 11"

[lib]
name = "proximadb_recall_bench"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
# Integration test composes the PR 6a precision-policy types and the
# foundation-layer EmbeddingValues::from_fp32_lossy adapter (which is
# what proximadb-embedding's project_to_canonical / prepare_query
# delegate to under the hood) into an end-to-end fp16 pipeline
# scaffold (PR 12 of EMBEDDING_PRECISION_LLD_2026_05_22.adoc). We
# can't dep on proximadb-embedding directly — modality crates are not
# importable from horizontal crates per workspace layering rules.
proximadb-catalog = { workspace = true }
half = "2.7"
proximadb-records = { workspace = true }

[lints]
workspace = true
