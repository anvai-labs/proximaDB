[package]
name = "proximadb-query"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Shared ProximaDB cross-model query runtime layer"

[lib]
name = "proximadb_query"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64 = "0.22"
bincode = "1.3"
parking_lot = "0.12"
rand = { version = "0.8", features = ["small_rng"] }
regex = "1.10"
serde.workspace = true
serde_json.workspace = true
tracing = "0.1"
tokio = { version = "1.37", features = ["rt", "sync", "macros"] }
proximadb-data-model = { path = "../../foundation/proximadb-data-model" }
proximadb-records = { path = "../../foundation/proximadb-records" }
proximadb-search-types = { path = "../../foundation/proximadb-search-types" }
proximadb-document-query = { path = "../proximadb-document-query" }
proximadb-filter-expression = { path = "../../foundation/proximadb-filter-expression" }
proximadb-graph-query = { path = "../proximadb-graph-query" }
proximadb-kernel = { path = "../../foundation/proximadb-kernel" }
proximadb-multimodel-plan = { path = "../proximadb-multimodel-plan" }
proximadb-multimodel-query = { path = "../proximadb-multimodel-query" }
proximadb-observability-query = { path = "../proximadb-observability-query" }
proximadb-proto = { path = "../../foundation/proximadb-proto" }
proximadb-query-filter = { path = "../proximadb-query-filter" }
proximadb-query-fusion = { path = "../proximadb-query-fusion" }
proximadb-runtime-common = { path = "../../horizontal/proximadb-runtime-common" }
proximadb-uql = { path = "../proximadb-uql" }
proximadb-vector-query = { path = "../proximadb-vector-query" }
