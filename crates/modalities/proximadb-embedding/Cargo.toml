[package]
name = "proximadb-embedding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/anvai-labs/proximaDB"
description = "ProximaDB native embedding service — tier-aware ONNX inference with two-tier priority scheduling"

[lib]
name = "proximadb_embedding"
path = "src/lib.rs"

[features]
default = []
# Real ONNX runtime via the `ort` crate. Without this feature the embedding
# crate compiles but `BgeModel::initialize` returns ModelUnavailable for
# production paths. Test code that needs a deterministic vector source uses
# `test-synthetic` (test-cfg only).
onnx = ["dep:ort", "dep:ndarray"]
# CoreML execution provider (macOS / iOS). Opt-in because it links a macOS-
# only framework and ort/coreml only builds on Apple targets. When enabled,
# PROXIMADB_EMBED_PROVIDER=coreml routes inference through CoreML; otherwise
# falls through to CPU.
coreml = ["onnx", "ort/coreml"]
# NVIDIA CUDA execution provider. Requires CUDA toolkit + matching cuDNN
# on the host. Set PROXIMADB_EMBED_PROVIDER=cuda after building with this.
cuda = ["onnx", "ort/cuda"]
# NVIDIA TensorRT (deeper graph optimization on top of CUDA). Stricter
# requirements (TensorRT runtime + matching CUDA). Use for production
# Nvidia inference where peak throughput matters.
tensorrt = ["onnx", "ort/tensorrt"]
# AMD ROCm execution provider. Requires ROCm + HIP runtime on host.
rocm = ["onnx", "ort/rocm"]
# AMD MIGraphX (AMD's graph-optimizing EP, alternative to ROCm direct).
migraphx = ["onnx", "ort/migraphx"]
# Intel OpenVINO execution provider. Targets Intel CPU/iGPU/VPU.
openvino = ["onnx", "ort/openvino"]
# Intel oneDNN CPU optimizations. Works on x86_64 servers without a GPU.
onednn = ["onnx", "ort/onednn"]
# Microsoft DirectML (Windows). Cross-vendor GPU compute on D3D12.
directml = ["onnx", "ort/directml"]
# Google XNNPACK — quantized inference path, useful on edge/ARM.
xnnpack = ["onnx", "ort/xnnpack"]
# WebGPU (browser + native). Cross-platform GPU compute.
webgpu = ["onnx", "ort/webgpu"]
# Convenience meta-features for typical deployments.
gpu-nvidia = ["cuda", "tensorrt"]
gpu-amd = ["rocm", "migraphx"]
gpu-intel = ["openvino"]
gpu-apple = ["coreml"]
gpu-windows = ["directml"]
cpu-intel = ["onednn"]
cpu-edge = ["xnnpack"]
# Deterministic hash-derived vector fallback. Visible only to `#[cfg(test)]`
# code via the helper in `bge::testing` — never enabled in release builds.
test-synthetic = []
# External Azure OpenAI fallback for the Premium add-on. Optional because
# many deployments won't enable Premium.
azure-openai = []
# Bring-your-own embedding endpoint (Enterprise tier feature).
byo = []
# All embedding routes enabled.
full = ["onnx", "azure-openai", "byo"]

[dependencies]
# ProximaDB foundation
proximadb-kernel = { path = "../../foundation/proximadb-kernel" }
proximadb-records = { path = "../../foundation/proximadb-records" }
proximadb-data-model = { path = "../../foundation/proximadb-data-model" }

# Async runtime
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "time", "macros"] }
async-trait.workspace = true

# Singleton + shared state
once_cell = "1.19"
dashmap = "6.1.0"


# Errors + tracing
anyhow.workspace = true
thiserror.workspace = true
tracing = "0.1"

# Metrics
prometheus = "0.14"

# Serde for config + tenant registry payloads
serde.workspace = true
serde_json.workspace = true

# Bounded queues for the scheduler
crossbeam-queue = "0.3"

# HTTP for Azure OpenAI + BYO endpoint clients. Blocking client is used
# inside the scheduler's worker threads which already isolate latency from
# the main runtime.
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }

# Tokenization (BPE / WordPiece) — used for chunking and pre-embedding token counts
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }

# Optional ONNX Runtime via the `ort` crate. The `download-binaries` feature
# fetches a prebuilt ONNX Runtime shared library at build time so the binary
# is self-contained on macOS/Linux without a system install. Gated to keep
# default builds dependency-light.
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = [
    "std",
    "download-binaries",
    "ndarray",
    "tls-rustls",
    "half",
] }
# half (`f16`/`bf16`) for fp16 ONNX output extraction AND the precision
# hw_capability micro-bench (PR 7 of EMBEDDING_PRECISION_LLD_2026_05_22).
# Unconditional — the probe runs at startup regardless of which inference
# backend is enabled.
half = { version = "2.7" }

# ndarray for tensor manipulation in the BGE inference path (mean-pool, L2 norm).
# Pinned to 0.17 to match ort 2.0.0-rc.x; ndarray 0.16 lacks the `NdFloat` trait
# layout that ort imports.
ndarray = { version = "0.17", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "test-util"] }

[lints]
workspace = true
