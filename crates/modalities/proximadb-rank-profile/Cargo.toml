[package]
name = "proximadb-rank-profile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/anvai-labs/proximaDB"
description = "Rank-profile DSL + validator + xCatalog-bindable registry for ProximaDB. See roadmap/RANKING_FRAMEWORK_SPEC_2026_05_23.md (R-4)."

[lib]
name = "proximadb_rank_profile"
path = "src/lib.rs"

[dependencies]
proximadb-kernel = { workspace = true }
proximadb-rank-core = { workspace = true }
proximadb-rank-expr = { workspace = true }
arc-swap = "1.7"
async-trait.workspace = true
dashmap.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
proximadb-rank-features = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
