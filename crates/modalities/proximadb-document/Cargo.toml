[package]
name = "proximadb-document"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/anvai-labs/proximaDB"
description = "Shared ProximaDB document modality contracts and full-text search primitives"

[lib]
name = "proximadb_document"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
arrow.workspace = true
async-trait.workspace = true
proximadb-data-model = { path = "../../foundation/proximadb-data-model" }
proximadb-kernel = { path = "../../foundation/proximadb-kernel" }
proximadb-records = { path = "../../foundation/proximadb-records" }
proximadb-query-filter = { path = "../../query/proximadb-query-filter" }
proximadb-document-query = { path = "../../query/proximadb-document-query" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing = "0.1"

[dev-dependencies]
proximadb-records = { path = "../../foundation/proximadb-records", features = ["test-support"] }
tokio = { version = "1.37", features = ["macros", "rt-multi-thread"] }
