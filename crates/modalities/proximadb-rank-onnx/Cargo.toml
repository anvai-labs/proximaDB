[package]
name = "proximadb-rank-onnx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/anvai-labs/proximaDB"
description = "Shared ONNX scorer primitives for ProximaDB ranking: ScorerSession, OnnxModelCache (LRU+refcount), BatchedScorer, ModelRegistry. See roadmap/RANKING_FRAMEWORK_SPEC_2026_05_23.md (R-5)."

[lib]
name = "proximadb_rank_onnx"
path = "src/lib.rs"

[features]
default = []
# R-5b: real ort-backed ScorerSession (`OrtScorerSession`). Gated so the
# default build stays light — the mock-driven session primitives from
# R-5 are sufficient for unit-testing the cache / batch / LRU
# semantics. Enable this in production deployments that need live
# cross-encoder inference.
real-onnx = ["dep:ort", "dep:ndarray"]
# R-5b.1.2: BertPairTokenizingDocFeatureExtractor — pulls
# (query_text, doc_text) pairs and produces a TokenizedBatch via
# `tokenizers::Tokenizer::encode_batch`. Gated so the default build
# stays under 60s without the (heavy) tokenizers + onig deps.
bert-tokenizer = ["dep:tokenizers"]

[dependencies]
proximadb-rank-core = { workspace = true }
proximadb-kernel = { workspace = true }
async-trait.workspace = true
dashmap.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

# Real ONNX runtime — version + features pinned to match
# crates/modalities/proximadb-embedding so both crates link against
# the same ort native library at runtime (avoids dual-load of
# onnxruntime which destabilises the EP registry).
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = [
    "std",
    "download-binaries",
    "ndarray",
    "tls-rustls",
    "half",
] }
ndarray = { version = "0.17", optional = true }

# R-5b.1.2: HuggingFace tokenizers. Version + features pinned to match
# `proximadb-embedding/Cargo.toml` so the two crates share one
# compiled tokenizers staticlib at link time.
tokenizers = { version = "0.23", optional = true, default-features = false, features = [
    "onig",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
