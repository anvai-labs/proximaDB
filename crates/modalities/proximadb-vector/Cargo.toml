[package]
name = "proximadb-vector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/anvai-labs/proximaDB"
description = "Shared ProximaDB vector modality contracts and search primitives"

[lib]
name = "proximadb_vector"
path = "src/lib.rs"

[features]
# Per ADR-021 + TURBOQUANT_LLD_2026_05_30. Activates the
# QuantizationLevel::TurboQuant variant + supporting types + the turboquant
# encode pipeline (P2). Foundation crate's matching feature is passed through
# so the discriminant in QuantizationType is also visible. Pulls in faer + statrs
# (only compiled when feature is on). Default off.
experimental-turboquant = [
    "proximadb-quantization-types/experimental-turboquant",
    "proximadb-quantization-model/experimental-turboquant",
    "dep:faer",
    "dep:statrs",
    "dep:rand_chacha",
    "dep:rand_distr",
]

[dependencies]
anyhow.workspace = true
arrow.workspace = true
async-trait.workspace = true
chrono.workspace = true
proximadb-data-model = { workspace = true }
proximadb-hardware = { path = "../../foundation/proximadb-hardware" }
proximadb-kernel = { path = "../../foundation/proximadb-kernel" }
proximadb-proto = { path = "../../foundation/proximadb-proto" }
proximadb-quantization-types = { path = "../../foundation/proximadb-quantization-types" }
proximadb-quantization-model = { workspace = true }
proximadb-records = { workspace = true }
proximadb-query-filter = { path = "../../query/proximadb-query-filter" }
proximadb-vector-query = { path = "../../query/proximadb-vector-query" }
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing = "0.1"

# TurboQuant deps — only compiled when `experimental-turboquant` is on.
faer = { workspace = true, optional = true }
statrs = { workspace = true, optional = true }
rand_chacha = { version = "0.9", optional = true }
rand_distr = { version = "0.4", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { version = "1.37", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
