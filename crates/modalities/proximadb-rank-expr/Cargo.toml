[package]
name = "proximadb-rank-expr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/anvai-labs/proximaDB"
description = "Expression parser + bytecode VM for ProximaDB rank profiles. See roadmap/RANKING_FRAMEWORK_SPEC_2026_05_23.md (R-3)."

[lib]
name = "proximadb_rank_expr"
path = "src/lib.rs"

[dependencies]
proximadb-rank-core = { workspace = true }
proximadb-kernel = { workspace = true }
smallvec = { version = "1.13", features = ["const_generics"] }
thiserror.workspace = true

[dev-dependencies]
proximadb-rank-core = { workspace = true, features = ["test-support"] }
