[package]
name = "proximadb-observability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shared ProximaDB observability modality contracts for logs, metrics, and traces"

[lib]
name = "proximadb_observability"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
proximadb-kernel = { path = "../../foundation/proximadb-kernel" }
proximadb-data-model = { path = "../../foundation/proximadb-data-model" }
proximadb-proto = { path = "../../foundation/proximadb-proto" }
proximadb-query-filter = { path = "../../query/proximadb-query-filter" }
proximadb-records = { path = "../../foundation/proximadb-records" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.37", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
