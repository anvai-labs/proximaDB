[package]
name = "proximadb-rank-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/anvai-labs/proximaDB"
description = "ProximaDB multi-phase ranking framework — Blueprint/Executor/LazyValue pattern, phase budget, lazy memoization. See roadmap/RANKING_FRAMEWORK_SPEC_2026_05_23.md (R-1)."

[lib]
name = "proximadb_rank_core"
path = "src/lib.rs"

[features]
default = []
# Shared fixtures for downstream ranking tests; enable only in dev-dependencies.
test-support = []

[dependencies]
proximadb-kernel = { workspace = true }
anyhow.workspace = true
async-trait.workspace = true
bumpalo = "3.16"
dashmap.workspace = true
futures.workspace = true
serde.workspace = true
smallvec = { version = "1.13", features = ["const_generics"] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }
