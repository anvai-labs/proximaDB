[package]
name = "proximadb-graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Shared ProximaDB graph modality contracts and query execution primitives"

[lib]
name = "proximadb_graph"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
nom = "8"
proximadb-data-model = { path = "../../foundation/proximadb-data-model" }
proximadb-kernel = { path = "../../foundation/proximadb-kernel" }
proximadb-records = { path = "../../foundation/proximadb-records" }
proximadb-graph-query = { path = "../../query/proximadb-graph-query" }
proximadb-query-filter = { path = "../../query/proximadb-query-filter" }
rayon.workspace = true
regex = "1.10"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.37", features = ["macros", "rt-multi-thread", "time", "sync"] }
tracing = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
async-recursion = "1.0"

[dev-dependencies]
proximadb-records = { path = "../../foundation/proximadb-records", features = ["test-support"] }
tokio = { version = "1.37", features = ["macros", "rt-multi-thread"] }
