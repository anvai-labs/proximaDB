[package]
name = "proximadb-engine-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Shared engine-core ops + formats hoisted out of the root crate (root-crate decomposition, engines extraction). Occupants: simd_decode ops + hermetic proximablocks sub-leaves."

[lib]
name = "proximadb_engine_core"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
proximadb-storage-common.workspace = true
# proximablocks hermetic sub-leaves (header_metadata + per_column_alignment).
proximadb-compression.workspace = true
proximadb-distance-kernel.workspace = true
proximadb-kernel.workspace = true
proximadb-records.workspace = true
# spatial_* cohort (spatial_clustering k-means + hilbert_curve via storage_common).
proximadb-clustering-kernel.workspace = true
# smart_rowgroup_sizing (raptor rowgroup sizing heuristics, TD-DECOMP-69)
# block_structures + index_structures (TD-DECOMP-71/72)
proximadb-bloom.workspace = true
# sst/swift metadata serializers (TD-DECOMP-75): FilesystemPort seam + zero-copy traits + futures block_on
proximadb-storage-ports.workspace = true
proximadb-filter-expression.workspace = true
proximadb-implicit-id-generator.workspace = true
proximadb-storage-filesystem-types.workspace = true
parking_lot.workspace = true
futures.workspace = true
proximadb-hardware-caps.workspace = true
proximadb-hardware.workspace = true
proximadb-runtime-common.workspace = true
moka.workspace = true
proximadb-codec.workspace = true
proximadb-config.workspace = true
num_cpus = "1.16"
toml.workspace = true
proximadb-search-types.workspace = true
proximadb-data-model.workspace = true
# block_structures runtime deps: bincode serialization, rayon parallel encode, tokio spawn
bincode.workspace = true
bytemuck = { version = "1.14", features = ["derive"] }
arrow-schema.workspace = true
arrow.workspace = true
arrow-array.workspace = true
arrow-buffer = { version = "59", default-features = false }
arrow-select = { version = "60", default-features = false }
memmap2 = "0.9"
parquet.workspace = true
bytes = "1.5"
proximadb-quantization-model.workspace = true
rayon.workspace = true
tokio.workspace = true
proximadb-proto.workspace = true
tracing.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
# uuid is not in workspace.dependencies (root-package-only) — inline spec.
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
half = "2.4"
tempfile.workspace = true
async-trait.workspace = true
rand.workspace = true

[lints]
workspace = true
