[package]
name = "proximadb-raptor-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "RAPTOR engine — consolidated reader (the first raptor leaf moved out of the root crate); depends on proximadb-raptor-common downward. Root-crate decomposition (engines extraction)."

[lib]
name = "proximadb_raptor_engine"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
async-trait.workspace = true
tokio.workspace = true
dashmap.workspace = true
bincode.workspace = true
serde_json.workspace = true
tracing.workspace = true
arrow-array.workspace = true
arrow-ipc = { version = "59", default-features = false, features = ["lz4", "zstd"] }
arrow-schema.workspace = true
proximadb-raptor-common = { path = "../proximadb-raptor-common" }
proximadb-storage-ports.workspace = true
proximadb-storage-filesystem-types.workspace = true
proximadb-proto.workspace = true
proximadb-search-types.workspace = true
proximadb-codec.workspace = true
proximadb-compression.workspace = true
proximadb-distance-kernel.workspace = true
proximadb-kernel.workspace = true
# Writer deps: hardware caps + memory pool + bloom filter (was crate::core::bloom).
proximadb-hardware-caps.workspace = true
proximadb-runtime-common.workspace = true
proximadb-bloom.workspace = true
# Writer encodes records via prost::Message.
prost.workspace = true

[features]
experimental-engines = []
# NOTE: GPU-accelerated P^2 matrix building (Metal MPS, formerly `gpu` feature)
# was root-coupled (`crate::compute::gpu`) and does NOT run from this crate. The
# `#[cfg(feature = "gpu")]` blocks in `matrix_builder.rs` are dormant here (always
# false); they are retained for a future gpu-compute crate/port restoration. The
# resulting `unexpected_cfgs` lint is silenced crate-wide in lib.rs. See
# ROOT_CRATE_DECOMPOSITION_ENGINES_EXTRACTION doc.

[dev-dependencies]
# consolidated_reader tests (experimental-engines feature) encode/decode vectors via base64.
base64 = "0.22"

[lints]
workspace = true
