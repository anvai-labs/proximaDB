[package]
name = "proximadb-storage-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Shared ProximaDB storage primitives reused across storage engines and modalities"

[lib]
name = "proximadb_storage_common"
path = "src/lib.rs"

[dependencies]
proximadb-storage-filesystem-types.workspace = true
anyhow.workspace = true
arrow.workspace = true
bincode.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
bytes = "1.5"
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
memmap2 = "0.9"
parking_lot.workspace = true
parquet.workspace = true
object_store.workspace = true
tokio = { version = "1.37", features = ["sync", "rt", "time"] }
proximadb-kernel.workspace = true
proximadb-compression-types.workspace = true
proximadb-compression.workspace = true
proximadb-proto.workspace = true
proximadb-data-model = { workspace = true }
proximadb-records = { workspace = true }
proximadb-search-types = { workspace = true }
proximadb-block-format = { workspace = true }
proximadb-codec = { workspace = true }
proximadb-filter-expression = { workspace = true }
proximadb-cache = { workspace = true }
# ADR-024 Step 4: storage-side ProximaSchema/ProximaColumn are now aliases for
# the canonical CatalogTableSchema/CatalogColumn. The schema contract types now
# live in the foundation `proximadb-catalog-schema` crate (extracted from the
# control-layer catalog), so storage -> foundation is a clean downward edge with
# no grandfathered control-layer coupling (TD-DECOMP ratchet).
proximadb-catalog-schema = { workspace = true }
# text_search/text_filter n-gram bloom (TD-DECOMP-73)
proximadb-bloom = { workspace = true }
proximadb-hardware.workspace = true
proximadb-hardware-caps.workspace = true
regex.workspace = true
arrow-select = { version = "59", default-features = false }
crc32fast.workspace = true
proximadb-runtime-common.workspace = true
# columnar footer_cache + utilities (TD-DECOMP-76)
moka.workspace = true
serde.workspace = true
serde_json.workspace = true
rmp-serde.workspace = true
thiserror.workspace = true
tempfile.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "wal_throughput"
harness = false

[lints]
workspace = true
