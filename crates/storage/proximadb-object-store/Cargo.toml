[package]
name = "proximadb-object-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Decoupled object-storage plumbing (object_store factory + I/O helpers) for the ProximaDB warehouse base tier"

[lib]
name = "proximadb_object_store"
path = "src/lib.rs"

[dependencies]
# MUST match proximadb-storage-common's object_store (ObjectStoreBridge) so the
# Arc<dyn ObjectStore> types unify across the warehouse base tier.
object_store.workspace = true
bytes = "1.5"
futures.workspace = true
url = "2"
proximadb-kernel.workspace = true
# For the canonical, cloud-neutral access-tier enum (`ObjectAccessTier`) + its
# per-cloud native mappings, reused by `put_with_tier`. Leaf type crate; no cycle.
proximadb-storage-filesystem-types.workspace = true

[features]
default = []
aws = ["object_store/aws"]
azure = ["object_store/azure"]
gcp = ["object_store/gcp"]

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true
tokio = { version = "1.37", features = ["macros", "rt-multi-thread"] }
