[package]
name = "proximadb-storage-ports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Dependency-inversion port traits for ProximaDB storage: narrow contracts (CollectionMetadataPort, …) that storage depends on downward while the composition root injects concrete implementations (Slice D)"

[lib]
name = "proximadb_storage_ports"
path = "src/lib.rs"

[dependencies]
proximadb-config.workspace = true
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
# tokio: GraphWalFactory returns Arc<tokio::sync::Mutex<dyn GraphWalPort>> (the
# async-mutex the writer is shared under). Precedent: distance-kernel/records/
# tenant/storage-common/storage-traits all depend on tokio.
tokio = { workspace = true, features = ["sync"] }
proximadb-proto.workspace = true
proximadb-storage-common.workspace = true
# Foundation-tier: FilterExpression (ScanStrategy::FilteredScan predicates) +
# ProximaRecord (ScanIterator::next_batch item type) — pure-data scan-strategy
# types reference no root-internal types.
proximadb-filter-expression.workspace = true
proximadb-records.workspace = true
# Foundation-tier: CollectionIdentity (typed path helpers) +
# the StorageQuantizationEnginePort data types below, all foundation types
# so the ports are facade-FREE (no DTO/adaptor layer).
proximadb-kernel.workspace = true
# Foundation-tier: the AxisClusteringPort names DistanceMetric (k-means +
# centroid-distance methods) — pure-data leaf type.
proximadb-distance-kernel.workspace = true
# Foundation-tier: the StorageQuantizationEnginePort returns these data types
# (Vec<StorageQuantizedData>, &QuantizedVector, UnifiedQuantizationLevel) — moved to
# foundation by #842, so the port is facade-FREE (no DTO/adaptor layer).
proximadb-quantization-model.workspace = true
# Storage-tier: the FilesystemPort names FileSystem / FileOptions / FsResult from
# this crate (the existing filesystem abstraction). Same-tier dep (storage→storage).
proximadb-storage-filesystem-types.workspace = true
# Foundation-tier: the GraphWalPort names GraphOperation + MarkerKind (graph
# write-op model) — pure-data leaf types (downward dep, facade-free).
proximadb-graph-model.workspace = true

[dev-dependencies]
# `#[tokio::test]` for the ConditionalKeyStore contract's in-memory reference test.
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
