[package]
name = "proximadb-records"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "ProximaRecord unified record envelope (spec §3 — Phase B, TD-054)"

[lib]
name = "proximadb_records"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
proximadb-data-model = { workspace = true }
proximadb-kernel = { workspace = true }
proximadb-proto = { workspace = true }
serde.workspace = true
serde_json.workspace = true
# fp16 / bf16 element types for EmbeddingValues (PR 1 of the precision rollout
# per docs/12-design/EMBEDDING_PRECISION_LLD_2026_05_22.adoc).
half = { version = "2.7", features = ["serde"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# PR 2: schema_version skip-on-bincode round-trip tests.
bincode = { workspace = true }
# TD-072: branch_id-survives-rmp roundtrip tests (matches canonical WAL encoder).
rmp-serde = "1.1"
