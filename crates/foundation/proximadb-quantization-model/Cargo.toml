[package]
name = "proximadb-quantization-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Canonical quantization-level model for ProximaDB: UnifiedQuantizationLevel + the rich QuantizationLevel enum + variant payloads (foundation-tier, shared by storage and the modality)"

[features]
# Gates the TurboQuant variant/payload + calibration paths (moved verbatim from
# proximadb-vector/src/quantization/internal_types.rs). Default off; same gate as
# proximadb-quantization-types' experimental-turboquant, and forwarded to it: the
# gated code names that crate's TurboQuant items, so a standalone build needs both
# (TD-TQFEAT-1; the root build only worked through feature unification).
experimental-turboquant = ["proximadb-quantization-types/experimental-turboquant"]

[dependencies]
proximadb-quantization-types = { workspace = true }
# StorageQuantizationConfig field type (foundation-pure; TD-DECOMP-72)
proximadb-distance-kernel = { workspace = true }
serde = { workspace = true }

[lints]
workspace = true
