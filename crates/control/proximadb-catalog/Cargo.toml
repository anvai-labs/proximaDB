[package]
name = "proximadb-catalog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "xCatalog contract types shared by catalog, query, API, and storage layers"

[lib]
name = "proximadb_catalog"
path = "src/lib.rs"

[features]
# FC metamodel (TD-FOUNDATION-2 D12): first-class relationships + identity slot + policy model. Additive, inert.
fc-metamodel = []
# OLTP catalog backends — bring in sqlx. Enable the matching backend feature too.
oltp-catalog-postgres = ["oltp-catalog", "sqlx/postgres"]
oltp-catalog-mysql    = ["oltp-catalog", "sqlx/mysql"]
oltp-catalog-sqlite   = ["oltp-catalog", "sqlx/sqlite"]
oltp-catalog          = ["dep:sqlx"]
# Cloud catalog backends (mirror the root crate's feature gates)
aws                   = ["dep:aws-config", "dep:aws-sdk-glue"]
delta-lake            = []
polaris-catalog       = ["dep:reqwest", "dep:urlencoding"]
unity-catalog         = ["dep:reqwest", "dep:urlencoding"]
# API composition roots opt in to OpenAPI schemas for the stable catalog
# contracts. Catalog-only consumers keep the control crate transport-neutral.
openapi               = ["dep:utoipa"]

[dependencies]
anyhow.workspace = true
arrow-schema = { workspace = true, default-features = false }
async-trait.workspace = true
# Extracted runtime/wiring modules (Slice 1) use chrono (timestamps) + prost
# (proto message construction in syscat_cache/warm).
chrono.workspace = true
prost.workspace = true
aws-config = { version = "1.0", optional = true }
aws-sdk-glue = { version = "1.0", optional = true }
dashmap.workspace = true
parking_lot.workspace = true
reqwest = { version = "0.12", optional = true, features = ["json"] }
urlencoding = { version = "2", optional = true }
proximadb-compression-types = { workspace = true }
proximadb-data-model = { workspace = true }
proximadb-distance-types = { workspace = true }
proximadb-quantization-types = { workspace = true }
proximadb-records = { workspace = true }
proximadb-tenant = { workspace = true }
# Foundation schema contract types (extracted from this crate — TD-DECOMP ratchet).
# Re-exported so historical `proximadb_catalog::*` paths keep working.
proximadb-catalog-schema = { workspace = true }
# The canonical `ObjectStoreBridge` contract module (moved down from
# `proximadb-storage-common`, which re-exports it): object_store/arrow-array/
# futures for the trait surface, kernel for `StorageError`.
arrow-array = { workspace = true, default-features = false }
futures = { workspace = true }
object_store = { workspace = true }
proximadb-kernel = { workspace = true }
# `SegmentMeta` for the segment registry (block-format is a foundation-clean
# leaf: serde + codec/data-model/records/filter-expression only — no cycle).
proximadb-block-format = { workspace = true }
# Foundation deps pulled in by the runtime/wiring modules extracted from the
# root `src/catalog` (Slice 1): proto messages (Collection), filter expressions
# (partition pruning), and the cache façade.
proximadb-cache = { workspace = true }
proximadb-filter-expression = { workspace = true }
proximadb-proto = { workspace = true }
# FileSystem trait only (no concrete backends) — lets NativeCatalog persist
# through an injected object-store/local backend (dependency inversion; the
# concrete FilesystemFactory lives in the root crate and injects the impl).
proximadb-storage-filesystem-types = { workspace = true }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
rand.workspace = true
sqlx = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "fs", "io-util", "time", "macros", "rt"] }
tracing.workspace = true
utoipa = { version = "5", optional = true }
uuid = { version = "1.0", features = ["v4"] }  # opaque server-issued namespace_id (ns_<uuid>)

[dev-dependencies]
# Concrete bridge impl for the Iceberg REST service tests (dev-only cycle:
# iceberg-engine sits above this crate in the main graph, which Cargo permits
# for dev-dependencies).
proximadb-iceberg-engine = { workspace = true }
tempfile = { workspace = true }
tokio = { version = "1.37", features = ["full", "test-util"] }
