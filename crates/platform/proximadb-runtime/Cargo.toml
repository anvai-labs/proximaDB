[package]
name = "proximadb-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Platform runtime composition helpers for ProximaDB"

[lib]
name = "proximadb_runtime"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
# Cluster RPC abstraction layer (TD-DECOMP-3/4, moved from root src/cluster/rpc/).
dashmap.workspace = true
futures.workspace = true
rand.workspace = true
proximadb-distance-types.workspace = true
# tonic-backed client impl (connection/grpc_client) — TD-DECOMP-4.
tonic.workspace = true
serde_json.workspace = true
# Cluster-core subsystem (TD-DECOMP-5, moved from root src/cluster/).
chrono.workspace = true
proximadb-graph-query = { path = "../../query/proximadb-graph-query" }
proximadb-vector-query = { path = "../../query/proximadb-vector-query" }
proximadb-hardware = { path = "../../foundation/proximadb-hardware" }
proximadb-kernel = { path = "../../foundation/proximadb-kernel" }
proximadb-data-model = { path = "../../foundation/proximadb-data-model" }
proximadb-records = { path = "../../foundation/proximadb-records" }
proximadb-tenant = { path = "../../foundation/proximadb-tenant" }
proximadb-config = { path = "../../foundation/proximadb-config" }
# TD-XMODAL-4 S2: the v2 native search result type (foundation) so the
# VectorOpsPort can expose `unified_search_native` — the single canonical vector
# kernel shared by the pgvector `<->` operator and the `vector_search` UDTF.
proximadb-search-types = { path = "../../foundation/proximadb-search-types" }
proximadb-proto.workspace = true
serde = { workspace = true, features = ["derive"] }
num_cpus = "1.16"
sysinfo = "0.30"
thiserror.workspace = true
tokio = { version = "1.37", features = ["full"] }
tracing = "0.1"
# Node-id generation: used unconditionally by `cluster::consensus` (TD-DECOMP-6) and by
# the `cluster`-gated `ClusterServerConfig::default`.
uuid = { version = "1.0", features = ["v4"] }

[features]
default = []
# Distributed cluster bootstrap support. When enabled, exposes the
# `ClusterServerConfig` re-export and the cluster-related fields on
# `MultiServerConfig`. The root `proximadb` crate forwards its own
# `cluster` feature here. Without this, `#[cfg(feature = "cluster")]`
# in `bootstrap_config.rs` would unexpected-cfg-condition-value lint. (`uuid` is now
# unconditional — see [dependencies] — so this feature enables only the cfg gate, not a dep.)
cluster = []
