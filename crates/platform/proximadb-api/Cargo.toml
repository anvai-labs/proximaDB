[package]
name = "proximadb-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/anvai-labs/proximaDB"
description = "ProximaDB API handlers - REST, gRPC, pgwire, and Arrow Flight"

[dependencies]
anyhow.workspace = true
arrow-flight.workspace = true
async-trait.workspace = true
axum.workspace = true
chrono = "0.4"
hyper.workspace = true
proximadb-api-error = { path = "../../foundation/proximadb-api-error" }
proximadb-kernel = { path = "../../foundation/proximadb-kernel" }
proximadb-data-model = { path = "../../foundation/proximadb-data-model" }
proximadb-proto = { path = "../../foundation/proximadb-proto" }
proximadb-tenant = { path = "../../foundation/proximadb-tenant" }
proximadb-query = { path = "../../query/proximadb-query" }
proximadb-query-filter = { path = "../../query/proximadb-query-filter" }
proximadb-records = { path = "../../foundation/proximadb-records" }
proximadb-runtime = { path = "../proximadb-runtime" }
proximadb-relational-frontend = { path = "../../query/proximadb-relational-frontend" }
proximadb-write-intent = { path = "../../horizontal/proximadb-write-intent" }
prost-types.workspace = true
serde.workspace = true
serde_json.workspace = true
utoipa.workspace = true
thiserror.workspace = true
tokio = { version = "1.37", features = ["full"] }
tokio-stream.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tower.workspace = true
uuid = { version = "1.6", features = ["v4"] }
tower-http.workspace = true
tracing = "0.1"
futures = "0.3"

[dev-dependencies]
tokio = { version = "1.37", features = ["macros", "rt-multi-thread"] }
