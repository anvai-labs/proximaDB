[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "proximadb_queue_embedded"
version = "0.4.0"
description = "ProximaDB Queue (Embedded) — in-process tiered persistent queue with Python bindings"
authors = [{name = "Vijaykumar Singh", email = "vijay@anvaiops.com"}]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.11"
keywords = ["queue", "persistent", "pyo3", "tokio", "wal", "lsm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "maturin>=1.4,<2.0",
]

[tool.maturin]
# Build the queue crate directly (it lives under crates/horizontal/).
manifest-path = "../../crates/horizontal/proximadb-queue/Cargo.toml"
features = ["proximadb-queue/python"]
python-source = "src"
module-name = "proximadb_queue_embedded._native"
bindings = "pyo3"
strip = true
compatibility = "manylinux2014"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
