# NOT a buildable package config. The canonical `proximadb_embedded` wheel is
# built from the REPO-ROOT pyproject.toml (`manifest-path =
# "crates/binding/proximadb-embedded/Cargo.toml"`, `python-source =
# "clients/python-embedded/src"`) — see `release-python.yml`. This file used to
# carry its own [build-system]+[tool.maturin] with the PRE-#1448 settings
# (`features = ["python", "pylib"]`, no manifest-path); `pylib` no longer
# exists, so building from this directory could never work, and having two
# configs with one correct was a standing trap (#1675). The blocks below are
# only the dev-tool configuration for the tests and benchmarks in this
# directory.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.isort]
profile = "black"
line_length = 88

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]
