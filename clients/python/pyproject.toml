[build-system]
requires = ["setuptools>=64", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
# Canonical PyPI distribution name is `proximadb` (the pure-Python client SDK;
# the import package stays `proximadb_sdk`). The native in-process engine ships
# separately as `proximadb_embedded` — install via the `embedded` extra below.
name = "proximadb"
version = "0.3.0"
description = "Python client SDK for ProximaDB - Cloud-native vector database engineered for AI-first applications"
authors = [
    {name = "Vijaykumar Singh", email = "vijay@anvaiops.com"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.11"
keywords = ["vector", "database", "similarity", "search", "ml", "ai", "embeddings", "proximity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx>=0.24.0",
    "h2>=4.0.0",  # Required for HTTP/2 support in httpx
    # attrs + python-dateutil back the generated REST transport models
    # (src/proximadb_sdk/_generated/rest, openapi-python-client output, TD-126
    # Phase 4). Light core-install deps.
    "attrs>=23.1.0",
    "python-dateutil>=2.8.0",
    "pydantic>=2.0.0",
    "numpy>=1.21.0",
    "typing-extensions>=4.0.0",
    "grpcio>=1.80.0",
    "protobuf>=6.31.1,<8",
    "asyncio-mqtt>=0.13.0",
    "tenacity>=8.0.0",
    "orjson>=3.8.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "tabulate>=0.9.0",
    # auth.py uses requests (sync token/refresh flows) on the core path; it was
    # previously only pulled in via the dev/test extras, so a core-only install
    # failed to `import proximadb_sdk`. Light dep, belongs in core.
    "requests>=2.28.0",
]

[project.optional-dependencies]
# In-process native engine (PyO3/maturin). Published separately as platform
# wheels; pull it in ergonomically with `pip install 'proximadb[embedded]'`.
embedded = [
    "proximadb_embedded>=0.2.0,<0.3.0",
]

# Embeddings concern (TD-126 Phase 3): the built-in local embedding providers
# (BGE, E5, GTE-Qwen, sentence-transformer, SFR) and their runtime model deps.
# Opt-in so the core install stays light — `import proximadb_sdk` and even
# `import proximadb_sdk.embedding_providers` no longer eagerly import the
# provider modules; provider self-registration fires lazily on first registry
# use (see embedding_providers/__init__.py). The `simulated` provider needs no
# extra deps and works core-only.
#   pip install 'proximadb[embeddings]'
embeddings = [
    "sentence-transformers>=3.2,<7",  # Local embedding models (BGE/E5/GTE-Qwen/SFR)
    # Trusted modeling code used by catalogued Nomic v1.5 imports
    # einops directly; keep the public extra sufficient for every advertised
    # open-weights model rather than relying on an ambient transitive package.
    "einops>=0.7,<1",
]

# Hosted / OpenAI-compatible embedding providers (opt-in, reachable via
# get_provider('openai'|'cohere'|'fastembed')). Kept separate from `embeddings`
# so the local-model install stays light.
#   pip install 'proximadb[embeddings-cloud]'
embeddings-cloud = [
    "openai>=2",  # OpenAIProvider (modern >=1.0 client)
    "cohere>=5",  # CohereProvider (cohere.ClientV2)
    "fastembed>=0.3",  # FastEmbedProvider (ONNX)
]

# LLM integration via Victor framework
llm = [
    "victor-ai>=0.2.0",  # Victor AI framework for embeddings and LLM
    "sentence-transformers>=3.2,<7",  # Local embedding models
]

# Chunking concern (TD-126 Phase 3): text + code-aware AST chunking via
# tree-sitter (requires Python 3.10+). Opt-in so the core install stays light —
# `import proximadb_sdk` no longer pulls tree-sitter; the chunking public names
# load lazily on first access (see proximadb_sdk/__init__.py __getattr__).
#   pip install 'proximadb[chunking]'
chunking = [
    "tree-sitter>=0.25",
    "tree-sitter-language-pack>=1.0",
]

# Back-compat alias for the pre-TD-126 extra name; identical to `chunking`.
code-chunking = [
    "tree-sitter>=0.25",
    "tree-sitter-language-pack>=1.0",
]

# Shared code->CPG chunker (TD-CG2 / ADR-029). The in-SDK `chunking_strategies/
# code.py` owns no parser; it delegates to `victor_codegraph`, so the tree-sitter
# symbol+relation chunker lives in ONE place (Victor owns it).
#
# The floor is 0.9.0 and that is NOT YET ON PyPI (latest published: 0.8.1). That
# is deliberate, not an oversight. TD-CG2's acceptance suite
# (tests/chunking/test_code_language_surface.py) passes on 0.9.0 and fails
# 30-of-54 on 0.8.1 -- R1 alone fails for 15 of the 16 languages the SDK
# advertises symbol extraction for. On 0.8.1 the delegated chunker returns almost
# no symbols, which is precisely the "dead but advertised" trap TD-CG2 deleted the
# in-SDK parsers to remove.
#
# An unsatisfiable floor makes that gap an install-time error naming the version,
# instead of a silent behavioural difference the caller discovers as an empty
# result. Lower it only when a release that passes the acceptance suite ships;
# `code.py` carries the matching runtime guard for environments that already hold
# an older copy. The language SURFACE is identical across 0.8.1 and 0.9.0 (27
# extensions, 18 languages) -- it is the behaviour that differs.
codegraph = [
    "victor-codegraph>=0.9.0",
]

langchain = [
    "langchain-core>=0.3.0",
]

victor = [
    "victor-ai>=0.2.0",
]

crewai = [
    "crewai>=1.0.0",
]

langgraph = [
    "langgraph>=1.0.0",
    "langchain-core>=0.3.0",
]

dspy = [
    "dspy>=3.0.0",
]

autogen = [
    # ProximaDBMemory targets the 0.4 autogen_core.memory protocol; the
    # ProximaDBVectorDB helper also works on the 0.2 line (pyautogen).
    "autogen-agentchat>=0.4.0",
]

llama_index = [
    "llama-index-core>=0.12.0",
]

haystack = [
    "haystack-ai>=2.0.0",
]

dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "pytest-timeout>=2.1.0",
    "pytest-cov>=4.0.0",
    "pytest-html>=3.1.0",
    "pytest-xdist>=3.0.0",
    "sentence-transformers>=3.2,<7",
    "requests>=2.28.0",
    "grpcio-tools>=1.80.0",
    # Pinned like isort below, and for the same reason: CI's `black --check` is a
    # HARD gate, so an unpinned ceiling makes it flap whenever black ships a
    # major with new formatting. `>=22.0.0` resolved to 26.x in CI while
    # .pre-commit-config.yaml pinned 24.10.0, and the two disagreed about which
    # files are dirty -- so the local hook and the merge gate gave different
    # answers. This pins the gate; the hook rev is a separate bump.
    "black>=26.0.0,<27",
    # Pin the major: isort 7 vs 9 order the same imports differently
    # (9 collapses parenthesized single-imports), so an unpinned floor makes
    # the lint gate flap on every new major. Pin ~=9.0 = what CI resolves.
    "isort>=9.0.1,<9.1",
    "mypy>=1.0.0",
    "pre-commit>=2.20.0",
    "ruff>=0.0.280",
]

test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "pytest-timeout>=2.1.0",
    "pytest-cov>=4.0.0",
    "pytest-html>=3.1.0",
    "pytest-xdist>=3.0.0",
    "sentence-transformers>=3.2,<7",
    "requests>=2.28.0",
    # Complete the "run the unit suite" contract: unit tests hard-import these
    # optional deps (arrow export/flight, dataframe builders, multi-bert psutil
    # sizing, grpc codegen, config/openapi validation). Kept here so
    # `pip install -e ".[test]"` is the single source of truth for CI — the
    # previously hand-maintained CI dep list drifted and left the SDK lane red.
    "pyarrow>=14.0.0",
    "pandas>=2.0.0",
    "psutil>=5.9.0",
    "grpcio-tools>=1.60.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0.0",
    "httpx>=0.24.0",
]

docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=0.18.0",
]

performance = [
    "uvloop>=0.17.0",
    "aiodns>=3.0.0",
    "cchardet>=2.1.0",
]

[project.scripts]
proximadb-cli = "proximadb_sdk.cli:main"
pdb-cli = "proximadb_sdk.cli:main"

[project.urls]
Homepage = "https://github.com/anvai-labs/proximaDB"
Documentation = "https://github.com/anvai-labs/proximaDB#readme"
Repository = "https://github.com/anvai-labs/proximaDB"
Issues = "https://github.com/anvai-labs/proximaDB/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"proximadb_sdk" = ["py.typed", "*.pyi"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | v1
)/
'''

# ruff does NOT read [tool.isort] -- it has its own isort implementation under
# [tool.ruff.lint.isort]. Without this, ruff run from the REPO ROOT (which is how
# .pre-commit-config.yaml invokes it: `--config clients/python/pyproject.toml`)
# cannot infer `proximadb_sdk` as first-party, so it reports I001 on files that
# are correctly ordered and the --fix hook rewrites them. It passed when run with
# cwd=clients/python only because src-root inference happened to work there.
[tool.ruff.lint.isort]
known-first-party = ["proximadb_sdk", "proximadb"]

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["proximadb"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
warn_unreachable = false
strict_equality = true

# Ignore errors in generated proto files
[[tool.mypy.overrides]]
module = ["proximadb_sdk.v1.*"]
ignore_errors = true

# Strict checking for well-typed core modules
[[tool.mypy.overrides]]
module = [
    "proximadb_sdk.models",
    "proximadb_sdk.models_v2",
    "proximadb_sdk.config",
    "proximadb_sdk.filters",
    "proximadb_sdk.auth",
    "proximadb_sdk.exceptions",
    "proximadb_sdk.integrations.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=proximadb_sdk",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--html=reports/report.html",
    "--self-contained-html",
    "-v"
]
markers = [
    "integration: marks tests as integration tests (may require running server)",
    "performance: marks tests as performance tests (may take longer to run)",
    "large_scale: marks tests as large-scale tests with significant data volumes",
    "grpc: marks tests as gRPC-specific tests",
    "rest: marks tests as REST-specific tests",
    "live: marks tests that require an external dependency or live service (e.g. the `victor` package, a real model download, network) — excluded from the offline SDK coverage ratchet",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
minversion = "7.0"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "ARG001", # unused-function-args
    "SIM118", # in-dict-keys
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["ARG001"]

[tool.coverage.run]
# Measure the whole hand-written SDK package (static discovery — never-imported
# modules count at 0%, so the denominator is honest, not import-inflated).
source_pkgs = ["proximadb_sdk"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
    # Generated protobuf/gRPC stubs — untestable boilerplate, excluded by
    # convention (disclosed). NOT the SDK's hand-written logic.
    "*/proximadb_sdk/v1/*_pb2.py",
    "*/proximadb_sdk/v1/*_pb2_grpc.py",
    "*/proximadb_sdk/v2/*_pb2.py",
    "*/proximadb_sdk/v2/*_pb2_grpc.py",
    # Un-importable as shipped (imports a non-existent `.base` submodule + uses
    # an unguarded `pd` annotation); not wired into embedding_providers/__init__,
    # so it is dead in normal import flow. Excluded until the import is fixed.
    "*/proximadb_sdk/embedding_providers/multi_bert_provider.py",
    # Heavy optional third-party framework integrations whose deps are not
    # installable in the test env (kept out of the denominator, disclosed).
    "*/proximadb_sdk/integrations/crewai*.py",
    "*/proximadb_sdk/integrations/dspy*.py",
    "*/proximadb_sdk/integrations/autogen*.py",
    "*/proximadb_sdk/integrations/llama_index*.py",
    "*/proximadb_sdk/integrations/haystack*.py",
    # External `victor` integration adapters (victor-ai / victor-coding / ...):
    # the `victor` package lives in a separate repo not installed in the test
    # env, so these are uncoverable offline — same rationale as crewai/dspy above.
    "*/proximadb_sdk/integrations/victor*.py",
    # Code chunking backed by tree-sitter grammars. The grammar wheels
    # (tree_sitter_language_pack / individual language packages) are NOT installed
    # in the qa-gate env — its test (test_chunking_code_cov.py) is --ignore'd there
    # — so this source is uncoverable offline. Excluded until the grammars ship in
    # the test env.
    "*/proximadb_sdk/chunking_strategies/code.py",
    # REST transport fully generated by openapi-python-client (@generated DO NOT
    # EDIT) — pure boilerplate, exactly like the generated *_pb2 stubs above. The
    # ratchet measures hand-written SDK logic; the python-sdk-codegen-drift gate
    # owns generated-transport correctness.
    "*/proximadb_sdk/_generated/rest/**",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
