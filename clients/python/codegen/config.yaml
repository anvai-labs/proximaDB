# openapi-python-client configuration for the generated ProximaDB Python REST
# transport (TD-126 Phase 4).
#
# This generates the low-level typed REST client (attrs models + per-operation
# request builders) into src/proximadb_sdk/_generated/rest. The hand-written
# ergonomic facade in src/proximadb_sdk/protocols/rest_sync.py calls into this
# generated client; the public Python SDK API (the `proximadb` / `proximadb_sdk`
# packages) is unchanged.
#
# Regenerate with:  make gen-python-sdk   (from the repo root)
# The generator version is pinned in clients/python/codegen/requirements.txt
# (see that file for the version). openapi-python-client is OpenAPI 3.1-native, so
# the published 3.1 spec (docs/openapi/proximadb-openapi.yaml) is consumed
# directly — no down-conversion (unlike the Go / Rust progenitor pipelines).
#
# The CI gate `python-sdk-codegen-drift` runs `make gen-python-sdk` and
# `git diff --exit-code`s the generated dir — same generated-artifact pattern as
# go-sdk-codegen-drift / ts-sdk-codegen-drift / rust-sdk-codegen-drift.

# Stable inner package name -> src/proximadb_sdk/_generated/rest/.
package_name_override: rest

# Disable the generator's own post-generation formatting hooks (ruff). They emit
# a non-deterministic .ruff_cache and are version-sensitive. gen.sh instead runs
# the SDK's own black + isort as the final, deterministic formatting pass, so the
# committed artifact matches both a fresh regeneration AND the Python Lint gate.
post_hooks: []
