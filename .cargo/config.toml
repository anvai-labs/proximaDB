# ProximaDB Cargo Build Configuration
# Tuned to avoid memory pressure on 64GB / 10-core machines

[build]
# Use 5 of 10 cores — balances parallelism against memory pressure (each rustc
# instance uses 2-6GB on this codebase; 5 jobs peaks at ~10-30GB on a 64GB machine).
# The previous value of 3 was tuned for GitHub Actions runners (4 vcores / 20GB).
jobs = 5

# More codegen units = faster compilation at slight runtime perf cost.
# 8 units allows good parallelism within each crate's LLVM codegen phase.
rustflags = ["-C", "codegen-units=8"]

[env]
# Run tests sequentially for integration tests that share resources
RUST_TEST_THREADS = "1"

[registries.crates-io]
# Use sparse protocol for faster dependency resolution (2-3x faster)
protocol = "sparse"

# NOTE: Profile settings ([profile.*]) must be in Cargo.toml, not here
# See Cargo.toml for: release-fast, dev, test, bench profiles

# Aliases for common operations
[alias]
# Run tests sequentially (for integration tests)
test-seq = "test --all -- --nocapture"

# Storage-specific test suites
test-sst = "test unit_tests::storage -- --nocapture"
test-atomic = "test unit_tests::storage::sst_atomic_operations_test -- --nocapture"
test-viper = "test unit_tests::storage::viper -- --nocapture"
test-batch = "test unit_tests::storage::write_buffer -- --nocapture"

# Coverage testing
test-coverage = "tarpaulin --config tarpaulin.toml"
test-coverage-safe = "tarpaulin --skip-clean --timeout 600 --avoid-cfg-tarpaulin --engine llvm --lib --jobs 3 --release"

# Fast check (syntax only, no codegen) — typed-syntax loop, no linking
check-fast = "check --all-targets --jobs 3"
check-lib  = "check --lib --jobs 3"   # even tighter; library-only
# L2 dev-fast lane: check with deps at -O1 (opt-in profile, see Cargo.toml
# [profile.dev-fast]). Faster than the default dev/test check for dep-heavy
# edits; artifacts are NOT shared with the test profile, so toggling recompiles.
check-dev-fast = "check --profile dev-fast"

# Parallel test run (for unit tests that don't share state).
# Overrides the RUST_TEST_THREADS=1 from [env] via the inner --test-threads flag.
test-parallel = "test --lib --jobs 3 -- --test-threads=3"

# Nextest aliases (requires `cargo install cargo-nextest --locked`).
# Nextest has its own runner — RUST_TEST_THREADS from [env] does NOT apply.
# Profiles live in .config/nextest.toml.
nx     = "nextest run --profile default"
nxlib  = "nextest run --lib --profile unit"
nxint  = "nextest run --profile integration"

# Perf evidence-ledger harnesses (TD-OLAP-4) — the CANONICAL invocations.
# Release build (wall/compute numbers are only admissible from release) with
# the in-process DuckDB baseline compiled in BY DEFAULT, so every ledger run
# carries all engine permutations (native/DataFusion/DuckDB). The `duckdb`
# cargo feature stays opt-in for library builds (bundled C++ is too heavy for
# CI/dev defaults) — these aliases are where it is always on. Knobs via env:
# TPC_PERF_SCALE / TPC_PERF_SKIP_NATIVE / TPC_PERF_QUERY_TIMEOUT_MS /
# CLICKBENCH_PARQUET / CLICKBENCH_QUERY_TIMEOUT_MS / *_LEDGER_OUT.
ledger-tpc        = "test --release --features duckdb --test tpc_perf_ledger_e2e -- --ignored --nocapture"
ledger-clickbench = "test --release --features duckdb --test clickbench_ledger_e2e clickbench_ledger -- --ignored --nocapture"

[target.aarch64-apple-darwin]
# Apple Silicon build flags.
# NOTE: `target-cpu=native` was removed here (2026-07). It broke two things on
# aarch64-apple-darwin:
#   1. Distributable wheels — `native` bakes the *builder's* exact CPU features
#      into the artifact, so a wheel built on one Mac can SIGILL (illegal
#      instruction) on another. proximadb_embedded ships Apple-Silicon wheels
#      (TD-EMBED-1), which MUST be portable across M-series chips.
#   2. `ring 0.17.x` — its darwin.rs const-assertion `CAPS_STATIC ==
#      MIN_STATIC_FEATURES` fails to compile when `native` enables features
#      beyond Apple's guaranteed baseline (the exact E0080 the macOS wheel build
#      hit; see ci.yml's GPU job note about avoiding macos-14 for ring).
# rustc's default target-cpu for this triple is the portable Apple baseline
# (NEON/AES/SHA2 already on) — optimized for Apple Silicon AND portable/ring-safe.
rustflags = [
    "-C", "codegen-units=8",
]

[target.x86_64-unknown-linux-gnu]
# Linux x86_64 optimizations - use mold linker if available
# Uncomment if mold is installed: linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]
rustflags = ["-C", "codegen-units=8"]
