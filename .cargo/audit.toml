# cargo-audit baseline for `cargo audit -D warnings --no-yanked`
# (the CI Security Audit job).
#
# TD-AUDITGATE-1: the job used to be doubly unfailable (`cargo audit || echo`
# under `continue-on-error`), so these findings sat silently green. Everything
# fixable was fixed in the PR that introduced this file (quinn-proto 0.11.19,
# h2 0.4.20, event-listener 5.4.2, chacha20 0.10.2, simba 0.10.2, rand 0.10.3).
# What remains here is unfixed upstream or reachable only through a dependency
# we cannot move without a major-bump effort — each entry says which, and each
# must be re-reviewed when its parent dependency moves. A NEW advisory that is
# not in this list fails CI; that is the point.
#
# Why --no-yanked: cargo-audit has no per-crate ignore for yanked (they carry
# no advisory ID), and the two current yanks (spin 0.9.8 via flume 0.12,
# wide 1.6.0 via simba 0.10) have no parent bump that clears them. A yank is a
# withdrawal signal, not a vulnerability; re-enable the check if either parent
# moves.
#
# Re-audit after editing: cargo audit -D warnings --no-yanked   (must exit 0)

[advisories]
ignore = [
    # --- vulnerabilities (unfixed upstream of us) ---

    # h2 unbounded empty DATA frames (RUSTSEC-2026-0258). The h2 0.4 line is
    # fixed (lock has 0.4.20); 0.3.27 is PRODUCTION-REACHABLE: the root crate's
    # unconditional `reqwest = "0.11"` dependency pulls reqwest 0.11.27 ->
    # hyper 0.14.32 -> h2 0.3.27 (the h2 0.3 copy httpmock 0.7 -> hyper 0.14
    # brings is dev-only, but that is not the only copy). No lock-only fix
    # exists — the whole 0.3 line is unpatched (fixed in >= 0.4.16). The real
    # fix is the reqwest 0.11 -> 0.12 major bump (own PR); do not deprioritize
    # it on the strength of this entry.
    "RUSTSEC-2026-0258",

    # quick-xml quadratic run time / unbounded namespace allocation
    # (RUSTSEC-2026-0194, RUSTSEC-2026-0195). Fixed in quick-xml >= 0.41, but
    # the only parent is object_store 0.13.2, which pins ^0.39 — unfixable
    # until an object_store 0.14 bump (API-breaking, own PR). Both advisories
    # are denial-of-service-class on attacker-supplied XML (S3/GCS list
    # responses), relevant only when a hostile party controls the bucket's
    # listing payload.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # --- unmaintained (transitive; no patched line exists) ---

    # async-std discontinued (RUSTSEC-2025-0052) — pulled by a transitive
    # runtime dep; no runtime code of ours executes on it.
    "RUSTSEC-2025-0052",
    # bincode 1.x unmaintained (RUSTSEC-2025-0141) — 2.x is a different API.
    # bincode is a DIRECT production dependency of the root crate (and ~17
    # workspace crates); the ignore stands only because the 1.x -> 2.x migration
    # is an API break owned by its own effort.
    "RUSTSEC-2025-0141",
    # paste unmaintained (RUSTSEC-2024-0436) — proc-macro helper of transitive
    # deps; expands to ordinary code, no runtime exposure.
    "RUSTSEC-2024-0436",
    # rustls-pemfile unmaintained (RUSTSEC-2025-0134) — 2.x is a DIRECT
    # production dependency of the root crate; 1.x rides transitive TLS-setup
    # paths (reqwest 0.11, axum-server). Migration is ours to own for the
    # direct copy.
    "RUSTSEC-2025-0134",
    # unsafe-libyaml unmaintained (RUSTSEC-2024-0449) — serde_yaml's backend;
    # long-known, upstream replaced by libyaml-safer in newer serde_yaml.
    "RUSTSEC-2024-0449",

    # --- unsound (reported unfixed upstream) ---

    # lru panic-safety UAF in LruCache::pop (RUSTSEC-2026-0253) — no patched
    # 0.16 release at baseline time; re-check on every lru point release.
    "RUSTSEC-2026-0253",

    # zstd 0.13.3 + zstd-safe 7.2.4, published 2026-10-26 (13 advisories:
    # 0391 is zstd itself; 0395-0406 are zstd-safe). cargo-audit classes 3 as
    # vulnerabilities — 0391 (abandoned-stream data leak into the NEXT stream
    # on a REUSED context), 0398 (Seekable OOB), 0403 (streaming uninit on a
    # failed legacy frame) — and 10 as unsound warnings on the
    # streaming/seekable/buffer APIs. No lock-level fix exists: patched floors
    # are zstd >=0.14.3 / zstd-safe >=8.2.0; zstd ^0.13 is required by
    # arrow-ipc 59 / parquet 59, and zstd-safe 7.x is ALSO co-pinned by
    # compression-codecs 0.4.38 (via async-compression <- tower-http
    # "compression-full"/"decompression-full"). Clearing 0391 takes an arrow
    # major; the 12 zstd-safe IDs additionally take a tower-http /
    # async-compression move. RETIREMENT TRIGGER: both.
    #
    # Exposure today — three surfaces, all checked:
    # (1) our own call sites are one-shot: encode_all/decode_all (io_trace,
    #     codecs) and zstd::bulk::compress/decompress (metrics store) — fresh
    #     context per call, no reuse, no dictionaries; 0391's precondition
    #     never holds.
    # (2) vendored arrow-ipc reuses a bulk::Compressor context — no ignored
    #     advisory covers the bulk API (0400 requires a dictionary).
    # (3) tower-http compiles the zstd STREAMING codec into the server (0403's
    #     scope is exactly DCtx::decompress_stream), but it is inert today:
    #     only the response-side DecompressionLayer is wired (its comment says
    #     "requests" — a pre-existing mis-wiring; no RequestDecompressionLayer
    #     exists anywhere), REST compression defaults OFF, and reqwest has no
    #     zstd feature. FUTURE WARNING: "fixing" request decompression by
    #     switching to RequestDecompressionLayer would activate 0403 on
    #     attacker-supplied bodies — drop this ignore first.
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0395",
    "RUSTSEC-2026-0396",
    "RUSTSEC-2026-0397",
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0399",
    "RUSTSEC-2026-0400",
    "RUSTSEC-2026-0401",
    "RUSTSEC-2026-0402",
    "RUSTSEC-2026-0403",
    "RUSTSEC-2026-0404",
    "RUSTSEC-2026-0405",
    "RUSTSEC-2026-0406",

    # --- yanked ---
    # Excluded as a class via --no-yanked (see header): spin 0.9.8 (flume
    # 0.12) and wide 1.6.0 (simba 0.10) are yanked with no parent bump that
    # clears them. chacha20 0.10.1's yank WAS cleared by moving the lock to
    # 0.10.2 — do not let it regress.
]
